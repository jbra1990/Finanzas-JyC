<style>
/* =============================================================================
   Finanzas J & C
   -----------------------------------------------------------------------------
   Todo pasa sobre un fondo de seda azul. Encima, dos materiales y nada más:
   el PANEL, un bloque azul marino con degradado —la tarjeta como objeto, con la
   cifra que importa— y las TARJETAS, azules claras y calladas, que sostienen el
   detalle. Esquinas muy redondeadas, cifras grandes, cero ruido.

   La barra de abajo flota y lleva el botón de añadir en el centro, levantado
   sobre ella.

   Los colores de las series de los gráficos están validados aparte (contraste y
   daltonismo) y no se tocan desde aquí.
   ========================================================================== */

:root {
  color-scheme: light;

  /* Fondo de seda: tres paradas de un mismo azul. */
  --fondo-1: #eaf3fd;
  --fondo-2: #cbe0f6;
  --fondo-3: #a9c8e8;
  --plano: var(--fondo-2);

  /* Superficies */
  --superficie: #f2f8ff;
  --superficie-2: #dfecfb;
  --superficie-3: #c8dcf2;

  /* El panel es el mismo objeto en los dos temas. */
  --panel: linear-gradient(148deg, #5f97cf 0%, #24568d 34%, #102c53 68%, #0b1f3d 100%);
  --panel-plano: #102c53;
  --panel-tinta: #ffffff;
  --panel-tinta-2: #a7c3e2;

  /* Tinta */
  --tinta: #0b2244;
  --tinta-2: #37567e;
  --tinta-3: #6e8cb2;

  /* Líneas */
  --grid: #d3e3f6;
  --baseline: #a9c4e3;
  --borde: rgba(16, 44, 83, 0.09);
  --borde-fuerte: rgba(16, 44, 83, 0.16);

  --sombra: 0 1px 2px rgba(16, 44, 83, 0.05), 0 10px 26px rgba(16, 44, 83, 0.08);
  --sombra-panel: 0 18px 44px rgba(11, 31, 61, 0.32);
  --sombra-nav: 0 10px 34px rgba(11, 31, 61, 0.18);

  /*
   * Cristal. Lo que hace que una superficie parezca vidrio no es la
   * transparencia sola: es el desenfoque de lo que hay detrás, la saturación
   * subida —el color de abajo se ve más vivo a través del vidrio— y sobre todo
   * el filo de luz del borde superior, que es donde rebota el reflejo.
   */
  --vidrio: rgba(255, 255, 255, 0.62);
  --vidrio-borde: rgba(255, 255, 255, 0.75);
  --vidrio-brillo: rgba(255, 255, 255, 0.85);
  --vidrio-sombra: rgba(11, 31, 61, 0.1);

  /* Series de gráficos: paleta validada, no cambiar sin volver a validar. */
  --serie-1: #2a78d6;
  --serie-2: #eb6834;
  --serie-3: #1baf7a;
  --serie-4: #eda100;
  --serie-5: #e87ba4;
  --serie-6: #008300;
  --serie-7: #4a3aa7;
  --serie-8: #e34948;

  /* Estado: separado del acento, nunca hace de «serie 9». */
  --ok: #0ca30c;
  --ok-texto: #067306;
  --alerta: #fab219;
  --grave: #ec835a;
  --critico: #d03b3b;

  --acento: #1d4e8f;
  --acento-suave: rgba(29, 78, 143, 0.12);

  --radio-xl: 28px;
  --radio: 22px;
  --radio-s: 14px;
  --radio-pill: 999px;

  --fuente: system-ui, -apple-system, "Segoe UI", sans-serif;
}

/*
 * En oscuro el fondo de seda se hunde hasta el azul de medianoche y las
 * tarjetas claras se vuelven bloques marinos: el panel sigue siendo el mismo
 * objeto, así que no cambia.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    color-scheme: dark;
    --fondo-1: #0d2141;
    --fondo-2: #091a33;
    --fondo-3: #061224;
    --plano: var(--fondo-2);

    --superficie: #10294b;
    --superficie-2: #17375f;
    --superficie-3: #1f4674;

    --panel: linear-gradient(148deg, #4a80b8 0%, #1d4a7e 32%, #0e2749 66%, #081a33 100%);
    --panel-plano: #0e2749;

    --tinta: #eaf3ff;
    --tinta-2: #a9c6e6;
    --tinta-3: #7b9dc4;

    --grid: #1c3f68;
    --baseline: #2b567f;
    --borde: rgba(255, 255, 255, 0.09);
    --borde-fuerte: rgba(255, 255, 255, 0.17);

    /* En oscuro la profundidad la da el bloque de color, no la sombra. */
    --sombra: none;
    --sombra-panel: none;
    --sombra-nav: 0 8px 30px rgba(0, 0, 0, 0.5);

    /* En oscuro el vidrio tiñe de azul en vez de blanquear. */
    --vidrio: rgba(24, 58, 102, 0.58);
    --vidrio-borde: rgba(255, 255, 255, 0.16);
    --vidrio-brillo: rgba(255, 255, 255, 0.3);
    --vidrio-sombra: rgba(0, 0, 0, 0.45);

    --serie-1: #5aa2f0;
    --serie-2: #d95926;
    --serie-3: #199e70;
    --serie-4: #c98500;
    --serie-5: #d55181;
    --serie-6: #008300;
    --serie-7: #9085e9;
    --serie-8: #e66767;
    --ok-texto: #4ade80;
    --acento: #6aa6e8;
    --acento-suave: rgba(106, 166, 232, 0.18);
  }
}

:root[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo-1: #0d2141;
  --fondo-2: #091a33;
  --fondo-3: #061224;
  --plano: var(--fondo-2);
  --superficie: #10294b;
  --superficie-2: #17375f;
  --superficie-3: #1f4674;
  --panel: linear-gradient(148deg, #4a80b8 0%, #1d4a7e 32%, #0e2749 66%, #081a33 100%);
  --panel-plano: #0e2749;
  --tinta: #eaf3ff;
  --tinta-2: #a9c6e6;
  --tinta-3: #7b9dc4;
  --grid: #1c3f68;
  --baseline: #2b567f;
  --borde: rgba(255, 255, 255, 0.09);
  --borde-fuerte: rgba(255, 255, 255, 0.17);
  --sombra: none;
  --sombra-panel: none;
  --sombra-nav: 0 8px 30px rgba(0, 0, 0, 0.5);
  --vidrio: rgba(24, 58, 102, 0.58);
  --vidrio-borde: rgba(255, 255, 255, 0.16);
  --vidrio-brillo: rgba(255, 255, 255, 0.3);
  --vidrio-sombra: rgba(0, 0, 0, 0.45);
  --serie-1: #5aa2f0;
  --serie-2: #d95926;
  --serie-3: #199e70;
  --serie-4: #c98500;
  --serie-5: #d55181;
  --serie-6: #008300;
  --serie-7: #9085e9;
  --serie-8: #e66767;
  --ok-texto: #4ade80;
  --acento: #6aa6e8;
  --acento-suave: rgba(106, 166, 232, 0.18);
}

* { box-sizing: border-box; }

/*
 * El degradado va en <html> y no en <body>: así se estira con el documento
 * entero sin recurrir a background-attachment:fixed, que en Safari de iPhone
 * salta al hacer scroll.
 */
html {
  min-height: 100%;
  background-color: var(--fondo-3);
  background-image: linear-gradient(180deg,
    var(--fondo-1) 0, var(--fondo-2) 380px, var(--fondo-3) 860px);
  background-repeat: no-repeat;
  background-size: 100% 860px;
}

html, body {
  margin: 0;
  padding: 0;
  color: var(--tinta);
  font-family: var(--fuente);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body { background: transparent; padding-bottom: env(safe-area-inset-bottom); }

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 640;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
a { color: var(--acento); }

/* --- Estructura ---------------------------------------------------------- */

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 16px 118px;
}

.cabecera {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 16px 0 12px;
}

.cabecera h1 {
  font-size: 22px;
  letter-spacing: -0.03em;
}

.cabecera .marca {
  display: grid;
  place-items: center;
  width: 42px; height: 42px;
  border-radius: 14px;
  background: var(--panel);
  color: #fff;
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 0.02em;
  flex: none;
  box-shadow: 0 6px 16px rgba(11, 31, 61, 0.22);
}

.cabecera .crece { flex: 1; min-width: 0; }

.cabecera .sub {
  font-size: 12.5px;
  color: var(--tinta-3);
  margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Los dos botones redondos de la esquina: avisos y menú. */
.icono-btn {
  display: grid;
  place-items: center;
  flex: none;
  width: 42px; height: 42px;
  padding: 0;
  border: 1px solid var(--borde);
  border-radius: 50%;
  background: var(--superficie);
  color: var(--tinta-2);
  cursor: pointer;
  box-shadow: var(--sombra);
  transition: transform 0.1s, background 0.15s;
}
.icono-btn svg { width: 20px; height: 20px; }
.icono-btn:active { transform: scale(0.93); }
.icono-btn:hover { background: var(--superficie-2); }

/* Punto rojo cuando hay algo que mirar en los avisos. */
.icono-btn[data-avisos="si"] { position: relative; }
.icono-btn[data-avisos="si"]::after {
  content: "";
  position: absolute;
  top: 7px; right: 8px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--critico);
  border: 2px solid var(--superficie);
}

/* --- Navegación: barra flotante con el «+» en medio ---------------------- */

.nav {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1px;
  padding: 8px 6px;
  border-radius: var(--radio-xl);

  /* Vidrio: lo de detrás se ve, desenfocado y con el color más vivo. */
  background: var(--vidrio);
  backdrop-filter: saturate(210%) blur(34px);
  -webkit-backdrop-filter: saturate(210%) blur(34px);
  border: 1px solid var(--vidrio-borde);

  /*
   * Las tres capas que convierten una superficie translúcida en vidrio:
   * la sombra que la separa del fondo, el filo de luz de arriba —donde
   * rebotaría el reflejo— y una caída suave en el canto de abajo.
   */
  box-shadow:
    0 12px 36px var(--vidrio-sombra),
    inset 0 1px 0 var(--vidrio-brillo),
    inset 0 -1px 0 var(--borde);
}

/*
 * Safari sin `backdrop-filter` (o con él desactivado) dejaría la barra casi
 * invisible sobre el contenido. Ahí se vuelve opaca: es preferible perder el
 * efecto a perder los rótulos.
 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .nav { background: var(--superficie); }
}

.nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 0;
  padding: 6px 0;
  border: 0;
  border-radius: 15px;
  background: transparent;
  /* Sobre vidrio el rótulo compite con lo que se transparenta: por eso va en
     la tinta media y no en la clara que usan las pistas del resto de la app. */
  color: var(--tinta-2);
  font: inherit;
  font-size: 9px;
  font-weight: 560;
  letter-spacing: -0.02em;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.nav button svg { width: 21px; height: 21px; }
.nav button[aria-current="page"] { color: var(--acento); }
.nav button[aria-current="page"] svg {
  background: var(--acento-suave);
  border-radius: 11px;
  padding: 2px 8px;
  width: 37px;
}
.nav button span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}

/*
 * El «+» va en el centro exacto de la barra y levantado sobre ella: es el gesto
 * que más se repite en la app, así que no comparte aspecto con las secciones.
 */
.nav .nav-mas {
  flex: none;
  display: grid;
  place-items: center;
  width: 56px; height: 56px;
  margin: -22px 5px 0;
  padding: 0;
  border-radius: 50%;
  background: var(--panel-plano);
  background-image: linear-gradient(150deg, #4f8ac4 0%, #1d4a7e 45%, #0d2547 100%);
  color: #fff;
  line-height: 0;
  box-shadow: 0 12px 26px rgba(11, 31, 61, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  /* El aro que lo separa de la barra es del mismo vidrio, no un blanco sólido:
     así el botón se ve incrustado en el cristal y no pegado encima. */
  border: 3px solid var(--vidrio-borde);
  transition: transform 0.12s, box-shadow 0.12s;
}
.nav .nav-mas svg { width: 26px; height: 26px; display: block; }
.nav .nav-mas:active { transform: scale(0.92); }
.nav .nav-mas:hover { box-shadow: 0 14px 30px rgba(11, 31, 61, 0.5); }

@media (min-width: 860px) {
  .nav {
    position: sticky;
    left: auto; right: auto;
    top: 12px;
    bottom: auto;
    justify-content: flex-start;
    flex-wrap: wrap;
    margin: 0 0 8px;
    padding: 7px;
  }
  .nav button { flex: 0 0 auto; flex-direction: row; font-size: 13.5px; padding: 9px 15px; gap: 7px; }
  .nav button[aria-current="page"] { background: var(--acento-suave); }
  .nav button[aria-current="page"] svg { background: none; padding: 0; width: 21px; }
  .nav .nav-mas { width: 44px; height: 44px; margin: 0 0 0 auto; }
  .app { padding-bottom: 48px; }
}

/* --- El panel: la tarjeta como objeto ------------------------------------ */

.panel {
  position: relative;
  overflow: hidden;
  margin: 14px 0;
  padding: 22px;
  border-radius: var(--radio-xl);
  background: var(--panel-plano);
  background-image: var(--panel);
  color: var(--panel-tinta);
  box-shadow: var(--sombra-panel);
}

/* Brillo de seda en la esquina superior izquierda, como en la referencia. */
.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 90% at 0% 0%,
    rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 55%);
  pointer-events: none;
}

.panel > * { position: relative; z-index: 1; }

.panel .etiqueta {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-tinta-2);
}

.panel .cifra {
  display: block;
  margin: 8px 0 4px;
  font-size: clamp(36px, 11vw, 48px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.02;
}
.panel .cifra.neg { color: #ff9d9d; }

/* Los centavos, apagados: la cifra se lee de un vistazo y el detalle no estorba. */
.cifra .dec { color: var(--panel-tinta-2); font-weight: 640; }
.heroe .dec { color: var(--tinta-3); font-weight: 640; }

.panel .nota { font-size: 12.5px; color: var(--panel-tinta-2); }

.panel-cab {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

/* Fila de datos secundarios dentro del panel. */
.panel-datos {
  display: flex;
  flex-wrap: wrap;
  gap: 18px 26px;
  margin-top: 16px;
  padding-top: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.11);
}
.panel-datos > div { min-width: 0; }
.panel-datos .etq {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--panel-tinta-2);
}
.panel-datos .val {
  font-size: 16px;
  font-weight: 620;
  letter-spacing: -0.02em;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

/* Fila de un segmentado ancho junto a un botón: el segmentado se encoge y
   desplaza, el botón nunca baja de línea. */
.barra-accion {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 0;
}
.barra-accion > *:first-child { flex: 1 1 auto; min-width: 0; }
.barra-accion > .btn { flex: none; }

/* El segmentado dentro del panel se viste de panel. */
.panel .segmentado {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.14);
}
.panel .segmentado button { color: var(--panel-tinta-2); }
.panel .segmentado button[aria-pressed="true"] {
  background: rgba(255, 255, 255, 0.95);
  color: #101828;
  box-shadow: none;
}
.panel .medidor { margin: 14px 0 0; }
.panel .btn {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.18);
  color: var(--panel-tinta);
}
.panel .btn:hover { background: rgba(255, 255, 255, 0.2); }
.panel .btn.primario { background: var(--acento); border-color: transparent; color: #fff; }

/* --- Tarjetas ------------------------------------------------------------ */

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 18px;
  margin: 12px 0;
  box-shadow: var(--sombra);
}

.tarjeta > header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 12px;
  margin-bottom: 12px;
}
.tarjeta > header > * { min-width: 0; max-width: 100%; }
.tarjeta > header h2 {
  font-size: 15px;
  letter-spacing: -0.015em;
}
.tarjeta > header .pista { font-size: 12px; color: var(--tinta-3); }

.rejilla { display: grid; gap: 12px; }
.rejilla.dos { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.rejilla.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

/* --- Indicadores --------------------------------------------------------- */

/* Los indicadores son el azul claro de la referencia: bloques, no fichas. */
.kpi {
  background: var(--superficie-2);
  border: 1px solid transparent;
  border-radius: var(--radio);
  padding: 15px 16px;
}
.tarjeta .kpi { background: var(--superficie-2); }

.kpi .etq {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--tinta-3);
  line-height: 1.3;
}
.kpi .valor {
  font-size: 23px;
  font-weight: 660;
  letter-spacing: -0.03em;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.kpi .delta { font-size: 11.5px; color: var(--tinta-2); margin-top: 3px; }
.kpi .delta.bien { color: var(--ok-texto); font-weight: 550; }
.kpi .delta.mal { color: var(--critico); font-weight: 550; }

/* Cifra suelta fuera del panel (vistas que aún no lo usan). */
.heroe {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.05;
  margin: 4px 0 6px;
}
.heroe.neg { color: var(--critico); }

/* --- Controles ----------------------------------------------------------- */

.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
  margin: 10px 0;
}
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1 1 150px; }
.campo > label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tinta-3);
}
.campo.ancho { flex-basis: 100%; }

input, select, textarea, button { font: inherit; color: var(--tinta); }

input, select, textarea {
  width: 100%;
  padding: 11px 12px;
  background: var(--superficie-2);
  border: 1px solid transparent;
  border-radius: var(--radio-s);
  min-height: 44px;
  transition: border-color 0.15s, background 0.15s;
}
input:hover, select:hover, textarea:hover { background: var(--superficie-3); }
input:focus, select:focus, textarea:focus {
  background: var(--superficie);
  border-color: var(--acento);
  outline: none;
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--acento);
  outline-offset: 2px;
}
textarea { min-height: 66px; resize: vertical; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 18px;
  min-height: 44px;
  border: 1px solid var(--borde-fuerte);
  border-radius: var(--radio-pill);
  background: var(--superficie);
  font-weight: 560;
  letter-spacing: -0.01em;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, transform 0.06s;
}
.btn:hover { background: var(--superficie-2); }
.btn:active { transform: scale(0.975); }
.btn.primario {
  background: var(--acento);
  border-color: transparent;
  color: #fff;
  font-weight: 620;
}
.btn.primario:hover { filter: brightness(1.08); }
.btn.peligro { color: var(--critico); }
.btn.pequeno { padding: 0 13px; min-height: 34px; font-size: 12.5px; }

.segmentado {
  display: flex;
  max-width: 100%;
  padding: 3px;
  gap: 2px;
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio-pill);
  overflow-x: auto;
  scrollbar-width: none;
}
.segmentado::-webkit-scrollbar { display: none; }
.segmentado button {
  flex: none;
  white-space: nowrap;
  border: 0;
  background: transparent;
  padding: 0 15px;
  min-height: 34px;
  border-radius: var(--radio-pill);
  color: var(--tinta-2);
  font-size: 13px;
  font-weight: 540;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.segmentado button[aria-pressed="true"] {
  background: var(--superficie);
  color: var(--tinta);
  font-weight: 640;
  box-shadow: 0 1px 3px rgba(13, 20, 32, 0.14);
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: var(--radio-pill);
  border: 1px solid var(--borde);
  background: var(--superficie-2);
  font-size: 12px;
  font-weight: 540;
  color: var(--tinta-2);
}
/* J y C: cada persona con su color, el mismo de las series 1 y 2. */
.chip.j { background: color-mix(in srgb, var(--serie-1) 14%, transparent);
  border-color: color-mix(in srgb, var(--serie-1) 34%, transparent); }
.chip.c { background: color-mix(in srgb, var(--serie-2) 14%, transparent);
  border-color: color-mix(in srgb, var(--serie-2) 34%, transparent); }

/* --- Tablas -------------------------------------------------------------- */

.tabla-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -16px;
  padding: 0 16px;
}
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child {
  text-align: left;
  position: sticky; left: 0;
  background: var(--superficie);
  z-index: 1;
}
thead th {
  position: sticky; top: 0;
  background: var(--superficie);
  color: var(--tinta-3);
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--borde);
  z-index: 2;
}
thead th:first-child { z-index: 3; }
tbody td {
  border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
tbody tr:hover td { background: var(--superficie-2); }
tbody tr:hover td:first-child { background: var(--superficie-2); }
tfoot td {
  font-weight: 660;
  border-top: 2px solid var(--baseline);
  font-variant-numeric: tabular-nums;
}
td.cero { color: var(--tinta-3); }

/* --- Listas -------------------------------------------------------------- */

.lista { list-style: none; margin: 0; padding: 0; }
.lista li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--grid);
}
.lista li:last-child { border-bottom: 0; }
.lista .principal { flex: 1; min-width: 0; }
.lista .titulo {
  font-weight: 570;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 7px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lista .meta {
  font-size: 11.5px; color: var(--tinta-3); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lista .monto {
  font-weight: 640;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.lista .monto .pie {
  display: block;
  font-size: 10px;
  font-weight: 550;
  letter-spacing: 0;
  color: var(--tinta-3);
  text-align: right;
}

  // comprobación de arranque y la bandera no se limpia.
  if (escrito && almacenamiento.motivo !== 'no-persiste') {
    almacenamiento.ok = true;
    almacenamiento.motivo = '';
  }
  notificar();
}

function adoptar(datos) {
  db.version = datos.version || 1;
  db.config = { ...CONFIG_POR_DEFECTO, ...(datos.config || {}) };
  db.configTs = Number(datos.configTs) || 0;
  db.borrados = Array.isArray(datos.borrados) ? datos.borrados : [];
  for (const col of COLECCIONES) {
    db[col] = Array.isArray(datos[col]) ? datos[col] : [];
  }
  migrarEsquema();
}

/**
 * Lleva una base guardada con un esquema anterior al actual. Se ejecuta en
 * cada carga y es idempotente.
 */
function migrarEsquema() {
  if (Number(db.config.version_esquema) >= 2) return;

  // v1 → v2: las cuentas de banco pasan a ser Pacífico 1, Pacífico 2 y
  // Pichincha, y las tarjetas estrenan su fecha de corte real.
  const porId = new Map(db.cuentas.map((c) => [c.id, c]));
  const plantilla = (id, nombre, banco) => ({
    id, nombre, tipo: 'Banco', banco, saldo_inicial: 0, cupo: 0,
    usuarios: 'J,C', dia_corte: '', dia_pago: '', activa: 'Si',
  });

  if (!porId.has('PACIFICO-1')) db.cuentas.push(plantilla('PACIFICO-1', 'Banco del Pacífico 1', 'Pacífico'));
  if (!porId.has('PACIFICO-2')) db.cuentas.push(plantilla('PACIFICO-2', 'Banco del Pacífico 2', 'Pacífico'));

  // Bolivariano no era una cuenta de ahorros, solo la tarjeta: se retira si
  // nadie la referencia.
  const usada = (id) => db.ingresos.some((i) => i.cuenta === id)
    || db.gastosEfectivo.some((g) => g.cuenta === id)
    || db.movimientos.some((m) => m.cuenta_origen === id || m.cuenta_destino === id)
    || db.inversiones.some((p) => p.cuenta_origen === id || p.cuenta_destino === id);
  if (porId.has('BCO-BOLI') && !usada('BCO-BOLI')) {
    db.cuentas = db.cuentas.filter((c) => c.id !== 'BCO-BOLI');
  }

  const corte = { 'TC-PICH': '3', 'TC-PICH-A': '3', 'TC-BOLI': 'fin' };
  db.cuentas.forEach((c) => {
    if (corte[c.id] !== undefined) c.dia_corte = corte[c.id];
  });

  db.config.version_esquema = '2';
  db.version = 2;
}

/**
 * Carga el estado: primero localStorage; si está vacío, la semilla migrada
 * del Excel original. Devuelve 'local' | 'semilla' | 'vacio'.
 */
async function cargar() {
  comprobarAlmacenamiento();
  const crudo = seguro.leer(CLAVE);
  if (crudo) {
    try {
      adoptar(JSON.parse(crudo));
      return 'local';
    } catch (err) {
      console.error('Estado local corrupto, se recarga la semilla', err);
    }
  }
  try {
    const resp = await fetch(RUTA_SEMILLA, { cache: 'no-cache' });
    if (resp.ok) {
      adoptar(await resp.json());
      guardar();
      return 'semilla';
    }
  } catch (err) {
    console.warn('Sin semilla disponible (¿abierto como file://?)', err);
  }
  adoptar({});
  return 'vacio';
}

/** Reemplaza toda la base (importación / restauración de respaldo). */
function reemplazar(datos) {
  adoptar(datos);
  guardar();
}

function limpiarTodo() {
  seguro.borrar(CLAVE);
  adoptar({});
  guardar();
}

/** Exporta una copia serializable del estado. */
function instantanea() {
  return JSON.parse(JSON.stringify(db));
}

// --- Identificadores ---------------------------------------------------------

const PREFIJOS = {
  gastosTarjeta: 'G', ingresos: 'I', gastosEfectivo: 'E',
  inversiones: 'P', movimientos: 'M', vehiculoGastos: 'V',
};

/**
 * Código corto y estable de este dispositivo. Sin él, el teléfono de J y el de
 * C generarían el mismo correlativo estando desconectados y un registro
 * pisaría al otro al sincronizar.
 */
function codigoDispositivo() {
  if (!db.config.dispositivo) {
    const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    db.config.dispositivo = Array.from(
      { length: 4 },
      () => letras[Math.floor(Math.random() * letras.length)],
    ).join('');
  }
  return db.config.dispositivo;
}

/** Solo los dígitos que van justo después del prefijo: 'G0477-KXQD' -> 477. */
function correlativo(id) {
  const m = /^[A-Za-z]+(\d+)/.exec(String(id || ''));
  return m ? parseInt(m[1], 10) : 0;
}

/** Siguiente ID de una colección: G0001-KXQD, G0002-KXQD… */
function nuevoId(coleccion) {
  const pref = PREFIJOS[coleccion] || 'X';
  let max = 0;
  for (const fila of db[coleccion] || []) {
    const n = correlativo(fila.id);
    if (n > max) max = n;
  }
  return `${pref}${String(max + 1).padStart(4, '0')}-${codigoDispositivo()}`;
}

// --- Operaciones de alto nivel ----------------------------------------------

/** Inserta o actualiza una fila por `id` y persiste. */
function upsert(coleccion, fila) {
  const lista = db[coleccion];
  const clave = CLAVES[coleccion];
  const i = lista.findIndex((f) => clave(f) === clave(fila));
  if (i >= 0) lista[i] = tocar({ ...lista[i], ...fila });
  else lista.push(tocar(fila));
  guardar();
  return fila;
}

/** Anota una baja para que también se propague al otro dispositivo. */
function sepultar(coleccion, registro) {
  db.borrados.push({ c: coleccion, k: CLAVES[coleccion](registro), t: Date.now() });
}

/** Elimina una fila por id. Para gastos de tarjeta arrastra sus cuotas. */
function eliminar(coleccion, id) {
  db[coleccion].filter((f) => f.id === id).forEach((f) => sepultar(coleccion, f));
  db[coleccion] = db[coleccion].filter((f) => f.id !== id);
  if (coleccion === 'gastosTarjeta') {
    db.cuotas.filter((c) => c.gasto_id === id).forEach((c) => sepultar('cuotas', c));
    db.cuotas = db.cuotas.filter((c) => c.gasto_id !== id);
  }
  guardar();
}

function cuenta(id) {
  return db.cuentas.find((c) => c.id === id) || null;
}

function tarjetas() {
  return db.cuentas.filter((c) => c.tipo === 'Tarjeta' && c.activa !== 'No');
}

function cuentasBancarias() {
  return db.cuentas.filter((c) => c.tipo !== 'Tarjeta' && c.activa !== 'No');
}

function categoriasGasto() {
  return db.categorias
    .filter((c) => c.tipo !== 'Ingreso' && c.activa !== 'No')
    .map((c) => c.nombre)
    .sort((a, b) => a.localeCompare(b, 'es'));
}

function categoriasIngreso() {
  const props = db.categorias
    .filter((c) => c.tipo === 'Ingreso')
    .map((c) => c.nombre);
  return props.length ? props : ['Sueldo', 'Otros ingresos'];
}

function usuarios() {
  return String(db.config.usuarios || 'J,C')
    .split(',')
    .map((u) => u.trim())
    .filter(Boolean);
}

return { CLAVES, COLECCIONES, CONFIG_LOCAL, alCambiar, almacenamiento, cargar, categoriasGasto, categoriasIngreso, codigoDispositivo, comprobarAlmacenamiento, cuenta, cuentasBancarias, db, eliminar, guardar, instantanea, limpiarTodo, nuevoId, reemplazar, tarjetas, tocar, upsert, usuarios };
})();

M["calc"] = (function () {
/**
 * Lógica financiera: meses, cuotas, pólizas, saldos y agregados de reportes.
 * Ninguna función de este módulo toca el DOM ni persiste nada.
 */

const {db} = M["store"];
// --- Meses -------------------------------------------------------------------

const NOMBRES_MES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const CORTOS_MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun',
  'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

/** 'YYYY-MM' a partir de un Date o de un texto ISO. */
function claveMes(fecha) {
  const d = fecha instanceof Date ? fecha : new Date(`${fecha}T00:00:00`);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function mesActual() {
  return claveMes(new Date());
}

/** Desplaza 'YYYY-MM' n meses (n puede ser negativo). */
function sumarMeses(mes, n) {
  const [y, m] = mes.split('-').map(Number);
  const total = y * 12 + (m - 1) + n;
  return `${String(Math.floor(total / 12)).padStart(4, '0')}-${String((total % 12) + 1).padStart(2, '0')}`;
}

/** Distancia en meses entre dos claves 'YYYY-MM'. */
function difMeses(desde, hasta) {
  const [y1, m1] = desde.split('-').map(Number);
  const [y2, m2] = hasta.split('-').map(Number);
  return (y2 * 12 + m2) - (y1 * 12 + m1);
}

/** Lista inclusiva de meses entre dos claves. */
function rangoMeses(desde, hasta) {
  const out = [];
  const n = difMeses(desde, hasta);
  for (let i = 0; i <= n; i += 1) out.push(sumarMeses(desde, i));
  return out;
}

function nombreMes(mes, corto = false) {
  const [y, m] = mes.split('-').map(Number);
  const nombre = (corto ? CORTOS_MES : NOMBRES_MES)[m - 1] || mes;
  return corto ? `${nombre} ${String(y).slice(2)}` : `${nombre} ${y}`;
}

function añosDisponibles() {
  const set = new Set(mesesConDatos().map((m) => m.slice(0, 4)));
  if (!set.size) set.add(String(new Date().getFullYear()));
  return [...set].sort();
}

/** Todos los meses que tienen algún registro, ordenados. */
function mesesConDatos() {
  const set = new Set();
  db.cuotas.forEach((c) => c.mes && set.add(c.mes));
  db.ingresos.forEach((i) => set.add(i.mes || claveMes(i.fecha)));
  db.gastosEfectivo.forEach((g) => set.add(claveMes(g.fecha)));
  db.movimientos.forEach((m) => set.add(claveMes(m.fecha)));
  if (!set.size) set.add(mesActual());
  return [...set].sort();
}

// --- Dinero ------------------------------------------------------------------

const redondear = (n) => Math.round((Number(n) || 0) * 100) / 100;

const FORMATO = new Intl.NumberFormat('es-EC', {
  style: 'currency', currency: 'USD', minimumFractionDigits: 2,
});

function money(n) {
  return FORMATO.format(Number(n) || 0);
}

/**
 * La misma cifra, con los centavos envueltos para poder apagarlos: en las
 * cifras grandes lo que se lee de un vistazo son los dólares.
 * Devuelve HTML, así que el llamador no debe volver a escaparlo.
 */
function moneyHTML(n) {
  const texto = money(n);
  const corte = texto.lastIndexOf(',');
  if (corte < 0) return texto;
  return `${texto.slice(0, corte)}<span class="dec">${texto.slice(corte)}</span>`;
}

/** Versión compacta para tarjetas KPI: $1,2 k */
function moneyCorto(n) {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  if (abs >= 1000) return `${v < 0 ? '-' : ''}$${(abs / 1000).toFixed(abs >= 10000 ? 0 : 1)}k`;
  return money(v);
}

// --- Cuotas de tarjeta -------------------------------------------------------

/**
 * Reparte un monto en `n` cuotas iguales cuadrando los centavos en la última,
 * de modo que la suma siempre devuelva exactamente el total.
 */
function repartirCuotas(total, n) {
  const t = redondear(total);
  const k = Math.max(1, Math.floor(n) || 1);
  const base = Math.floor((t * 100) / k) / 100;
  const cuotas = Array(k).fill(base);
  cuotas[k - 1] = redondear(t - base * (k - 1));
  return cuotas;
}

/**
 * Cuota fija del sistema francés. `tasaAnual` en % (12 = 12 % anual).
 * Con tasa 0 devuelve el reparto simple.
 */
function cuotaFrancesa(capital, tasaAnual, n) {
  const k = Math.max(1, Math.floor(n) || 1);
  const i = (Number(tasaAnual) || 0) / 100 / 12;
  if (i <= 0) return redondear(capital / k);
  const f = (1 + i) ** k;
  return redondear((capital * i * f) / (f - 1));
}

/**
 * Construye el cronograma de un consumo con tarjeta.
 * `tipo`: 'Corriente' (1 cuota) o 'Diferido' (n cuotas desde `mesInicio`).
 * Devuelve { cuotas: [{n_cuota, mes, monto}], totalPagado, interesTotal }.
 */
function planificarCuotas({ montoTotal, cuotas = 1, mesInicio, tasaInteres = 0 }) {
  const n = Math.max(1, Math.floor(cuotas) || 1);
  const tasa = Number(tasaInteres) || 0;
  let montos;
  if (tasa > 0 && n > 1) {
    const fija = cuotaFrancesa(montoTotal, tasa, n);
    montos = Array(n).fill(fija);
  } else {
    montos = repartirCuotas(montoTotal, n);
  }
  const lista = montos.map((monto, i) => ({
    n_cuota: i + 1,
    mes: sumarMeses(mesInicio, i),
    monto: redondear(monto),
  }));
  const totalPagado = redondear(lista.reduce((s, c) => s + c.monto, 0));
  return {
    cuotas: lista,
    totalPagado,
    interesTotal: redondear(totalPagado - redondear(montoTotal)),
  };
}

// --- Pólizas / inversiones ---------------------------------------------------

/**
 * Rendimiento de una póliza a plazo fijo.
 *
 * @param {object} p
 * @param {number} p.capital        monto invertido
 * @param {number} p.tasaAnual      tasa nominal anual en %
 * @param {number} p.plazoDias      plazo en días
 * @param {number} [p.base=360]     base de días del año (360 o 365)
 * @param {boolean} [p.compuesto]   capitaliza mes a mes en lugar de simple
 * @param {number} [p.retencion]    retención en la fuente sobre el interés (0.02)
 */
function calcularPoliza({
  capital, tasaAnual, plazoDias, base = 360, compuesto = false, retencion = 0,
}) {
  const c = Number(capital) || 0;
  const i = (Number(tasaAnual) || 0) / 100;
  const d = Number(plazoDias) || 0;
  const b = Number(base) || 360;

  const bruto = compuesto
    ? c * ((1 + i / 12) ** (d / 30) - 1)
    : c * i * (d / b);

  const ret = redondear(bruto * (Number(retencion) || 0));
  const neto = redondear(bruto - ret);
  return {
    interesBruto: redondear(bruto),
    retencion: ret,
    interesNeto: neto,
    valorFinal: redondear(c + neto),
    rendimientoEfectivo: c > 0 ? redondear((neto / c) * 100) : 0,
  };
}

/** Suma `dias` a una fecha ISO y devuelve otra fecha ISO. */
function sumarDias(fechaISO, dias) {
  const d = new Date(`${fechaISO}T00:00:00`);
  d.setDate(d.getDate() + (Number(dias) || 0));
  return d.toISOString().slice(0, 10);
}

function diasEntre(desdeISO, hastaISO) {
  const a = new Date(`${desdeISO}T00:00:00`);
  const b = new Date(`${hastaISO}T00:00:00`);
  return Math.round((b - a) / 86400000);
}

// --- Tarjetas ----------------------------------------------------------------

/**
 * Mes de facturación al que cae un consumo según la fecha de corte de la
 * tarjeta. Con corte el día 3 (Pichincha), una compra del 5 de agosto entra en
 * el estado de cuenta que cierra el 3 de septiembre. Con corte a fin de mes
 * (Bolivariano) el mes de facturación coincide con el mes calendario.
 *
 * @param {string} fechaISO  'YYYY-MM-DD'
 * @param {string} tarjetaId
 * @returns {string} 'YYYY-MM'
 */
function mesDeFacturacion(fechaISO, tarjetaId) {
  const mes = claveMes(fechaISO);
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const corte = String(tarjeta?.dia_corte ?? '').trim().toLowerCase();

  if (!corte || corte === 'fin') return mes;
  const dia = Number(corte);
  if (!Number.isFinite(dia) || dia < 1) return mes;

  const diaCompra = Number(String(fechaISO).slice(8, 10));
  return diaCompra <= dia ? mes : sumarMeses(mes, 1);
}

/** Texto corto que explica el corte de una tarjeta. */
function textoCorte(tarjetaId) {
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const corte = String(tarjeta?.dia_corte ?? '').trim().toLowerCase();
  if (!corte) return '';
  if (corte === 'fin') return 'corte a fin de mes';
  return `corte el día ${corte}`;
}

/**
 * Una cuota se considera pendiente si no está marcada como pagada y su mes es
 * el actual o posterior. Los meses anteriores sin marca se asumen ya pagados
 * (así el histórico migrado no infla el cupo utilizado).
 */
function cuotaPendiente(cuota, mesRef = mesActual()) {
  return cuota.pagado !== 'Si' && cuota.mes >= mesRef;
}

/** Cupo utilizado, disponible y % de uso de una tarjeta. */
function estadoTarjeta(tarjetaId, mesRef = mesActual()) {
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const cupo = Number(tarjeta?.cupo) || 0;
  let utilizado = 0;
  const porUsuario = {};
  for (const c of db.cuotas) {
    if (c.tarjeta !== tarjetaId || !cuotaPendiente(c, mesRef)) continue;
    utilizado += c.monto;
    porUsuario[c.usuario] = (porUsuario[c.usuario] || 0) + c.monto;
  }
  utilizado = redondear(utilizado);
  return {
    tarjeta,
    cupo,
    utilizado,
    disponible: redondear(cupo - utilizado),
    uso: cupo > 0 ? Math.min(100, (utilizado / cupo) * 100) : 0,
    porUsuario: Object.fromEntries(
      Object.entries(porUsuario).map(([k, v]) => [k, redondear(v)])),
  };
}

/** Total a pagar de una tarjeta en un mes concreto. */
function pagoDelMes(tarjetaId, mes, usuario = 'ambos') {
  let total = 0;
  for (const c of db.cuotas) {
    if (c.tarjeta !== tarjetaId || c.mes !== mes) continue;
    if (usuario !== 'ambos' && c.usuario !== usuario) continue;
    total += c.monto;
  }
  return redondear(total);
}

/** Cuotas de diferidos que siguen vivas, agrupadas por gasto. */
function diferidosVigentes(mesRef = mesActual()) {
  const porGasto = new Map();
  for (const c of db.cuotas) {
    if (!cuotaPendiente(c, mesRef)) continue;
    const g = db.gastosTarjeta.find((x) => x.id === c.gasto_id);
    if (!g || g.tipo === 'Corriente') continue;
    const acc = porGasto.get(c.gasto_id) || {
      gasto: g, restante: 0, cuotasRestantes: 0, proxima: null,
    };
    acc.restante += c.monto;
    acc.cuotasRestantes += 1;
    if (!acc.proxima || c.mes < acc.proxima.mes) acc.proxima = c;
    porGasto.set(c.gasto_id, acc);
  }
  return [...porGasto.values()]
    .map((a) => ({ ...a, restante: redondear(a.restante) }))
    .sort((a, b) => b.restante - a.restante);
}

// --- Cuentas y patrimonio ----------------------------------------------------

/** Saldo real de una cuenta bancaria o de efectivo. */
function saldoCuenta(cuentaId) {
  const c = db.cuentas.find((x) => x.id === cuentaId);
  let saldo = Number(c?.saldo_inicial) || 0;

  for (const i of db.ingresos) if (i.cuenta === cuentaId) saldo += Number(i.neto) || 0;
  for (const g of db.gastosEfectivo) if (g.cuenta === cuentaId) saldo -= Number(g.monto) || 0;
  for (const m of db.movimientos) {
    if (m.cuenta_origen === cuentaId) saldo -= Number(m.monto) || 0;
    if (m.cuenta_destino === cuentaId) saldo += Number(m.monto) || 0;
  }
  for (const p of db.inversiones) {
    if (p.estado !== 'Liquidada' && p.cuenta_origen === cuentaId) {
      saldo -= Number(p.capital) || 0;
    }
    if (p.estado === 'Liquidada' && p.cuenta_destino === cuentaId) {
      saldo += Number(p.valor_final) || 0;
    }
    if (p.estado === 'Liquidada' && p.cuenta_origen === cuentaId) {
      saldo -= Number(p.capital) || 0;
    }
  }
  return redondear(saldo);
}

function totalAhorrado() {
  return redondear(db.cuentas
    .filter((c) => c.tipo !== 'Tarjeta')
    .reduce((s, c) => s + saldoCuenta(c.id), 0));
}

function totalInvertido() {
  return redondear(db.inversiones
    .filter((p) => p.estado === 'Activa')
    .reduce((s, p) => s + (Number(p.capital) || 0), 0));
}

function rendimientoProyectado() {
  return redondear(db.inversiones
    .filter((p) => p.estado === 'Activa')
    .reduce((s, p) => s + (Number(p.interes_neto) || 0), 0));
}

function deudaTotalTarjetas(mesRef = mesActual()) {
  return redondear(db.cuentas
    .filter((c) => c.tipo === 'Tarjeta')
    .reduce((s, c) => s + estadoTarjeta(c.id, mesRef).utilizado, 0));
}

function patrimonioNeto(mesRef = mesActual()) {
  return redondear(totalAhorrado() + totalInvertido() - deudaTotalTarjetas(mesRef));
}

// --- Agregados de reportes ---------------------------------------------------

/**
 * Filtros comunes de los reportes.
 * @typedef {{usuario?: string, tarjeta?: string, categorias?: string[],
 *            incluirEfectivo?: boolean, incluirTarjeta?: boolean}} Filtros
 */

const pasaUsuario = (f, u) => !f.usuario || f.usuario === 'ambos' || f.usuario === u;
const pasaTarjeta = (f, t) => !f.tarjeta || f.tarjeta === 'todas' || f.tarjeta === t;
const pasaCategoria = (f, c) => !f.categorias?.length || f.categorias.includes(c);

/** Gastos del periodo desglosados fila a fila (tarjeta + efectivo). */
function gastosEnMeses(meses, filtros = {}) {
  const set = new Set(meses);
  const out = [];

    svg.appendChild(el('polygon', {
      points: `${m.l},${y(0)} ${puntos} ${x(s.valores.length - 1)},${y(0)}`,

      svg.appendChild(el('text', {
        x: x(i), y: alto - 8, 'text-anchor': 'middle', class: 'viz-tick',
      })).textContent = etq;
    }
  });

  return undefined;
}

const TABLA_CRC = (() => {

    v.setUint16(8, 0, true);             // método: stored

async function leerZip(buffer) {
  const datos = new Uint8Array(buffer);
  const v = new DataView(datos.buffer);

  // Localiza el "end of central directory" desde el final.
  let fin = -1;
  for (let i = datos.length - 22; i >= 0 && i > datos.length - 65558; i -= 1) {
    if (v.getUint32(i, true) === 0x06054b50) { fin = i; break; }
  }
  if (fin < 0) throw new Error('El archivo no es un .xlsx válido.');

  const nEntradas = v.getUint16(fin + 10, true);
  let p = v.getUint32(fin + 16, true);
  const salida = new Map();
  const dec = new TextDecoder();

  for (let i = 0; i < nEntradas; i += 1) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const metodo = v.getUint16(p + 10, true);
    const tamComprimido = v.getUint32(p + 20, true);
    const nLen = v.getUint16(p + 28, true);
    const eLen = v.getUint16(p + 30, true);
    const cLen = v.getUint16(p + 32, true);
    const desplLocal = v.getUint32(p + 42, true);
    const nombre = dec.decode(datos.subarray(p + 46, p + 46 + nLen));

    // La cabecera local repite nombre/extra con longitudes propias.
    const nLenL = v.getUint16(desplLocal + 26, true);
    const eLenL = v.getUint16(desplLocal + 28, true);
    const ini = desplLocal + 30 + nLenL + eLenL;
    const crudo = datos.subarray(ini, ini + tamComprimido);

    if (nombre.endsWith('.xml') || nombre.endsWith('.rels')) {
      const contenido = metodo === 0 ? crudo : await inflarRaw(crudo);
      salida.set(nombre, dec.decode(contenido));
    }
    p += 46 + nLen + eLen + cLen;
  }
  return salida;
}

// --- Utilidades XML ----------------------------------------------------------

const escXml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
  // Excel rechaza caracteres de control fuera de tab/salto de línea.
  // eslint-disable-next-line no-control-regex
  .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');

const desescXml = (s) => String(s ?? '')
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
  .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)))
  .replace(/&amp;/g, '&');

/** Índice 0 → A, 25 → Z, 26 → AA. */
function letraColumna(i) {
  let n = i + 1;
  let s = '';
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

const indiceColumna = (ref) => {
  const letras = ref.match(/^[A-Z]+/)?.[0] || 'A';
  return [...letras].reduce((s, c) => s * 26 + (c.charCodeAt(0) - 64), 0) - 1;
};

// --- Escritura de libro ------------------------------------------------------

/**
 * Genera un .xlsx a partir de hojas simples.
 * @param {Array<{nombre: string, filas: Array<Array<string|number>>}>} hojas
 * @returns {Blob}
 */
function escribirLibro(hojas) {
  const hojasXml = hojas.map(({ filas }) => {
    const cuerpo = filas.map((fila, r) => {
      const celdas = fila.map((valor, c) => {
        const ref = `${letraColumna(c)}${r + 1}`;
        if (valor === null || valor === undefined || valor === '') return '';
        if (typeof valor === 'number' && Number.isFinite(valor)) {
          return `<c r="${ref}"${r === 0 ? ' s="1"' : ''}><v>${valor}</v></c>`;
        }
        return `<c r="${ref}" t="inlineStr"${r === 0 ? ' s="1"' : ''}>`
          + `<is><t xml:space="preserve">${escXml(valor)}</t></is></c>`;
      }).join('');
      return `<row r="${r + 1}">${celdas}</row>`;
    }).join('');

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + `<sheetData>${cuerpo}</sheetData></worksheet>`;
  });

  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + `<sheets>${hojas.map((h, i) => (
      `<sheet name="${escXml(h.nombre.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`
    )).join('')}</sheets></workbook>`;

  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + `${hojas.map((_, i) => (
      `<Relationship Id="rId${i + 1}" Target="worksheets/sheet${i + 1}.xml"`
      + ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet"/>'
    )).join('')}`
    + `<Relationship Id="rIdS" Target="styles.xml"`
    + ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles"/>'
    + '</Relationships>';

  // Un único estilo extra (s="1"): cabecera en negrita.
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
    + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    + '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>'
    + '<borders count="1"><border/></borders>'
    + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
    + '<cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs>'
    + '</styleSheet>';

  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + `${hojas.map((_, i) => (
      `<Override PartName="/xl/worksheets/sheet${i + 1}.xml"`
      + ' ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    )).join('')}</Types>`;

  const raiz = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Target="xl/workbook.xml"'
    + ' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument"/>'
    + '</Relationships>';

  const entradas = [
    { nombre: '[Content_Types].xml', datos: utf8(contentTypes) },
    { nombre: '_rels/.rels', datos: utf8(raiz) },
    { nombre: 'xl/workbook.xml', datos: utf8(workbook) },
    { nombre: 'xl/_rels/workbook.xml.rels', datos: utf8(rels) },
    { nombre: 'xl/styles.xml', datos: utf8(styles) },
    ...hojasXml.map((xml, i) => ({ nombre: `xl/worksheets/sheet${i + 1}.xml`, datos: utf8(xml) })),
  ];

  return new Blob([crearZip(entradas)], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  });
}

// --- Lectura de libro --------------------------------------------------------

/** Fecha serie de Excel → 'YYYY-MM-DD'. */
function serialAFecha(n) {
  const ms = Math.round((Number(n) - 25569) * 86400000);
  return new Date(ms).toISOString().slice(0, 10);
}

function parsearCadenasCompartidas(xml) {
  if (!xml) return [];
  return [...xml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map((m) => (
    [...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((t) => desescXml(t[1])).join('')
  ));
}

function parsearHoja(xml, compartidas) {
  const filas = [];
  for (const fm of xml.matchAll(/<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)) {
    const idx = Number(fm[1]) - 1;
    const fila = [];
    let siguiente = 0;

    // La alternativa `\/>` es imprescindible: Excel escribe las celdas vacías
    // con estilo como `<c r="G5" s="12"/>`. Sin contemplarlas, el `</c>` que
    // cierra la celda siguiente las daría por terminadas y todos los valores
    // de la fila se correrían una columna.
    for (const cm of fm[2].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
      const attrs = cm[1];
      const interior = cm[2];
      const ref = attrs.match(/r="([A-Z]+\d+)"/)?.[1];
      const tipo = attrs.match(/t="(\w+)"/)?.[1];
      const col = ref ? indiceColumna(ref) : siguiente;
      siguiente = col + 1;

      let valor = '';
      if (interior === undefined) {
        // Celda auto-cerrada: sin contenido.
      } else if (tipo === 'inlineStr') {
        valor = [...interior.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)]
          .map((t) => desescXml(t[1])).join('');
      } else {
        const v = interior.match(/<v>([\s\S]*?)<\/v>/)?.[1];
        if (v !== undefined) {
          if (tipo === 's') valor = compartidas[Number(v)] ?? '';
          else if (tipo === 'str') valor = desescXml(v);
          else valor = Number(v);
        }
      }
      fila[col] = valor;
    }
    filas[idx] = fila;
  }
  // Rellena huecos para que todas las filas sean arrays densos. Se construye
  // con Array.from y no con .map porque .map conserva los huecos del array
  // disperso, y una hoja que empieza en la fila 3 dejaría las dos primeras
  // posiciones en `undefined`.
  const ancho = filas.reduce((m, f) => Math.max(m, f?.length || 0), 0);
  return Array.from({ length: filas.length }, (_, r) => (
    Array.from({ length: ancho }, (_, c) => (filas[r]?.[c] ?? ''))));
}

/**
 * Lee un .xlsx y devuelve { nombreHoja: filas[][] }.
 * @param {ArrayBuffer} buffer
 */
async function leerLibro(buffer) {
  const archivos = await leerZip(buffer);
  const workbook = archivos.get('xl/workbook.xml');
  if (!workbook) throw new Error('El archivo no contiene una hoja de cálculo.');

  const rels = new Map(
    [...(archivos.get('xl/_rels/workbook.xml.rels') || '')
      .matchAll(/Id="([^"]+)"[^>]*?Target="([^"]+)"/g)]
      .map((m) => [m[1], m[2].replace(/^\/?xl\//, '')]),
  );
  const compartidas = parsearCadenasCompartidas(archivos.get('xl/sharedStrings.xml'));

  const salida = {};
  const hojas = [...workbook.matchAll(/<sheet[^>]*name="([^"]*)"[^>]*r:id="([^"]+)"[^>]*\/>/g)];
  hojas.forEach(([, nombre, rid], i) => {
    const destino = rels.get(rid) || `worksheets/sheet${i + 1}.xml`;
    const xml = archivos.get(`xl/${destino}`);
    if (xml) salida[desescXml(nombre)] = parsearHoja(xml, compartidas);
  });
  return salida;
}

/** Filas crudas (con cabecera en la fila 1) → array de objetos. */
function filasAObjetos(filas, mapaColumnas) {
  if (!filas?.length) return [];
  const cabecera = filas[0].map((c) => String(c).trim());
  return filas.slice(1)
    .filter((f) => f.some((c) => c !== '' && c !== null && c !== undefined))
    .map((f) => {
      const obj = {};
      cabecera.forEach((titulo, i) => {
        const clave = mapaColumnas[titulo];
        if (clave) obj[clave] = f[i];
      });
      return obj;
    });
}

return { escribirLibro, filasAObjetos, leerLibro, serialAFecha };
})();

M["sync"] = (function () {
/**
 * Sincronización entre los dispositivos de J y C.
 *
 * Guarda toda la base como un único documento JSON en una tabla de Supabase y
 * la fusiona registro a registro: si J agrega un gasto en su teléfono y C otro
 * en el suyo, al sincronizar quedan los dos. Cada fila lleva `_ts` (última
 * modificación) y las bajas dejan una lápida en `db.borrados`, así una
 * eliminación tampoco «revive» al sincronizar.
 *
 * No hay servidor propio: se habla directo con la API REST de Supabase.
 */

const {db, COLECCIONES, CLAVES, CONFIG_LOCAL, reemplazar, instantanea} = M["store"];
const TABLA = 'finanzas';
const INTERVALO = 60_000;

/** Estado observable del sync, para pintarlo en la interfaz. */
const estadoSync = {
  activo: false,
  sincronizando: false,
  ultima: null,
  error: null,
};

const oyentes = new Set();
function alCambiarSync(fn) {
  oyentes.add(fn);
  return () => oyentes.delete(fn);
}
const avisar = () => oyentes.forEach((fn) => fn(estadoSync));

function configurado() {
  return Boolean(db.config.sync_url && db.config.sync_clave);
}

function cabeceras() {
  return {
    apikey: db.config.sync_clave,
    Authorization: `Bearer ${db.config.sync_clave}`,
    'Content-Type': 'application/json',
    Prefer: 'return=representation',
  };
}

const base = () => `${String(db.config.sync_url).replace(/\/+$/, '')}/rest/v1/${TABLA}`;

// --- Fusión ------------------------------------------------------------------

/** Índice clave → registro, quedándose con la versión más reciente. */
function indexar(lista, clave) {
  const m = new Map();
  for (const fila of lista || []) {
    const k = clave(fila);
    const previo = m.get(k);
    if (!previo || (fila._ts || 0) > (previo._ts || 0)) m.set(k, fila);
  }
  return m;
}

/**
 * Fusiona dos bases. Para cada registro gana la copia con `_ts` mayor; una
 * lápida elimina el registro si es posterior a su última modificación.
 */
function fusionar(local, remoto) {
  const salida = { version: Math.max(local.version || 1, remoto.version || 1) };

  const lapidas = new Map();
  for (const t of [...(local.borrados || []), ...(remoto.borrados || [])]) {
    const k = `${t.c}␀${t.k}`;
    if (!lapidas.has(k) || t.t > lapidas.get(k).t) lapidas.set(k, t);
  }

  for (const col of COLECCIONES) {
    const clave = CLAVES[col];
    const fusion = indexar(local[col], clave);
    for (const [k, fila] of indexar(remoto[col], clave)) {
      const previo = fusion.get(k);
      if (!previo || (fila._ts || 0) > (previo._ts || 0)) fusion.set(k, fila);
    }
    for (const [k, fila] of [...fusion]) {
      const lapida = lapidas.get(`${col}␀${k}`);
      if (lapida && lapida.t >= (fila._ts || 0)) fusion.delete(k);
    }
    salida[col] = [...fusion.values()];
  }

  // Los ajustes generales van por documento; los del dispositivo no viajan.
  const remotoGana = (remoto.configTs || 0) > (local.configTs || 0);
  salida.config = { ...(remotoGana ? local.config : remoto.config),
    ...(remotoGana ? remoto.config : local.config) };
  CONFIG_LOCAL.forEach((k) => { salida.config[k] = local.config?.[k] ?? ''; });
  salida.configTs = Math.max(local.configTs || 0, remoto.configTs || 0);

  // Las lápidas viejas ya no aportan: se conservan 90 días.
  const corte = Date.now() - 90 * 86400000;
  salida.borrados = [...lapidas.values()].filter((t) => t.t > corte);

  return salida;
}

/** Lo que se sube: la base sin los ajustes propios del dispositivo. */
function paraSubir(datos) {
  const copia = { ...datos, config: { ...datos.config } };
  CONFIG_LOCAL.forEach((k) => delete copia.config[k]);
  return copia;
}

// --- Transporte --------------------------------------------------------------

async function traer() {
  const url = `${base()}?id=eq.${encodeURIComponent(db.config.sync_id || 'jc')}&select=datos`;
  const resp = await fetch(url, { headers: cabeceras() });
  if (!resp.ok) throw new Error(`Supabase respondió ${resp.status}: ${await resp.text()}`);
  const filas = await resp.json();
  return filas[0]?.datos || null;
}

async function subir(datos) {
  const id = db.config.sync_id || 'jc';
  const cuerpo = JSON.stringify([{ id, datos: paraSubir(datos), actualizado: new Date().toISOString() }]);
  // upsert: crea la fila la primera vez y la reemplaza después.
  const resp = await fetch(base(), {
    method: 'POST',
    headers: { ...cabeceras(), Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: cuerpo,
  });
  if (!resp.ok) throw new Error(`Supabase respondió ${resp.status}: ${await resp.text()}`);
}

/**
 * Ciclo completo: baja lo remoto, fusiona con lo local, guarda y sube.
 * @returns {Promise<boolean>} true si terminó sin error
 */
async function sincronizar({ silencioso = true } = {}) {
  if (!configurado() || estadoSync.sincronizando) return false;
  estadoSync.sincronizando = true;
  estadoSync.error = null;
  avisar();

  try {
    const local = instantanea();
    const remoto = await traer();
    const fusionado = remoto ? fusionar(local, remoto) : local;
    if (remoto) reemplazar(fusionado);
    await subir(fusionado);

    estadoSync.activo = true;
    estadoSync.ultima = new Date();
    return true;
  } catch (err) {
    console.error('Sync', err);
    estadoSync.error = err.message;
    if (!silencioso) throw err;
    return false;
  } finally {
    estadoSync.sincronizando = false;
    avisar();
  }
}

/** Comprueba credenciales antes de guardarlas. */
async function probarConexion(url, clave, id) {
  const anterior = { ...db.config };
  Object.assign(db.config, { sync_url: url, sync_clave: clave, sync_id: id });
  try {
    await traer();
    return { ok: true };
  } catch (err) {
    return { ok: false, error: err.message };
  } finally {
    Object.assign(db.config, anterior);
  }
}

// --- Arranque ----------------------------------------------------------------

let temporizador;
let pendiente;

/** Sube los cambios poco después de guardarlos, agrupando ráfagas. */
function empujarDiferido() {
  // Sin este guardo, el `guardar()` que hace la propia fusión reprogramaría
  // otra subida y el ciclo no pararía nunca.
  if (!configurado() || estadoSync.sincronizando) return;
  clearTimeout(pendiente);
  pendiente = setTimeout(() => sincronizar(), 2500);
}

/** Arranca el ciclo: al abrir, al volver a la app y cada minuto. */
function iniciarSync() {
  if (!configurado()) return;
  estadoSync.activo = true;
  sincronizar();

  clearInterval(temporizador);
  temporizador = setInterval(() => {
    if (document.visibilityState === 'visible') sincronizar();
  }, INTERVALO);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') sincronizar();
  });
  window.addEventListener('online', () => sincronizar());
}

/** SQL que el usuario debe correr una vez en su proyecto de Supabase. */
const SQL_TABLA = `create table if not exists finanzas (
  id text primary key,
  datos jsonb not null default '{}'::jsonb,
  actualizado timestamptz not null default now()
);

alter table finanzas enable row level security;

create policy "acceso con la clave anon"
  on finanzas for all
  using (true) with check (true);`;

return { SQL_TABLA, alCambiarSync, configurado, empujarDiferido, estadoSync, fusionar, iniciarSync, probarConexion, sincronizar };
})();

    ['Estado', 'estado', 't'], ['Cuenta origen', 'cuenta_origen', 't'],

  ['Movimientos', 'movimientos', [

    ['Cuenta origen', 'cuenta_origen', 't'], ['Cuenta destino', 'cuenta_destino', 't'],

  const conArchivo = async (fn, exito) => {
    try {
      await fn();
      brindis(exito);
    } catch (err) {
      if (err.name === 'AbortError') return;
      modal({
        titulo: 'No se pudo vincular',
        cuerpo: `<p>${esc(err.message)}</p>`,
        aceptar: 'Entendido',
        alEnviar: () => {},
      });
    }
    render(raiz);
  };

  $('#btn-ar-crear', raiz)?.addEventListener('click', () => conArchivo(
    () => archivoExcel.crearYVincular(), 'Archivo creado y vinculado'));
  $('#btn-ar-vincular', raiz)?.addEventListener('click', () => conArchivo(
    () => archivoExcel.vincularExistente(), 'Archivo vinculado'));
  $('#btn-ar-reconectar', raiz)?.addEventListener('click', () => conArchivo(
    () => archivoExcel.reconectar(), 'Permiso restablecido'));
  $('#btn-ar-guardar', raiz)?.addEventListener('click', async () => {
    brindis(await archivoExcel.escribir() ? 'Archivo actualizado' : 'No se pudo guardar');
    render(raiz);
  });
  $('#btn-ar-desvincular', raiz)?.addEventListener('click', () => {
    confirmar('La app dejará de escribir en el archivo. Los datos siguen aquí.', async () => {
      await archivoExcel.desvincular();
      render(raiz);
    }, { aceptar: 'Desvincular' });
  });

  $('#btn-sy-guardar', raiz).addEventListener('click', async () => {
    const url = $('#sy-url', raiz).value.trim();
    const clave = $('#sy-clave', raiz).value.trim();
    const id = $('#sy-id', raiz).value.trim() || 'jc';
    if (!url || !clave) {
      brindis('Faltan la URL y la clave');
      return;
    }
    brindis('Probando la conexión…');
    const r = await probarConexion(url, clave, id);
    if (!r.ok) {
      modal({
        titulo: 'No se pudo conectar',
        cuerpo: `<p>${esc(r.error)}</p>
          <p class="pista">Revisa que la URL sea la del proyecto, que la clave sea la
          <em>anon public</em> y que ya hayas ejecutado el SQL de la tabla.</p>`,
        aceptar: 'Entendido',
        alEnviar: () => {},
      });
      return;
    }
    Object.assign(db.config, { sync_url: url, sync_clave: clave, sync_id: id });
    guardar();
    await sincronizar();
    iniciarSync();
    brindis('Dispositivo conectado');
    render(raiz);
  });

  $('#btn-sy-ahora', raiz).addEventListener('click', async () => {
    brindis('Sincronizando…');
    const ok = await sincronizar();
    brindis(ok ? 'Todo al día' : 'No se pudo sincronizar');
    render(raiz);
  });

  $('#btn-exp-xlsx', raiz).addEventListener('click', exportarExcel);
  $('#btn-imp-xlsx', raiz).addEventListener('click', () => importarExcel(() => render(raiz)));
  $('#btn-exp-json', raiz).addEventListener('click', exportarJSON);
  $('#btn-imp-json', raiz).addEventListener('click', () => importarJSON(() => render(raiz)));
  $('#btn-cat', raiz).addEventListener('click', () => formCategoria(null, () => render(raiz)));
  $$('[data-cat]', raiz).forEach((b) => b.addEventListener('click', () => {
    formCategoria(b.dataset.cat, () => render(raiz));
  }));

  $('#btn-ajustes', raiz).addEventListener('click', () => {
    db.config.tema = $('#s-tema', raiz).value;
    db.config.usuarios = $('#s-usuarios', raiz).value.trim() || 'J,C';
    db.config.base_anual_polizas = $('#s-base', raiz).value;
    db.config.retencion_fuente_polizas = String(aNumero($('#s-ret', raiz).value) || 0);
    guardar();
    document.documentElement.dataset.tema = db.config.tema === 'auto' ? '' : db.config.tema;
    brindis('Ajustes guardados');
  });

  $('#btn-borrar', raiz).addEventListener('click', () => {
    confirmar('Se borrarán todos los registros de este dispositivo. '
      + '¿Descargaste antes un respaldo?', () => {
      limpiarTodo();
      location.reload();
    }, { aceptar: 'Borrar todo' });
  });
}

function formCategoria(nombre, alTerminar) {
  const c = nombre ? db.categorias.find((x) => x.nombre === nombre) : null;
  modal({
    titulo: c ? `Editar «${c.nombre}»` : 'Nueva categoría',
    cuerpo: `
      <div class="filtros">
        <div class="campo"><label for="ct-nombre">Nombre</label>
          <input id="ct-nombre" name="nombre" required value="${esc(c?.nombre || '')}"></div>
        <div class="campo"><label for="ct-grupo">Grupo</label>
          <input id="ct-grupo" name="grupo" value="${esc(c?.grupo || 'Otros')}"></div>
      </div>
      <div class="filtros">
        <div class="campo"><label for="ct-tipo">Tipo</label>
          <select id="ct-tipo" name="tipo">
            <option${c?.tipo !== 'Ingreso' ? ' selected' : ''}>Gasto</option>
            <option${c?.tipo === 'Ingreso' ? ' selected' : ''}>Ingreso</option>
          </select></div>
        <div class="campo"><label for="ct-ppto">Presupuesto mensual</label>
          <input id="ct-ppto" name="presupuesto" type="text"
                 value="${Number(c?.presupuesto) || 0}" inputmode="decimal"></div>
      </div>
      ${c ? '<p class="pista">Al renombrar, los registros existentes conservan el nombre anterior.</p>' : ''}`,
    alEnviar(d) {
      const fila = {
        nombre: d.nombre.trim(),
        grupo: d.grupo.trim() || 'Otros',
        tipo: d.tipo,
        presupuesto: redondear(d.presupuesto),
        activa: 'Si',
      };
      const i = db.categorias.findIndex((x) => x.nombre === (c?.nombre ?? fila.nombre));
      if (i >= 0) db.categorias[i] = fila;
      else db.categorias.push(fila);
      guardar();
      brindis('Categoría guardada');
      alTerminar?.();
    },
  });
}

return { render };
})();

M["app"] = (function () {
/** Arranque, navegación y botón de registro rápido. */

const {db, cargar, alCambiar, almacenamiento, instantanea, guardar, tarjetas} = M["store"];
const {iniciarSync, empujarDiferido, alCambiarSync, estadoSync, configurado} = M["sync"];
const {mesActual, nombreMes, money, pagoDelMes, estadoTarjeta} = M["calc"];
const archivoExcel = M["archivo"];
const {$, crear, esc, ICONOS, modal, brindis, descargar} = M["ui"];
const {formGastoTarjeta, formGastoEfectivo, formIngreso, formInversion, formMovimiento} = M["forms"];
const resumen = M["views/resumen"];
const mensual = M["views/mensual"];
const anual = M["views/anual"];
const vistaTarjetas = M["views/tarjetas"];
const inversiones = M["views/inversiones"];
const cuentas = M["views/cuentas"];
const datos = M["views/datos"];
/*
 * `titulo` es el rótulo de la barra de abajo, donde cada ranura mide unos 48 px
 * en un teléfono: si no cabe, se corta. `rotulo` es el título largo de la
 * cabecera, que sí tiene sitio.
 */
const VISTAS = [
  { id: 'resumen', titulo: 'Inicio', rotulo: 'Resumen', modulo: resumen, icono: ICONOS.resumen },
  { id: 'mensual', titulo: 'Mes', rotulo: 'Mensual', modulo: mensual, icono: ICONOS.mensual },
  { id: 'anual', titulo: 'Año', modulo: anual, icono: ICONOS.anual },
  { id: 'tarjetas', titulo: 'Tarjetas', modulo: vistaTarjetas, icono: ICONOS.tarjetas },
  { id: 'inversiones', titulo: 'Invertir', rotulo: 'Inversiones', modulo: inversiones, icono: ICONOS.inversiones },
  { id: 'cuentas', titulo: 'Cuentas', modulo: cuentas, icono: ICONOS.cuentas },
  { id: 'datos', titulo: 'Datos', modulo: datos, icono: ICONOS.datos },
];

/*
 * La barra de abajo lleva seis secciones repartidas a los lados del «+».
 * «Datos» —importar, respaldos, sincronización— no es de uso diario, así que
 * vive en el menú de la cabecera y deja sitio para que las demás respiren.
 */
const EN_BARRA = VISTAS.filter((v) => v.id !== 'datos');

let vistaActual = 'resumen';

function aplicarTema() {
  const tema = db.config.tema || 'auto';
  document.documentElement.dataset.tema = tema === 'auto' ? '' : tema;
}

/** Punto de estado del sync junto al título. */
function pintarEstadoSync() {
  const nodo = $('#estado-sync');
  if (!nodo) return;
  if (!configurado()) {
    nodo.hidden = true;
    return;
  }
  nodo.hidden = false;
  const estado = estadoSync.sincronizando ? 'sync' : estadoSync.error ? 'error' : 'ok';
  nodo.dataset.estado = estado;
  nodo.title = {
    sync: 'Sincronizando…',
    error: `Error de sincronización: ${estadoSync.error}`,
    ok: estadoSync.ultima
      ? `Sincronizado a las ${estadoSync.ultima.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' })}`
      : 'Conectado',
  }[estado];
}

function pintarNav() {
  const nav = $('#nav');
  const boton = (v) => `
    <button data-vista="${v.id}" ${v.id === vistaActual ? 'aria-current="page"' : ''}>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${v.icono}</svg>
      <span>${v.titulo}</span>
    </button>`;

  // El «+» va dibujado, no escrito: el carácter de texto se apoya en la línea
  // base de la fuente y nunca queda centrado del todo dentro del círculo.
  const mas = `
    <button class="nav-mas" id="fab" aria-label="Registrar movimiento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>`;

  const mitad = Math.ceil(EN_BARRA.length / 2);
  nav.innerHTML = EN_BARRA.slice(0, mitad).map(boton).join('')
    + mas
    + EN_BARRA.slice(mitad).map(boton).join('');

  nav.querySelectorAll('[data-vista]').forEach((b) => {
    b.addEventListener('click', () => irA(b.dataset.vista));
  });
  nav.querySelector('#fab').addEventListener('click', menuRegistro);
}

/** Lo que hay que mirar hoy: se pinta en la campana de la cabecera. */
function avisosPendientes() {
  const lista = [];

  if (!almacenamiento.ok) {
    lista.push({ nivel: 'critico', texto: 'Este navegador no está guardando los datos. Descarga un respaldo.' });
  }
  if (configurado() && estadoSync.error) {
    lista.push({ nivel: 'critico', texto: `La sincronización falló: ${estadoSync.error}` });
  }

  const mes = mesActual();
  tarjetas().forEach((t) => {
    const pago = pagoDelMes(t.id, mes, 'ambos');
    if (pago > 0) {
      lista.push({ nivel: 'info', texto: `${t.nombre}: a pagar en ${nombreMes(mes)} ${money(pago)}.` });
    }
    const est = estadoTarjeta(t.id);
    const uso = est.cupo ? (est.utilizado / est.cupo) * 100 : 0;
    if (uso >= 80) {
      lista.push({
        nivel: uso >= 95 ? 'critico' : 'alerta',
        texto: `${t.nombre} lleva usado el ${uso.toFixed(0)} % del cupo.`,
      });
    }
  });

  return lista;
}

function pintarAvisos() {
  const btn = $('#btn-avisos');
  if (!btn) return;
  const hay = avisosPendientes().some((a) => a.nivel !== 'info');
  btn.dataset.avisos = hay ? 'si' : 'no';
}

function panelAvisos() {
  const lista = avisosPendientes();
  modal({
    titulo: 'Avisos',
    cuerpo: lista.length
      ? lista.map((a) => `
          <div class="aviso ${a.nivel === 'info' ? '' : a.nivel}">
            <span class="icono">${a.nivel === 'info' ? '•' : '⚠'}</span>
            <span class="crece">${esc(a.texto)}</span>
          </div>`).join('')
      : '<p class="vacio">Todo en orden: nada pendiente de mirar.</p>',
    aceptar: 'Cerrar',
    soloCerrar: true,
    alEnviar: () => {},
  });
}

/** Menú de la cabecera: lo que no cabe en la barra de abajo. */
function menuPrincipal() {
  const temas = [['auto', 'Automático'], ['claro', 'Claro'], ['oscuro', 'Oscuro']];
  const actual = db.config.tema || 'auto';
  const dlg = modal({
    titulo: 'Menú',
    cuerpo: `
      <div class="filtros" style="flex-direction:column;align-items:stretch">
        <button type="button" class="btn" id="m-datos" style="justify-content:flex-start">
          Datos, respaldos y sincronización</button>
      </div>
      <div class="campo" style="margin-top:14px">
        <label>Tema</label>
        <div class="segmentado" id="m-tema">
          ${temas.map(([v, txt]) => `
            <button type="button" data-tema="${v}" aria-pressed="${v === actual}">${txt}</button>
          `).join('')}
        </div>
      </div>`,
    aceptar: 'Cerrar',
    soloCerrar: true,
    alEnviar: () => {},
  });

  dlg.querySelector('#m-datos').addEventListener('click', () => {
    dlg.close();
    dlg.remove();
    irA('datos');
  });
  dlg.querySelectorAll('[data-tema]').forEach((b) => {
    b.addEventListener('click', () => {
      db.config.tema = b.dataset.tema;
      guardar();
      aplicarTema();
      dlg.querySelectorAll('[data-tema]').forEach((o) => {
        o.setAttribute('aria-pressed', String(o === b));
      });
    });
  });
}

/**
 * Cuando el navegador no guarda, la app sigue usable en la sesión pero hay
 * que decirlo sin rodeos: lo contrario es perder datos en silencio.
 */
function avisoAlmacenamiento() {
  if (almacenamiento.ok) return null;
  const texto = {
    bloqueado: 'Este navegador está bloqueando el almacenamiento de la página, '
      + 'así que lo que registres se perderá al cerrarla. Pasa en Safari del '
      + 'iPhone cuando la app va incrustada en otra página.',
    'no-persiste': 'Este navegador no está conservando los datos entre sesiones: '
      + 'lo que registres se perderá al cerrar la app.',
    'sin-espacio': 'No queda espacio de almacenamiento en este navegador. '
      + 'Descarga un respaldo y borra datos antiguos.',
  }[almacenamiento.motivo] || 'No se pudo guardar en este navegador.';

  const nodo = crear(`
    <div class="aviso critico" role="alert">
      <span class="icono">⚠</span>
      <span class="crece"><strong>Los datos no se están guardando.</strong> ${texto}</span>
      <button class="btn pequeno" id="btn-respaldo-urgente">Descargar respaldo</button>
    </div>`);
  nodo.querySelector('#btn-respaldo-urgente').addEventListener('click', () => {
    descargar(new Blob([JSON.stringify(instantanea(), null, 1)], { type: 'application/json' }),
      `respaldo_finanzas_${new Date().toISOString().slice(0, 10)}.json`);
  });
  return nodo;
}

function irA(id) {
  const vista = VISTAS.find((v) => v.id === id) || VISTAS[0];
  vistaActual = vista.id;
  if (location.hash !== `#${vista.id}`) location.hash = vista.id;
  pintarNav();
  $('#titulo-vista').textContent = vista.rotulo || vista.titulo;
  const raiz = $('#vista');
  raiz.textContent = '';
  vista.modulo.render(raiz, { irA });
  const aviso = avisoAlmacenamiento();
  if (aviso) raiz.prepend(aviso);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/** Menú del botón flotante: qué quiero registrar. */
function menuRegistro() {
  const acciones = [
    ['Gasto con tarjeta', formGastoTarjeta],
    ['Gasto en efectivo', formGastoEfectivo],
    ['Ingreso', formIngreso],
    ['Inversión / póliza', formInversion],
    ['Movimiento entre cuentas', formMovimiento],
  ];
  const dlg = modal({
    titulo: '¿Qué quieres registrar?',
    cuerpo: `<div class="filtros" style="flex-direction:column;align-items:stretch">
      ${acciones.map(([texto], i) => (
    `<button type="button" class="btn" data-accion="${i}" style="justify-content:flex-start">${texto}</button>`
  )).join('')}</div>`,
    aceptar: 'Cerrar',
    alEnviar: () => {},
  });
  dlg.querySelector('.modal-pie').style.display = 'none';
  dlg.querySelectorAll('[data-accion]').forEach((b) => {
    b.addEventListener('click', () => {
      dlg.close();
      dlg.remove();
      acciones[Number(b.dataset.accion)][1](() => irA(vistaActual));
    });
  });
}

async function iniciar() {
  const origen = await cargar();
  aplicarTema();

  pintarNav();
  $('#btn-menu').addEventListener('click', menuPrincipal);
  $('#btn-avisos').addEventListener('click', panelAvisos);

  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && id !== vistaActual) irA(id);
  });

  irA(location.hash.slice(1) || 'resumen');

  if (origen === 'semilla') {
    brindis('Datos cargados desde el Excel migrado');
  } else if (origen === 'vacio') {
    $('#vista').prepend(crear(`
      <div class="aviso alerta"><span class="icono">⚠</span>
        <span>No se encontró la base inicial. Si abriste el archivo directamente
        desde el disco, súbelo a un servidor o importa el Excel en la pestaña
        <strong>Datos</strong>.</span></div>`));
  }

  // Refresca la cabecera cuando cambian los datos y sube los cambios.
  alCambiar(() => {
    aplicarTema();
    pintarAvisos();
    empujarDiferido();
    archivoExcel.guardarDiferido();
  });

  // Indicador de sincronización en la cabecera.
  alCambiarSync(() => { pintarEstadoSync(); pintarAvisos(); });
  pintarEstadoSync();
  pintarAvisos();
  iniciarSync();

  // Archivo de Excel vinculado: se readopta y se queda atento a las
  // ediciones hechas directamente en Excel.
  if (archivoExcel.soportado) {
    archivoExcel.restaurar().then((estado) => {
      if (estado === 'ninguno') return;
      archivoExcel.vigilar(() => irA(vistaActual));
      if (estado === 'listo') {
        irA(vistaActual);
        brindis(`Datos leídos de ${archivoExcel.archivo.nombre}`);
      }
    }).catch((err) => console.warn('Archivo vinculado', err));
  }

  // El service worker solo acompaña a la versión por módulos; en el archivo
  // único no existe y pedirlo solo ensucia la consola con un 404. La señal es
  // el propio `<script type="module">`, que el empaquetador quita: mirar el
  // enlace al manifiesto no valía, porque la versión publicada también lo
  // lleva para que Android tome sus iconos.
  const porModulos = document.querySelector('script[type="module"]');
  if (porModulos && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sin modo offline */ });
  }
}

iniciar();

return {  };
})();

</script>

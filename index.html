/**
 * Abre un modal con formulario.
 *
 * @param {object} opts
 * @param {string} opts.titulo
 * @param {string} opts.cuerpo        HTML del formulario
 * @param {string} [opts.aceptar]     texto del botón principal
 * @param {(form: HTMLFormElement, dlg: HTMLDialogElement) => void} [opts.alAbrir]
 * @param {(datos: object, form: HTMLFormElement) => boolean|void} opts.alEnviar
 *        devolver `false` mantiene el modal abierto (validación fallida)
 */
/**
 * `soloCerrar` deja un único botón en el pie: en un panel que solo se lee,
 * «Cancelar» y «Cerrar» uno al lado del otro hacen dudar sin motivo.
 */
function modal({ titulo, cuerpo, aceptar = 'Guardar', soloCerrar = false, alAbrir, alEnviar }) {
  const dlg = crear(`
    <dialog>
      <form method="dialog" class="modal-form">
        <div class="modal-cab">
          <h2>${esc(titulo)}</h2>
          <button type="button" class="cerrar" aria-label="Cerrar">&times;</button>
        </div>
        <div class="modal-cuerpo">${cuerpo}</div>
        <div class="modal-pie">
          <button type="button" class="btn" data-cancelar
            ${soloCerrar ? 'hidden' : ''}>Cancelar</button>
          <button type="submit" class="btn ${soloCerrar ? '' : 'primario'}">${esc(aceptar)}</button>
        </div>
      </form>
    </dialog>`);

  document.body.appendChild(dlg);
  const form = dlg.querySelector('form');

  const cerrar = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('.cerrar').addEventListener('click', cerrar);
  dlg.querySelector('[data-cancelar]').addEventListener('click', cerrar);
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); cerrar(); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const datos = Object.fromEntries(new FormData(form).entries());
    // Los campos de dinero se normalizan aquí, en un solo sitio: quien los
    // lee después recibe siempre un número con punto decimal.
    form.querySelectorAll('input[inputmode="decimal"]').forEach((i) => {
      if (i.name) datos[i.name] = String(aNumero(i.value));
    });
    if (alEnviar(datos, form) !== false) cerrar();
  });

  dlg.showModal();
  alAbrir?.(form, dlg);
  return dlg;
}

    const texto = typeof it === 'string' ? it : it.texto;

/** Grupo de botones mutuamente excluyentes. Devuelve el elemento. */
function segmentado(items, valorActual, alCambiar) {
  const nodo = crear(`<div class="segmentado" role="group">${items.map((it) => {
    const valor = typeof it === 'string' ? it : it.valor;
    const texto = typeof it === 'string' ? it : it.texto;
    return `<button type="button" value="${esc(valor)}" aria-pressed="${valor === valorActual}">${esc(texto)}</button>`;
  }).join('')}</div>`);

  nodo.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    $$('button', nodo).forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));

}

  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

}

// --- CRC32 -------------------------------------------------------------------

const TABLA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i += 1) {
    let c = i;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i += 1) {
    c = TABLA_CRC[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  }

const utf8 = (s) => new TextEncoder().encode(s);

// --- ZIP: escritura ----------------------------------------------------------

/** @param {Array<{nombre: string, datos: Uint8Array}>} entradas */
function crearZip(entradas) {
  const locales = [];
  const central = [];
  let offset = 0;

  for (const { nombre, datos } of entradas) {
    const nom = utf8(nombre);
    const crc = crc32(datos);

    const cab = new Uint8Array(30 + nom.length);
    const v = new DataView(cab.buffer);
    v.setUint32(0, 0x04034b50, true);
    v.setUint16(4, 20, true);            // versión
    v.setUint16(6, 0x0800, true);        // flag: nombres en UTF-8
    v.setUint16(8, 0, true);             // método: stored
    v.setUint32(14, crc, true);
    v.setUint32(18, datos.length, true);
    v.setUint32(22, datos.length, true);
    v.setUint16(26, nom.length, true);
    cab.set(nom, 30);

    const cd = new Uint8Array(46 + nom.length);
    const w = new DataView(cd.buffer);
    w.setUint32(0, 0x02014b50, true);
    w.setUint16(4, 20, true);
    w.setUint16(6, 20, true);
    w.setUint16(8, 0x0800, true);
    w.setUint16(10, 0, true);
    w.setUint32(16, crc, true);
    w.setUint32(20, datos.length, true);
    w.setUint32(24, datos.length, true);
    w.setUint16(28, nom.length, true);
    w.setUint32(42, offset, true);
    cd.set(nom, 46);

    locales.push(cab, datos);
    central.push(cd);
    offset += cab.length + datos.length;
  }

  const tamCentral = central.reduce((s, c) => s + c.length, 0);
  const fin = new Uint8Array(22);
  const f = new DataView(fin.buffer);
  f.setUint32(0, 0x06054b50, true);
  f.setUint16(8, entradas.length, true);
  f.setUint16(10, entradas.length, true);
  f.setUint32(12, tamCentral, true);
  f.setUint32(16, offset, true);

  const partes = [...locales, ...central, fin];
  const total = partes.reduce((s, p) => s + p.length, 0);
  const salida = new Uint8Array(total);
  let p = 0;
  for (const parte of partes) { salida.set(parte, p); p += parte.length; }

// --- ZIP: lectura ------------------------------------------------------------

async function inflarRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('Este navegador no puede descomprimir el .xlsx. '
      + 'Usa la importación desde JSON o actualiza el navegador.');

  const flujo = new Blob([bytes]).stream().pipeThrough(ds);

  let fin = -1;
  for (let i = datos.length - 22; i >= 0 && i > datos.length - 65558; i -= 1) {
    if (v.getUint32(i, true) === 0x06054b50) { fin = i; break; }
  }
  if (fin < 0) throw new Error('El archivo no es un .xlsx válido.');

  const nEntradas = v.getUint16(fin + 10, true);
  let p = v.getUint32(fin + 16, true);
  const salida = new Map();
  const dec = new TextDecoder();

  for (let i = 0; i < nEntradas; i += 1) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const metodo = v.getUint16(p + 10, true);
    const tamComprimido = v.getUint32(p + 20, true);
    const nLen = v.getUint16(p + 28, true);
    const eLen = v.getUint16(p + 30, true);
    const cLen = v.getUint16(p + 32, true);

    const nombre = dec.decode(datos.subarray(p + 46, p + 46 + nLen));

    // La cabecera local repite nombre/extra con longitudes propias.
    const nLenL = v.getUint16(desplLocal + 26, true);
    const eLenL = v.getUint16(desplLocal + 28, true);
    const ini = desplLocal + 30 + nLenL + eLenL;
    const crudo = datos.subarray(ini, ini + tamComprimido);

    if (nombre.endsWith('.xml') || nombre.endsWith('.rels')) {
      const contenido = metodo === 0 ? crudo : await inflarRaw(crudo);
      salida.set(nombre, dec.decode(contenido));
    }
    p += 46 + nLen + eLen + cLen;
  }
  return salida;
}

const escXml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  // eslint-disable-next-line no-control-regex

  .replace(/&lt;/g, '<').replace(/&gt;/g, '>')

  let n = i + 1;
  let s = '';
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

  const letras = ref.match(/^[A-Z]+/)?.[0] || 'A';
  return [...letras].reduce((s, c) => s * 26 + (c.charCodeAt(0) - 64), 0) - 1;
};

function parsearHoja(xml, compartidas) {

    const idx = Number(fm[1]) - 1;

    // con estilo como `<c r="G5" s="12"/>`. Sin contemplarlas, el `</c>` que
    // cierra la celda siguiente las daría por terminadas y todos los valores
    // de la fila se correrían una columna.

  // con Array.from y no con .map porque .map conserva los huecos del array
  // disperso, y una hoja que empieza en la fila 3 dejaría las dos primeras
  // posiciones en `undefined`.
  const ancho = filas.reduce((m, f) => Math.max(m, f?.length || 0), 0);

    Array.from({ length: ancho }, (_, c) => (filas[r]?.[c] ?? ''))));

    .filter((f) => f.some((c) => c !== '' && c !== null && c !== undefined))
    .map((f) => {

      cabecera.forEach((titulo, i) => {
        const clave = mapaColumnas[titulo];

/** Índice clave → registro, quedándose con la versión más reciente. */
function indexar(lista, clave) {
  const m = new Map();
  for (const fila of lista || []) {
    const k = clave(fila);
    const previo = m.get(k);
    if (!previo || (fila._ts || 0) > (previo._ts || 0)) m.set(k, fila);
  }

/**
 * Fusiona dos bases. Para cada registro gana la copia con `_ts` mayor; una
 * lápida elimina el registro si es posterior a su última modificación.
 */
function fusionar(local, remoto) {
  const salida = { version: Math.max(local.version || 1, remoto.version || 1) };

  const lapidas = new Map();
  for (const t of [...(local.borrados || []), ...(remoto.borrados || [])]) {
    const k = `${t.c}\u0000${t.k}`;
    if (!lapidas.has(k) || t.t > lapidas.get(k).t) lapidas.set(k, t);
  }

  for (const col of COLECCIONES) {
    const clave = CLAVES[col];
    const fusion = indexar(local[col], clave);
    for (const [k, fila] of indexar(remoto[col], clave)) {
      const previo = fusion.get(k);
      if (!previo || (fila._ts || 0) > (previo._ts || 0)) fusion.set(k, fila);
    }
    for (const [k, fila] of [...fusion]) {
      const lapida = lapidas.get(`${col}\u0000${k}`);
      if (lapida && lapida.t >= (fila._ts || 0)) fusion.delete(k);
    }
    salida[col] = [...fusion.values()];

  const remotoGana = (remoto.configTs || 0) > (local.configTs || 0);
  salida.config = { ...(remotoGana ? local.config : remoto.config),
    ...(remotoGana ? remoto.config : local.config) };

    404: 'No se encuentra la tabla «finanzas» en ese proyecto.',

  const id = db.config.sync_id || 'jc';
  const cuerpo = JSON.stringify([{ id, datos: paraSubir(datos), actualizado: new Date().toISOString() }]);
  // upsert: crea la fila la primera vez y la reemplaza después.
  const resp = await fetch(base(), {
    method: 'POST',
    headers: { ...cabeceras(), Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: cuerpo,
  });
  if (!resp.ok) throw await fallo(resp);
}

/**
 * Ciclo completo: baja lo remoto, fusiona con lo local, guarda y sube.
 * @returns {Promise<boolean>} true si terminó sin error
 */
async function sincronizar({ silencioso = true } = {}) {
  if (!configurado() || estadoSync.sincronizando) return false;
  estadoSync.sincronizando = true;
  estadoSync.error = null;
  avisar();

  try {
    const local = instantanea();
    const remoto = await traer();
    const fusionado = remoto ? fusionar(local, remoto) : local;
    if (remoto) reemplazar(fusionado);
    await subir(fusionado);

    estadoSync.activo = true;
    estadoSync.ultima = new Date();
    return true;
  } catch (err) {
    console.error('Sync', err);
    estadoSync.error = err.message;
    if (!silencioso) throw err;
    return false;
  } finally {
    estadoSync.sincronizando = false;
    avisar();
  }
}

/** Comprueba credenciales antes de guardarlas. */
async function probarConexion(url, clave, id) {
  const anterior = { ...db.config };
  Object.assign(db.config, { sync_url: url, sync_clave: clave, sync_id: id });
  try {
    await traer();
    return { ok: true };
  } catch (err) {
    return { ok: false, error: err.message };
  } finally {
    Object.assign(db.config, anterior);
  }
}

// --- Arranque ----------------------------------------------------------------

let temporizador;
let pendiente;

/** Sube los cambios poco después de guardarlos, agrupando ráfagas. */
function empujarDiferido() {
  // Sin este guardo, el `guardar()` que hace la propia fusión reprogramaría
  // otra subida y el ciclo no pararía nunca.
  if (!configurado() || estadoSync.sincronizando) return;
  clearTimeout(pendiente);
  pendiente = setTimeout(() => sincronizar(), 2500);
}

/** Arranca el ciclo: al abrir, al volver a la app y cada minuto. */
function iniciarSync() {
  if (!configurado()) return;
  estadoSync.activo = true;
  sincronizar();

  clearInterval(temporizador);
  temporizador = setInterval(() => {
    if (document.visibilityState === 'visible') sincronizar();
  }, INTERVALO);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') sincronizar();
  });
  window.addEventListener('online', () => sincronizar());
}

/**
 * Identificador del documento. Largo y aleatorio, no «jc».
 *
 * Con la política nueva, este identificador es lo que decide a qué fila se
 * puede llegar: hace de contraseña. «jc» se acierta a la primera, así que se
 * genera uno de 32 caracteres al conectar. Los que ya estaban puestos se
 * respetan —cambiarlo dejaría la fila anterior huérfana y al otro teléfono sin
 * encontrarla.
 */
function idNuevo() {
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  return `jc-${[...b].map((x) => x.toString(16).padStart(2, '0')).join('')}`;
}

/**
 * SQL que el usuario debe correr una vez en su proyecto de Supabase.
 *
 * La política anterior era `using (true) with check (true)`: autorizaba TODO a
 * cualquiera con la clave `anon`, que es pública por diseño —viaja en cada
 * petición y vive en el navegador. Cualquiera que la consiguiera podía leer,
 * cambiar o borrar la base entera, y también crear y borrar filas ajenas.
 *
 * Ahora la política se ata al identificador del documento, que es un secreto
 * largo y aleatorio: aunque alguien tenga la clave, sin ese identificador no
 * llega a ninguna fila, no puede enumerar las que hay ni vaciar la tabla.
 *
 * Conviene ser claro sobre hasta dónde llega esto: no equivale a autenticar.
 * Siguen siendo dos secretos guardados en el teléfono en vez de uno. La
 * protección de verdad es Supabase Auth con una política por usuario; esto es
 * lo más sólido que se puede hacer sin añadir una pantalla de acceso.
 */
const SQL_TABLA = `-- 1. La tabla (si aún no existe).
create table if not exists finanzas (
  id text primary key,
  datos jsonb not null default '{}'::jsonb,
  actualizado timestamptz not null default now()
);

alter table finanzas enable row level security;

-- 2. Fuera la política abierta, si la creaste antes.
drop policy if exists "acceso con la clave anon" on finanzas;
drop policy if exists "solo el documento de esta casa" on finanzas;

-- 3. Solo se llega a la fila cuyo identificador se conoce.
--    Sustituye AQUI_TU_IDENTIFICADOR por el que muestra la app en Datos.
create policy "solo el documento de esta casa"
  on finanzas for all
  using (id = 'AQUI_TU_IDENTIFICADOR')
  with check (id = 'AQUI_TU_IDENTIFICADOR');`;

return { SQL_TABLA, alCambiarSync, configurado, empujarDiferido, estadoSync, fusionar, idNuevo, iniciarSync, probarConexion, sincronizar };
})();

const HOJAS_MINIMAS = ['Cuentas', 'Gastos_Tarjeta', 'Cuotas'];

/** Marca de tiempo de cada fila; viaja en el Excel para poder fusionar. */
const COL_TS = 'Modificado';

/** La base actual convertida en hojas listas para `escribirLibro`. */
function construirLibro() {
  return ESQUEMA.map(([hoja, coleccion, cols]) => {
    const cabecera = cols.map(([titulo]) => titulo);
    if (!coleccion) {
      return {
        nombre: hoja,
        filas: [cabecera, ...Object.entries(db.config).map(([k, v]) => [k, String(v)])],
      };
    }
    const filas = (db[coleccion] || []).map((fila) => {
      const salida = cols.map(([, clave, tipo]) => {
        const v = fila[clave];
        if (v === undefined || v === null || v === '') return '';
        return tipo === 'n' ? Number(v) || 0 : String(v);
      });
      salida.push(Number(fila._ts) || 0);
      return salida;
    });
    return { nombre: hoja, filas: [[...cabecera, COL_TS], ...filas] };
  });
}

/** Filas crudas (cabecera en la fila 1) → objetos, según un mapa de columnas. */
function filasAObjetos(filas, cols) {
  if (!filas?.length) return [];
  const cabecera = filas[0].map((c) => String(c).trim());
  const mapa = Object.fromEntries(cols.map(([titulo, clave]) => [titulo, clave]));
  const tipos = Object.fromEntries(cols.map(([, clave, tipo]) => [clave, tipo]));
  const colTs = cabecera.indexOf(COL_TS);

  return filas.slice(1)
    .filter((f) => f.some((c) => c !== '' && c !== null && c !== undefined))
    .map((f) => {
      const obj = {};
      cabecera.forEach((titulo, i) => {
        const clave = mapa[titulo];
        if (!clave) return;
        const valor = f[i];
        if (tipos[clave] === 'n') obj[clave] = Number(valor) || 0;
        else if (tipos[clave] === 'f') {
          obj[clave] = typeof valor === 'number' ? serialAFecha(valor) : String(valor || '');
        } else obj[clave] = String(valor ?? '');
      });
      if (colTs >= 0) obj._ts = Number(f[colTs]) || 0;
      return obj;
    });

  return HOJAS_MINIMAS.every((h) => Array.isArray(libro?.[h]));

  if (!esBaseDeLaApp(libro)) {

      + `(${HOJAS_MINIMAS.join(', ')}). Si es tu libro original de tarjetas, `
      + 'usa «Exportar a Excel» para crear la base y vincula ese archivo.');

  const datos = { version: 2, config: { ...configBase } };
  const resumen = [];

  for (const [hoja, coleccion, cols] of ESQUEMA) {

M["libro_tarjetas"] = (function () {

 * Lector del libro `Cuentas_tarjetas.xlsx` tal como lo mantiene el usuario:

 *
 * No modifica nada del archivo. Devuelve una tabla plana de hechos
 * (una fila por mes con valor) que es lo que consumen los gráficos.
 */

const MESES_LARGO = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const MESES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun',
  'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

/** Meses que se asumen si el libro no trae la hoja `Tabla` con fechas reales. */
const MES_INICIO_POR_DEFECTO = '2025-05';

const nombreMes = (mes, corto = false) => {
  const [y, m] = String(mes).split('-').map(Number);
  const lista = corto ? MESES_CORTO : MESES_LARGO;
  return corto ? `${lista[m - 1]} ${String(y).slice(2)}` : `${lista[m - 1]} ${y}`;
};

const redondear = (n) => Math.round((Number(n) || 0) * 100) / 100;

const FORMATO = new Intl.NumberFormat('es-EC', {
  style: 'currency', currency: 'USD', minimumFractionDigits: 2,
});
const money = (n) => FORMATO.format(Number(n) || 0);

function sumarMeses(mes, n) {
  const [y, m] = mes.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return `${String(Math.floor(t / 12)).padStart(4, '0')}-${String((t % 12) + 1).padStart(2, '0')}`;
}

const texto = (v) => (v === null || v === undefined ? '' : String(v).trim());
const numero = (v) => {
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
  return Number.isFinite(n) ? n : 0;
};

/**
 * Fecha de una celda del libro, en ISO.
 *
 * Excel guarda las fechas como número de días desde 1900, así que sin
 * convertirlas se colaban tal cual —«45653»— y quedaban guardadas como si
 * fueran texto: las listas se ordenaban por una cadena sin sentido y no había
 * forma de calcular cuántos días pasan entre una compra y la siguiente. En el
 * libro también hay fechas escritas a mano, con barras o con dos puntos.
 */
function fechaDeCelda(v) {
  const esSerie = (n) => Number.isFinite(n) && n > 20000 && n < 80000;
  const aISO = (n) => new Date(Math.round((n - 25569) * 86400000))
    .toISOString().slice(0, 10);

  if (typeof v === 'number') return esSerie(v) ? aISO(v) : '';
  const s = texto(v);
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);

  const dmy = /^(\d{1,2})[/\-.:](\d{1,2})[/\-.:](\d{2}|\d{4})$/.exec(s);
  if (dmy) {
    const [, d, m, y] = dmy;
    // El año va de dos o cuatro cifras y nada más: en el libro hay un «205»
    // escrito a mano que si se acepta tal cual produce una fecha imposible,
    // y a partir de ahí todo lo que reste días revienta.
    const iso = `${y.length === 2 ? `20${y}` : y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
    return valida(iso) ? iso : '';
  }
  const n = Number(s.replace(',', '.'));
  return esSerie(n) ? aISO(n) : '';
}

/** Comprueba que la fecha existe de verdad (no «2025-02-31» ni «205-06-21»). */
function valida(iso) {
  const d = new Date(`${iso}T00:00:00Z`);
  return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === iso;
}

/** Serie de fecha de Excel → 'YYYY-MM'. */
function serialAMes(n) {
  const d = new Date(Math.round((Number(n) - 25569) * 86400000));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
}

function textoAMes(v) {
  const s = texto(v);
  const iso = /^(\d{4})-(\d{2})/.exec(s);
  if (iso) return `${iso[1]}-${iso[2]}`;
  const d = new Date(s);
  if (!Number.isNaN(d.getTime())) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  return null;
}

/**
 * Los encabezados de mes de las hojas de tarjeta son etiquetas sueltas
 * ("Mayo", "Junio", … "Diciembre2"). La hoja `Tabla` sí trae las fechas
 * reales de esos mismos 20 meses, así que de ahí salen las claves.
 */
function mesesDelLibro(libro, cuantos) {
  const tabla = libro.Tabla;
  if (tabla) {
    for (const fila of tabla.slice(0, 8)) {
      const encontrados = [];
      for (const celda of fila) {
        const mes = typeof celda === 'number' && celda > 20000
          ? serialAMes(celda)
          : textoAMes(celda);
        if (mes) encontrados.push(mes);
      }
      if (encontrados.length >= cuantos) return encontrados.slice(0, cuantos);
    }
  }
  // Sin `Tabla` usable: se numeran corridos desde el mes por defecto.
  return Array.from({ length: cuantos }, (_, i) => sumarMeses(MES_INICIO_POR_DEFECTO, i));
}

/** Localiza la fila de encabezados de una hoja de tarjeta. */
function localizarCabecera(filas) {
  for (let i = 0; i < Math.min(filas.length, 10); i += 1) {
    const fila = filas[i].map((c) => texto(c).toLowerCase());
    const cargo = fila.indexOf('cargo');
    if (cargo >= 0 && fila.includes('fecha') && fila.includes('cuenta')) {
      return { indice: i, columnas: fila, cargo };
    }
  }
  return null;
}

/** Nombre visible de la tarjeta: el rótulo que va sobre la tabla. */
function nombreTarjeta(filas, cabecera, hoja) {
  for (let i = Math.max(0, cabecera - 3); i < cabecera; i += 1) {
    const rotulo = (filas[i] || []).map(texto).find((c) => /banco/i.test(c));
    if (rotulo) return rotulo;
  }
  return hoja;
}

/**
 * Convierte el libro completo en la tabla de hechos.
 *
 * @param {Record<string, Array<Array<string|number>>>} libro  salida de leerLibro()
 * @returns {{meses: string[], registros: object[], tarjetas: object[],
 *            categorias: string[], usuarios: string[], movimientos: object[],
 *            total: number, avisos: string[]}}
 */
function analizar(libro) {
  const avisos = [];
  const registros = [];
  const movimientos = [];
  const tarjetas = [];
  let meses = null;

  for (const [hoja, filas] of Object.entries(libro)) {
    if (!Array.isArray(filas) || filas.length < 5) continue;
    const cab = localizarCabecera(filas);
    if (!cab) continue;

    const { indice, columnas, cargo } = cab;
    const colFecha = columnas.indexOf('fecha');
    const colDetalle = columnas.indexOf('detalle');
    const colProposito = columnas.indexOf('proposito');
    const colCuenta = columnas.indexOf('cuenta');

    // Los meses van desde la columna siguiente a "Cuenta" hasta el primer
    // encabezado de totales.
    const inicioMes = colCuenta + 1;
    let finMes = columnas.length;
    for (let c = inicioMes; c < columnas.length; c += 1) {
      if (/^(total|totales|monto)/.test(columnas[c])) { finMes = c; break; }
    }
    const nColumnasMes = finMes - inicioMes;
    if (nColumnasMes < 1) continue;

    if (!meses) meses = mesesDelLibro(libro, nColumnasMes);
    const mesesHoja = meses.slice(0, nColumnasMes);

    const id = hoja.replace(/\s+/g, '-').toUpperCase();
    const nombre = nombreTarjeta(filas, indice, hoja);
    let totalHoja = 0;
    let filasHoja = 0;

    for (let f = indice + 1; f < filas.length; f += 1) {
      const fila = filas[f];
      if (!fila) continue;
      const usuario = texto(fila[cargo]).toUpperCase();
      const detalle = texto(fila[colDetalle]);
      // Las filas de cierre llevan "TOTAL ACUMULADO …" en la columna de fecha.
      if (!['J', 'C'].includes(usuario) || !detalle) continue;
      if (/total/i.test(texto(fila[colFecha]))) continue;

      const categoria = texto(fila[colCuenta]) || 'Sin categoría';
      const proposito = colProposito >= 0 ? texto(fila[colProposito]) : '';
      const fecha = fechaDeCelda(fila[colFecha]);

      const cuotas = [];
      for (let c = 0; c < nColumnasMes; c += 1) {
        const monto = redondear(numero(fila[inicioMes + c]));
        if (Math.abs(monto) < 0.005) continue;
        cuotas.push({ mes: mesesHoja[c], monto });
        registros.push({
          tarjeta: id,
          tarjetaNombre: nombre,
          usuario,
          categoria,
          detalle,
          proposito,
          fecha,
          mes: mesesHoja[c],
          monto,
        });
        totalHoja += monto;
      }
      if (!cuotas.length) continue;
      filasHoja += 1;
      movimientos.push({
        tarjeta: id,
        tarjetaNombre: nombre,
        hoja,
        // Fila dentro de la hoja: distingue dos compras por lo demás idénticas.
        fila: f,
        usuario,
        categoria,
        detalle,
        proposito,
        fecha,
        cuotas: cuotas.length,
        mesInicio: cuotas[0].mes,
        // Cronograma real de la fila. Sin él habría que volver a emparejar los
        // registros por sus campos, y dos compras iguales el mismo día se
        // llevarían las cuotas de ambas.
        plan: cuotas,
        total: redondear(cuotas.reduce((s, c) => s + c.monto, 0)),
      });
    }

    if (filasHoja) {
      tarjetas.push({ id, nombre, hoja, total: redondear(totalHoja), movimientos: filasHoja });
    }
  }

  if (!tarjetas.length) {
    avisos.push('No se encontró ninguna hoja con las columnas Cargo / Fecha / Cuenta. '
      + '¿Es el archivo correcto?');
  }
  if (!libro.Tabla) {
    avisos.push(`El libro no trae la hoja «Tabla», así que los meses se cuentan `
      + `desde ${nombreMes(MES_INICIO_POR_DEFECTO)}.`);
  }

  const mesesConDato = [...new Set(registros.map((r) => r.mes))].sort();

  return {
    meses: mesesConDato,
    mesesLibro: meses || [],
    registros,
    movimientos,
    tarjetas: tarjetas.sort((a, b) => b.total - a.total),
    categorias: [...new Set(registros.map((r) => r.categoria))].sort((a, b) => a.localeCompare(b, 'es')),
    usuarios: [...new Set(registros.map((r) => r.usuario))].sort(),
    total: redondear(registros.reduce((s, r) => s + r.monto, 0)),
    avisos,
  };
}

// --- Agregaciones ------------------------------------------------------------

/** Filtra la tabla de hechos por los segmentadores activos. */
function filtrar(datos, { usuario, tarjeta, desde, hasta, categoria }) {
  return datos.registros.filter((r) => {
    if (usuario && usuario !== 'todos' && r.usuario !== usuario) return false;
    if (tarjeta && tarjeta !== 'todas' && r.tarjeta !== tarjeta) return false;
    if (categoria && categoria !== 'todas' && r.categoria !== categoria) return false;
    if (desde && r.mes < desde) return false;
    if (hasta && r.mes > hasta) return false;
    return true;
  });
}

/** Suma por mes de una dimensión: 'tarjeta' | 'usuario' | 'categoria'. */
function porMes(registros, meses, dimension) {
  const claves = [...new Set(registros.map((r) => r[dimension]))];
  const mapa = new Map(claves.map((k) => [k, Object.fromEntries(meses.map((m) => [m, 0]))]));
  for (const r of registros) {
    const fila = mapa.get(r[dimension]);
    if (fila && fila[r.mes] !== undefined) fila[r.mes] += r.monto;
  }
  return [...mapa.entries()]
    .map(([nombre, fila]) => ({
      nombre,
      valores: meses.map((m) => redondear(fila[m])),
      total: redondear(meses.reduce((s, m) => s + fila[m], 0)),
    }))
    .filter((s) => s.total !== 0)
    .sort((a, b) => b.total - a.total);
}

/** Convierte una serie mensual en su acumulado corrido. */
function acumular(valores) {
  let acc = 0;
  return valores.map((v) => { acc = redondear(acc + v); return acc; });
}

/** Total por una dimensión, de mayor a menor. */
function totalPor(registros, dimension) {
  const m = new Map();
  for (const r of registros) m.set(r[dimension], (m.get(r[dimension]) || 0) + r.monto);
  return [...m.entries()]
    .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
    .filter((x) => x.valor !== 0)
    .sort((a, b) => b.valor - a.valor);
}

/** Lista de meses entre dos claves, inclusive. */
function rangoMeses(desde, hasta) {
  const out = [];
  let m = desde;
  let guarda = 0;
  while (m <= hasta && guarda < 240) { out.push(m); m = sumarMeses(m, 1); guarda += 1; }
  return out;
}

return { acumular, analizar, filtrar, money, nombreMes, porMes, rangoMeses, redondear, sumarMeses, totalPor };
})();

M["importar_libro"] = (function () {
/**
 * Importa el libro de tarjetas original —el que se mantiene a mano, con una
 * hoja por tarjeta y las columnas de mes desplegadas a lo ancho— y lo convierte
 * en los gastos, cuotas e ingresos de la app.
 *
 * Es la misma conversión que hace `tools/migrar_excel.py`, pero dentro del
 * navegador para que se pueda hacer desde el celular.
 *
 * Los identificadores se derivan del contenido de cada fila, así que volver a
 * importar el mismo archivo actualiza lo que ya estaba en vez de duplicarlo.
 */

const {analizar, redondear} = M["libro_tarjetas"];
const TOLERANCIA = 0.02;   // centavos de holgura al comparar cuotas

/** Marca con la que se reconoce después lo que vino del libro. */
const NOTA_IMPORTADO = 'Importado del libro de tarjetas';

/** Hash corto y estable de un texto (FNV-1a) para construir identificadores. */
function huella(texto) {
  let h = 0x811c9dc5;
  for (let i = 0; i < texto.length; i += 1) {
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36).toUpperCase().padStart(7, '0');
}

/**
 * Nombre de la hoja -> identificador de cuenta de la app. Basta con el banco:
 * la hoja «Pichincha A» del libro viejo (la adicional, ya dada de baja) cae
 * también en la Pichincha principal, que es donde vive ahora ese consumo.
 */
function idTarjeta(nombreHoja, cuentas) {
  const limpio = String(nombreHoja).toLowerCase();
  const porBanco = cuentas.find((c) => c.tipo === 'Tarjeta'
    && limpio.includes(String(c.banco || '').toLowerCase()));
  return porBanco ? porBanco.id : `TC-${limpio.replace(/[^a-z0-9]+/g, '-').toUpperCase()}`;
}

/**
 * Deduce cómo se pagó un consumo a partir de en qué meses aparece:
 * un solo mes es corriente; meses seguidos con el mismo valor, diferido;
 * cualquier otra cosa (suscripciones, cargos variables) es recurrente.
 */
function deducirTipo(cuotas, meses) {
  if (cuotas.length === 1) return 'Corriente';
  const indices = cuotas.map((c) => meses.indexOf(c.mes));
  const seguidos = indices.every((v, i) => i === 0 || v === indices[i - 1] + 1);
  const montos = cuotas.map((c) => c.monto);
  const iguales = Math.max(...montos) - Math.min(...montos) <= TOLERANCIA;
  return seguidos && iguales ? 'Diferido' : 'Recurrente';
}

/** Ingresos de la hoja «Ingreso», si el libro la trae. */
function leerIngresos(libro, cuentaPorDefecto) {
  const filas = libro.Ingreso;
  if (!Array.isArray(filas)) return [];

  const out = [];
  for (const fila of filas) {
    if (!Array.isArray(fila)) continue;
    // Columnas: B fecha · C bruto · D descuentos
    const cruda = fila[1];
    const fecha = typeof cruda === 'number' && cruda > 20000
      ? new Date(Math.round((cruda - 25569) * 86400000)).toISOString().slice(0, 10)
      : (/^\d{4}-\d{2}-\d{2}/.exec(String(cruda || ''))?.[0] || null);
    if (!fecha) continue;

    const bruto = redondear(Number(fila[2]) || 0);
    const descuentos = redondear(Number(fila[3]) || 0);
    if (!bruto && !descuentos) continue;

    out.push({
      id: `I-${huella(`${fecha}|${bruto}|${descuentos}`)}`,
      fecha,
      mes: fecha.slice(0, 7),
      usuario: 'J',
      concepto: 'Sueldo',
      categoria: 'Sueldo',
      bruto,
      descuentos,
      neto: redondear(bruto - descuentos),
      cuenta: cuentaPorDefecto,
      notas: NOTA_IMPORTADO,
    });
  }
  return out;
}

/**
 * Convierte el libro en entidades de la app.
 *
 * @param {object} libro     salida de `leerLibro()`
 * @param {object[]} cuentas cuentas de la app, para emparejar las tarjetas
 * @returns {{gastosTarjeta: object[], cuotas: object[], ingresos: object[],
 *            categorias: string[], resumen: object, avisos: string[]}}
 */
function libroTarjetasAEntidades(libro, cuentas = []) {
  const datos = analizar(libro);
  if (!datos.registros.length) {
    throw new Error('No se encontró ninguna hoja de tarjeta con las columnas '
      + 'Cargo, Fecha, Detalle, Propósito y Cuenta. ¿Es el archivo correcto?');
  }

  const gastosTarjeta = [];
  const cuotas = [];
  const porTarjeta = {};

  for (const mov of datos.movimientos) {
    const tarjeta = idTarjeta(mov.tarjetaNombre || mov.tarjeta, cuentas);

    // El cronograma viene de la propia fila del Excel.
    const suyas = mov.plan;
    if (!suyas?.length) continue;

    const tipo = deducirTipo(suyas, datos.mesesLibro);
    const fecha = mov.fecha || `${suyas[0].mes}-01`;
    // La hoja y el número de fila entran en la huella para que dos compras
    // idénticas el mismo día sigan siendo dos, y para que reimportar el mismo
    // archivo dé exactamente los mismos identificadores.
    const id = `G-${huella([mov.hoja, mov.fila, tarjeta, mov.usuario, mov.detalle,
      mov.categoria, fecha, mov.total].join('|'))}`;

    gastosTarjeta.push({
      id,
      fecha,
      tarjeta,
      usuario: mov.usuario,
      detalle: mov.detalle,
      proposito: mov.proposito || '',
      categoria: mov.categoria,
      tipo,
      cuotas: suyas.length,
      monto_total: redondear(mov.total),
      tasa_interes: 0,
      mes_inicio: suyas[0].mes,
      notas: NOTA_IMPORTADO,
    });

    suyas.forEach((r, i) => cuotas.push({
      gasto_id: id,
      n_cuota: i + 1,
      mes: r.mes,
      monto: redondear(r.monto),
      tarjeta,
      usuario: mov.usuario,
      categoria: mov.categoria,
      pagado: '',
    }));

    porTarjeta[tarjeta] = redondear((porTarjeta[tarjeta] || 0) + mov.total);
  }

  const bancoPorDefecto = cuentas.find((c) => c.tipo === 'Banco')?.id || 'BCO-PICH';
  const ingresos = leerIngresos(libro, bancoPorDefecto);

  return {
    gastosTarjeta,
    cuotas,
    ingresos,
    categorias: datos.categorias,
    avisos: datos.avisos,
    resumen: {
      gastos: gastosTarjeta.length,
      cuotas: cuotas.length,
      ingresos: ingresos.length,
      total: redondear(cuotas.reduce((s, c) => s + c.monto, 0)),
      porTarjeta,
      meses: datos.meses,
      usuarios: datos.usuarios,
      porUsuario: Object.fromEntries(datos.usuarios.map((u) => [u, redondear(
        datos.registros.filter((r) => r.usuario === u).reduce((s, r) => s + r.monto, 0))])),
    },
  };
}

/** ¿Este libro tiene pinta de ser el de las tarjetas? */
function esLibroDeTarjetas(libro) {
  return Object.values(libro || {}).some((filas) => (
    Array.isArray(filas) && filas.slice(0, 10).some((f) => {
      if (!Array.isArray(f)) return false;
      const c = f.map((x) => String(x ?? '').trim().toLowerCase());
      return c.includes('cargo') && c.includes('fecha') && c.includes('cuenta');
    })
  ));
}

return { NOTA_IMPORTADO, esLibroDeTarjetas, libroTarjetasAEntidades };
})();

M["archivo"] = (function () {
/**
 * Vínculo de la app con un archivo de Excel guardado en el computador.
 *
 * A diferencia del tablero, que solo lee, aquí el archivo es la base de datos:
 * la app lo lee al abrirse, adopta los cambios que se hayan hecho en Excel y
 * vuelca en él cada movimiento que se registra.
 *
 * Salvaguarda importante: solo se escribe sobre un libro con las hojas de la
 * app. El libro original de tarjetas (hojas anchas, fórmulas, dashboards)
 * nunca se sobrescribe; para eso está «Crear el archivo».
 *
 * Requiere la File System Access API: Chrome y Edge de escritorio.
 */

const {db, instantanea, reemplazar} = M["store"];
const {escribirLibro, leerLibro} = M["xlsx"];
const {construirLibro, libroADatos, esBaseDeLaApp} = M["esquema"];
const {fusionar} = M["sync"];
const BD = 'finanzas-archivo';
const ALMACEN = 'handles';
const CLAVE = 'libro';
const INTERVALO = 6000;

const enMarcoAjeno = (() => {
  try {
    return window.top !== window.self;
  } catch {
    return true;
  }
})();

/** Chrome bloquea el selector de archivos dentro de marcos de otro origen. */
const soportado = typeof window !== 'undefined'
  && typeof window.showOpenFilePicker === 'function'
  && !enMarcoAjeno;

const archivo = {
  vinculado: false,
  nombre: '',
  handle: null,
  ultimaLectura: null,
  ultimaEscritura: null,
  modificado: null,   // lastModified conocido; sirve para detectar ediciones
  ocupado: false,
  error: null,
};

const oyentes = new Set();
function alCambiarArchivo(fn) {
  oyentes.add(fn);
  return () => oyentes.delete(fn);
}
const avisar = () => oyentes.forEach((fn) => fn(archivo));

// --- Handle persistente ------------------------------------------------------

function abrirBD() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(BD, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(ALMACEN);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function conBD(modo, fn) {
  const bd = await abrirBD();
  const salida = await new Promise((resolve, reject) => {
    const tx = bd.transaction(ALMACEN, modo);
    const r = fn(tx.objectStore(ALMACEN));
    tx.oncomplete = () => resolve(r?.result ?? null);
    tx.onerror = () => reject(tx.error);
  });
  bd.close();
  return salida;
}

const guardarHandle = (h) => conBD('readwrite', (s) => s.put(h, CLAVE));
const leerHandle = () => conBD('readonly', (s) => s.get(CLAVE)).catch(() => null);
const borrarHandle = () => conBD('readwrite', (s) => s.delete(CLAVE));

async function permiso(handle, pedir = false) {
  if (!handle?.queryPermission) return true;
  const opciones = { mode: 'readwrite' };
  if (await handle.queryPermission(opciones) === 'granted') return true;
  if (!pedir) return false;
  return await handle.requestPermission(opciones) === 'granted';
}

// --- Lectura -----------------------------------------------------------------

/**
 * Lee el archivo y fusiona su contenido con lo que hay en la app.
 * Se usa la misma fusión por registro del sync entre teléfonos: nada se pierde
 * ni se duplica, y ante conflicto gana la versión con marca de tiempo mayor.
 */
async function adoptarDelArchivo({ silencioso = true } = {}) {
  const f = await archivo.handle.getFile();
  const libro = await leerLibro(await f.arrayBuffer());
  const { datos } = libroADatos(libro, db.config);

  reemplazar(fusionar(instantanea(), datos));
  archivo.modificado = f.lastModified;
  archivo.nombre = f.name;
  archivo.ultimaLectura = new Date();
  if (!silencioso) avisar();
  return datos;
}

// --- Escritura ---------------------------------------------------------------

let pendiente;
let escribiendo = false;

/** Vuelca la base completa en el archivo. */
async function escribir() {
  if (!archivo.vinculado || !archivo.handle || escribiendo) return false;
  escribiendo = true;
  archivo.ocupado = true;
  avisar();
  try {
    if (!await permiso(archivo.handle, false)) {
      archivo.error = 'permiso';
      return false;
    }
    const blob = escribirLibro(construirLibro());
    const flujo = await archivo.handle.createWritable();
    await flujo.write(blob);
    await flujo.close();

    // Se anota el lastModified propio para no confundir la escritura con una
    // edición hecha desde Excel.
    const f = await archivo.handle.getFile();
    archivo.modificado = f.lastModified;
    archivo.ultimaEscritura = new Date();
    archivo.error = null;
    return true;
  } catch (err) {
    console.error('No se pudo escribir el archivo', err);
    archivo.error = err.message;
    return false;
  } finally {
    escribiendo = false;
    archivo.ocupado = false;
    avisar();
  }
}

/** Agrupa las ráfagas de cambios en una sola escritura. */
function guardarDiferido() {
  if (!archivo.vinculado) return;
  clearTimeout(pendiente);
  pendiente = setTimeout(escribir, 1500);
}

// --- Alta del vínculo --------------------------------------------------------

function activar(handle, nombre) {
  archivo.handle = handle;
  archivo.nombre = nombre;
  archivo.vinculado = true;
  archivo.error = null;
  avisar();
}

/**
 * Vincula un archivo que ya existe. Si no tiene las hojas de la app, no se
 * vincula: así el libro original de tarjetas nunca queda expuesto a que la
 * app lo sobrescriba.
 */
async function vincularExistente() {
  const [handle] = await window.showOpenFilePicker({
    types: [{
      description: 'Base de datos de la app',
      accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] },
    }],
    multiple: false,
  });
  if (!await permiso(handle, true)) {
    throw new Error('Sin permiso de escritura sobre el archivo.');
  }

  const f = await handle.getFile();
  const libro = await leerLibro(await f.arrayBuffer());
  if (!esBaseDeLaApp(libro)) {
    throw new Error(`«${f.name}» no es una base de la app: le faltan las hojas `
      + 'Cuentas, Gastos_Tarjeta y Cuotas. Si es tu libro original de tarjetas, '
      + 'no lo vincules: usa «Crear el archivo» para generar la base y deja el '
      + 'original intacto.');
  }

  await guardarHandle(handle);
  activar(handle, f.name);
  await adoptarDelArchivo();
  avisar();
  return f.name;
}

/** Crea un archivo nuevo con la base actual y lo deja vinculado. */
async function crearYVincular() {
  const handle = await window.showSaveFilePicker({
    suggestedName: 'Finanzas_DB.xlsx',
    types: [{
      description: 'Libro de Excel',
      accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] },
    }],
  });
  if (!await permiso(handle, true)) {
    throw new Error('Sin permiso de escritura sobre el archivo.');
  }
  await guardarHandle(handle);
  activar(handle, handle.name);
  await escribir();
  return handle.name;
}

/**
 * Recupera el vínculo de sesiones anteriores.
 * @returns {Promise<'listo'|'permiso'|'ninguno'>}
 */
async function restaurar() {
  const handle = await leerHandle();
  if (!handle) return 'ninguno';
  activar(handle, handle.name);
  if (!await permiso(handle, false)) {
    archivo.error = 'permiso';
    avisar();
    return 'permiso';
  }
  await adoptarDelArchivo();
  avisar();
  return 'listo';
}

/** Vuelve a pedir permiso (necesita un gesto del usuario). */
async function reconectar() {
  if (!archivo.handle) return false;
  if (!await permiso(archivo.handle, true)) return false;
  archivo.error = null;
  await adoptarDelArchivo();
  avisar();
  return true;
}

async function desvincular() {
  detener();
  await borrarHandle();
  Object.assign(archivo, {
    vinculado: false, nombre: '', handle: null,
    ultimaLectura: null, ultimaEscritura: null, modificado: null, error: null,
  });
  avisar();
}

// --- Vigilancia de ediciones externas ----------------------------------------

let temporizador;

/**
 * Detecta que el archivo cambió desde fuera (alguien lo editó en Excel) y
 * adopta esos cambios.
 * @param {() => void} alAdoptar  se llama para repintar la vista
 */
function vigilar(alAdoptar) {
  detener();
  if (!archivo.vinculado) return;

  const mirar = async () => {
    if (document.visibilityState !== 'visible') return;
    if (!archivo.handle || archivo.ocupado || escribiendo) return;
    try {
      if (!await permiso(archivo.handle, false)) return;
      const f = await archivo.handle.getFile();
      if (f.lastModified === archivo.modificado) return;
      await adoptarDelArchivo({ silencioso: false });
      alAdoptar?.();
    } catch (err) {
      archivo.error = err.message;
      avisar();
    }
  };

  temporizador = setInterval(mirar, INTERVALO);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') mirar();
  });
}

function detener() {
  clearInterval(temporizador);
  clearTimeout(pendiente);
}

/** Texto de estado para la interfaz. */
function textoEstado() {
  if (!archivo.vinculado) return 'Sin archivo vinculado';
  if (archivo.error === 'permiso') return 'Toca «Reconectar» para volver a usar el archivo';
  if (archivo.error) return archivo.error;
  if (archivo.ocupado) return 'Guardando…';
  const hora = (archivo.ultimaEscritura || archivo.ultimaLectura)?.toLocaleTimeString(
    'es-EC', { hour: '2-digit', minute: '2-digit' });
  return hora ? `Sincronizado con el archivo · ${hora}` : 'Vinculado';
}

return { alCambiarArchivo, archivo, crearYVincular, desvincular, detener, enMarcoAjeno, escribir, guardarDiferido, reconectar, restaurar, soportado, textoEstado, vigilar, vincularExistente };
})();

M["cajon"] = (function () {

 * Cajón lateral: un panel vertical que entra deslizando desde el borde
 * izquierdo.
 *
 * Existe porque la cabecera se va con el scroll. Los dos botones redondos
 * —avisos y menú— solo se podían tocar estando arriba del todo, y en el
 * iPhone, al subir de golpe, el rebote del scroll los saca del marco justo
 * cuando se intenta acertar. Desde el cajón están siempre a un gesto.
 *
 * El módulo solo se ocupa del panel y del gesto; lo que va dentro lo pone
 * quien lo monta.
 */

/** Ancho de la franja del borde donde empieza a contar el gesto. */
const BORDE = 26;

/** Desplazamiento a partir del cual el arrastre se da por intencionado. */
const UMBRAL = 65;

function crearCajon({ etiqueta = 'Menú' } = {}) {
  const velo = document.createElement('div');
  velo.className = 'cajon-velo';

  const cajon = document.createElement('aside');
  cajon.className = 'cajon';
  cajon.setAttribute('aria-label', etiqueta);
  cajon.setAttribute('aria-hidden', 'true');
  cajon.hidden = true;
  velo.hidden = true;

  document.body.append(velo, cajon);

  let abierto = false;

  const colocar = (dx) => {

 * Detección de gastos que se repiten y proyección del presupuesto.
 *
 * La idea: mirar el historial, ver qué se repite y cada cuánto, y con eso
 * rellenar los meses que aún no han pasado. Así el mes que viene no aparece
 * casi vacío —solo con las cuotas ya comprometidas— sino con lo que de verdad
 * se va a gastar.
 *
 * Tres cifras por mes, que no se pisan:
 *
 *   COMPROMETIDO  lo que ya está registrado y cae en ese mes: cuotas de
 *                 tarjeta (incluidas las futuras de un diferido) y efectivo.
 *   PREVISTO      lo que la app supone que se repetirá y todavía no está
 *                 apuntado.

 *

/**
 * Por debajo de este umbral el gasto cae varias veces al mes y no tiene
 * sentido señalar el día: se presupuesta como un importe mensual.
 */
const UMBRAL_MENSUAL = 20;

const CADENCIAS = [
  { dias: 7, nombre: 'Cada semana', porMes: 52 / 12 },
  { dias: 15, nombre: 'Cada quincena', porMes: 2 },
  { dias: 30, nombre: 'Cada mes', porMes: 1 },
  { dias: 60, nombre: 'Cada 2 meses', porMes: 1 / 2 },
  { dias: 90, nombre: 'Cada 3 meses', porMes: 1 / 3 },
  { dias: 120, nombre: 'Cada 4 meses', porMes: 1 / 4 },
  { dias: 182, nombre: 'Cada 6 meses', porMes: 1 / 6 },
  { dias: 365, nombre: 'Una vez al año', porMes: 1 / 12 },

  (c) => Math.abs(dias - c.dias) <= c.dias * 0.22);

 * Cuánto supone al mes un importe que se repite cada tantos días.

 * días: un cargo mensual de $2,99 son $2,99 al mes, no $3,03. Dividir 30,44

   * importe real, y como sus meses ya registrados son los de sus cuotas, la
   * previsión solo rellena a partir de donde se acaban: nada se cuenta dos

       * la proyección lo reparta solo donde toca.

         * mío lleva pagándose desde enero— y contar solo las marcadas con el
         * botón diría «0 de 120» con siete ya pagadas. Una cuota de un mes que
         * ya pasó está pagada, la marque uno o no: el banco la cobró igual.

        const mesHoy = claveMes(hoy);

         * cualquier tabla de amortización, y la suma de las cuotas es exacta.
         *
         * Los gastos dados de alta antes de que se pudiera escribir el total no
         * lo tienen guardado: para ellos el total es la cuota por las veces.
         */
        const total = redondear(Number(f.total) || (Number(f.monto) || 0) * cuotas);
        const cuota = redondear(total / cuotas);
        const ultimaCuota = redondear(total - cuota * (cuotas - 1));
        // Lo que falta por pagar, contando que la última cuota es distinta.
        const restante = hechas >= cuotas
          ? 0 : redondear(cuota * (cuotas - 1 - hechas) + ultimaCuota);
        const pagado = redondear(total - restante);

          clave: f.id,
          clase: 'plazos',
          cuotas,
          desdeMes: desde,
          hastaMes: hasta,

          cadencia: 30,

          cadenciaTexto: 'Cuota mensual',
          veces: 0,
          fechas: [],
          mesesConRegistro: new Set(),
          dispersion: 0,
          variacion: 0,
          tipo: 'Fijo',
          tipoAuto: 'Fijo',
          reparto: { [f.medio || 'Préstamo']: 1 },
          fiable: true,
          pagos: f.pagos || [],
          pagadas: hechas,

          marcadas: pagos.size,

          mensual: true,

          montoAuto: cuota,

          ultimaCuota,

        variacion: 0,
        tipoAuto: f.tipo,

 * meses donde todavía no hay nada de ese gasto.

    .filter((r) => estaExcluida(r.clave)).map((r) => r.clave));

  const ahora = mesActual();
  const cero = () => Object.fromEntries(MEDIOS.map((x) => [x, 0]));

     */

   * efectivo. Pero es un préstamo, y en la lectura por bolsillo tiene que
   * seguir siéndolo: si no, la columna Préstamo solo enseñaría lo que falta por
   * pagar y nunca lo pagado. Se reconoce por el concepto, que es el que la
   * ficha del gasto a plazos puso al registrarlo.

    if (f.medio && f.detalle) medioManual.set(claveGasto(f.detalle), f.medio);

  const apuntar = (m, medio, monto, detalle, fecha, nota) => {
    m.comprometido += monto;
    m.medios[medio] += monto;
    m.reales[medio] += monto;
    m.realLineas.push({ detalle, monto, medio, fecha, nota });
  };

    const m = porMes.get(c.mes);
    if (!m || !esDe(c.usuario, quien)) continue;
    const compra = db.gastosTarjeta.find((g) => g.id === c.gasto_id);
    const enCuotas = Number(compra?.cuotas) > 1;
    apuntar(m, 'Tarjeta', Number(c.monto) || 0,
      compra?.detalle || c.categoria || 'Cuota de tarjeta',
      // La fecha que interesa es la de la compra: el mes de la cuota ya lo
      // dice la fila que se ha desplegado.
      compra?.fecha, enCuotas ? `cuota ${c.n_cuota} de ${compra.cuotas}` : '');
  }
  for (const g of db.gastosEfectivo) {
    const m = porMes.get(claveMes(g.fecha));
    if (!m || !esDe(g.usuario, quien)) continue;
    const medio = medioManual.get(claveGasto(g.detalle)) || medioDe(g.cuenta);
    apuntar(m, MEDIOS.includes(medio) ? medio : 'Efectivo',
      Number(g.monto) || 0, g.detalle || g.categoria || 'Gasto', g.fecha,
      g.proposito || '');
  }

  const usadas = [];
  for (const r of recurrencias(quien)) {
    if (!r.fiable || !r.vigente || fuera.has(r.clave)) continue;
    let aporta = false;

    const pagados = new Set(r.pagos || []);
    /*
     * `conocido` distingue lo que se ESTIMA de lo que se SABE. Una cuota de
     * préstamo no es una suposición: el importe y el mes están firmados, igual
     * que la cuota de una tarjeta por una compra ya hecha. Así que pesa en la
     * tabla de lo real aunque todavía no se haya pagado. Lo que la app deduce
     * del historial —la gasolina, el súper— sigue siendo solo previsión.
     */
    const sumar = (mes, monto, cuando, conocido = false) => {
      const casilla = porMes.get(mes);
      // Un mes ya pagado no se prevé: su importe ya está apuntado como gasto
      // real, y volver a preverlo lo contaría dos veces.
      if (!casilla || mes < ahora || r.mesesConRegistro.has(mes) || pagados.has(mes)) return;
      casilla.previsto += monto;
      // Se reparte por medio en la misma proporción que el historial.
      Object.entries(r.reparto || { Efectivo: 1 }).forEach(([medio, parte]) => {
        if (casilla.medios[medio] !== undefined) casilla.medios[medio] += monto * parte;
        if (conocido && casilla.reales[medio] !== undefined) {
          casilla.reales[medio] += monto * parte;
        }
      });
      casilla.lineas.push({ clave: r.clave, detalle: r.detalle, monto, cuando, reparto: r.reparto });
      if (conocido) {
        casilla.realLineas.push({
          detalle: r.detalle,
          monto,
          medio: Object.keys(r.reparto || { Efectivo: 1 })[0],
          nota: cuando,
        });
      }
      aporta = true;
    };

    if (r.clase === 'plazos') {
      // Cuotas contadas: se colocan en sus meses y se acaban. La última lleva
      // los centavos que la división no repartió.
      for (let i = 0; i < r.cuotas; i += 1) {
        const importe = i === r.cuotas - 1 ? (r.ultimaCuota ?? r.monto) : r.monto;
        sumar(sumarMeses(r.desdeMes, i), importe, `cuota ${i + 1} de ${r.cuotas}`, true);
      }
    } else if (r.mensual) {
      // Varias veces al mes: se presupuesta el importe mensual completo.
      meses.forEach((m) => sumar(m, r.porMes, `~${(DIAS_MES / r.cadencia).toFixed(1)} al mes`));
    } else {
      const tope = finDeMes(meses[meses.length - 1]);
      let f = r.ultima;
      // Cadencias largas: se avanza en el calendario desde la última vez.
      for (let i = 0; i < 400; i += 1) {
        f = sumarDias(f, r.cadencia);
        if (f > tope) break;
        sumar(claveMes(f), r.monto, f);
      }
    }
    if (aporta) usadas.push(r);
  }

    const x = porMes.get(m);
    x.comprometido = redondear(x.comprometido);
    x.previsto = redondear(x.previsto);
    x.simulado = redondear(x.comprometido + x.previsto);
    MEDIOS.forEach((k) => {
      x.medios[k] = redondear(x.medios[k]);
      x.reales[k] = redondear(x.reales[k]);
    });
    /*
     * El total de lo real NO es «comprometido»: eso solo cuenta lo ya
     * registrado, y aquí entran además las cuotas de préstamo, que están
     * firmadas aunque no se hayan pagado todavía.
     */
    x.real = redondear(MEDIOS.reduce((s, k) => s + x.reales[k], 0));
    x.lineas.sort((a, b) => b.monto - a.monto);
    x.realLineas.sort((a, b) => b.monto - a.monto);
    return x;
  });

  // Lo real corriendo mes a mes: cuánto suma este mes y todos los anteriores.
  let acumulado = 0;
  filas.forEach((x) => { acumulado = redondear(acumulado + x.real); x.acumulado = acumulado; });

  return {
    filas,
    usadas,
    totales: {
      comprometido: redondear(filas.reduce((s, x) => s + x.comprometido, 0)),
      previsto: redondear(filas.reduce((s, x) => s + x.previsto, 0)),
      simulado: redondear(filas.reduce((s, x) => s + x.simulado, 0)),
      medios: Object.fromEntries(MEDIOS.map((k) => [k,
        redondear(filas.reduce((s, x) => s + x.medios[k], 0))])),
      reales: Object.fromEntries(MEDIOS.map((k) => [k,
        redondear(filas.reduce((s, x) => s + x.reales[k], 0))])),
      real: redondear(filas.reduce((s, x) => s + x.real, 0)),
    },
  };
}

// --- Presupuesto por categoría -----------------------------------------------

/** Meses cerrados que se miran para sacar el gasto habitual de una categoría. */
const MESES_REFERENCIA = 6;

/**
 * Presupuesto que le tocaría a cada categoría según lo que se gasta de verdad.
 *
 * Se toma el mayor de dos medidas, que miran cosas distintas:
 *
 *   PROMEDIO   lo gastado al mes en los últimos meses cerrados. Recoge todo,
 *              también lo suelto, pero se queda corto con lo que empezó hace
 *              poco: un gimnasio de $30 que lleva dos meses promedia $10.
 *   FIJO       lo que ya está comprometido al mes en esa categoría: los gastos
 *              que se repiten con ritmo propio, más las cuotas vivas de los
 *              diferidos y de los cargos recurrentes. Ese sí ve los $30
 *              completos del gimnasio, porque mira el compromiso, no el total
 *              repartido entre meses en los que aún no existía.
 *
 * El mes en curso no entra en el promedio: va a medias y tiraría la cifra
 * hacia abajo. Sí entra en el fijo, que es justo donde se ve lo que se paga
 * ahora mismo.
 */
function presupuestoSugerido() {
  const hasta = sumarMeses(mesActual(), -1);
  const desde = sumarMeses(hasta, -(MESES_REFERENCIA - 1));
  const ventana = new Set(rangoMeses(desde, hasta));

  const gastado = new Map();
  const suma = (categoria, mes, monto) => {
    if (!ventana.has(mes)) return;
    const c = categoria || 'Sin categoría';
    gastado.set(c, (gastado.get(c) || 0) + (Number(monto) || 0));
  };
  db.cuotas.forEach((c) => suma(c.categoria, c.mes, c.monto));
  db.gastosEfectivo.forEach((g) => suma(g.categoria, claveMes(g.fecha), g.monto));

  const periodico = new Map();
  const sumaFijo = (categoria, monto) => {
    const c = categoria || 'Sin categoría';
    periodico.set(c, (periodico.get(c) || 0) + (Number(monto) || 0));
  };

  recurrencias()
    .filter((r) => r.fiable && r.vigente && !estaExcluida(r.clave))
    .forEach((r) => sumaFijo(r.categoria, r.porMes));

  /*
   * Y las cuotas del mes en curso de lo diferido y lo recurrente. Quedan fuera
   * de `recurrencias()` a propósito —sus meses futuros ya están en la base y
   * proyectarlos los contaría dos veces— pero para presupuestar sí hacen
   * falta: son dinero que sale todos los meses. Es lo que dejaba el gimnasio
   * en $10 cuando se paga $30.
   */
  const ahora = mesActual();
  const porTipo = new Map(db.gastosTarjeta.map((g) => [g.id, g.tipo]));
  db.cuotas
    .filter((c) => c.mes === ahora && porTipo.get(c.gasto_id) !== 'Corriente')
    .forEach((c) => sumaFijo(c.categoria, c.monto));

  const historico = new Set([
    ...db.cuotas.map((c) => c.categoria),
    ...db.gastosEfectivo.map((g) => g.categoria),
  ]);

  return db.categorias
    .filter((c) => c.tipo !== 'Ingreso')
    .map((c) => {
      const promedio = (gastado.get(c.nombre) || 0) / MESES_REFERENCIA;
      const recurrente = periodico.get(c.nombre) || 0;
      const actual = Number(c.presupuesto) || 0;
      // Sin nada en el historial no hay con qué estimar: se deja como está en
      // vez de ponerlo a cero y hacer desaparecer la categoría del cuadro.
      const sugerido = historico.has(c.nombre)
        ? Math.round(Math.max(promedio, recurrente)) : actual;
      return {
        categoria: c.nombre, actual, sugerido, promedio: redondear(promedio),
        recurrente: redondear(recurrente), cambia: sugerido !== actual,
      };
    })
    .sort((a, b) => Math.abs(b.sugerido - b.actual) - Math.abs(a.sugerido - a.actual));
}

/** Escribe los presupuestos sugeridos. Devuelve cuántos cambiaron. */
function aplicarPresupuesto(filas) {
  let n = 0;
  filas.filter((f) => f.cambia).forEach((f) => {
    const cat = db.categorias.find((c) => c.nombre === f.categoria);
    if (!cat) return;
    cat.presupuesto = f.sugerido;
    n += 1;
  });
  return n;
}

/** Rango por defecto del módulo: el mes en curso y los cinco siguientes. */
function mesesProyectados(n = 6) {
  const base = mesActual();
  return Array.from({ length: n }, (_, i) => sumarMeses(base, i));
}

  nuevaPagina();
  return api;
}

/** Los objetos del PDF, con su tabla de referencias cruzadas. */
function armar(paginas, { titulo, pie }) {
  const objetos = [];
  const añadir = (cuerpo) => { objetos.push(cuerpo); return objetos.length; };

  // 1: catálogo, 2: páginas, 3 y 4: las dos fuentes. Los contenidos y las
  // páginas van después, en pares.
  const idCatalogo = añadir(null);
  const idPaginas = añadir(null);
  const idFuente = añadir('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica '
    + '/Encoding /WinAnsiEncoding >>');
  const idNegrita = añadir('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold '
    + '/Encoding /WinAnsiEncoding >>');

  const idsPagina = [];
  paginas.forEach((contenido, i) => {
    // El pie con la numeración se escribe aquí, que es cuando ya se sabe
    // cuántas hojas salieron.
    const numero = `${pie}${pie ? '   ' : ''}Pagina ${i + 1} de ${paginas.length}`;
    const conPie = `${contenido}BT /F1 8 Tf 0.45 g 1 0 0 1 ${MARGEN} ${MARGEN - 6} Tm `
      + `(${aWinAnsi(numero)}) Tj ET\n`;
    const idFlujo = añadir(`<< /Length ${bytes(conPie)} >>\nstream\n${conPie}endstream`);
    idsPagina.push(añadir(`<< /Type /Page /Parent ${idPaginas} 0 R `
      + `/MediaBox [0 0 ${ANCHO} ${ALTO}] /Resources << /Font << `
      + `/F1 ${idFuente} 0 R /F2 ${idNegrita} 0 R >> >> /Contents ${idFlujo} 0 R >>`));
  });

  objetos[idCatalogo - 1] = `<< /Type /Catalog /Pages ${idPaginas} 0 R >>`;
  objetos[idPaginas - 1] = `<< /Type /Pages /Kids [${
    idsPagina.map((n) => `${n} 0 R`).join(' ')}] /Count ${idsPagina.length} >>`;
  const idInfo = añadir(`<< /Title (${aWinAnsi(titulo)}) /Producer (Finanzas J&C) >>`);

  let salida = '%PDF-1.4\n';
  const posiciones = [];
  objetos.forEach((cuerpo, i) => {
    posiciones.push(bytes(salida));
    salida += `${i + 1} 0 obj\n${cuerpo}\nendobj\n`;
  });

  const inicioTabla = bytes(salida);
  salida += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n`;
  posiciones.forEach((p) => { salida += `${String(p).padStart(10, '0')} 00000 n \n`; });
  salida += `trailer\n<< /Size ${objetos.length + 1} /Root ${idCatalogo} 0 R `
    + `/Info ${idInfo} 0 R >>\nstartxref\n${inicioTabla}\n%%EOF`;

  /*
   * Cada carácter de la cadena es un byte del archivo: las posiciones de la
   * tabla xref se calcularon así, y con UTF-8 una sola letra acentuada las
   * correría todas y el lector no abriría el archivo.
   */
  const buf = new Uint8Array(salida.length);
  for (let i = 0; i < salida.length; i += 1) buf[i] = salida.charCodeAt(i) & 0xff;
  return new Blob([buf], { type: 'application/pdf' });
}

/** Longitud en bytes, contando un byte por carácter (ver `armar`). */
const bytes = (s) => s.length;

return { ancho, documento, recortar };
})();

M["informe"] = (function () {
/**
 * El informe mensual de una persona, en PDF, para mandarlo por WhatsApp.
 *
 * La pregunta que resuelve es la de fin de mes: «¿qué gastaste tú este mes?».
 * Enseñar la pantalla no sirve —el otro no tiene la app— y una captura se corta
 * a los diez movimientos. Un PDF de dos o tres hojas se manda por WhatsApp, se
 * abre en cualquier teléfono y se guarda.
 *
 * Sale con todo el detalle a propósito: el total y el reparto por categoría
 * arriba, y debajo la lista completa de movimientos, uno por línea. Lo que se
 * quiere ver en un reparto de gastos es justamente lo que no cabe en un
 * resumen.
 */

const {documento, ancho, recortar} = M["pdf"];
const {nombreMes, money, redondear, textoFecha, detalleDeGastos} = M["calc"];
/*
 * Fecha corta: «17 sep 25».
 *
 * En una columna de 60 puntos no cabe «17 de septiembre», y lo que sobraba se
 * metía encima del nombre del comercio. El año en dos cifras no es un adorno:
 * en el mes de enero aparecen cuotas de compras del año anterior, y sin él
 * parecen del mismo mes.
 */
const MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun',
  'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function fechaCompacta(iso) {
  const [a, m, d] = String(iso).slice(0, 10).split('-');
  if (!d) return String(iso);
  return `${Number(d)} ${MESES_CORTOS[Number(m) - 1] || m} ${a.slice(2)}`;
}

/** Coordenadas de las columnas, en puntos desde el margen izquierdo. */
const COL = { fecha: 0, detalle: 62, categoria: 300, medio: 404, monto: 511 };

/** Dónde empieza y cuánto mide la barra del reparto por categoría. */
const ANCHO_BARRA_X = 200;
const ANCHO_BARRA = 240;

/**
 * Arma el PDF del mes de una persona.
 *
 * @param {string} mes 'YYYY-MM'
 * @param {string} usuario 'J', 'C' o 'ambos'
 * @returns {{blob: Blob, nombre: string, total: number, movimientos: number}}
 */
function informeMensual(mes, usuario = 'ambos') {
  const movs = detalleDeGastos([mes], { usuario })
    .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
  const total = redondear(movs.reduce((s, m) => s + m.monto, 0));

  const porCategoria = [...movs.reduce((m, x) => {
    const c = x.categoria || 'Sin categoria';
    return m.set(c, redondear((m.get(c) || 0) + x.monto));
  }, new Map())].sort((a, b) => b[1] - a[1]);

  const porMedio = ['Tarjeta', 'Efectivo'].map((t) => ({
    tipo: t,
    monto: redondear(movs.filter((x) => x.tipo === t).reduce((s, x) => s + x.monto, 0)),
  })).filter((x) => x.monto > 0);

  const dueño = usuario === 'ambos' ? 'J y C' : usuario;
  const titulo = `Gastos de ${nombreMes(mes)} - ${dueño}`;

  const doc = documento({
    titulo,
    pie: titulo,
    // Al pasar de hoja se repiten los rótulos: media lista sin cabecera no se
    // lee, hay que subir a la hoja anterior para saber qué columna es cuál.
    cabeceraRepetida: (d) => {
      d.salto(6);
      cabeceraTabla(d);
    },
  });

  doc.texto(titulo, { tam: 17, negrita: true, avance: 20 });
  doc.texto(`Generado el ${textoFecha(new Date().toISOString().slice(0, 10))}`,
    { tam: 9, gris: 0.45, avance: 18 });

  // El total, en grande: es lo primero que se busca al abrirlo.
  doc.banda({ alto: 40, desde: 30 });
  doc.texto('TOTAL DEL MES', { x: 10, tam: 8, negrita: true, gris: 0.35, avance: 15 });
  doc.texto(money(total), { x: 10, tam: 19, negrita: true, avance: 12 });
  doc.texto(`${movs.length} ${movs.length === 1 ? 'movimiento' : 'movimientos'}${
    porMedio.length ? `   ${porMedio.map((m) => `${m.tipo} ${money(m.monto)}`).join('   ')}` : ''}`,
  { x: 10, tam: 9, gris: 0.35, avance: 26 });

  if (!movs.length) {
    doc.texto(`No hay gastos registrados de ${dueño} en ${nombreMes(mes)}.`,
      { tam: 11, gris: 0.4 });
    return terminar(doc, mes, usuario, total, 0);
  }

  // Reparto por categoría, con barra: en un reparto entre dos, lo que se
  // discute es en qué se fue, no cuánto en total.
  doc.texto('Por categoria', { tam: 11, negrita: true, avance: 15 });
  porCategoria.forEach(([cat, monto]) => {
    doc.asegurar(15);
    const parte = total > 0 ? monto / total : 0;
    doc.texto(recortar(cat, ANCHO_BARRA_X - 8, 9.5), { tam: 9.5 });
    // Todas las barras arrancan en la misma vertical, no pegadas a su texto:
    // si cada una empieza donde acaba su nombre, no se pueden comparar.
    doc.rect({ x: ANCHO_BARRA_X, ancho: ANCHO_BARRA, alto: 6, gris: 0.88, desde: -1 });
    doc.rect({ x: ANCHO_BARRA_X, ancho: ANCHO_BARRA * parte, alto: 6, gris: 0.5, desde: -1 });
    doc.texto(`${(parte * 100).toFixed(0)}%`, { x: 455, tam: 8.5, gris: 0.45, derecha: true });
    doc.texto(money(monto), { x: COL.monto, tam: 9.5, negrita: true, derecha: true, avance: 14 });
  });

  doc.salto(10);
  doc.texto('Detalle de movimientos', { tam: 11, negrita: true, avance: 15 });
  cabeceraTabla(doc);

  movs.forEach((m) => {
    doc.asegurar(13);
    doc.texto(fechaCompacta(m.fecha), { x: COL.fecha, tam: 8.5, gris: 0.4 });
    doc.texto(recortar(m.detalle, COL.categoria - COL.detalle - 8, 9), { x: COL.detalle, tam: 9 });
    doc.texto(recortar(m.categoria || 'Sin categoria', COL.medio - COL.categoria - 8, 8.5),
      { x: COL.categoria, tam: 8.5, gris: 0.4 });
    doc.texto(recortar(`${m.tipo}${m.cuota ? ` ${m.cuota}` : ''}`, 92, 8.5),
      { x: COL.medio, tam: 8.5, gris: 0.4 });
    doc.texto(money(m.monto), { x: COL.monto, tam: 9, derecha: true, avance: 13 });
  });

  doc.salto(2).regla({ gris: 0.6, avance: 13 });
  doc.texto(`Total ${nombreMes(mes)}`, { tam: 10, negrita: true });
  doc.texto(money(total), { x: COL.monto, tam: 10, negrita: true, derecha: true });

  return terminar(doc, mes, usuario, total, movs.length);
}

function cabeceraTabla(doc) {
  doc.banda({ alto: 14, desde: 4, gris: 0.92 });
  doc.texto('FECHA', { x: COL.fecha + 2, tam: 7.5, negrita: true, gris: 0.35 });
  doc.texto('DETALLE', { x: COL.detalle, tam: 7.5, negrita: true, gris: 0.35 });
  doc.texto('CATEGORIA', { x: COL.categoria, tam: 7.5, negrita: true, gris: 0.35 });
  doc.texto('PAGO', { x: COL.medio, tam: 7.5, negrita: true, gris: 0.35 });
  doc.texto('MONTO', { x: COL.monto, tam: 7.5, negrita: true, gris: 0.35, derecha: true, avance: 14 });
}

function terminar(doc, mes, usuario, total, movimientos) {
  const quien = usuario === 'ambos' ? 'JyC' : usuario;
  return {
    blob: doc.blob(),
    nombre: `Gastos_${mes}_${quien}.pdf`,
    total,
    movimientos,
  };
}

/**
 * Manda el PDF por donde el teléfono deje: la hoja de compartir del sistema
 * —donde está WhatsApp— y, si no la hay, descargándolo.
 *
 * En iOS `navigator.share` con archivos existe desde Safari 15, pero solo
 * responde a un gesto del usuario: por eso esto se llama desde el propio clic
 * y no después de un `await` largo.
 */
async function compartir({ blob, nombre }, texto = '') {
  const archivo = new File([blob], nombre, { type: 'application/pdf' });
  if (navigator.canShare?.({ files: [archivo] })) {
    try {
      await navigator.share({ files: [archivo], text: texto });
      return 'compartido';
    } catch (e) {
      // Cancelar la hoja de compartir no es un error que haya que contar.
      if (e?.name === 'AbortError') return 'cancelado';
    }
  }
  return 'descargar';
}

return { compartir, informeMensual };
})();

M["forms"] = (function () {
/**
 * Formularios de captura y corrección.
 *
 * Cada `form*` abre un modal. Si recibe un registro existente lo precarga y
 * lo actualiza en vez de crear uno nuevo, así se puede corregir lo ya
 * ingresado sin borrarlo y volver a escribirlo.
 *
 * Los campos de dinero van como texto con teclado decimal: `type="number"`
 * descarta la coma, que es el separador que se usa aquí. `modal()` normaliza
 * coma y punto al enviar.
 */

const {db, guardar, nuevoId, upsert, tocar, cuentasBancarias, tarjetas, categoriasGasto, categoriasIngreso, usuarios} = M["store"];
const {claveMes, mesActual, money, planificarCuotas, calcularPoliza, sumarDias, redondear, nombreMes, sumarMeses, textoCorte, fechaPagoCompra, textoFecha, saldoCuenta} = M["calc"];
const {modal, opciones, brindis, hoyISO, esc, $, aNumero, campoMonto} = M["ui"];
const selUsuarios = (sel) => opciones(usuarios(), sel);
const val = (form, sel) => aNumero($(sel, form).value);

/** Lista de meses seleccionables: 12 atrás y 24 adelante desde hoy. */
function mesesSeleccionables() {
  const base = sumarMeses(mesActual(), -12);
  return Array.from({ length: 37 }, (_, i) => {
    const m = sumarMeses(base, i);
    return { valor: m, texto: nombreMes(m) };
  });
}

/** Formato de edición: sin separador de miles, con coma decimal. */
const paraEditar = (n) => (n === undefined || n === null || n === ''
  ? '' : String(redondear(n)).replace('.', ','));

// --- Categoría al vuelo ------------------------------------------------------

/*
 * La categoría que hace falta casi nunca está en la lista justo cuando se está
 * apuntando el gasto, y salir a «Datos» a crearla obliga a abandonar lo que se
 * estaba escribiendo. Con esto se crea desde el propio formulario.
 */
const NUEVA_CAT = '__nueva__';

function campoCategoria(id, lista, valor) {
  // Una categoría de un registro antiguo puede haberse borrado del catálogo:
  // se añade a la lista para no cambiársela sin querer al corregirlo.
  const items = valor && !lista.includes(valor) ? [valor, ...lista] : lista;
  return `
    <div class="campo"><label for="${id}">Categoría</label>
      <select id="${id}" name="categoria" required>
        ${opciones(items, valor)}
        <option value="${NUEVA_CAT}">+ Nueva categoría…</option>
      </select>
      <input id="${id}-nueva" name="categoria_nueva" placeholder="Nombre de la nueva categoría"
             maxlength="40" autocomplete="off" hidden disabled></div>`;
}

function conectarCategoria(form, id) {
  const sel = $(`#${id}`, form);
  const txt = $(`#${id}-nueva`, form);
  const sincronizar = ({ enfocar } = {}) => {
    const nueva = sel.value === NUEVA_CAT;
    txt.hidden = !nueva;
    txt.disabled = !nueva;
    txt.required = nueva;
    if (nueva && enfocar) txt.focus();
  };
  sel.addEventListener('change', () => sincronizar({ enfocar: true }));
  sincronizar();
}

/** Nombre de categoría a guardar; la da de alta si es nueva. */
function categoriaElegida(d, tipo = 'Gasto') {
  if (d.categoria !== NUEVA_CAT) return d.categoria;
  const nombre = (d.categoria_nueva || '').trim();
  if (!nombre) return d.categoria;
  if (!db.categorias.some((c) => c.nombre.toLowerCase() === nombre.toLowerCase())) {
    db.categorias.push({
      nombre, grupo: 'Otros', tipo, presupuesto: 0, activa: 'Si',
    });
  }
  return nombre;
}

// --- Gasto con tarjeta -------------------------------------------------------

function formGastoTarjeta(alTerminar, existente = null) {
  const g = existente;
  const cuerpo = `
    <div class="filtros">
      <div class="campo"><label for="f-fecha">Fecha</label>
        <input id="f-fecha" name="fecha" type="date" value="${esc(g?.fecha || hoyISO())}" required></div>
      <div class="campo"><label for="f-usuario">Usuario</label>
        <select id="f-usuario" name="usuario" required>${selUsuarios(g?.usuario || 'J')}</select></div>
    </div>
    <div class="filtros">
      <div class="campo"><label for="f-tarjeta">Tarjeta</label>
        <select id="f-tarjeta" name="tarjeta" required>
          ${opciones(tarjetas().map((t) => ({ valor: t.id, texto: t.nombre })), g?.tarjeta)}
        </select></div>
      ${campoMonto('f-monto', 'monto_total', {
    etiqueta: 'Monto total (USD)', valor: paraEditar(g?.monto_total), requerido: true,
  })}
    </div>
    <div class="campo ancho"><label for="f-detalle">Comercio o proveedor</label>
      <input id="f-detalle" name="detalle" required placeholder="MI COMISARIATO"
             value="${esc(g?.detalle || '')}"></div>
    <div class="campo ancho"><label for="f-proposito">Qué se compró</label>
      <input id="f-proposito" name="proposito" placeholder="Víveres de la semana"
             value="${esc(g?.proposito || '')}"></div>
    <div class="filtros">
      ${campoCategoria('f-categoria', categoriasGasto(), g?.categoria || 'Viveres')}
    </div>
    <div class="filtros">
      <div class="campo"><label for="f-tipo">Tipo de pago</label>
        <select id="f-tipo" name="tipo">
          ${['Corriente', 'Diferido', 'Recurrente'].map((t) => `
            <option value="${t}"${g?.tipo === t ? ' selected' : ''}>${
  t === 'Corriente' ? 'Corriente (1 pago)'
    : t === 'Diferido' ? 'Diferido en cuotas' : 'Recurrente'}</option>`).join('')}
        </select></div>
      <div class="campo" id="caja-cuotas" hidden><label for="f-cuotas">N.º de cuotas</label>
        <input id="f-cuotas" name="cuotas" type="number" min="2" max="48" step="1"
               value="${g && g.cuotas > 1 ? g.cuotas : 3}" inputmode="numeric"></div>
    </div>
    <div class="filtros">
      <div class="campo"><label for="f-mes">Mes de la primera cuota</label>
        <select id="f-mes" name="mes_inicio">
          ${opciones(mesesSeleccionables(), g?.mes_inicio || mesActual())}</select></div>
      <div class="campo" id="caja-tasa" hidden><label for="f-tasa">Tasa anual % (0 = sin interés)</label>
        <input id="f-tasa" name="tasa_interes" type="text" inputmode="decimal"
               value="${paraEditar(g?.tasa_interes || 0)}"></div>
    </div>
    <p class="pista" id="nota-corte" style="margin:-4px 0 0"></p>
    <div class="previsualizacion" id="preview"></div>`;

  modal({
    titulo: g ? 'Corregir gasto' : 'Nuevo gasto con tarjeta',
    cuerpo,
    aceptar: g ? 'Guardar cambios' : 'Registrar gasto',
    alAbrir(form) {
      const tipo = $('#f-tipo', form);
      const cajaCuotas = $('#caja-cuotas', form);
      const cajaTasa = $('#caja-tasa', form);
      const preview = $('#preview', form);
      const selMes = $('#f-mes', form);
      const nota = $('#nota-corte', form);
      // Al corregir se respeta el mes que ya tenía; al crear, sigue a la fecha.
      let mesManual = Boolean(g);
      selMes.addEventListener('change', () => { mesManual = true; });

      /*
       * El gasto se queda en el mes de la compra: uno de agosto es de agosto.
       * Antes se adelantaba al mes del estado de cuenta —una compra del 17 de
       * agosto se guardaba en septiembre— y el consumo del mes dejaba de
       * cuadrar con lo que uno recuerda haber gastado. Lo que sí se corre es
       * el pago, y eso se dice en la nota.
       */
      const ajustarMes = () => {
        const tarjeta = $('#f-tarjeta', form).value;
        const fecha = $('#f-fecha', form).value;
        if (!fecha) return;
        const propio = claveMes(fecha);
        if (!mesManual && [...selMes.options].some((o) => o.value === propio)) {
          selMes.value = propio;
        }
        const corte = textoCorte(tarjeta);
        const vence = fechaPagoCompra(fecha, tarjeta);
        nota.textContent = vence
          ? `Esta tarjeta tiene ${corte}: la compra queda en ${nombreMes(propio)} `
            + `y se paga hasta el ${textoFecha(vence)}.`
          : (corte ? `Esta tarjeta tiene ${corte}.` : '');
      };

      const refrescar = () => {
        const enCuotas = tipo.value !== 'Corriente';
        cajaCuotas.hidden = !enCuotas;
        cajaTasa.hidden = tipo.value !== 'Diferido';
        /*
         * Además de ocultarlos hay que desactivarlos. Un campo oculto sigue
         * validándose: si quedaba un «1» en las cuotas y se pasaba a
         * «Corriente», el mínimo de 2 daba el formulario por inválido y el

        $('#f-cuotas', form).disabled = !enCuotas;
        $('#f-tasa', form).disabled = tipo.value !== 'Diferido';

        const n = enCuotas ? Math.max(2, Number($('#f-cuotas', form).value) || 2) : 1;

            ${plan.interesTotal > 0 ? `· interés ${money(plan.interesTotal)}` : '· sin interés'}</div>
          <div class="cuotas-lista">${chips}</div>`;

      conectarCategoria(form, 'f-categoria');
      ['change', 'input'].forEach((ev) => form.addEventListener(ev, refrescar));
      refrescar();
    },
    alEnviar(d) {
      const categoria = categoriaElegida(d);
      const enCuotas = d.tipo !== 'Corriente';
      const n = enCuotas ? Math.max(2, Number(d.cuotas) || 2) : 1;
      const tasa = d.tipo === 'Diferido' ? aNumero(d.tasa_interes) : 0;
      const plan = planificarCuotas({
        montoTotal: aNumero(d.monto_total), cuotas: n,

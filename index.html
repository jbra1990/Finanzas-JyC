<style>
/* =============================================================================
   Finanzas J & C
   -----------------------------------------------------------------------------
   Todo pasa sobre un fondo de seda azul. Encima, dos materiales y nada más:
   el PANEL, un bloque azul marino con degradado —la tarjeta como objeto, con la
   cifra que importa— y las TARJETAS, azules claras y calladas, que sostienen el
   detalle. Esquinas muy redondeadas, cifras grandes, cero ruido.

   La barra de abajo flota y lleva el botón de añadir en el centro, levantado
   sobre ella.

   Los colores de las series de los gráficos están validados aparte (contraste y
   daltonismo) y no se tocan desde aquí.
   ========================================================================== */

:root {
  color-scheme: dark;

  /*
   * El degradado de la referencia, muestreado de la propia imagen: la página
   * empieza en azul casi blanco y se hunde hasta el navy de medianoche a la
   * altura del primer bloque de contenido. No es un fondo claro con tarjetas
   * blancas encima —eso era lo que teníamos— sino al revés: la cabecera vive
   * en la franja clara y todo lo demás es cristal sobre el azul profundo.
   */
  --fondo-1: #dfecfd;
  --fondo-2: #75a2df;
  --fondo-3: #182f61;
  --fondo-4: #0a142a;
  --plano: #0b1a35;

  /* Paradas calcadas de la referencia: medidas sobre la imagen y pasadas de
     píxel de captura a punto de pantalla. */
  --degradado: linear-gradient(180deg,
    #dfecfd 0, #dfecfd 62px, #c7dff6 128px, #75a2df 196px, #315596 262px,
    #182f61 330px, #13264e 398px, #0f2147 600px, #0b1c3c 668px, #0a142a 804px);

  /* La cabecera es lo único que se apoya en la franja clara. */
  --tinta-cabecera: #0b2244;
  --tinta-cabecera-2: #3a5f92;

  /*
   * Superficies de cristal. En la referencia las tarjetas no tienen color
   * propio: son un velo de luz sobre el fondo, y por eso las de arriba se ven
   * azules y las de abajo casi negras sin cambiar de estilo.
   */
  /*
   * Casi opaca, y de un navy más claro de lo que parecería necesario. Dos
   * razones: translúcida se componía con el degradado y arriba quedaba lavada,
   * sin contraste para nada; y si la tarjeta es casi negra, el bloque oscuro de
   * la esquina no tiene hacia dónde separarse. Aclararla es lo que deja sitio
   * a las dos cosas: título con color propio y esquina que se distingue.
   */
  --superficie: rgba(34, 57, 95, 0.93);
  --superficie-2: rgba(255, 255, 255, 0.10);
  --superficie-3: rgba(255, 255, 255, 0.155);

  /* El panel es el mismo objeto en los dos temas. */
  --panel: linear-gradient(148deg, #4d8ccb 0%, #1d4a7e 30%, #10294f 64%, #081734 100%);
  --panel-plano: #10294f;
  --panel-tinta: #ffffff;
  --panel-tinta-2: #a7c3e2;

  /* Tinta */
  --tinta: #ffffff;
  --tinta-2: #b3cae6;
  --tinta-3: #7f9cc1;

  /* Líneas */
  --grid: rgba(255, 255, 255, 0.085);
  --baseline: rgba(255, 255, 255, 0.15);
  --borde: rgba(255, 255, 255, 0.10);
  --borde-fuerte: rgba(255, 255, 255, 0.19);

  /* Sobre el azul profundo la profundidad la da el velo de luz, no la sombra. */
  --sombra: none;
  --sombra-panel: 0 20px 46px rgba(4, 12, 28, 0.5);
  --sombra-nav: 0 10px 34px rgba(4, 12, 28, 0.45);

  /*
   * Cristal. Lo que hace que una superficie parezca vidrio no es la
   * transparencia sola: es el desenfoque de lo que hay detrás, la saturación
   * subida —el color de abajo se ve más vivo a través del vidrio— y sobre todo
   * el filo de luz del borde superior, que es donde rebota el reflejo.
   */
  --vidrio: rgba(19, 47, 86, 0.82);
  --vidrio-borde: rgba(255, 255, 255, 0.16);
  --vidrio-brillo: rgba(255, 255, 255, 0.22);
  --vidrio-sombra: rgba(11, 31, 61, 0.34);
  --vidrio-tinta: #b7cfe9;
  --vidrio-tinta-viva: #ffffff;

  /*
   * Series de gráficos: una sola escala de azules, de casi blanco a azul medio,
   * como en la referencia. Se ordenan de mayor a menor, así que el degradado
   * dice por sí solo quién manda, y la leyenda pone el nombre al lado.
   *
   * Nota: al ser un solo tono, dos series contiguas se distinguen por claridad
   * y no por color. Por eso ninguna cifra depende de acertar el color: siempre
   * está escrita al lado, en la leyenda o en la tabla.
   */
  --serie-1: #eaf3fe;
  --serie-2: #b9d7f6;
  --serie-3: #8dbcee;
  --serie-4: #6aa0e2;
  --serie-5: #4f84d0;
  --serie-6: #3d6ab5;
  --serie-7: #315699;
  --serie-8: #27447c;

  /*
   * El título de cada sección va en azul claro, no en blanco. El blanco lo
   * llevan los datos: así el encabezado se lee como rótulo y no se confunde con
   * la primera fila de dentro, que es lo que pasaba —«Cupos de las tarjetas» y
   * «Pichincha» eran el mismo blanco, casi el mismo peso y el mismo tamaño.
   * Medido: 8,4:1 sobre la tarjeta arriba del todo y 11,2:1 abajo (AAA).
   */
  --titulo-seccion: #b9d7f6;

  /* J y C no son «serie 1 y 2»: son dos extremos de la escala, para que se
     distingan de un vistazo aunque todo lo demás sea del mismo azul. */
  --persona-j: #dcecfd;
  --persona-c: #4f84d0;

  /*
   * Los tres tonos de la ficha: tapa (la más oscura), contenedor y panel.
   *
   * La tapa tenía tan poco contraste con lo que la rodea (1,2:1) que las tres
   * capas se leían como una superficie plana: el bloque de la esquina no se
   * distinguía. Oscurecerlo más no servía —la tarjeta ya estaba casi en negro y
   * no quedaba recorrido hacia abajo—, así que la separación viene de aclarar
   * la tarjeta. Medido sobre el resultado: 1,9:1 el bloque contra la ficha,
   * frente a 1,2:1 de antes.
   */
  --ficha-tapa: rgba(3, 9, 22, 0.82);
  --ficha-fuera: rgba(255, 255, 255, 0.06);
  --ficha-dentro: rgba(255, 255, 255, 0.10);
  /* Un filo de luz en el canto interior: define el bloque aunque el tono
     apenas cambie, que es como se separan las capas en la referencia. */
  --ficha-filo: rgba(255, 255, 255, 0.09);

  /*
   * El mismo color de la tarjeta pero OPACO, para lo que debe tapar: la primera
   * columna y la cabecera de las tablas se quedan fijas mientras el resto se
   * desplaza por detrás. Con el fondo translúcido de la tarjeta, los importes
   * se transparentaban encima del nombre de la categoría y no se entendía ni
   * una cosa ni la otra. Calculado como la tarjeta compuesta sobre el fondo
   * profundo, que es donde caen las tablas: así no se nota el parche.
   */
  --superficie-solida: #20365b;

  /* Estado: separado del acento, nunca hace de «serie 9». */
  --ok: #35c46a;
  --ok-texto: #4ade80;
  --alerta: #fab219;
  --grave: #ec835a;
  --critico: #f06a6a;

  --acento: #6aa6e8;
  --acento-suave: rgba(106, 166, 232, 0.18);

  --radio-xl: 28px;
  --radio: 22px;
  --radio-s: 14px;
  --radio-pill: 999px;

  --fuente: system-ui, -apple-system, "Segoe UI", sans-serif;
}

/*
 * En oscuro el fondo de seda se hunde hasta el azul de medianoche y las
 * tarjetas claras se vuelven bloques marinos: el panel sigue siendo el mismo
 * objeto, así que no cambia.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    color-scheme: dark;
    --fondo-1: #0d2141;
    --fondo-2: #091a33;
    --fondo-3: #061224;
    --fondo-4: #040d1c;
    --plano: #061224;
    /* Sin franja clara arriba: en oscuro la cabecera ya se apoya en el navy. */
    --degradado: linear-gradient(180deg,
      #14294e 0, #102142 180px, #0a1832 400px, #061224 640px, #040d1c 804px);
    --tinta-cabecera: #eaf3ff;
    --tinta-cabecera-2: #9fbcda;

    --superficie: rgba(255, 255, 255, 0.075);
    --superficie-solida: #171f2d;
    --superficie-2: rgba(255, 255, 255, 0.095);
    --superficie-3: rgba(255, 255, 255, 0.15);

    --panel: linear-gradient(148deg, #4a80b8 0%, #1d4a7e 32%, #0e2749 66%, #081a33 100%);
    --panel-plano: #0e2749;

    --tinta: #eaf3ff;
    --tinta-2: #a9c6e6;
    --tinta-3: #7b9dc4;

    --grid: #1c3f68;
    --baseline: #2b567f;
    --borde: rgba(255, 255, 255, 0.09);
    --borde-fuerte: rgba(255, 255, 255, 0.17);

    /* En oscuro la profundidad la da el bloque de color, no la sombra. */
    --sombra: none;
    --sombra-panel: none;
    --sombra-nav: 0 8px 30px rgba(0, 0, 0, 0.5);

    /* En oscuro el vidrio tiñe de azul en vez de blanquear. */
    --vidrio: rgba(16, 41, 75, 0.8);
    --vidrio-borde: rgba(255, 255, 255, 0.14);
    --vidrio-brillo: rgba(255, 255, 255, 0.22);
    --vidrio-sombra: rgba(0, 0, 0, 0.5);
    --vidrio-tinta: #9fbcda;
    --vidrio-tinta-viva: #ffffff;

    --serie-1: #eaf3fe;
    --serie-2: #b9d7f6;
    --serie-3: #8dbcee;
    --serie-4: #6aa0e2;
    --serie-5: #4f84d0;
    --serie-6: #3d6ab5;
    --serie-7: #315699;
    --serie-8: #27447c;
    --ok-texto: #4ade80;
    --acento: #6aa6e8;
    --acento-suave: rgba(106, 166, 232, 0.18);
  }
}

:root[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo-1: #0d2141;
  --fondo-2: #091a33;
  --fondo-3: #061224;
  --fondo-4: #040d1c;
  --plano: #061224;
  --degradado: linear-gradient(180deg,
    #14294e 0, #102142 180px, #0a1832 400px, #061224 640px, #040d1c 804px);
  --tinta-cabecera: #eaf3ff;
  --tinta-cabecera-2: #9fbcda;
  --superficie: rgba(255, 255, 255, 0.075);
  --superficie-solida: #171f2d;
  --superficie-2: rgba(255, 255, 255, 0.095);
  --superficie-3: rgba(255, 255, 255, 0.15);
  --panel: linear-gradient(148deg, #4a80b8 0%, #1d4a7e 32%, #0e2749 66%, #081a33 100%);
  --panel-plano: #0e2749;
  --tinta: #eaf3ff;
  --tinta-2: #a9c6e6;
  --tinta-3: #7b9dc4;
  --grid: #1c3f68;
  --baseline: #2b567f;
  --borde: rgba(255, 255, 255, 0.09);
  --borde-fuerte: rgba(255, 255, 255, 0.17);
  --sombra: none;
  --sombra-panel: none;
  --sombra-nav: 0 8px 30px rgba(0, 0, 0, 0.5);
  --vidrio: rgba(16, 41, 75, 0.8);
  --vidrio-borde: rgba(255, 255, 255, 0.14);
  --vidrio-brillo: rgba(255, 255, 255, 0.22);
  --vidrio-sombra: rgba(0, 0, 0, 0.5);
  --vidrio-tinta: #9fbcda;
  --vidrio-tinta-viva: #ffffff;
  --serie-1: #eaf3fe;
  --serie-2: #b9d7f6;
  --serie-3: #8dbcee;
  --serie-4: #6aa0e2;
  --serie-5: #4f84d0;
  --serie-6: #3d6ab5;
  --serie-7: #315699;
  --serie-8: #27447c;
  --ok-texto: #4ade80;
  --acento: #6aa6e8;
  --acento-suave: rgba(106, 166, 232, 0.18);
}

* { box-sizing: border-box; }

/*
 * El degradado va en <html> y no en <body>: así se estira con el documento
 * entero sin recurrir a background-attachment:fixed, que en Safari de iPhone
 * salta al hacer scroll.
 */
html {
  min-height: 100%;
  /* Ayuda a que el deslizamiento horizontal no se convierta en «atrás». */
  overscroll-behavior-x: contain;
  background-color: var(--fondo-4);
  background-image: var(--degradado);
  background-repeat: no-repeat;
  background-size: 100% 804px;
}

html, body {
  margin: 0;
  padding: 0;
  color: var(--tinta);
  font-family: var(--fuente);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body { background: transparent; padding-bottom: env(safe-area-inset-bottom); }

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 640;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
a { color: var(--acento); }

/* --- Estructura ---------------------------------------------------------- */

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 16px 104px;
}

.cabecera {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 16px 0 12px;
}

.cabecera h1 {
  color: var(--tinta-cabecera);
  font-size: 22px;
  letter-spacing: -0.03em;
}

/*
 * La marca es además el tirador del menú. Sin los dos botones de la esquina
 * hace falta algo VISIBLE que abra el cajón: el gesto desde el borde está bien
 * para quien ya lo conoce, pero no puede ser la única puerta.
 */
.cabecera .marca {
  position: relative;
  display: grid;
  place-items: center;
  width: 42px; height: 42px;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: var(--panel);
  background-color: var(--panel-plano);
  color: #fff;
  font: inherit;
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 0.02em;
  flex: none;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(11, 31, 61, 0.22);
  transition: transform 0.1s;
}
.cabecera .marca:active { transform: scale(0.93); }

/* Punto rojo cuando hay algo en los avisos. */
.cabecera .marca[data-avisos="si"]::after {
  content: "";
  position: absolute;
  top: -3px; right: -3px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--critico);
  border: 2px solid var(--fondo-1);
}

.cabecera .crece { flex: 1; min-width: 0; }

.cabecera .sub {
  font-size: 12.5px;
  color: var(--tinta-cabecera-2);
  margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* --- El «+» flotante ------------------------------------------------------ */

/*
 * Abajo ya no hay barra de secciones: navegar es cosa del cajón lateral, así
 * que aquí solo queda el gesto que se repite a diario. El contenedor no pinta
 * nada y deja pasar los toques; lo único que existe de verdad es el botón.
 */
.nav {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  /*
   * Abajo a la izquierda, en la misma boca por donde sale la banda de opciones:
   * los dos gestos viven en el mismo sitio. Centrado se comía justo la fila que
   * uno está mirando, y a ras del filo quedaba apretado contra el borde.
   *
   * El `env()` se suma al margen para apartarlo de la muesca en horizontal; en
   * vertical vale cero y manda el margen.
   */
  justify-content: flex-start;
  padding-left: calc(14px + env(safe-area-inset-left));
  pointer-events: none;
}

.nav .nav-mas {
  pointer-events: auto;
  display: grid;
  place-items: center;
  width: 54px; height: 54px;
  padding: 0;
  border-radius: 50%;
  background: var(--panel-plano);
  background-image: linear-gradient(150deg, #4f8ac4 0%, #1d4a7e 45%, #0d2547 100%);
  color: #fff;
  line-height: 0;
  cursor: pointer;
  box-shadow: 0 12px 26px rgba(11, 31, 61, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  border: 2.5px solid rgba(255, 255, 255, 0.22);
  transition: transform 0.12s, box-shadow 0.12s;
}
.nav .nav-mas svg { width: 25px; height: 25px; display: block; }
.nav .nav-mas:active { transform: scale(0.92); }
.nav .nav-mas:hover { box-shadow: 0 16px 34px rgba(11, 31, 61, 0.55); }

@media (min-width: 860px) {
  .nav { right: auto; left: 12px; bottom: 26px; }
  .app { padding-bottom: 48px; }
}

/* --- El panel: la tarjeta como objeto ------------------------------------ */

.panel {
  position: relative;
  overflow: hidden;
  margin: 14px 0;
  padding: 22px;
  border-radius: var(--radio-xl);
  background: var(--panel-plano);
  background-image: var(--panel);
  color: var(--panel-tinta);
  box-shadow: var(--sombra-panel);
}

/* Brillo de seda en la esquina superior izquierda, como en la referencia. */
.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 90% at 0% 0%,
    rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 55%);
  pointer-events: none;
}

.panel > * { position: relative; z-index: 1; }

.panel .etiqueta {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--panel-tinta-2);
}

.panel .cifra {
  display: block;
  margin: 8px 0 4px;
  font-size: clamp(36px, 11vw, 48px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.02;
}
.panel .cifra.neg { color: #ff9d9d; }

/* Los centavos, apagados: la cifra se lee de un vistazo y el detalle no estorba. */
.cifra .dec { color: var(--panel-tinta-2); font-weight: 640; }
.heroe .dec { color: var(--tinta-3); font-weight: 640; }

.panel .nota { font-size: 12.5px; color: var(--panel-tinta-2); }

.panel-cab {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

/* Fila de datos secundarios dentro del panel. */
.panel-datos {
  display: flex;
  flex-wrap: wrap;
  gap: 18px 26px;
  margin-top: 16px;
  padding-top: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.11);
}
.panel-datos > div { min-width: 0; }
.panel-datos .etq {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--panel-tinta-2);
}
.panel-datos .val {
  font-size: 16px;
  font-weight: 620;
  letter-spacing: -0.02em;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

/* Contador de un gasto a plazos: por qué cuota va, cuánto lleva pagado y
   cuánto le queda. La barra da la lectura de un vistazo; las cifras, la
   exacta. */
.plazos { margin: 9px 0 3px; }
.plazos-cab {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}
.plazos-cuota {
  font-size: 12.5px;
  font-weight: 630;
  color: var(--tinta);
  letter-spacing: -0.01em;
}
.plazos-pct {
  font-size: 11px;
  font-weight: 640;
  color: var(--tinta-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.plazos-barra {
  height: 7px;
  border-radius: var(--radio-pill);
  background: var(--superficie-2);
  overflow: hidden;
}
.plazos-barra > span {
  display: block;
  height: 100%;
  border-radius: var(--radio-pill);
  background: var(--serie-2);
  /* Una cuota de 120 es un 0,8 %: sin mínimo no se vería nada. */
  min-width: 3px;
}
.plazos-datos {
  /* Rejilla y no flex: así las cuatro cifras caen 2×2 alineadas en el móvil
     —tres y una suelta quedaba descuadrado— y en cuatro columnas si cabe. */
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 9px 16px;
  margin-top: 10px;
}
.plazos-datos > div { min-width: 0; }
.plazos-datos .etq {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--tinta-2);
}
.plazos-datos .val {
  font-size: 14px;
  font-weight: 620;
  letter-spacing: -0.02em;
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

/* Fila de un segmentado ancho junto a un botón: el segmentado se encoge y
   desplaza, el botón nunca baja de línea. */
.barra-accion {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 0;
}
.barra-accion > *:first-child { flex: 1 1 auto; min-width: 0; }
.barra-accion > .btn { flex: none; }

/* El segmentado dentro del panel se viste de panel. */
.panel .segmentado {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.14);
}
.panel .segmentado button { color: var(--panel-tinta-2); }
.panel .segmentado button[aria-pressed="true"] {
  background: rgba(255, 255, 255, 0.95);
  color: #101828;
  box-shadow: none;
}
/*
 * Píldoras de variación bajo la cifra grande, como los «+4.73%» y
 * «+$1,286 - Today» de la referencia: dos datos sueltos que acompañan al
 * número sin competir con él.
 */
.panel .chips-panel { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.panel .chip-panel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--radio-pill);
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255, 255, 255, 0.16);
  font-size: 12.5px;
  font-weight: 570;
  color: var(--panel-tinta);
  font-variant-numeric: tabular-nums;
}
.panel .chip-panel.bien { color: #57e08f; }
.panel .chip-panel.mal { color: #ff9d9d; }

/*
 * Accesos rápidos dentro del panel: icono arriba, rótulo debajo, tres en fila.
 * Son las tres cosas que se hacen a diario, al alcance sin salir de Inicio.
 */
.acciones-panel {
  display: grid;
  /* Cuatro accesos no caben en una fila de móvil sin apretar el texto, así que
     se reparten en dos filas de dos. */
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.acciones-panel button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 14px 6px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: var(--panel-tinta);
  font: inherit;
  font-size: 12.5px;
  font-weight: 560;
  cursor: pointer;
  transition: background 0.15s, transform 0.06s;
}
.acciones-panel button:hover { background: rgba(255, 255, 255, 0.19); }
.acciones-panel button:active { transform: scale(0.97); }
.acciones-panel svg { width: 19px; height: 19px; }

.panel .medidor { margin: 14px 0 0; }
.panel .btn {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.18);
  color: var(--panel-tinta);
}
.panel .btn:hover { background: rgba(255, 255, 255, 0.2); }
.panel .btn.primario { background: var(--acento); border-color: transparent; color: #fff; }

/* --- Tarjetas ------------------------------------------------------------ */

/*
 * La tarjeta de la referencia no tiene color propio: es un velo de luz sobre el
 * fondo. Por eso las de arriba se ven azules y las de abajo casi negras sin
 * cambiar de estilo, y por eso lleva desenfoque —sin él el velo se ve plano.
 */
.tarjeta {
  position: relative;
  background: var(--superficie);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
  backdrop-filter: blur(18px) saturate(1.25);
  border: 1px solid var(--borde);
  border-radius: var(--radio-xl);
  padding: 16px;
  margin: 14px 0;
  box-shadow: var(--sombra);
  /* Recorta la esquina oscura contra el redondeo de la tarjeta. */
  overflow: hidden;
}

/*
 * La cabecera de la referencia: el rótulo a la izquierda y el dato de contexto
 * ENCAJADO en la esquina de arriba a la derecha, en un bloque más oscuro. Se
 * estira hasta los bordes con margen negativo para que el bloque llegue al filo
 * de la tarjeta; el recorte de `overflow` le da la esquina redondeada.
 *
 * El bloque va en FLUJO, no posicionado en absoluto. Colocado en absoluto no
 * podía crecer: los rótulos largos se recortaban con puntos suspensivos y, si
 * el título también era largo, uno se metía por debajo del otro —el `padding`
 * en porcentaje de la cabecera y el `max-width` del bloque se resuelven contra
 * anchos distintos y nunca cuadraban. En flujo, una nota de dos líneas
 * simplemente hace más alta la cabecera.
 *
 * Solo se transforma el `.pista`, que es un dato. Las cabeceras que llevan un
 * botón lo conservan como botón: encajarlo en la esquina lo disfrazaría de
 * etiqueta y dejaría de invitar a pulsarlo.
 */
.tarjeta > header {
  display: flex;
  flex-wrap: nowrap;
  align-items: stretch;
  justify-content: space-between;
  gap: 0;
  margin: -16px -16px 14px;
  padding: 0;
  min-height: 46px;
}
.tarjeta > header h2 {
  flex: 1 1 auto;
  min-width: 0;
  align-self: center;
  padding: 13px 12px 13px 16px;
  color: var(--titulo-seccion);
  font-size: 15px;
  letter-spacing: -0.005em;
  line-height: 1.3;
}

.tarjeta > header .pista {
  flex: 0 1 auto;
  display: flex;
  align-items: center;
  max-width: 52%;
  margin: 0;
  padding: 12px 16px;
  border-radius: 0 0 0 20px;
  background: var(--ficha-tapa);
  border-left: 1px solid var(--ficha-filo);
  border-bottom: 1px solid var(--ficha-filo);
  /* Apagado: es el dato de contexto, no debe competir con el rótulo. */
  color: var(--tinta-3);
  font-size: 12px;
  font-weight: 560;
  line-height: 1.35;
  text-align: right;
}

/* Lo que no es rótulo ni dato —botones— se queda como estaba. */
.tarjeta > header > *:not(h2):not(.pista) {
  align-self: center;
  flex: none;
  margin-right: 16px;
}

.rejilla { display: grid; gap: 12px; }
.rejilla.dos { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.rejilla.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

/* --- Indicadores --------------------------------------------------------- */

/* Los indicadores son el azul claro de la referencia: bloques, no fichas. */
.kpi {
  background: var(--superficie-2);
  border: 1px solid transparent;
  border-radius: var(--radio);
  padding: 15px 16px;
}
.tarjeta .kpi { background: var(--superficie-2); }

.kpi .etq {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--tinta-3);
  line-height: 1.3;
}
.kpi .valor {
  font-size: 23px;
  font-weight: 660;
  letter-spacing: -0.03em;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.kpi .delta { font-size: 11.5px; color: var(--tinta-2); margin-top: 3px; }
.kpi .delta.bien { color: var(--ok-texto); font-weight: 550; }
.kpi .delta.mal { color: var(--critico); font-weight: 550; }

/* Cifra suelta fuera del panel (vistas que aún no lo usan). */
.heroe {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.05;
  margin: 4px 0 6px;
}
.heroe.neg { color: var(--critico); }

/* --- Controles ----------------------------------------------------------- */

.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
  margin: 10px 0;
}
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1 1 150px; }
.campo > label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tinta-3);
}
.campo.ancho { flex-basis: 100%; }

input, select, textarea, button { font: inherit; color: var(--tinta); }

input, select, textarea {
  width: 100%;
  padding: 11px 12px;
  background: var(--superficie-2);
  border: 1px solid transparent;
  border-radius: var(--radio-s);
  min-height: 44px;
  transition: border-color 0.15s, background 0.15s;
}
input:hover, select:hover, textarea:hover { background: var(--superficie-3); }
input:focus, select:focus, textarea:focus {
  background: var(--superficie);
  border-color: var(--acento);
  outline: none;
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--acento);
  outline-offset: 2px;
}
textarea { min-height: 66px; resize: vertical; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 18px;
  min-height: 44px;
  border: 1px solid var(--borde-fuerte);
  border-radius: var(--radio-pill);
  background: var(--superficie);
  font-weight: 560;
  letter-spacing: -0.01em;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, transform 0.06s;
}
.btn:hover { background: var(--superficie-2); }
.btn:active { transform: scale(0.975); }
.btn.primario {
  background: var(--acento);
  border-color: transparent;
  color: #fff;
  font-weight: 620;
}
.btn.primario:hover { filter: brightness(1.08); }
.btn.peligro { color: var(--critico); }
.btn.pequeno { padding: 0 13px; min-height: 34px; font-size: 12.5px; }

.segmentado {
  display: flex;
  max-width: 100%;
  padding: 3px;
  gap: 2px;
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio-pill);
  overflow-x: auto;
  scrollbar-width: none;
}
.segmentado::-webkit-scrollbar { display: none; }
.segmentado button {
  flex: none;
  white-space: nowrap;
  border: 0;
  background: transparent;
  padding: 0 15px;
  min-height: 34px;
  border-radius: var(--radio-pill);
  color: var(--tinta-2);
  font-size: 13px;
  font-weight: 540;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.segmentado button[aria-pressed="true"] {
  background: var(--superficie);
  color: var(--tinta);
  font-weight: 640;
  box-shadow: 0 1px 3px rgba(13, 20, 32, 0.14);
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: var(--radio-pill);
  border: 1px solid var(--borde);
  background: var(--superficie-2);
  font-size: 12px;
  font-weight: 540;
  color: var(--tinta-2);
}
/* J y C: cada persona con su color, el mismo de las series 1 y 2. */
.chip.j { background: color-mix(in srgb, var(--persona-j) 16%, transparent);
  border-color: color-mix(in srgb, var(--persona-j) 40%, transparent); }
.chip.c { background: color-mix(in srgb, var(--persona-c) 22%, transparent);
  border-color: color-mix(in srgb, var(--persona-c) 52%, transparent); }

/* --- Tablas -------------------------------------------------------------- */

/*
 * Sin relleno a la IZQUIERDA: con él, la columna fija se anclaba por dentro y
 * quedaba una rendija por la que asomaban los importes al desplazar. El hueco
 * visual lo pone ahora la propia celda, que es lo que se queda anclado. (La
 * sombra no servía: con `border-collapse: collapse` el navegador la ignora en
 * las celdas.)
 */
.tabla-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -16px;
  padding: 0 16px 0 0;
}
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child {
  text-align: left;
  position: sticky; left: 0;
  /* Opaco: por debajo pasan los importes al desplazar la tabla de lado. */
  background: var(--superficie-solida);
  z-index: 1;
  /*
   * El contenedor con scroll lleva 16 px de relleno, así que la columna se
   * ancla POR DENTRO de él y quedaba una rendija a la izquierda por la que
   * asomaban los importes. La primera sombra pinta esa franja del mismo color;
   * la segunda es un filo que indica que la columna está anclada y que hay más
   * tabla a la derecha.
   */
  /* El hueco del borde de la tarjeta va aquí dentro, no en el contenedor. */
  padding-left: 26px;
}
thead th {
  position: sticky; top: 0;
  background: var(--superficie-solida);
  color: var(--tinta-3);
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--borde);
  z-index: 2;
}
thead th:first-child { z-index: 3; }
tbody td {
  border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
tbody tr:hover td { background: var(--superficie-2); }
tbody tr:hover td:first-child { background: var(--superficie-2); }
tfoot td {
  font-weight: 660;
  border-top: 2px solid var(--baseline);
  font-variant-numeric: tabular-nums;
}
td.cero { color: var(--tinta-3); }

/* --- Categorías que se abren --------------------------------------------- */

tr.desplegable { cursor: pointer; }
tr.desplegable:hover td, tr.desplegable:hover td:first-child {
  background: var(--superficie-2);
}
tr.desplegable .flecha {
  display: inline-block;
  width: 14px;
  margin-right: 2px;
  color: var(--tinta-3);
  transition: transform 0.15s;
}
tr.desplegable[aria-expanded="true"] .flecha {
  transform: rotate(90deg);
  color: var(--acento);
}
tr.desplegable[aria-expanded="true"] td,
tr.desplegable[aria-expanded="true"] td:first-child {
  background: var(--superficie-2);
  font-weight: 620;
}

/*
 * El desglose ocupa una fila entera de la tabla. La celda no lleva el `sticky`
 * de la primera columna a propósito: si lo llevara, al desplazar la tabla de
 * lado el detalle se quedaría clavado encima de los meses.
 */
tr.detalle > td {
  position: static;
  padding: 0;
  white-space: normal;
  text-align: left;
  background: var(--superficie-2);
}
/* Pegada al borde izquierdo del contenedor con scroll: el ancho se lo pone
   la vista, midiendo lo que de verdad se ve. */
.caja-desglose { position: sticky; left: 0; padding: 2px 0 10px; }

.desglose { list-style: none; margin: 0; padding: 2px 12px; }
.desglose li {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--grid);
  font-size: 13px;
}
.desglose li:last-child { border-bottom: 0; }
.desglose .principal { flex: 1; min-width: 0; }
.desglose .titulo { font-weight: 570; display: flex; align-items: center; gap: 7px; }
.desglose .meta { font-size: 11.5px; color: var(--tinta-3); margin-top: 1px; }
.desglose .monto {
  font-weight: 640; white-space: nowrap;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.pie-desglose {
  padding: 8px 12px 2px;
  font-size: 12px;
  color: var(--tinta-3);
  border-top: 1px solid var(--baseline);
}
.pie-desglose strong { color: var(--tinta); font-variant-numeric: tabular-nums; }

/* --- Listas -------------------------------------------------------------- */

.lista { list-style: none; margin: 0; padding: 0; }
.lista li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--grid);
}
.lista li:last-child { border-bottom: 0; }
.lista .principal { flex: 1; min-width: 0; }
.lista .titulo {
  font-weight: 570;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 7px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lista .meta {
  font-size: 11.5px; color: var(--tinta-3); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* De qué comercios se compone una categoría: se agrupa por concepto, así que
   conviene poder comprobar de un vistazo qué ha entrado en cada saco. */
.lista .meta.sitios { color: var(--tinta-2); opacity: 0.72; font-size: 11px; }
.lista .monto {
  font-weight: 640;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.lista .monto .pie {
  display: block;
  font-size: 10px;
  font-weight: 550;
  letter-spacing: 0;
  color: var(--tinta-3);
  text-align: right;
}

/* Casilla de comprobación contra el estado de cuenta. Grande a propósito: se
   usa con el papel del banco al lado, tachando uno por uno con el pulgar. */
.lista .check {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
  margin: -4px 0;
  cursor: pointer;
}
.lista .check input { width: 22px; height: 22px; accent-color: var(--acento); }
.lista li.comprobable:has(input:checked) { opacity: 0.55; }
.lista li.comprobable:has(input:checked) .titulo { text-decoration: line-through; }

/* Filas de tres líneas: el detalle se envuelve en vez de cortarse con puntos
   suspensivos, que es justo donde estaban la categoría y el número de cuota. */
.lista li.detallada .titulo,
.lista li.detallada .meta { white-space: normal; }

/* Cifras con rótulo dentro de una fila: «Cuota $28,90 · Total $346,80». */
.lista .cifras {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 14px;
  margin-top: 5px;
  font-size: 11.5px;
  color: var(--tinta-3);
}
.lista .cifras strong {
  color: var(--tinta);
  font-weight: 640;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.lista .monto.neg { color: var(--critico); }
.lista .monto.pos { color: var(--ok-texto); }

/*
 * Filas con botones. En un teléfono, «Corregir» y «✕» a la derecha dejaban al
 * detalle del gasto unos 90 px y todos los nombres salían cortados; como el
 * detalle es justo lo que se compara con el Excel, los botones bajan a una
 * segunda línea y el texto recupera el ancho completo.
 */
.lista li.con-acciones { flex-wrap: wrap; row-gap: 8px; }
.lista li.con-acciones .monto { margin-left: auto; }
/* Estas filas ocupan dos alturas de todas formas, así que el texto se envuelve
   en vez de cortarse: la fecha de pago quedaba en «se paga el 1…». */
.lista li.con-acciones .titulo,
.lista li.con-acciones .meta { white-space: normal; }
/* Desplegable de selección múltiple: se abre para elegir y se cierra, y el
   rótulo dice qué hay marcado sin necesidad de abrirlo. Con la lista siempre
   abierta, el resultado quedaba media pantalla más abajo. */
.desplegable-marcas {
  background: var(--superficie);
  border: 1px solid var(--ficha-filo, var(--superficie-2));
  border-radius: var(--radio-s);
  margin: 10px 0;
  overflow: hidden;
}
.desplegable-marcas > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 8px 14px;
  cursor: pointer;
  list-style: none;
}
.desplegable-marcas > summary::-webkit-details-marker { display: none; }
.desplegable-marcas .dm-etq {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--tinta-2);
  flex: none;
}
.desplegable-marcas .dm-valor {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 580;
  color: var(--tinta);
  text-align: right;
  /* Un nombre largo no puede empujar la flecha fuera de la caja. */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.desplegable-marcas .dm-flecha {
  flex: none;
  color: var(--tinta-2);
  transition: transform 0.18s;
}
.desplegable-marcas[open] .dm-flecha { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) {
  .desplegable-marcas .dm-flecha { transition: none; }
}

/* Listado de categorías para armar un corte: una por línea, con su casilla.
   Se desplaza dentro de su caja en vez de estirar la tarjeta a lo largo de
   toda la pantalla. */
.lista-marcas {
  max-height: 260px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-top: 1px solid var(--superficie-2);
  padding: 2px 0;
}
.lista-marcas .marca {
  display: flex;
  align-items: center;
  gap: 10px;
  /* Alto de dedo: 44px, aunque la casilla mida 18. */
  min-height: 44px;
  padding: 0 13px;
  font-size: 13.5px;
  color: var(--tinta-2);
  cursor: pointer;
}
.lista-marcas .marca + .marca { border-top: 1px solid rgba(255, 255, 255, 0.06); }
.lista-marcas .marca:has(input:checked) { color: var(--tinta); font-weight: 600; }
.lista-marcas .marca.todas { font-weight: 600; }
.lista-marcas input[type="checkbox"] {
  flex: none;
  width: 18px;
  height: 18px;
  accent-color: var(--serie-2);
  margin: 0;
}
.lista-marcas .marca > span { min-width: 0; }

/* Una categoría del análisis, que se abre para enseñar sus movimientos.
   Cerrada se lee como una fila de lista; abierta, el detalle queda dentro y
   con sangría, para que se vea de quién cuelga. */
.cat { border-top: 1px solid rgba(255, 255, 255, 0.07); }
.cat:first-of-type { border-top: 0; }
.cat > summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  cursor: pointer;
  list-style: none;
}
.cat > summary::-webkit-details-marker { display: none; }
.cat > summary .principal { flex: 1 1 auto; min-width: 0; }
.cat > summary .titulo {
  font-size: 14px;
  font-weight: 600;
  color: var(--tinta);
  display: flex;
  align-items: center;
  gap: 6px;
}
.cat > summary .flecha {
  color: var(--tinta-2);
  font-size: 15px;
  line-height: 1;
  transition: transform 0.18s;
}
.cat[open] > summary .flecha { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) {
  .cat > summary .flecha { transition: none; }
}
.cat > summary .barra-jc { margin-top: 7px; height: 6px; }
.cat > summary .meta {
  margin-top: 5px;
  font-size: 11px;
  color: var(--tinta-2);
}
.cat > summary .monto {
  flex: none;
  text-align: right;
  white-space: nowrap;
  font-size: 15px;
  font-weight: 640;
  font-variant-numeric: tabular-nums;
}
.cat > summary .monto .pie {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--tinta-2);
}
/* El detalle vive dentro de su categoría: sangrado y sobre un fondo algo más
   hundido, para que no se confunda con la siguiente categoría. */
.cat > .desglose {
  margin: 0 0 12px;
  padding: 4px 0 4px 14px;
  border-left: 2px solid var(--serie-2);
  background: rgba(0, 0, 0, 0.14);
  border-radius: 0 var(--radio-s) var(--radio-s) 0;
}

/* Reparto por categoría dentro del análisis: nombre, barra y cifra. */
.lista.compacta { margin: 12px 0 4px; }
.lista.compacta li { padding: 7px 0; }
.lista.compacta .barra-jc { margin-top: 6px; height: 6px; }
.lista.compacta .monto { text-align: right; white-space: nowrap; }
.lista.compacta .monto .pie {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--tinta-2);
}

/* Las cuatro cifras de cabecera del análisis no cuelgan de un panel oscuro,
   así que necesitan su propio filo arriba. */
.an-cifras { border-top-color: var(--superficie-2); }

/* La columna que va acumulando pesa menos que el mes: es contexto, no el
   dato que se lee primero. */
td.acumulado, tfoot td.acumulado { color: var(--tinta-2); }

/* El contador de un gasto a plazos ocupa el ancho entero de la ficha: son
   cuatro cifras y compartir línea con el importe las apretaba. */
.lista li.con-acciones .plazos { flex: 1 0 100%; }

.lista li.con-acciones .acciones {
  flex: 1 0 100%;
  display: flex; justify-content: flex-end; gap: 8px;
}

/*
 * Insignia circular con las iniciales, como el «CG» / «MS» de la referencia.
 * Le da un ancla visual a cada fila sin necesidad de iconos inventados.
 */
.lista .insignia {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--superficie-2);
  color: var(--acento);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.lista .delta-mini {
  display: block;
  font-size: 11.5px;
  font-weight: 560;
  letter-spacing: 0;
  text-align: right;
  color: var(--tinta-3);
}
.lista .delta-mini.bien { color: var(--ok-texto); }
.lista .delta-mini.mal { color: var(--critico); }

/*
 * Ficha con cabecera y pie, como las tarjetas de movimiento de la referencia:
 * arriba el tipo y la fecha, en medio de qué se trata, y abajo una franja con
 * las dos cifras que resumen el asunto.
 */
/*
 * La forma de la referencia: un contenedor redondeado, un bloque oscuro
 * ENCAJADO en la esquina de arriba a la derecha con la fecha, y el contenido
 * en un panel interior más claro. Lo que hace el efecto es la media luna del
 * contenedor que asoma entre la esquina redondeada del bloque oscuro y la del
 * panel: parece que el panel esté mordido, sin recortar nada.
 */
.ficha {
  position: relative;
  background: var(--ficha-fuera);
  border-radius: 26px;
  padding: 0 5px 5px;
  margin: 0 0 12px;
}
.ficha:last-child { margin-bottom: 0; }

.ficha-meta {
  position: absolute;
  top: 0; right: 0;
  max-width: 62%;
  padding: 9px 15px 10px;
  border-radius: 0 26px 0 20px;
  background: var(--ficha-tapa);

.ficha-cab {

.pie-reparto {
  display: flex;

  color: var(--tinta-3);
}

}

.reparto { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.reparto .chip { gap: 5px; padding: 6px 12px; font-size: 12.5px; }
.reparto .chip strong {

}

  font-weight: 660;
  letter-spacing: -0.025em;
}
.ficha-pie {

  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 14px;
  padding: 10px 14px 11px;
  border-top: 1px solid var(--borde);
  font-size: 12.5px;
  color: var(--tinta-3);
}
.ficha-pie strong {
  color: var(--tinta);
  font-weight: 640;
  font-variant-numeric: tabular-nums;
}

.vacio {
  padding: 30px 12px;
  text-align: center;
  color: var(--tinta-3);
  font-size: 13.5px;
}

/* --- Medidor de cupo ----------------------------------------------------- */

.medidor { margin: 8px 0; }
.medidor-pista {
  height: 7px;

  background: var(--superficie-3);
  overflow: hidden;
}
.medidor-relleno {
  height: 100%;
  border-radius: var(--radio-pill);
  background: var(--acento);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.medidor[data-estado="alerta"] .medidor-relleno { background: var(--alerta); }
.medidor[data-estado="critico"] .medidor-relleno { background: var(--critico); }
.medidor-pie {

  font-variant-numeric: tabular-nums;

/* El mismo medidor dentro del panel oscuro. */
.panel .medidor-pista { background: rgba(255, 255, 255, 0.15); }
.panel .medidor-pie { color: var(--panel-tinta-2); }
.panel .medidor-pie strong { color: var(--panel-tinta); }

/* --- Gráficos ------------------------------------------------------------ */

.viz-svg { display: block; overflow: visible; }
.viz-grid { stroke: var(--grid); stroke-width: 1; }
/* Rejilla de trazos, como en la referencia: marca el nivel sin dibujar una
   línea que compita con las barras. */
.viz-grid.punteada { stroke-dasharray: 3 5; }
.viz-baseline { stroke: var(--baseline); stroke-width: 1; }
.viz-tick {

.viz-centro-etq {

}
.viz-centro-valor {

  font-family: var(--fuente); letter-spacing: -0.04em;

/* Rótulo curvado sobre el anillo. */
.viz-arco-etq {
  font-family: var(--fuente);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.005em;

}
/* Cuando va por fuera de la banda escribe sobre el fondo, no sobre el color. */
.viz-arco-fuera {

  font-weight: 640;
  font-variant-numeric: tabular-nums;

.viz-barra, .viz-arco { transition: opacity 0.15s; }
.viz-barra:hover, .viz-arco:hover { opacity: 0.8; }
.viz-punto-fin { stroke: var(--superficie); stroke-width: 2; }
.viz-zona:hover { fill: color-mix(in srgb, var(--tinta) 4%, transparent); }
.viz-caja { width: 100%; }
.viz-vacio { padding: 30px 8px; text-align: center; color: var(--tinta-3); font-size: 13px; }

.viz-dona { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.viz-dona-svg { width: 250px; height: 250px; flex: none; margin: 0 auto; }

.viz-leyenda { list-style: none; margin: 0; padding: 0; flex: 1 1 190px; min-width: 0; }
.viz-leyenda li {

}
.viz-leyenda-nombre { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viz-leyenda-valor { font-variant-numeric: tabular-nums; color: var(--tinta); font-weight: 560; }
.viz-leyenda-pct {

.viz-leyenda-agrupada .viz-punto {

}

}

.viz-leyenda-h { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }

}

}

}

dialog {

/* --- Cajón lateral -------------------------------------------------------- */

/*
 * Panel vertical que entra desde el borde izquierdo. Está porque la cabecera
 * se va con el scroll: sus dos botones solo se podían tocar arriba del todo, y
 * el rebote del iPhone los sacaba del marco justo al intentar acertar.
 */
.cajon-velo {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(6, 17, 33, 0.5);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity 0.24s;

.cajon {

  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: calc(20px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));

.cajon-item {

 * `hidden` tiene que ganar siempre. Su regla por defecto es `display:none`,

/** 'YYYY-MM' a partir de un Date o de un texto ISO. */
function claveMes(fecha) {
  const d = fecha instanceof Date ? fecha : new Date(`${fecha}T00:00:00`);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function sumarMeses(mes, n) {
  const [y, m] = mes.split('-').map(Number);
  const total = y * 12 + (m - 1) + n;
  return `${String(Math.floor(total / 12)).padStart(4, '0')}-${String((total % 12) + 1).padStart(2, '0')}`;
}

function difMeses(desde, hasta) {
  const [y1, m1] = desde.split('-').map(Number);
  const [y2, m2] = hasta.split('-').map(Number);
  return (y2 * 12 + m2) - (y1 * 12 + m1);
}

  const out = [];
  const n = difMeses(desde, hasta);
  for (let i = 0; i <= n; i += 1) out.push(sumarMeses(desde, i));

  return money(v);
}

// --- Cuotas de tarjeta -------------------------------------------------------

/**
 * Reparte un monto en `n` cuotas iguales cuadrando los centavos en la última,
 * de modo que la suma siempre devuelva exactamente el total.
 */
function repartirCuotas(total, n) {
  const t = redondear(total);
  const k = Math.max(1, Math.floor(n) || 1);
  const base = Math.floor((t * 100) / k) / 100;
  const cuotas = Array(k).fill(base);
  cuotas[k - 1] = redondear(t - base * (k - 1));
  return cuotas;
}

/**
 * Cuota fija del sistema francés. `tasaAnual` en % (12 = 12 % anual).
 * Con tasa 0 devuelve el reparto simple.
 */
function cuotaFrancesa(capital, tasaAnual, n) {
  const k = Math.max(1, Math.floor(n) || 1);
  const i = (Number(tasaAnual) || 0) / 100 / 12;
  if (i <= 0) return redondear(capital / k);
  const f = (1 + i) ** k;
  return redondear((capital * i * f) / (f - 1));
}

/**
 * Construye el cronograma de un consumo con tarjeta.
 * `tipo`: 'Corriente' (1 cuota) o 'Diferido' (n cuotas desde `mesInicio`).
 * Devuelve { cuotas: [{n_cuota, mes, monto}], totalPagado, interesTotal }.
 */
function planificarCuotas({ montoTotal, cuotas = 1, mesInicio, tasaInteres = 0 }) {
  const n = Math.max(1, Math.floor(cuotas) || 1);
  const tasa = Number(tasaInteres) || 0;
  let montos;
  if (tasa > 0 && n > 1) {
    const fija = cuotaFrancesa(montoTotal, tasa, n);
    montos = Array(n).fill(fija);
  } else {
    montos = repartirCuotas(montoTotal, n);
  }
  const lista = montos.map((monto, i) => ({
    n_cuota: i + 1,
    mes: sumarMeses(mesInicio, i),
    monto: redondear(monto),
  }));
  const totalPagado = redondear(lista.reduce((s, c) => s + c.monto, 0));
  return {
    cuotas: lista,
    totalPagado,
    interesTotal: redondear(totalPagado - redondear(montoTotal)),
  };
}

// --- Pólizas / inversiones ---------------------------------------------------

/**
 * Rendimiento de una póliza a plazo fijo.
 *
 * @param {object} p
 * @param {number} p.capital        monto invertido
 * @param {number} p.tasaAnual      tasa nominal anual en %
 * @param {number} p.plazoDias      plazo en días
 * @param {number} [p.base=360]     base de días del año (360 o 365)
 * @param {boolean} [p.compuesto]   capitaliza mes a mes en lugar de simple
 * @param {number} [p.retencion]    retención en la fuente sobre el interés (0.02)
 */
function calcularPoliza({
  capital, tasaAnual, plazoDias, base = 360, compuesto = false, retencion = 0,
}) {
  const c = Number(capital) || 0;
  const i = (Number(tasaAnual) || 0) / 100;
  const d = Number(plazoDias) || 0;
  const b = Number(base) || 360;

  const bruto = compuesto
    ? c * ((1 + i / 12) ** (d / 30) - 1)
    : c * i * (d / b);

  const ret = redondear(bruto * (Number(retencion) || 0));
  const neto = redondear(bruto - ret);
  return {
    interesBruto: redondear(bruto),
    retencion: ret,
    interesNeto: neto,
    valorFinal: redondear(c + neto),
    rendimientoEfectivo: c > 0 ? redondear((neto / c) * 100) : 0,
  };
}

/** Suma `dias` a una fecha ISO y devuelve otra fecha ISO. */
function sumarDias(fechaISO, dias) {
  const d = new Date(`${fechaISO}T00:00:00`);
  d.setDate(d.getDate() + (Number(dias) || 0));
  return d.toISOString().slice(0, 10);
}

function diasEntre(desdeISO, hastaISO) {
  const a = new Date(`${desdeISO}T00:00:00`);
  const b = new Date(`${hastaISO}T00:00:00`);
  return Math.round((b - a) / 86400000);
}

// --- Tarjetas ----------------------------------------------------------------

/**
 * Mes de facturación al que cae un consumo según la fecha de corte de la
 * tarjeta. Con corte el día 3 (Pichincha), una compra del 5 de agosto entra en
 * el estado de cuenta que cierra el 3 de septiembre. Con corte a fin de mes
 * (Bolivariano) el mes de facturación coincide con el mes calendario.
 *
 * @param {string} fechaISO  'YYYY-MM-DD'
 * @param {string} tarjetaId
 * @returns {string} 'YYYY-MM'
 */
function mesDeFacturacion(fechaISO, tarjetaId) {
  const mes = claveMes(fechaISO);
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const corte = String(tarjeta?.dia_corte ?? '').trim().toLowerCase();

  if (!corte || corte === 'fin') return mes;
  const dia = Number(corte);
  if (!Number.isFinite(dia) || dia < 1) return mes;

  const diaCompra = Number(String(fechaISO).slice(8, 10));
  return diaCompra <= dia ? mes : sumarMeses(mes, 1);
}

/** Texto corto que explica el corte de una tarjeta. */
function textoCorte(tarjetaId) {
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const corte = String(tarjeta?.dia_corte ?? '').trim().toLowerCase();
  if (!corte) return '';
  if (corte === 'fin') return 'corte a fin de mes';
  return `corte el día ${corte}`;
}

// --- Cuándo se paga ----------------------------------------------------------

/*
 * El gasto se apunta en el mes en que se hizo la compra: un consumo de agosto
 * es de agosto. Lo que se corre al mes siguiente es el PAGO, y eso se calcula
 * aparte con el corte y el día de vencimiento de cada tarjeta:
 *
 *   Pichincha  · corte el 3        · se paga hasta el 18
 *   Bolivariano· corte a fin de mes· se paga hasta el 15
 *
 * Mezclar las dos cosas —meter la compra directamente en el mes del pago— era
 * lo que hacía que un gasto de agosto apareciera registrado en septiembre.
 */

/** 'YYYY-MM-DD' del día `dia` de un mes, recortado si el mes es más corto. */
function diaDelMes(mes, dia) {
  const [y, m] = mes.split('-').map(Number);
  const ultimo = new Date(y, m, 0).getDate();
  return `${mes}-${String(Math.min(dia, ultimo)).padStart(2, '0')}`;
}

const diaPagoDe = (tarjetaId) => {
  const t = db.cuentas.find((c) => c.id === tarjetaId);
  const dia = Number(String(t?.dia_pago ?? '').trim());
  return Number.isFinite(dia) && dia >= 1 ? dia : 0;
};

/**
 * Fecha límite de pago de una compra concreta. Una compra anterior al corte
 * entra en el estado que cierra ese mismo mes y se paga dentro del mes; una
 * posterior espera al estado siguiente.
 *
 * @returns {string} 'YYYY-MM-DD', o '' si la tarjeta no tiene día de pago.
 */
function fechaPagoCompra(fechaISO, tarjetaId) {
  const pago = diaPagoDe(tarjetaId);
  if (!pago) return '';
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const corte = String(tarjeta?.dia_corte ?? '').trim().toLowerCase();
  const mes = claveMes(fechaISO);
  const diaCompra = Number(String(fechaISO).slice(8, 10));
  const dentroDelMes = corte && corte !== 'fin' && diaCompra <= Number(corte);
  return diaDelMes(dentroDelMes ? mes : sumarMeses(mes, 1), pago);
}

/** Fecha límite de pago del consumo de un mes completo. */
function fechaPagoMes(mes, tarjetaId) {
  const pago = diaPagoDe(tarjetaId);
  return pago ? diaDelMes(sumarMeses(mes, 1), pago) : '';
}

/** «el 18 de septiembre de 2026» a partir de 'YYYY-MM-DD'. */
function textoFecha(fechaISO) {
  if (!fechaISO) return '';
  const [y, m, d] = fechaISO.split('-').map(Number);
  return `${d} de ${NOMBRES_MES[m - 1].toLowerCase()} de ${y}`;
}

/**
 * Una cuota se considera pendiente si no está marcada como pagada y su mes es
 * el actual o posterior. Los meses anteriores sin marca se asumen ya pagados
 * (así el histórico migrado no infla el cupo utilizado).
 */
function cuotaPendiente(cuota, mesRef = mesActual()) {
  return cuota.pagado !== 'Si' && cuota.mes >= mesRef;
}

/** Cupo utilizado, disponible y % de uso de una tarjeta. */
function estadoTarjeta(tarjetaId, mesRef = mesActual()) {
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const cupo = Number(tarjeta?.cupo) || 0;
  let utilizado = 0;
  const porUsuario = {};
  for (const c of db.cuotas) {
    if (c.tarjeta !== tarjetaId || !cuotaPendiente(c, mesRef)) continue;
    utilizado += c.monto;
    porUsuario[c.usuario] = (porUsuario[c.usuario] || 0) + c.monto;
  }
  utilizado = redondear(utilizado);
  return {
    tarjeta,
    cupo,
    utilizado,
    disponible: redondear(cupo - utilizado),
    uso: cupo > 0 ? Math.min(100, (utilizado / cupo) * 100) : 0,
    porUsuario: Object.fromEntries(
      Object.entries(porUsuario).map(([k, v]) => [k, redondear(v)])),
  };
}

/** Total a pagar de una tarjeta en un mes concreto. */
function pagoDelMes(tarjetaId, mes, usuario = 'ambos') {
  let total = 0;
  for (const c of db.cuotas) {
    if (c.tarjeta !== tarjetaId || c.mes !== mes) continue;
    if (usuario !== 'ambos' && c.usuario !== usuario) continue;
    total += c.monto;
  }
  return redondear(total);
}

// --- Comprobación contra el estado de cuenta ---------------------------------

/*
 * Marcar un consumo como comprobado es distinto de marcarlo como pagado: lo
 * primero dice «esto también sale en el estado de cuenta del banco, y por el
 * mismo valor»; lo segundo, «ya lo pagué». Por eso viven en campos separados.
 */

/** Clave de configuración donde se guarda el total del estado de cuenta. */
const claveEstadoCuenta = (tarjetaId, mes) => `estado_${tarjetaId}_${mes}`;

/** Resumen de la comprobación de un mes: cuántas cuadran y cuánto falta. */
function comprobacionDelMes(tarjetaId, mes, usuario = 'ambos') {
  const cuotas = db.cuotas.filter((c) => c.tarjeta === tarjetaId && c.mes === mes
    && (usuario === 'ambos' || c.usuario === usuario));
  const marcadas = cuotas.filter((c) => c.conciliado === 'Si');
  const total = redondear(cuotas.reduce((s, c) => s + c.monto, 0));
  const comprobado = redondear(marcadas.reduce((s, c) => s + c.monto, 0));

  const guardado = db.config[claveEstadoCuenta(tarjetaId, mes)];
  const declarado = guardado === undefined || guardado === '' ? null : Number(guardado);

  return {
    cuotas: cuotas.length,
    marcadas: marcadas.length,
    total,
    comprobado,
    pendiente: redondear(total - comprobado),
    declarado,
    // Lo que el banco dice menos lo que tiene la app. Positivo = falta algo
    // por registrar; negativo = hay algo de más.
    diferencia: declarado === null ? null : redondear(declarado - total),
    cuadra: declarado !== null && Math.abs(redondear(declarado - total)) < 0.005,
    completa: cuotas.length > 0 && marcadas.length === cuotas.length,
  };
}

/** Cuotas de diferidos que siguen vivas, agrupadas por gasto. */
function diferidosVigentes(mesRef = mesActual()) {
  const porGasto = new Map();
  for (const c of db.cuotas) {
    if (!cuotaPendiente(c, mesRef)) continue;
    const g = db.gastosTarjeta.find((x) => x.id === c.gasto_id);
    if (!g || g.tipo === 'Corriente') continue;
    const acc = porGasto.get(c.gasto_id) || {
      gasto: g, restante: 0, cuotasRestantes: 0, proxima: null,
    };
    acc.restante += c.monto;
    acc.cuotasRestantes += 1;
    if (!acc.proxima || c.mes < acc.proxima.mes) acc.proxima = c;
    porGasto.set(c.gasto_id, acc);
  }
  return [...porGasto.values()]
    .map((a) => ({ ...a, restante: redondear(a.restante) }))
    .sort((a, b) => b.restante - a.restante);
}

// --- Cuentas y patrimonio ----------------------------------------------------

/** Saldo real de una cuenta bancaria o de efectivo. */
function saldoCuenta(cuentaId) {
  const c = db.cuentas.find((x) => x.id === cuentaId);
  let saldo = Number(c?.saldo_inicial) || 0;

  for (const i of db.ingresos) if (i.cuenta === cuentaId) saldo += Number(i.neto) || 0;
  for (const g of db.gastosEfectivo) if (g.cuenta === cuentaId) saldo -= Number(g.monto) || 0;
  for (const m of db.movimientos) {
    if (m.cuenta_origen === cuentaId) saldo -= Number(m.monto) || 0;
    if (m.cuenta_destino === cuentaId) saldo += Number(m.monto) || 0;
  }
  for (const p of db.inversiones) {
    if (p.estado !== 'Liquidada' && p.cuenta_origen === cuentaId) {
      saldo -= Number(p.capital) || 0;
    }
    if (p.estado === 'Liquidada' && p.cuenta_destino === cuentaId) {
      saldo += Number(p.valor_final) || 0;
    }
    if (p.estado === 'Liquidada' && p.cuenta_origen === cuentaId) {
      saldo -= Number(p.capital) || 0;
    }
  }
  return redondear(saldo);
}

function totalAhorrado() {
  return redondear(db.cuentas
    .filter((c) => c.tipo !== 'Tarjeta')
    .reduce((s, c) => s + saldoCuenta(c.id), 0));
}

function totalInvertido() {
  return redondear(db.inversiones
    .filter((p) => p.estado === 'Activa')
    .reduce((s, p) => s + (Number(p.capital) || 0), 0));
}

function rendimientoProyectado() {
  return redondear(db.inversiones
    .filter((p) => p.estado === 'Activa')
    .reduce((s, p) => s + (Number(p.interes_neto) || 0), 0));
}

function deudaTotalTarjetas(mesRef = mesActual()) {
  return redondear(db.cuentas
    .filter((c) => c.tipo === 'Tarjeta')
    .reduce((s, c) => s + estadoTarjeta(c.id, mesRef).utilizado, 0));
}

function patrimonioNeto(mesRef = mesActual()) {
  return redondear(totalAhorrado() + totalInvertido() - deudaTotalTarjetas(mesRef));
}

// --- Agregados de reportes ---------------------------------------------------

/**
 * Filtros comunes de los reportes.
 * @typedef {{usuario?: string, tarjeta?: string, categorias?: string[],
 *            incluirEfectivo?: boolean, incluirTarjeta?: boolean}} Filtros
 */

const pasaUsuario = (f, u) => !f.usuario || f.usuario === 'ambos' || f.usuario === u;
const pasaTarjeta = (f, t) => !f.tarjeta || f.tarjeta === 'todas' || f.tarjeta === t;
const pasaCategoria = (f, c) => !f.categorias?.length || f.categorias.includes(c);

/** Gastos del periodo desglosados fila a fila (tarjeta + efectivo). */
function gastosEnMeses(meses, filtros = {}) {
  const set = new Set(meses);
  const out = [];

  if (filtros.incluirTarjeta !== false) {
    for (const c of db.cuotas) {
      if (!set.has(c.mes)) continue;
      if (!pasaUsuario(filtros, c.usuario) || !pasaTarjeta(filtros, c.tarjeta)) continue;
      if (!pasaCategoria(filtros, c.categoria)) continue;
      out.push({
        mes: c.mes, usuario: c.usuario, categoria: c.categoria,
        monto: c.monto, origen: c.tarjeta, tipo: 'Tarjeta', ref: c.gasto_id,
      });
    }
  }
  if (filtros.incluirEfectivo !== false && (!filtros.tarjeta || filtros.tarjeta === 'todas')) {
    for (const g of db.gastosEfectivo) {
      const mes = claveMes(g.fecha);
      if (!set.has(mes)) continue;
      if (!pasaUsuario(filtros, g.usuario) || !pasaCategoria(filtros, g.categoria)) continue;
      out.push({
        mes, usuario: g.usuario, categoria: g.categoria,
        monto: Number(g.monto) || 0, origen: g.cuenta, tipo: 'Efectivo', ref: g.id,
      });
    }
  }
  return out;
}

/**
 * Los movimientos que hay detrás de una fila de la tabla mensual: en qué se
 * fue el dinero de esa categoría, del más reciente al más antiguo.
 *
 * Reutiliza `gastosEnMeses` para que el desglose no pueda discrepar del total
 * que enseña la tabla, y le añade lo que hace falta para leerlo —fecha, dónde
 * se compró y, si venía a plazos, qué cuota es.
 */
function detalleDeCategoria(meses, categoria, filtros = {}) {
  return detalleDeGastos(meses, { ...filtros, categorias: [categoria] });
}

/**
 * Lo mismo pero sin atarse a una categoría: los movimientos que hay detrás de
 * cualquier corte —un mes o doce, una categoría o cinco, solo tarjeta o todo—,
 * con lo que hace falta para leerlos.
 */
function detalleDeGastos(meses, filtros = {}) {
  const nombreCuenta = (id) => db.cuentas.find((c) => c.id === id)?.nombre || id;

  return gastosEnMeses(meses, filtros)
    .map((x) => {
      const esTarjeta = x.tipo === 'Tarjeta';
      const g = esTarjeta
        ? db.gastosTarjeta.find((y) => y.id === x.ref)
        : db.gastosEfectivo.find((y) => y.id === x.ref);
      const cuota = esTarjeta
        ? db.cuotas.find((c) => c.gasto_id === x.ref && c.mes === x.mes)
        : null;
      return {
        fecha: g?.fecha || `${x.mes}-01`,
        detalle: g?.detalle || x.ref,
        usuario: x.usuario,
        monto: x.monto,
        mes: x.mes,
        origen: nombreCuenta(x.origen),
        categoria: x.categoria,
        tipo: x.tipo,
        proposito: g?.proposito || '',
        cuota: g && g.cuotas > 1 && cuota ? `cuota ${cuota.n_cuota}/${g.cuotas}` : '',
      };
    })
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
}

/** Matriz categorías × meses lista para pintar la tabla mensual. */
function matrizCategoriaMes(meses, filtros = {}) {
  const filas = gastosEnMeses(meses, filtros);
  const porCat = new Map();
  for (const f of filas) {
    const cat = f.categoria || 'Sin categoría';
    if (!porCat.has(cat)) porCat.set(cat, Object.fromEntries(meses.map((m) => [m, 0])));
    porCat.get(cat)[f.mes] += f.monto;
  }
  const salida = [...porCat.entries()]
    .map(([categoria, porMes]) => {
      const valores = meses.map((m) => redondear(porMes[m] || 0));
      return { categoria, valores, total: redondear(valores.reduce((a, b) => a + b, 0)) };
    })
    .filter((f) => f.total !== 0)
    .sort((a, b) => b.total - a.total);

  const totales = meses.map((_, i) => redondear(
    salida.reduce((s, f) => s + f.valores[i], 0)));
  return {
    meses,
    filas: salida,
    totales,
    granTotal: redondear(totales.reduce((a, b) => a + b, 0)),
  };
}

/** Total gastado por categoría en el periodo, de mayor a menor. */
function totalPorCategoria(meses, filtros = {}) {
  const m = new Map();
  for (const f of gastosEnMeses(meses, filtros)) {
    m.set(f.categoria, (m.get(f.categoria) || 0) + f.monto);
  }
  return [...m.entries()]
    .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
    .filter((x) => x.valor !== 0)
    .sort((a, b) => b.valor - a.valor);
}

/** Reparto del gasto entre J y C en el periodo. */
function totalPorUsuario(meses, filtros = {}) {
  const m = new Map();
  for (const f of gastosEnMeses(meses, { ...filtros, usuario: 'ambos' })) {
    m.set(f.usuario, (m.get(f.usuario) || 0) + f.monto);
  }
  return [...m.entries()]
    .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
    .sort((a, b) => b.valor - a.valor);
}

/** Ingreso neto de un mes (opcionalmente filtrado por usuario). */
function ingresoDelMes(mes, usuario = 'ambos') {
  return redondear(db.ingresos
    .filter((i) => (i.mes || claveMes(i.fecha)) === mes)
    .filter((i) => usuario === 'ambos' || i.usuario === usuario)
    .reduce((s, i) => s + (Number(i.neto) || 0), 0));
}

/** Serie ingresos / gastos / balance para un rango de meses. */
function serieMensual(meses, filtros = {}) {
  const gastos = gastosEnMeses(meses, filtros);
  const porMes = Object.fromEntries(meses.map((m) => [m, 0]));
  gastos.forEach((g) => { porMes[g.mes] += g.monto; });

  return meses.map((mes) => {
    const ingreso = ingresoDelMes(mes, filtros.usuario || 'ambos');
    const gasto = redondear(porMes[mes]);
    return { mes, ingreso, gasto, balance: redondear(ingreso - gasto) };
  });
}

/** Acumulados históricos de toda la base. */
function acumuladoHistorico(filtros = {}) {
  const meses = mesesConDatos();
  const serie = serieMensual(meses, filtros);
  const ingresos = redondear(serie.reduce((s, x) => s + x.ingreso, 0));
  const gastos = redondear(serie.reduce((s, x) => s + x.gasto, 0));
  return { meses, serie, ingresos, gastos, balance: redondear(ingresos - gastos) };
}

/** Comparativo presupuesto vs. real del mes. */
function presupuestoVsReal(mes, filtros = {}) {
  const reales = new Map(totalPorCategoria([mes], filtros).map((x) => [x.nombre, x.valor]));
  return db.categorias
    .filter((c) => c.tipo !== 'Ingreso' && (Number(c.presupuesto) || 0) > 0)
    .map((c) => {
      const real = reales.get(c.nombre) || 0;
      const ppto = Number(c.presupuesto) || 0;
      return {
        categoria: c.nombre,
        presupuesto: ppto,
        real,
        diferencia: redondear(ppto - real),
        uso: ppto > 0 ? (real / ppto) * 100 : 0,
      };
    })
    .sort((a, b) => b.uso - a.uso);
}

    + `A ${r} ${r} 0 ${grande} ${invertido ? 0 : 1} ${x1.toFixed(2)} ${y1.toFixed(2)}`;

    `M ${P(rExt, desde + gExt)}`,
    `A ${rExt} ${rExt} 0 ${grande} 1 ${P(rExt, hasta - gExt)}`,
    `A ${k} ${k} 0 0 1 ${P(rExt - k, hasta)}`,
    `L ${P(rInt + k, hasta)}`,
    `A ${k} ${k} 0 0 1 ${P(rInt, hasta - gInt)}`,
    `A ${rInt} ${rInt} 0 ${grande} 0 ${P(rInt, desde + gInt)}`,
    `A ${k} ${k} 0 0 1 ${P(rInt + k, desde)}`,
    `L ${P(rExt - k, desde)}`,

  const textoCentro = money(total);

      <span class="viz-leyenda-pct">${((d.valor / total) * 100).toFixed(0)}%</span>`;
    leyenda.appendChild(li);
  });
  if (agrupadas) {
    const pie = document.createElement('li');
    pie.className = 'viz-leyenda-nota';
    pie.textContent = `Las ${completa.length - conPorcion} últimas van juntas `
      + 'en la porción «Otros» del anillo.';
    leyenda.appendChild(pie);
  }
  envoltura.appendChild(leyenda);
  return undefined;
}

/*
 * Ranking. Una sola serie: sin leyenda, con el valor al final de la barra.
 *
 * Sin tope por defecto. Cortaba en diez, y con veinte categorías eso dejaba la
 * mitad del gasto fuera de la vista sin decirlo: la lista se alarga, pero es
 * una lista y se recorre — el objetivo es saber en qué se va TODO.
 */
function barrasHorizontales(contenedor, datos, { max = Infinity } = {}) {
  const serie = datos.filter((d) => d.valor > 0).slice(0, max);
  if (!serie.length) return vacio(contenedor);

  limpiar(contenedor);
  const lista = document.createElement('div');
  lista.className = 'viz-ranking';
  const tope = Math.max(...serie.map((d) => d.valor));

  serie.forEach((d, i) => {
    const fila = document.createElement('div');
    fila.className = 'viz-ranking-fila';
    fila.innerHTML = `
      <span class="viz-ranking-nombre" title="${esc(d.nombre)}">${esc(d.nombre)}</span>
      <span class="viz-ranking-pista">
        <span class="viz-ranking-barra" style="width:${(d.valor / tope) * 100}%;
              background:${colorSerieDe(i, serie.length)}"></span>
      </span>
      <span class="viz-ranking-valor">${money(d.valor)}</span>`;
    conectar(fila, `<strong>${esc(d.nombre)}</strong><br>${money(d.valor)}`);
    lista.appendChild(fila);
  });
  contenedor.appendChild(lista);
  return undefined;
}

// --- Columnas agrupadas ------------------------------------------------------

/**
 * Columnas por mes con una o varias series en la MISMA unidad ($).
 * `series` = [{nombre, valores:number[]}], `etiquetas` = eje X.
 */
function columnas(contenedor, etiquetas, series, { alto = 240, leyenda = true } = {}) {
  const hayDatos = series.some((s) => s.valores.some((v) => Math.abs(v) > 0));
  if (!etiquetas.length || !hayDatos) return vacio(contenedor);

  limpiar(contenedor);
  const caja = document.createElement('div');
  caja.className = 'viz-caja';
  contenedor.appendChild(caja);

  const { svg, ancho } = lienzo(caja, alto);
  // Escala a la DERECHA, como en el diseño de referencia: la columna de cifras
  // deja de partir la lectura por la mitad izquierda y las barras arrancan
  // pegadas al borde.
  const m = { t: 14, r: 44, b: 26, l: 6 };
  const w = ancho - m.l - m.r;
  const h = alto - m.t - m.b;

  const max = Math.max(...series.flatMap((s) => s.valores.map((v) => Math.abs(v))), 1);
  const ticks = ticksY(max);
  const techo = ticks[ticks.length - 1];
  const y = (v) => m.t + h - (v / techo) * h;

  ticks.forEach((t) => {
    svg.appendChild(el('line', {
      x1: m.l, x2: m.l + w, y1: y(t), y2: y(t),
      class: t === 0 ? 'viz-baseline' : 'viz-grid punteada',
    }));
    svg.appendChild(el('text', {
      x: m.l + w + 7, y: y(t) + 4, 'text-anchor': 'start', class: 'viz-tick',
    })).textContent = etiquetaEje(t);
  });

  const banda = w / etiquetas.length;
  const n = series.length;
  const grueso = Math.min(24, Math.max(4, (banda * 0.62) / n - 2));

  etiquetas.forEach((etq, i) => {
    const centro = m.l + banda * (i + 0.5);
    const anchoGrupo = grueso * n + 2 * (n - 1);
    series.forEach((s, j) => {
      const v = Math.abs(s.valores[i] || 0);
      const altura = Math.max((v / techo) * h, v > 0 ? 2 : 0);
      if (!altura) return;
      const x = centro - anchoGrupo / 2 + j * (grueso + 2);
      const barra = el('rect', {
        x, y: m.t + h - altura, width: grueso, height: altura,
        rx: Math.min(4, grueso / 2), fill: colorSerieDe(j, n), class: 'viz-barra',
      });
      conectar(barra, `<strong>${esc(etq)}</strong><br>${esc(s.nombre)}: ${money(s.valores[i] || 0)}`);
      svg.appendChild(barra);
    });

    // El eje X se adelgaza en pantallas estrechas para que no se solapen.
    const salto = Math.ceil(etiquetas.length / Math.max(3, Math.floor(w / 46)));
    if (i % salto === 0) {
      svg.appendChild(el('text', {
        x: centro, y: alto - 8, 'text-anchor': 'middle', class: 'viz-tick',
      })).textContent = etq;
    }
  });

  if (leyenda && series.length > 1) caja.appendChild(leyendaHorizontal(series));
  return undefined;
}

// --- Columnas apiladas -------------------------------------------------------

/** Apiladas por categoría, con 2px de aire entre segmentos. */
function columnasApiladas(contenedor, etiquetas, series, { alto = 260 } = {}) {
  const hayDatos = series.some((s) => s.valores.some((v) => v > 0));
  if (!etiquetas.length || !hayDatos) return vacio(contenedor);

  limpiar(contenedor);
  const caja = document.createElement('div');
  caja.className = 'viz-caja';
  contenedor.appendChild(caja);

  const { svg, ancho } = lienzo(caja, alto);
  // Misma escala a la derecha y rejilla punteada que en las agrupadas.
  const m = { t: 14, r: 44, b: 26, l: 6 };
  const w = ancho - m.l - m.r;
  const h = alto - m.t - m.b;

  const totales = etiquetas.map((_, i) => series.reduce((s, x) => s + (x.valores[i] || 0), 0));
  const ticks = ticksY(Math.max(...totales, 1));
  const techo = ticks[ticks.length - 1];
  const y = (v) => m.t + h - (v / techo) * h;

  ticks.forEach((t) => {
    svg.appendChild(el('line', {
      x1: m.l, x2: m.l + w, y1: y(t), y2: y(t),
      class: t === 0 ? 'viz-baseline' : 'viz-grid punteada',
    }));
    svg.appendChild(el('text', {
      x: m.l + w + 7, y: y(t) + 4, 'text-anchor': 'start', class: 'viz-tick',
    })).textContent = etiquetaEje(t);
  });

  const banda = w / etiquetas.length;
  const grueso = Math.min(24, banda * 0.6);

  etiquetas.forEach((etq, i) => {
    const x = m.l + banda * (i + 0.5) - grueso / 2;
    let acumulado = 0;
    series.forEach((s, j) => {
      const v = s.valores[i] || 0;
      if (v <= 0) return;
      const altura = (v / techo) * h;
      const top = m.t + h - ((acumulado + v) / techo) * h;
      const seg = el('rect', {
        x, y: top, width: grueso, height: Math.max(altura - 2, 1),
        rx: j === series.length - 1 ? 4 : 0, fill: colorSerieDe(j, series.length), class: 'viz-barra',
      });
      conectar(seg, `<strong>${esc(etq)}</strong><br>${esc(s.nombre)}: ${money(v)}
        <br><span class="viz-tt-tenue">Total ${money(totales[i])}</span>`);
      svg.appendChild(seg);
      acumulado += v;
    });

    const salto = Math.ceil(etiquetas.length / Math.max(3, Math.floor(w / 46)));
    if (i % salto === 0) {
      svg.appendChild(el('text', {
        x: m.l + banda * (i + 0.5), y: alto - 8, 'text-anchor': 'middle', class: 'viz-tick',
      })).textContent = etq;
    }
  });

  caja.appendChild(leyendaHorizontal(series));
  return undefined;
}

// --- Línea -------------------------------------------------------------------

/** Serie temporal con área tenue y etiqueta directa en el último punto. */
function linea(contenedor, etiquetas, series, { alto = 230 } = {}) {
  const hayDatos = series.some((s) => s.valores.some((v) => Math.abs(v) > 0));
  if (etiquetas.length < 2 || !hayDatos) return vacio(contenedor);

  limpiar(contenedor);
  const caja = document.createElement('div');
  caja.className = 'viz-caja';
  contenedor.appendChild(caja);

  const { svg, ancho } = lienzo(caja, alto);
  const m = { t: 16, r: 52, b: 26, l: 44 };
  const w = ancho - m.l - m.r;
  const h = alto - m.t - m.b;

  const todos = series.flatMap((s) => s.valores);
  const min = Math.min(0, ...todos);
  const ticks = ticksY(Math.max(...todos.map(Math.abs), 1));
  const techo = ticks[ticks.length - 1];
  const piso = min < 0 ? -techo : 0;
  const y = (v) => m.t + h - ((v - piso) / (techo - piso)) * h;
  const x = (i) => m.l + (etiquetas.length === 1 ? w / 2 : (i / (etiquetas.length - 1)) * w);

  const marcasY = piso < 0 ? [...ticks.slice().reverse().map((t) => -t), ...ticks.slice(1)] : ticks;
  marcasY.forEach((t) => {
    svg.appendChild(el('line', {
      x1: m.l, x2: m.l + w, y1: y(t), y2: y(t),
      class: t === 0 ? 'viz-baseline' : 'viz-grid',
    }));
    svg.appendChild(el('text', {
      x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'viz-tick',
    })).textContent = etiquetaEje(t);
  });

  series.forEach((s, j) => {
    const puntos = s.valores.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    svg.appendChild(el('polygon', {
      points: `${m.l},${y(0)} ${puntos} ${x(s.valores.length - 1)},${y(0)}`,
      fill: colorSerieDe(j, series.length), opacity: 0.1,
    }));
    svg.appendChild(el('polyline', {
      points: puntos, fill: 'none', stroke: colorSerieDe(j, series.length),
      'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));

    const ultimo = s.valores.length - 1;
    svg.appendChild(el('circle', {
      cx: x(ultimo), cy: y(s.valores[ultimo]), r: 4.5,
      fill: colorSerieDe(j, series.length), class: 'viz-punto-fin',
    }));
    if (series.length <= 4) {
      svg.appendChild(el('text', {
        x: x(ultimo) + 8, y: y(s.valores[ultimo]) + 4, class: 'viz-etq-directa',
      })).textContent = etiquetaEje(s.valores[ultimo]);
    }
  });

  // Zona sensible por columna: el objetivo táctil es toda la franja del mes.
  etiquetas.forEach((etq, i) => {
    const paso = w / Math.max(1, etiquetas.length - 1);
    const zona = el('rect', {
      x: x(i) - paso / 2, y: m.t, width: paso, height: h,
      fill: 'transparent', class: 'viz-zona',
    });
    const detalle = series
      .map((s, j) => `<span class="viz-punto" style="background:${colorSerieDe(j, series.length)}"></span>
        ${esc(s.nombre)}: ${money(s.valores[i] || 0)}`)
      .join('<br>');
    conectar(zona, `<strong>${esc(etq)}</strong><br>${detalle}`);
    svg.appendChild(zona);

    const salto = Math.ceil(etiquetas.length / Math.max(3, Math.floor(w / 46)));
    if (i % salto === 0) {
      svg.appendChild(el('text', {
        x: x(i), y: alto - 8, 'text-anchor': 'middle', class: 'viz-tick',
      })).textContent = etq;
    }
  });

  if (series.length > 1) caja.appendChild(leyendaHorizontal(series));
  return undefined;
}

// --- Leyenda -----------------------------------------------------------------

function leyendaHorizontal(series) {
  const ul = document.createElement('ul');
  ul.className = 'viz-leyenda viz-leyenda-h';
  series.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="viz-punto" style="background:${colorSerieDe(i, series.length)}"></span>
      <span class="viz-leyenda-nombre">${esc(s.nombre)}</span>`;
    ul.appendChild(li);
  });
  return ul;
}

/**
 * Barra de uso de cupo: el color del relleno indica severidad.
 * Con `sinPie` se dibuja solo la barra, para cuando las cifras ya están al lado.
 */
function medidor(contenedor, { usado, total, etiqueta = '', sinPie = false }) {
  const pct = total > 0 ? Math.min(100, (usado / total) * 100) : 0;
  const estado = pct >= 90 ? 'critico' : pct >= 70 ? 'alerta' : 'bien';
  const pie = sinPie ? '' : `
      <div class="medidor-pie">
        <span>${esc(etiqueta)}</span>
        <span><strong>${money(usado)}</strong> de ${money(total)} · ${pct.toFixed(0)}%</span>
      </div>`;
  contenedor.innerHTML = `
    <div class="medidor" data-estado="${estado}">
      <div class="medidor-pista"><div class="medidor-relleno" style="width:${pct}%"></div></div>${pie}
    </div>`;
}

 * Repinta los gráficos cuando cambia el ancho (rotación del teléfono).

 * Sólo sobrevive la última función registrada. Cada vista la llama al pintarse,
 * así que guardar todas significaba que al girar el teléfono se repintaban
 * también las vistas anteriores: sus contenedores ya no existen y cada una
 * lanzaba un error. Con una sola, la que corresponde a lo que está en pantalla,
 * el problema desaparece y de paso el listener se instala una única vez.

  repintar = fn;

  clearTimeout(temporizador);
  temporizador = setTimeout(() => { if (repintar) repintar(); }, 180);
});

return { MAX_SERIES, alRedimensionar, barrasHorizontales, colorSerie, colorSerieDe, columnas, columnasApiladas, dona, linea, medidor, ocultarTooltip, plegarOtros };

/**
 * Convierte a número lo que se escriba en un campo de dinero, aceptando la
 * coma decimal además del punto: «12,50», «12.50» y «1.234,56» valen igual.
 * El último separador que aparece es el decimal; el otro son los miles.
 */
function aNumero(valor) {
  if (typeof valor === 'number') return Number.isFinite(valor) ? valor : 0;
  let s = String(valor ?? '').trim().replace(/\s| /g, '');
  if (!s) return 0;

  const coma = s.lastIndexOf(',');
  const punto = s.lastIndexOf('.');
  if (coma >= 0 && punto >= 0) {
    s = coma > punto
      ? s.replace(/\./g, '').replace(',', '.')   // 1.234,56
      : s.replace(/,/g, '');                      // 1,234.56
  } else if (coma >= 0) {
    s = s.replace(',', '.');
  }
  s = s.replace(/[^0-9.\-]/g, '');
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

/** Hojas sin las cuales un libro no es una base de la app. */
const HOJAS_MINIMAS = ['Cuentas', 'Gastos_Tarjeta', 'Cuotas'];

/** Marca de tiempo de cada fila; viaja en el Excel para poder fusionar. */
const COL_TS = 'Modificado';

/** La base actual convertida en hojas listas para `escribirLibro`. */
function construirLibro() {
  return ESQUEMA.map(([hoja, coleccion, cols]) => {
    const cabecera = cols.map(([titulo]) => titulo);
    if (!coleccion) {
      return {
        nombre: hoja,
        filas: [cabecera, ...Object.entries(db.config).map(([k, v]) => [k, String(v)])],
      };
    }
    const filas = (db[coleccion] || []).map((fila) => {
      const salida = cols.map(([, clave, tipo]) => {
        const v = fila[clave];
        if (v === undefined || v === null || v === '') return '';
        return tipo === 'n' ? Number(v) || 0 : String(v);
      });
      salida.push(Number(fila._ts) || 0);
      return salida;
    });
    return { nombre: hoja, filas: [[...cabecera, COL_TS], ...filas] };
  });
}

/** Filas crudas (cabecera en la fila 1) → objetos, según un mapa de columnas. */
function filasAObjetos(filas, cols) {
  if (!filas?.length) return [];
  const cabecera = filas[0].map((c) => String(c).trim());
  const mapa = Object.fromEntries(cols.map(([titulo, clave]) => [titulo, clave]));
  const tipos = Object.fromEntries(cols.map(([, clave, tipo]) => [clave, tipo]));
  const colTs = cabecera.indexOf(COL_TS);

  return filas.slice(1)
    .filter((f) => f.some((c) => c !== '' && c !== null && c !== undefined))
    .map((f) => {
      const obj = {};
      cabecera.forEach((titulo, i) => {
        const clave = mapa[titulo];
        if (!clave) return;
        const valor = f[i];
        if (tipos[clave] === 'n') obj[clave] = Number(valor) || 0;
        else if (tipos[clave] === 'f') {
          obj[clave] = typeof valor === 'number' ? serialAFecha(valor) : String(valor || '');
        } else obj[clave] = String(valor ?? '');
      });
      if (colTs >= 0) obj._ts = Number(f[colTs]) || 0;
      return obj;
    });
}

/** ¿Este libro tiene la forma de una base de la app? */
function esBaseDeLaApp(libro) {
  return HOJAS_MINIMAS.every((h) => Array.isArray(libro?.[h]));
}

/**
 * Libro de Excel → objeto de base de datos.
 * @throws si el libro no tiene las hojas de la app
 * @returns {{datos: object, resumen: string[]}}
 */
function libroADatos(libro, configBase = {}) {
  if (!esBaseDeLaApp(libro)) {
    throw new Error('El archivo no tiene las hojas de la app '
      + `(${HOJAS_MINIMAS.join(', ')}). Si es tu libro original de tarjetas, `
      + 'usa «Exportar a Excel» para crear la base y vincula ese archivo.');
  }

  const datos = { version: 2, config: { ...configBase } };
  const resumen = [];

  for (const [hoja, coleccion, cols] of ESQUEMA) {
    const filas = libro[hoja];
    if (!filas) continue;

    if (!coleccion) {
      filasAObjetos(filas, [['Clave', 'clave', 't'], ['Valor', 'valor', 't']])
        .forEach((f) => { if (f.clave) datos.config[f.clave] = String(f.valor); });
      continue;
    }
    datos[coleccion] = filasAObjetos(filas, cols);
    resumen.push(`${hoja}: ${datos[coleccion].length}`);
  }
  return { datos, resumen };
}

return { ESQUEMA, construirLibro, esBaseDeLaApp, libroADatos };
})();

M["libro_tarjetas"] = (function () {
/**
 * Lector del libro `Cuentas_tarjetas.xlsx` tal como lo mantiene el usuario:
 * una hoja por tarjeta, con las columnas de mes desplegadas a lo ancho.
 *
 * No modifica nada del archivo. Devuelve una tabla plana de hechos
 * (una fila por mes con valor) que es lo que consumen los gráficos.
 */

const MESES_LARGO = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const MESES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun',
  'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

/** Meses que se asumen si el libro no trae la hoja `Tabla` con fechas reales. */
const MES_INICIO_POR_DEFECTO = '2025-05';

const nombreMes = (mes, corto = false) => {
  const [y, m] = String(mes).split('-').map(Number);
  const lista = corto ? MESES_CORTO : MESES_LARGO;
  return corto ? `${lista[m - 1]} ${String(y).slice(2)}` : `${lista[m - 1]} ${y}`;
};

const redondear = (n) => Math.round((Number(n) || 0) * 100) / 100;

const FORMATO = new Intl.NumberFormat('es-EC', {
  style: 'currency', currency: 'USD', minimumFractionDigits: 2,
});
const money = (n) => FORMATO.format(Number(n) || 0);

function sumarMeses(mes, n) {
  const [y, m] = mes.split('-').map(Number);
  const t = y * 12 + (m - 1) + n;
  return `${String(Math.floor(t / 12)).padStart(4, '0')}-${String((t % 12) + 1).padStart(2, '0')}`;
}

const texto = (v) => (v === null || v === undefined ? '' : String(v).trim());
const numero = (v) => {
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
  return Number.isFinite(n) ? n : 0;
};

/** Serie de fecha de Excel → 'YYYY-MM'. */
function serialAMes(n) {
  const d = new Date(Math.round((Number(n) - 25569) * 86400000));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
}

function textoAMes(v) {
  const s = texto(v);
  const iso = /^(\d{4})-(\d{2})/.exec(s);
  if (iso) return `${iso[1]}-${iso[2]}`;
  const d = new Date(s);
  if (!Number.isNaN(d.getTime())) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  return null;
}

/**
 * Los encabezados de mes de las hojas de tarjeta son etiquetas sueltas
 * ("Mayo", "Junio", … "Diciembre2"). La hoja `Tabla` sí trae las fechas
 * reales de esos mismos 20 meses, así que de ahí salen las claves.
 */
function mesesDelLibro(libro, cuantos) {
  const tabla = libro.Tabla;
  if (tabla) {
    for (const fila of tabla.slice(0, 8)) {
      const encontrados = [];
      for (const celda of fila) {
        const mes = typeof celda === 'number' && celda > 20000
          ? serialAMes(celda)
          : textoAMes(celda);
        if (mes) encontrados.push(mes);
      }
      if (encontrados.length >= cuantos) return encontrados.slice(0, cuantos);
    }
  }
  // Sin `Tabla` usable: se numeran corridos desde el mes por defecto.
  return Array.from({ length: cuantos }, (_, i) => sumarMeses(MES_INICIO_POR_DEFECTO, i));
}

/** Localiza la fila de encabezados de una hoja de tarjeta. */
function localizarCabecera(filas) {
  for (let i = 0; i < Math.min(filas.length, 10); i += 1) {
    const fila = filas[i].map((c) => texto(c).toLowerCase());
    const cargo = fila.indexOf('cargo');
    if (cargo >= 0 && fila.includes('fecha') && fila.includes('cuenta')) {
      return { indice: i, columnas: fila, cargo };
    }
  }
  return null;
}

/** Nombre visible de la tarjeta: el rótulo que va sobre la tabla. */
function nombreTarjeta(filas, cabecera, hoja) {
  for (let i = Math.max(0, cabecera - 3); i < cabecera; i += 1) {
    const rotulo = (filas[i] || []).map(texto).find((c) => /banco/i.test(c));
    if (rotulo) return rotulo;
  }
  return hoja;
}

/**
 * Convierte el libro completo en la tabla de hechos.
 *
 * @param {Record<string, Array<Array<string|number>>>} libro  salida de leerLibro()
 * @returns {{meses: string[], registros: object[], tarjetas: object[],
 *            categorias: string[], usuarios: string[], movimientos: object[],
 *            total: number, avisos: string[]}}
 */
function analizar(libro) {
  const avisos = [];
  const registros = [];
  const movimientos = [];
  const tarjetas = [];
  let meses = null;

  for (const [hoja, filas] of Object.entries(libro)) {
    if (!Array.isArray(filas) || filas.length < 5) continue;
    const cab = localizarCabecera(filas);
    if (!cab) continue;

    const { indice, columnas, cargo } = cab;
    const colFecha = columnas.indexOf('fecha');
    const colDetalle = columnas.indexOf('detalle');
    const colProposito = columnas.indexOf('proposito');
    const colCuenta = columnas.indexOf('cuenta');

    // Los meses van desde la columna siguiente a "Cuenta" hasta el primer
    // encabezado de totales.
    const inicioMes = colCuenta + 1;
    let finMes = columnas.length;
    for (let c = inicioMes; c < columnas.length; c += 1) {
      if (/^(total|totales|monto)/.test(columnas[c])) { finMes = c; break; }
    }
    const nColumnasMes = finMes - inicioMes;
    if (nColumnasMes < 1) continue;

    if (!meses) meses = mesesDelLibro(libro, nColumnasMes);
    const mesesHoja = meses.slice(0, nColumnasMes);

    const id = hoja.replace(/\s+/g, '-').toUpperCase();
    const nombre = nombreTarjeta(filas, indice, hoja);
    let totalHoja = 0;
    let filasHoja = 0;

    for (let f = indice + 1; f < filas.length; f += 1) {
      const fila = filas[f];
      if (!fila) continue;
      const usuario = texto(fila[cargo]).toUpperCase();
      const detalle = texto(fila[colDetalle]);
      // Las filas de cierre llevan "TOTAL ACUMULADO …" en la columna de fecha.
      if (!['J', 'C'].includes(usuario) || !detalle) continue;
      if (/total/i.test(texto(fila[colFecha]))) continue;

      const categoria = texto(fila[colCuenta]) || 'Sin categoría';
      const proposito = colProposito >= 0 ? texto(fila[colProposito]) : '';
      const fecha = texto(fila[colFecha]);

      const cuotas = [];
      for (let c = 0; c < nColumnasMes; c += 1) {
        const monto = redondear(numero(fila[inicioMes + c]));
        if (Math.abs(monto) < 0.005) continue;
        cuotas.push({ mes: mesesHoja[c], monto });
        registros.push({
          tarjeta: id,
          tarjetaNombre: nombre,
          usuario,
          categoria,
          detalle,
          proposito,
          fecha,
          mes: mesesHoja[c],
          monto,
        });
        totalHoja += monto;
      }
      if (!cuotas.length) continue;
      filasHoja += 1;
      movimientos.push({
        tarjeta: id,
        tarjetaNombre: nombre,
        hoja,
        // Fila dentro de la hoja: distingue dos compras por lo demás idénticas.
        fila: f,
        usuario,
        categoria,
        detalle,
        proposito,
        fecha,
        cuotas: cuotas.length,
        mesInicio: cuotas[0].mes,
        // Cronograma real de la fila. Sin él habría que volver a emparejar los
        // registros por sus campos, y dos compras iguales el mismo día se
        // llevarían las cuotas de ambas.
        plan: cuotas,
        total: redondear(cuotas.reduce((s, c) => s + c.monto, 0)),
      });
    }

    if (filasHoja) {
      tarjetas.push({ id, nombre, hoja, total: redondear(totalHoja), movimientos: filasHoja });
    }
  }

  if (!tarjetas.length) {
    avisos.push('No se encontró ninguna hoja con las columnas Cargo / Fecha / Cuenta. '
      + '¿Es el archivo correcto?');
  }
  if (!libro.Tabla) {
    avisos.push(`El libro no trae la hoja «Tabla», así que los meses se cuentan `
      + `desde ${nombreMes(MES_INICIO_POR_DEFECTO)}.`);
  }

  const mesesConDato = [...new Set(registros.map((r) => r.mes))].sort();

  return {
    meses: mesesConDato,
    mesesLibro: meses || [],
    registros,
    movimientos,
    tarjetas: tarjetas.sort((a, b) => b.total - a.total),
    categorias: [...new Set(registros.map((r) => r.categoria))].sort((a, b) => a.localeCompare(b, 'es')),
    usuarios: [...new Set(registros.map((r) => r.usuario))].sort(),
    total: redondear(registros.reduce((s, r) => s + r.monto, 0)),
    avisos,
  };
}

// --- Agregaciones ------------------------------------------------------------

/** Filtra la tabla de hechos por los segmentadores activos. */
function filtrar(datos, { usuario, tarjeta, desde, hasta, categoria }) {
  return datos.registros.filter((r) => {
    if (usuario && usuario !== 'todos' && r.usuario !== usuario) return false;
    if (tarjeta && tarjeta !== 'todas' && r.tarjeta !== tarjeta) return false;
    if (categoria && categoria !== 'todas' && r.categoria !== categoria) return false;
    if (desde && r.mes < desde) return false;
    if (hasta && r.mes > hasta) return false;
    return true;
  });
}

/** Suma por mes de una dimensión: 'tarjeta' | 'usuario' | 'categoria'. */
function porMes(registros, meses, dimension) {
  const claves = [...new Set(registros.map((r) => r[dimension]))];
  const mapa = new Map(claves.map((k) => [k, Object.fromEntries(meses.map((m) => [m, 0]))]));
  for (const r of registros) {
    const fila = mapa.get(r[dimension]);
    if (fila && fila[r.mes] !== undefined) fila[r.mes] += r.monto;
  }
  return [...mapa.entries()]
    .map(([nombre, fila]) => ({
      nombre,
      valores: meses.map((m) => redondear(fila[m])),
      total: redondear(meses.reduce((s, m) => s + fila[m], 0)),
    }))
    .filter((s) => s.total !== 0)
    .sort((a, b) => b.total - a.total);
}

/** Convierte una serie mensual en su acumulado corrido. */
function acumular(valores) {
  let acc = 0;
  return valores.map((v) => { acc = redondear(acc + v); return acc; });
}

/** Total por una dimensión, de mayor a menor. */
function totalPor(registros, dimension) {
  const m = new Map();
  for (const r of registros) m.set(r[dimension], (m.get(r[dimension]) || 0) + r.monto);
  return [...m.entries()]
    .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
    .filter((x) => x.valor !== 0)
    .sort((a, b) => b.valor - a.valor);
}

/** Lista de meses entre dos claves, inclusive. */
function rangoMeses(desde, hasta) {
  const out = [];
  let m = desde;
  let guarda = 0;
  while (m <= hasta && guarda < 240) { out.push(m); m = sumarMeses(m, 1); guarda += 1; }
  return out;
}

return { acumular, analizar, filtrar, money, nombreMes, porMes, rangoMeses, redondear, sumarMeses, totalPor };
})();

M["importar_libro"] = (function () {
/**
 * Importa el libro de tarjetas original —el que se mantiene a mano, con una
 * hoja por tarjeta y las columnas de mes desplegadas a lo ancho— y lo convierte
 * en los gastos, cuotas e ingresos de la app.
 *
 * Es la misma conversión que hace `tools/migrar_excel.py`, pero dentro del
 * navegador para que se pueda hacer desde el celular.
 *
 * Los identificadores se derivan del contenido de cada fila, así que volver a
 * importar el mismo archivo actualiza lo que ya estaba en vez de duplicarlo.
 */

const {analizar, redondear} = M["libro_tarjetas"];
const TOLERANCIA = 0.02;   // centavos de holgura al comparar cuotas

/** Marca con la que se reconoce después lo que vino del libro. */
const NOTA_IMPORTADO = 'Importado del libro de tarjetas';

/** Hash corto y estable de un texto (FNV-1a) para construir identificadores. */
function huella(texto) {
  let h = 0x811c9dc5;
  for (let i = 0; i < texto.length; i += 1) {
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36).toUpperCase().padStart(7, '0');
}

/** Nombre de la hoja -> identificador de cuenta de la app. */
function idTarjeta(nombreHoja, cuentas) {
  const limpio = String(nombreHoja).toLowerCase();
  const porBanco = cuentas.find((c) => c.tipo === 'Tarjeta'
    && limpio.includes(String(c.banco || '').toLowerCase())
    && (limpio.includes(' a') === /adicional/i.test(c.nombre)));
  if (porBanco) return porBanco.id;
  const porNombre = cuentas.find((c) => c.tipo === 'Tarjeta'
    && limpio.includes(String(c.banco || '').toLowerCase()));
  return porNombre ? porNombre.id : `TC-${limpio.replace(/[^a-z0-9]+/g, '-').toUpperCase()}`;
}

/**
 * Deduce cómo se pagó un consumo a partir de en qué meses aparece:
 * un solo mes es corriente; meses seguidos con el mismo valor, diferido;
 * cualquier otra cosa (suscripciones, cargos variables) es recurrente.
 */
function deducirTipo(cuotas, meses) {
  if (cuotas.length === 1) return 'Corriente';
  const indices = cuotas.map((c) => meses.indexOf(c.mes));
  const seguidos = indices.every((v, i) => i === 0 || v === indices[i - 1] + 1);
  const montos = cuotas.map((c) => c.monto);
  const iguales = Math.max(...montos) - Math.min(...montos) <= TOLERANCIA;
  return seguidos && iguales ? 'Diferido' : 'Recurrente';
}

/** Ingresos de la hoja «Ingreso», si el libro la trae. */
function leerIngresos(libro, cuentaPorDefecto) {
  const filas = libro.Ingreso;
  if (!Array.isArray(filas)) return [];

  const out = [];
  for (const fila of filas) {
    if (!Array.isArray(fila)) continue;
    // Columnas: B fecha · C bruto · D descuentos
    const cruda = fila[1];
    const fecha = typeof cruda === 'number' && cruda > 20000
      ? new Date(Math.round((cruda - 25569) * 86400000)).toISOString().slice(0, 10)
      : (/^\d{4}-\d{2}-\d{2}/.exec(String(cruda || ''))?.[0] || null);
    if (!fecha) continue;

    const bruto = redondear(Number(fila[2]) || 0);
    const descuentos = redondear(Number(fila[3]) || 0);
    if (!bruto && !descuentos) continue;

    out.push({
      id: `I-${huella(`${fecha}|${bruto}|${descuentos}`)}`,
      fecha,
      mes: fecha.slice(0, 7),
      usuario: 'J',
      concepto: 'Sueldo',
      categoria: 'Sueldo',
      bruto,
      descuentos,
      neto: redondear(bruto - descuentos),
      cuenta: cuentaPorDefecto,
      notas: NOTA_IMPORTADO,
    });
  }
  return out;
}

/**
 * Convierte el libro en entidades de la app.
 *
 * @param {object} libro     salida de `leerLibro()`
 * @param {object[]} cuentas cuentas de la app, para emparejar las tarjetas
 * @returns {{gastosTarjeta: object[], cuotas: object[], ingresos: object[],
 *            categorias: string[], resumen: object, avisos: string[]}}
 */
function libroTarjetasAEntidades(libro, cuentas = []) {
  const datos = analizar(libro);
  if (!datos.registros.length) {
    throw new Error('No se encontró ninguna hoja de tarjeta con las columnas '
      + 'Cargo, Fecha, Detalle, Propósito y Cuenta. ¿Es el archivo correcto?');
  }

  const gastosTarjeta = [];
  const cuotas = [];
  const porTarjeta = {};

  for (const mov of datos.movimientos) {
    const tarjeta = idTarjeta(mov.tarjetaNombre || mov.tarjeta, cuentas);

    // El cronograma viene de la propia fila del Excel.
    const suyas = mov.plan;
    if (!suyas?.length) continue;

    const tipo = deducirTipo(suyas, datos.mesesLibro);
    const fecha = mov.fecha || `${suyas[0].mes}-01`;
    // La hoja y el número de fila entran en la huella para que dos compras
    // idénticas el mismo día sigan siendo dos, y para que reimportar el mismo
    // archivo dé exactamente los mismos identificadores.
    const id = `G-${huella([mov.hoja, mov.fila, tarjeta, mov.usuario, mov.detalle,
      mov.categoria, fecha, mov.total].join('|'))}`;

    gastosTarjeta.push({
      id,
      fecha,
      tarjeta,
      usuario: mov.usuario,
      detalle: mov.detalle,
      proposito: mov.proposito || '',
      categoria: mov.categoria,
      tipo,
      cuotas: suyas.length,
      monto_total: redondear(mov.total),
      tasa_interes: 0,
      mes_inicio: suyas[0].mes,
      notas: NOTA_IMPORTADO,
    });

    suyas.forEach((r, i) => cuotas.push({
      gasto_id: id,
      n_cuota: i + 1,
      mes: r.mes,
      monto: redondear(r.monto),
      tarjeta,
      usuario: mov.usuario,
      categoria: mov.categoria,
      pagado: '',
    }));

    porTarjeta[tarjeta] = redondear((porTarjeta[tarjeta] || 0) + mov.total);
  }

  const bancoPorDefecto = cuentas.find((c) => c.tipo === 'Banco')?.id || 'BCO-PICH';
  const ingresos = leerIngresos(libro, bancoPorDefecto);

  return {
    gastosTarjeta,
    cuotas,
    ingresos,
    categorias: datos.categorias,
    avisos: datos.avisos,
    resumen: {
      gastos: gastosTarjeta.length,
      cuotas: cuotas.length,
      ingresos: ingresos.length,
      total: redondear(cuotas.reduce((s, c) => s + c.monto, 0)),
      porTarjeta,
      meses: datos.meses,
      usuarios: datos.usuarios,
      porUsuario: Object.fromEntries(datos.usuarios.map((u) => [u, redondear(
        datos.registros.filter((r) => r.usuario === u).reduce((s, r) => s + r.monto, 0))])),
    },
  };
}

/** ¿Este libro tiene pinta de ser el de las tarjetas? */
function esLibroDeTarjetas(libro) {
  return Object.values(libro || {}).some((filas) => (
    Array.isArray(filas) && filas.slice(0, 10).some((f) => {
      if (!Array.isArray(f)) return false;
      const c = f.map((x) => String(x ?? '').trim().toLowerCase());
      return c.includes('cargo') && c.includes('fecha') && c.includes('cuenta');
    })
  ));
}

return { NOTA_IMPORTADO, esLibroDeTarjetas, libroTarjetasAEntidades };

M["archivo"] = (function () {
/**
 * Vínculo de la app con un archivo de Excel guardado en el computador.
 *
 * A diferencia del tablero, que solo lee, aquí el archivo es la base de datos:
 * la app lo lee al abrirse, adopta los cambios que se hayan hecho en Excel y
 * vuelca en él cada movimiento que se registra.
 *
 * Salvaguarda importante: solo se escribe sobre un libro con las hojas de la
 * app. El libro original de tarjetas (hojas anchas, fórmulas, dashboards)
 * nunca se sobrescribe; para eso está «Crear el archivo».
 *
 * Requiere la File System Access API: Chrome y Edge de escritorio.
 */

const {db, instantanea, reemplazar} = M["store"];
const {escribirLibro, leerLibro} = M["xlsx"];
const {construirLibro, libroADatos, esBaseDeLaApp} = M["esquema"];
const {fusionar} = M["sync"];
const BD = 'finanzas-archivo';
const ALMACEN = 'handles';
const CLAVE = 'libro';
const INTERVALO = 6000;

const enMarcoAjeno = (() => {
  try {
    return window.top !== window.self;
  } catch {
    return true;
  }
})();

/** Chrome bloquea el selector de archivos dentro de marcos de otro origen. */
const soportado = typeof window !== 'undefined'
  && typeof window.showOpenFilePicker === 'function'
  && !enMarcoAjeno;

const archivo = {
  vinculado: false,
  nombre: '',
  handle: null,
  ultimaLectura: null,
  ultimaEscritura: null,
  modificado: null,   // lastModified conocido; sirve para detectar ediciones
  ocupado: false,
  error: null,
};

const oyentes = new Set();
function alCambiarArchivo(fn) {
  oyentes.add(fn);
  return () => oyentes.delete(fn);
}
const avisar = () => oyentes.forEach((fn) => fn(archivo));

// --- Handle persistente ------------------------------------------------------

function abrirBD() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(BD, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(ALMACEN);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function conBD(modo, fn) {
  const bd = await abrirBD();
  const salida = await new Promise((resolve, reject) => {
    const tx = bd.transaction(ALMACEN, modo);
    const r = fn(tx.objectStore(ALMACEN));
    tx.oncomplete = () => resolve(r?.result ?? null);
    tx.onerror = () => reject(tx.error);
  });
  bd.close();
  return salida;
}

const guardarHandle = (h) => conBD('readwrite', (s) => s.put(h, CLAVE));
const leerHandle = () => conBD('readonly', (s) => s.get(CLAVE)).catch(() => null);
const borrarHandle = () => conBD('readwrite', (s) => s.delete(CLAVE));

async function permiso(handle, pedir = false) {
  if (!handle?.queryPermission) return true;
  const opciones = { mode: 'readwrite' };
  if (await handle.queryPermission(opciones) === 'granted') return true;
  if (!pedir) return false;
  return await handle.requestPermission(opciones) === 'granted';
}

// --- Lectura -----------------------------------------------------------------

/**
 * Lee el archivo y fusiona su contenido con lo que hay en la app.
 * Se usa la misma fusión por registro del sync entre teléfonos: nada se pierde
 * ni se duplica, y ante conflicto gana la versión con marca de tiempo mayor.
 */
async function adoptarDelArchivo({ silencioso = true } = {}) {
  const f = await archivo.handle.getFile();
  const libro = await leerLibro(await f.arrayBuffer());
  const { datos } = libroADatos(libro, db.config);

  reemplazar(fusionar(instantanea(), datos));
  archivo.modificado = f.lastModified;
  archivo.nombre = f.name;
  archivo.ultimaLectura = new Date();
  if (!silencioso) avisar();
  return datos;
}

// --- Escritura ---------------------------------------------------------------

let pendiente;
let escribiendo = false;

/** Vuelca la base completa en el archivo. */
async function escribir() {
  if (!archivo.vinculado || !archivo.handle || escribiendo) return false;
  escribiendo = true;
  archivo.ocupado = true;
  avisar();
  try {
    if (!await permiso(archivo.handle, false)) {
      archivo.error = 'permiso';
      return false;
    }
    const blob = escribirLibro(construirLibro());
    const flujo = await archivo.handle.createWritable();
    await flujo.write(blob);
    await flujo.close();

    // Se anota el lastModified propio para no confundir la escritura con una
    // edición hecha desde Excel.
    const f = await archivo.handle.getFile();
    archivo.modificado = f.lastModified;
    archivo.ultimaEscritura = new Date();
    archivo.error = null;
    return true;
  } catch (err) {
    console.error('No se pudo escribir el archivo', err);
    archivo.error = err.message;
    return false;
  } finally {
    escribiendo = false;
    archivo.ocupado = false;
    avisar();
  }
}

/** Agrupa las ráfagas de cambios en una sola escritura. */
function guardarDiferido() {
  if (!archivo.vinculado) return;
  clearTimeout(pendiente);
  pendiente = setTimeout(escribir, 1500);
}

// --- Alta del vínculo --------------------------------------------------------

function activar(handle, nombre) {
  archivo.handle = handle;
  archivo.nombre = nombre;
  archivo.vinculado = true;
  archivo.error = null;
  avisar();
}

/**
 * Vincula un archivo que ya existe. Si no tiene las hojas de la app, no se
 * vincula: así el libro original de tarjetas nunca queda expuesto a que la
 * app lo sobrescriba.
 */
async function vincularExistente() {
  const [handle] = await window.showOpenFilePicker({
    types: [{
      description: 'Base de datos de la app',
      accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] },
    }],
    multiple: false,
  });
  if (!await permiso(handle, true)) {
    throw new Error('Sin permiso de escritura sobre el archivo.');
  }

  const f = await handle.getFile();
  const libro = await leerLibro(await f.arrayBuffer());
  if (!esBaseDeLaApp(libro)) {
    throw new Error(`«${f.name}» no es una base de la app: le faltan las hojas `
      + 'Cuentas, Gastos_Tarjeta y Cuotas. Si es tu libro original de tarjetas, '
      + 'no lo vincules: usa «Crear el archivo» para generar la base y deja el '
      + 'original intacto.');
  }

  await guardarHandle(handle);
  activar(handle, f.name);
  await adoptarDelArchivo();
  avisar();
  return f.name;
}

/** Crea un archivo nuevo con la base actual y lo deja vinculado. */
async function crearYVincular() {
  const handle = await window.showSaveFilePicker({
    suggestedName: 'Finanzas_DB.xlsx',
    types: [{
      description: 'Libro de Excel',
      accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] },
    }],
  });
  if (!await permiso(handle, true)) {
    throw new Error('Sin permiso de escritura sobre el archivo.');
  }
  await guardarHandle(handle);
  activar(handle, handle.name);
  await escribir();
  return handle.name;
}

/**
 * Recupera el vínculo de sesiones anteriores.
 * @returns {Promise<'listo'|'permiso'|'ninguno'>}
 */
async function restaurar() {
  const handle = await leerHandle();
  if (!handle) return 'ninguno';
  activar(handle, handle.name);
  if (!await permiso(handle, false)) {
    archivo.error = 'permiso';
    avisar();
    return 'permiso';
  }
  await adoptarDelArchivo();
  avisar();
  return 'listo';
}

/** Vuelve a pedir permiso (necesita un gesto del usuario). */
async function reconectar() {
  if (!archivo.handle) return false;
  if (!await permiso(archivo.handle, true)) return false;
  archivo.error = null;
  await adoptarDelArchivo();
  avisar();
  return true;
}

async function desvincular() {
  detener();
  await borrarHandle();
  Object.assign(archivo, {
    vinculado: false, nombre: '', handle: null,
    ultimaLectura: null, ultimaEscritura: null, modificado: null, error: null,
  });
  avisar();
}

// --- Vigilancia de ediciones externas ----------------------------------------

let temporizador;

/**
 * Detecta que el archivo cambió desde fuera (alguien lo editó en Excel) y
 * adopta esos cambios.
 * @param {() => void} alAdoptar  se llama para repintar la vista
 */
function vigilar(alAdoptar) {
  detener();
  if (!archivo.vinculado) return;

  const mirar = async () => {
    if (document.visibilityState !== 'visible') return;
    if (!archivo.handle || archivo.ocupado || escribiendo) return;
    try {
      if (!await permiso(archivo.handle, false)) return;
      const f = await archivo.handle.getFile();
      if (f.lastModified === archivo.modificado) return;
      await adoptarDelArchivo({ silencioso: false });
      alAdoptar?.();
    } catch (err) {
      archivo.error = err.message;
      avisar();
    }
  };

  temporizador = setInterval(mirar, INTERVALO);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') mirar();
  });
}

function detener() {
  clearInterval(temporizador);
  clearTimeout(pendiente);
}

/** Texto de estado para la interfaz. */
function textoEstado() {
  if (!archivo.vinculado) return 'Sin archivo vinculado';
  if (archivo.error === 'permiso') return 'Toca «Reconectar» para volver a usar el archivo';
  if (archivo.error) return archivo.error;
  if (archivo.ocupado) return 'Guardando…';
  const hora = (archivo.ultimaEscritura || archivo.ultimaLectura)?.toLocaleTimeString(
    'es-EC', { hour: '2-digit', minute: '2-digit' });
  return hora ? `Sincronizado con el archivo · ${hora}` : 'Vinculado';
}

return { alCambiarArchivo, archivo, crearYVincular, desvincular, detener, enMarcoAjeno, escribir, guardarDiferido, reconectar, restaurar, soportado, textoEstado, vigilar, vincularExistente };
})();

M["forms"] = (function () {

 * Formularios de captura y corrección.

 * Cada `form*` abre un modal. Si recibe un registro existente lo precarga y

 * ingresado sin borrarlo y volver a escribirlo.
 *
 * Los campos de dinero van como texto con teclado decimal: `type="number"`
 * descarta la coma, que es el separador que se usa aquí. `modal()` normaliza
 * coma y punto al enviar.
 */

const {db, guardar, nuevoId, upsert, tocar, cuentasBancarias, tarjetas, categoriasGasto, categoriasIngreso, usuarios} = M["store"];
const {claveMes, mesActual, money, planificarCuotas, calcularPoliza, sumarDias, redondear, nombreMes, sumarMeses, mesDeFacturacion, textoCorte} = M["calc"];
const {modal, opciones, brindis, hoyISO, esc, $, aNumero, campoMonto} = M["ui"];
const selUsuarios = (sel) => opciones(usuarios(), sel);
const val = (form, sel) => aNumero($(sel, form).value);

/** Lista de meses seleccionables: 12 atrás y 24 adelante desde hoy. */
function mesesSeleccionables() {
  const base = sumarMeses(mesActual(), -12);
  return Array.from({ length: 37 }, (_, i) => {
    const m = sumarMeses(base, i);
    return { valor: m, texto: nombreMes(m) };
  });
}

/** Formato de edición: sin separador de miles, con coma decimal. */
const paraEditar = (n) => (n === undefined || n === null || n === ''
  ? '' : String(redondear(n)).replace('.', ','));

      const ajustarMes = () => {

        preview.innerHTML = `

      })));

        : `Gasto registrado · ${money(plan.totalPagado)} en ${n} ${n === 1 ? 'pago' : 'cuotas'}`);
      alTerminar?.();
    },
  });
}

    </div>

    </div>

    etiqueta: 'Capital a invertir', valor: paraEditar(g?.capital), requerido: true,
  })}

  })}
    </div>
    <div class="filtros">
      <div class="campo"><label for="p-plazo">Plazo (días)</label>

        </select></div>
    </div>
    <div class="filtros">
      <div class="campo"><label for="p-origen">Sale de</label>
        <select id="p-origen" name="cuenta_origen">
          ${opciones(cuentas.map((c) => ({ valor: c.id, texto: c.nombre })), g?.cuenta_origen)}
        </select></div>
      <div class="campo"><label for="p-destino">Regresa a</label>
        <select id="p-destino" name="cuenta_destino">
          ${opciones(cuentas.map((c) => ({ valor: c.id, texto: c.nombre })), g?.cuenta_destino)}
        </select></div>
    </div>
    <div class="filtros">
      <label class="campo" style="flex-direction:row;align-items:center;gap:8px">
        <input type="checkbox" name="retencion_on" style="width:auto;min-height:auto"
               ${conRetencion ? 'checked' : ''}>
        <span>Descontar 2 % de retención en la fuente</span>
      </label>
      <label class="campo" style="flex-direction:row;align-items:center;gap:8px">
        <input type="checkbox" name="compuesto" style="width:auto;min-height:auto"
               ${g?.renovable === 'Si' ? 'checked' : ''}>
        <span>Capitalizar (interés compuesto)</span>
      </label>
    </div>
    <div class="previsualizacion" id="p-preview"></div>`;

  const calcular = (form) => calcularPoliza({
    capital: val(form, '#p-capital'),
    tasaAnual: val(form, '#p-tasa'),
    plazoDias: Number($('#p-plazo', form).value) || 0,
    base: Number($('#p-base', form).value) || 360,
    compuesto: form.compuesto.checked,
    retencion: form.retencion_on.checked

  });

  modal({
    titulo: g ? 'Corregir inversión' : 'Nueva inversión / póliza',

      form.addEventListener('input', refrescar);
      form.addEventListener('change', refrescar);
      refrescar();

      const plazo = Number(d.plazo_dias);
      const r = calcular(form);
      upsert('inversiones', {
        id: g?.id || nuevoId('inversiones'),
        fecha_inicio: d.fecha_inicio,
        usuario: d.usuario,
        institucion: d.institucion.trim(),
        tipo: d.tipo,
        capital,
        tasa_anual: aNumero(d.tasa_anual),
        plazo_dias: plazo,
        base: Number(d.base),
        fecha_vencimiento: sumarDias(d.fecha_inicio, plazo),
        interes_bruto: r.interesBruto,
        retencion: r.retencion,
        interes_neto: r.interesNeto,
        valor_final: r.valorFinal,
        estado: g?.estado || 'Activa',
        cuenta_origen: d.cuenta_origen,
        cuenta_destino: d.cuenta_destino,
        renovable: form.compuesto.checked ? 'Si' : 'No',
        notas: g?.notas || '',
      });
      brindis(g ? 'Inversión corregida'
        : `Inversión registrada · vence ${sumarDias(d.fecha_inicio, plazo)}`);
      alTerminar?.();
    },
  });
}

/**
 * Paga el consumo de una tarjeta en un mes: marca sus cuotas como pagadas
 * (libera cupo) y deja el movimiento en la cuenta de origen.
 */
function formPagoTarjeta(tarjetaId, mes, monto, alTerminar) {
  const cuentas = cuentasBancarias();
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const cuerpo = `
    <p>Pago de <strong>${esc(tarjeta?.nombre || tarjetaId)}</strong> ·
       ${esc(nombreMes(mes))}</p>
    <div class="filtros">
      <div class="campo"><label for="pt-fecha">Fecha del pago</label>
        <input id="pt-fecha" name="fecha" type="date" value="${hoyISO()}" required></div>
      ${campoMonto('pt-monto', 'monto', {
    etiqueta: 'Monto pagado', valor: paraEditar(monto), requerido: true,
  })}
    </div>
    <div class="campo ancho"><label for="pt-cuenta">Se paga desde</label>
      <select id="pt-cuenta" name="cuenta_origen" required>
        ${opciones(cuentas.map((c) => ({ valor: c.id, texto: c.nombre })))}
      </select></div>
    <div class="previsualizacion">
      Al confirmar, las cuotas de ${esc(nombreMes(mes))} quedan marcadas como pagadas
      y ese monto se libera del cupo disponible.
    </div>`;

  modal({
    titulo: 'Registrar pago de tarjeta',
    cuerpo,
    aceptar: 'Confirmar pago',
    alEnviar(d) {
      db.cuotas.forEach((c) => {
        if (c.tarjeta === tarjetaId && c.mes === mes) tocar(Object.assign(c, { pagado: 'Si' }));
      });
      db.movimientos.push(tocar({
        id: nuevoId('movimientos'),
        fecha: d.fecha,
        tipo: 'Pago de tarjeta',
        cuenta_origen: d.cuenta_origen,
        cuenta_destino: tarjetaId,
        monto: redondear(aNumero(d.monto)),
        descripcion: `Pago ${tarjeta?.nombre || tarjetaId} — ${nombreMes(mes)}`,
        ref_id: `${tarjetaId}:${mes}`,
      }));
      guardar();
      brindis(`Pago registrado · ${money(aNumero(d.monto))}`);
      alTerminar?.();
    },
  });
}

/** Liquida una póliza vencida: acredita el valor final en la cuenta destino. */
function liquidarInversion(id, alTerminar) {
  const p = db.inversiones.find((x) => x.id === id);
  if (!p) return;
  tocar(Object.assign(p, { estado: 'Liquidada' }));
  db.movimientos.push(tocar({
    id: nuevoId('movimientos'),
    fecha: p.fecha_vencimiento,
    tipo: 'Rendimiento de inversión',
    cuenta_origen: '',
    cuenta_destino: p.cuenta_destino,
    monto: 0, // el capital y el interés ya se reflejan vía la póliza liquidada
    descripcion: `Vencimiento ${p.institucion} — capital ${money(p.capital)} + interés ${money(p.interes_neto)}`,
    ref_id: p.id,
  }));
  guardar();
  brindis(`Póliza liquidada · ${money(p.valor_final)} acreditados`);
  alTerminar?.();
}

return { formGastoEfectivo, formGastoTarjeta, formIngreso, formInversion, formMovimiento, formPagoTarjeta, liquidarInversion };
})();

M["views/resumen"] = (function () {
/** Vista «Resumen»: la foto del mes en curso y del acumulado histórico. */

const {db, tarjetas} = M["store"];
const {mesActual, nombreMes, money, moneyHTML, sumarMeses, rangoMeses, estadoTarjeta, pagoDelMes, ingresoDelMes, totalPorCategoria, serieMensual, acumuladoHistorico, totalAhorrado, totalInvertido, deudaTotalTarjetas, patrimonioNeto, redondear, diasEntre} = M["calc"];
const {dona, columnas, medidor, alRedimensionar} = M["charts"];
const {crear, esc, $, segmentado} = M["ui"];
let usuarioFiltro = 'ambos';

function render(raiz, { irA }) {
  const mes = mesActual();
  const meses12 = rangoMeses(sumarMeses(mes, -11), mes);
  const filtros = { usuario: usuarioFiltro };

  const ingreso = ingresoDelMes(mes, usuarioFiltro);
  const gastoMes = redondear(serieMensual([mes], filtros)[0].gasto);
  const balance = redondear(ingreso - gastoMes);
  const mesPrevio = sumarMeses(mes, -1);
  const gastoPrevio = redondear(serieMensual([mesPrevio], filtros)[0].gasto);
  const variacion = gastoPrevio > 0 ? ((gastoMes - gastoPrevio) / gastoPrevio) * 100 : 0;

  const hist = acumuladoHistorico(filtros);
  const ahorro = totalAhorrado();
  const invertido = totalInvertido();
  const deuda = deudaTotalTarjetas();

  raiz.innerHTML = `
    <section class="panel">
      <div class="panel-cab">
        <div>
          <span class="etiqueta">Gasto de ${esc(nombreMes(mes))}</span>
          <span class="cifra">${moneyHTML(gastoMes)}</span>
          <span class="nota">
            ${gastoPrevio > 0
    ? `${variacion >= 0 ? '▲' : '▼'} ${Math.abs(variacion).toFixed(1)} % frente a ${esc(nombreMes(mesPrevio, true))}`
    : 'Sin mes anterior para comparar'}
          </span>
        </div>
        <div id="seg-usuario"></div>
      </div>
      <div class="panel-datos">
        <div><div class="etq">Ingresos</div><div class="val">${money(ingreso)}</div></div>
        <div><div class="etq">Balance</div><div class="val">${money(balance)}</div></div>
        <div><div class="etq">A pagar en tarjetas</div>
          <div class="val">${money(tarjetas().reduce((s, t) => s + pagoDelMes(t.id, mes, usuarioFiltro), 0))}</div></div>
      </div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Cupos de las tarjetas</h2><span class="pista">Saldo pendiente</span></header>
        <div id="cupos"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Patrimonio</h2><span class="pista">Hoy</span></header>
        <div class="rejilla kpis">
          <div class="kpi"><div class="etq">En cuentas</div>
            <div class="valor">${money(ahorro)}</div></div>
          <div class="kpi"><div class="etq">Invertido</div>
            <div class="valor">${money(invertido)}</div></div>
          <div class="kpi"><div class="etq">Deuda tarjetas</div>
            <div class="valor">${money(deuda)}</div></div>
          <div class="kpi"><div class="etq">Patrimonio neto</div>
            <div class="valor">${money(patrimonioNeto())}</div>
            <div class="delta">Ahorro + inversión − deuda</div></div>
        </div>
      </div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Gasto por categoría</h2><span class="pista">${esc(nombreMes(mes))}</span></header>
        <div id="g-dona"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Ingresos vs. gastos</h2><span class="pista">Últimos 12 meses</span></header>
        <div id="g-barras"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Acumulado de todos los registros</h2>
        <button class="btn pequeno" data-ir="anual">Ver año completo</button></header>
      <div class="rejilla kpis">
        <div class="kpi"><div class="etq">Ingresos</div>
          <div class="valor">${money(hist.ingresos)}</div>
          <div class="delta">${hist.meses.length} meses con registros</div></div>
        <div class="kpi"><div class="etq">Gastos</div>
          <div class="valor">${money(hist.gastos)}</div></div>
        <div class="kpi"><div class="etq">Balance</div>
          <div class="valor">${money(hist.balance)}</div>
          <div class="delta ${hist.balance >= 0 ? 'bien' : 'mal'}">
            ${hist.balance >= 0 ? 'Superávit' : 'Déficit'}</div></div>
      </div>
    </section>

    <section class="tarjeta" id="proximos"></section>`;

  // Filtro J / C / ambos
  $('#seg-usuario', raiz).appendChild(segmentado(
    [{ valor: 'ambos', texto: 'Ambos' }, { valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' }],
    usuarioFiltro,
    (v) => { usuarioFiltro = v; render(raiz, { irA }); },
  ));

  // Cupos
  const cupos = $('#cupos', raiz);
  tarjetas().forEach((t) => {
    const est = estadoTarjeta(t.id);
    const caja = crear('<div style="margin-bottom:12px"></div>');
    const detalle = Object.entries(est.porUsuario)
      .map(([u, v]) => `<span class="chip ${u.toLowerCase()}">${esc(u)}: ${money(v)}</span>`)

    medidor(caja.querySelector('.medidor-host'), {
      usado: est.utilizado, total: est.cupo, etiqueta: 'Disponible ' + money(est.disponible),
    });
    cupos.appendChild(caja);
  });

  const pintarGraficos = () => {
    dona($('#g-dona', raiz), totalPorCategoria([mes], filtros), { titulo: 'Gasto del mes' });
    const serie = serieMensual(meses12, filtros);
    columnas($('#g-barras', raiz), meses12.map((m) => nombreMes(m, true)), [
      { nombre: 'Ingresos', valores: serie.map((s) => s.ingreso) },
      { nombre: 'Gastos', valores: serie.map((s) => s.gasto) },
    ]);
  };
  pintarGraficos();
  alRedimensionar(pintarGraficos);

  // Próximos vencimientos e hitos
  $('#proximos', raiz).innerHTML = seccionProximos(mes);

  raiz.querySelectorAll('[data-ir]').forEach((b) => {
    b.addEventListener('click', () => irA(b.dataset.ir));
  });
}

function seccionProximos(mes) {
  const filas = [];

  tarjetas().forEach((t) => {
    const monto = pagoDelMes(t.id, mes, 'ambos');
    if (monto > 0) {
      filas.push({
        titulo: `Pago ${t.nombre}`,
        meta: `${nombreMes(mes)}${t.dia_pago ? ` · vence el día ${t.dia_pago}` : ''}`,
        monto: -monto,
      });
    }
  });

  const hoy = new Date().toISOString().slice(0, 10);
  db.inversiones
    .filter((p) => p.estado === 'Activa')
    .sort((a, b) => String(a.fecha_vencimiento).localeCompare(String(b.fecha_vencimiento)))
    .slice(0, 4)
    .forEach((p) => {
      const dias = diasEntre(hoy, p.fecha_vencimiento);
      filas.push({
        titulo: `Vence póliza ${p.institucion}`,
        meta: `${p.fecha_vencimiento} · ${dias >= 0 ? `en ${dias} días` : `venció hace ${-dias} días`}`,
        monto: Number(p.valor_final) || 0,
      });
    });

  if (!filas.length) {
    return '<header><h2>Próximos movimientos</h2></header><p class="vacio">Nada pendiente por ahora.</p>';
  }
  return `<header><h2>Próximos movimientos</h2></header>
    <ul class="lista">${filas.map((f) => `
      <li>
        <div class="principal">
          <div class="titulo">${esc(f.titulo)}</div>
          <div class="meta">${esc(f.meta)}</div>
        </div>
        <div class="monto ${f.monto < 0 ? 'neg' : 'pos'}">${money(Math.abs(f.monto))}</div>
      </li>`).join('')}</ul>`;
}

return { render };
})();

M["views/mensual"] = (function () {
/**
 * Vista «Mensual»: la tabla de categorías × meses con filtros por usuario,
 * tarjeta y rango de meses. Es también la vista-tabla que respalda los
 * gráficos (requisito de accesibilidad: los valores nunca dependen del color).
 */

const {tarjetas, categoriasGasto} = M["store"];
const {mesActual, nombreMes, money, sumarMeses, rangoMeses, mesesConDatos, matrizCategoriaMes, totalPorCategoria, totalPorUsuario, serieMensual, presupuestoVsReal} = M["calc"];
const {dona, barrasHorizontales, columnas, alRedimensionar} = M["charts"];
const {esc, $, opciones, segmentado} = M["ui"];
const estado = {
  usuario: 'ambos',
  tarjeta: 'todas',
  categoria: 'todas',
  desde: null,
  hasta: null,
  origen: 'todo', // todo | tarjeta | efectivo
};

function inicializarRango() {
  const conDatos = mesesConDatos();
  const ultimo = conDatos[conDatos.length - 1] || mesActual();
  // Por defecto se muestra el semestre que termina en el mes en curso: los
  // meses futuros existen (cuotas por venir) pero no son la vista natural.
  const hasta = estado.hasta || (ultimo > mesActual() ? mesActual() : ultimo);
  const desde = estado.desde || sumarMeses(hasta, -5);
  estado.desde = desde < conDatos[0] ? conDatos[0] : desde;
  estado.hasta = hasta;
}

function render(raiz) {
  inicializarRango();
  if (estado.desde > estado.hasta) estado.desde = estado.hasta;

  const meses = rangoMeses(estado.desde, estado.hasta);
  const filtros = {
    usuario: estado.usuario,
    tarjeta: estado.tarjeta,
    categorias: estado.categoria === 'todas' ? [] : [estado.categoria],
    incluirTarjeta: estado.origen !== 'efectivo',
    incluirEfectivo: estado.origen !== 'tarjeta',
  };

  const matriz = matrizCategoriaMes(meses, filtros);
  const serie = serieMensual(meses, filtros);
  const opcionesMes = mesesConDatos().map((m) => ({ valor: m, texto: nombreMes(m) }));

  raiz.innerHTML = `
    <section class="tarjeta">
      <header>
        <h2>Filtros</h2>
        <span class="pista">${meses.length} ${meses.length === 1 ? 'mes' : 'meses'}</span>
      </header>
      <div class="filtros">
        <div class="campo"><label for="f-desde">Desde</label>
          <select id="f-desde">${opciones(opcionesMes, estado.desde)}</select></div>
        <div class="campo"><label for="f-hasta">Hasta</label>
          <select id="f-hasta">${opciones(opcionesMes, estado.hasta)}</select></div>
        <div class="campo"><label for="f-tarjeta">Tarjeta</label>
          <select id="f-tarjeta">
            <option value="todas">Todas</option>
            ${opciones(tarjetas().map((t) => ({ valor: t.id, texto: t.nombre })), estado.tarjeta)}
          </select></div>
        <div class="campo"><label for="f-categoria">Categoría</label>
          <select id="f-categoria">
            <option value="todas">Todas</option>
            ${opciones(categoriasGasto(), estado.categoria)}
          </select></div>
      </div>
      <div class="filtros">
        <div class="campo" style="flex:0 0 auto"><label>Usuario</label><div id="seg-usuario"></div></div>
        <div class="campo" style="flex:0 0 auto"><label>Forma de pago</label><div id="seg-origen"></div></div>
        <div class="campo" style="flex:0 0 auto;justify-content:flex-end">
          <button class="btn pequeno" id="btn-reset">Restablecer</button></div>
      </div>
    </section>

    <section class="rejilla kpis">
      <div class="kpi"><div class="etq">Gasto</div>
        <div class="valor">${money(matriz.granTotal)}</div></div>
      <div class="kpi"><div class="etq">Promedio/mes</div>
        <div class="valor">${money(meses.length ? matriz.granTotal / meses.length : 0)}</div></div>
      <div class="kpi"><div class="etq">Ingresos</div>
        <div class="valor">${money(serie.reduce((s, x) => s + x.ingreso, 0))}</div></div>
      <div class="kpi"><div class="etq">Balance</div>
        <div class="valor">${money(serie.reduce((s, x) => s + x.balance, 0))}</div></div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Reparto por categoría</h2><span class="pista">Periodo filtrado</span></header>
        <div id="g-dona"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Evolución mensual</h2><span class="pista">Ingresos vs. gastos</span></header>
        <div id="g-col"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header>
        <h2>Categorías por mes</h2>
        <button class="btn pequeno" id="btn-csv">Exportar CSV</button>
      </header>
      <div class="tabla-scroll">${tablaHTML(matriz)}</div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Ranking de gasto</h2><span class="pista">Top 10</span></header>
        <div id="g-rank"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Reparto J / C</h2><span class="pista">Periodo filtrado</span></header>
        <div id="g-usuarios"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Presupuesto vs. real</h2>
        <span class="pista">${esc(nombreMes(estado.hasta))}</span></header>
      <div class="tabla-scroll" id="tabla-ppto"></div>
    </section>`;

  // --- Controles ---
  const recargar = () => render(raiz);
  $('#f-desde', raiz).addEventListener('change', (e) => { estado.desde = e.target.value; recargar(); });
  $('#f-hasta', raiz).addEventListener('change', (e) => { estado.hasta = e.target.value; recargar(); });
  $('#f-tarjeta', raiz).addEventListener('change', (e) => { estado.tarjeta = e.target.value; recargar(); });
  $('#f-categoria', raiz).addEventListener('change', (e) => { estado.categoria = e.target.value; recargar(); });
  $('#btn-reset', raiz).addEventListener('click', () => {
    Object.assign(estado, {
      usuario: 'ambos', tarjeta: 'todas', categoria: 'todas',
      desde: null, hasta: null, origen: 'todo',
    });
    recargar();
  });

  $('#seg-usuario', raiz).appendChild(segmentado(
    [{ valor: 'ambos', texto: 'Ambos' }, { valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' }],
    estado.usuario, (v) => { estado.usuario = v; recargar(); },
  ));
  $('#seg-origen', raiz).appendChild(segmentado(
    [{ valor: 'todo', texto: 'Todo' }, { valor: 'tarjeta', texto: 'Tarjeta' },
      { valor: 'efectivo', texto: 'Efectivo' }],
    estado.origen, (v) => { estado.origen = v; recargar(); },
  ));

  $('#btn-csv', raiz).addEventListener('click', () => exportarCSV(matriz));

  // --- Gráficos ---
  const pintar = () => {
    dona($('#g-dona', raiz), totalPorCategoria(meses, filtros), { titulo: 'Periodo' });
    columnas($('#g-col', raiz), meses.map((m) => nombreMes(m, true)), [
      { nombre: 'Ingresos', valores: serie.map((s) => s.ingreso) },
      { nombre: 'Gastos', valores: serie.map((s) => s.gasto) },
    ]);
    barrasHorizontales($('#g-rank', raiz), totalPorCategoria(meses, filtros));
    dona($('#g-usuarios', raiz), totalPorUsuario(meses, filtros), { titulo: 'J y C' });
  };
  pintar();
  alRedimensionar(pintar);

  // --- Presupuesto ---
  const ppto = presupuestoVsReal(estado.hasta, { ...filtros, usuario: estado.usuario });
  $('#tabla-ppto', raiz).innerHTML = ppto.length ? `
    <table>
      <thead><tr><th>Categoría</th><th>Presupuesto</th><th>Real</th><th>Diferencia</th><th>Uso</th></tr></thead>
      <tbody>${ppto.map((p) => `
        <tr>
          <td>${esc(p.categoria)}</td>
          <td>${money(p.presupuesto)}</td>
          <td>${money(p.real)}</td>
          <td style="color:${p.diferencia < 0 ? 'var(--critico)' : 'var(--ok-texto)'}">
            ${money(p.diferencia)}</td>
          <td>${p.uso.toFixed(0)} %</td>
        </tr>`).join('')}</tbody>
    </table>` : '<p class="vacio">Define presupuestos por categoría en la pestaña Datos.</p>';
}

function tablaHTML(matriz) {
  if (!matriz.filas.length) return '<p class="vacio">Sin gastos en el periodo seleccionado.</p>';
  const cab = matriz.meses.map((m) => `<th>${esc(nombreMes(m, true))}</th>`).join('');
  const cuerpo = matriz.filas.map((f) => `
    <tr>
      <td>${esc(f.categoria)}</td>
      ${f.valores.map((v) => `<td class="${v ? '' : 'cero'}">${v ? money(v) : '—'}</td>`).join('')}
      <td><strong>${money(f.total)}</strong></td>
    </tr>`).join('');
  const pie = matriz.totales.map((v) => `<td>${money(v)}</td>`).join('');
  return `
    <table>
      <thead><tr><th>Categoría</th>${cab}<th>Total</th></tr></thead>
      <tbody>${cuerpo}</tbody>
      <tfoot><tr><td>TOTAL</td>${pie}<td>${money(matriz.granTotal)}</td></tr></tfoot>
    </table>`;
}

function exportarCSV(matriz) {
  const filas = [
    ['Categoría', ...matriz.meses, 'Total'],
    ...matriz.filas.map((f) => [f.categoria, ...f.valores, f.total]),
    ['TOTAL', ...matriz.totales, matriz.granTotal],
  ];
  const csv = filas.map((f) => f.map((c) => (
    typeof c === 'string' && /[",;\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c
  )).join(',')).join('\n');

  const url = URL.createObjectURL(new Blob([`﻿${csv}`], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `gastos_${matriz.meses[0]}_a_${matriz.meses[matriz.meses.length - 1]}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

return { render };
})();

const {tarjetas} = M["store"];
const {nombreMes, money, moneyHTML, matrizCategoriaMes, totalPorCategoria, serieMensual, añosDisponibles, redondear, totalPorUsuario} = M["calc"];
const {columnas, columnasApiladas, linea, dona, barrasHorizontales, plegarOtros, alRedimensionar} = M["charts"];

  const mesesConGasto = serie.filter((s) => s.gasto > 0).length;
  const mayor = serie.slice().sort((a, b) => b.gasto - a.gasto)[0];

  let accI = 0;
  let accG = 0;
  const acumulado = serie.map((s) => {

    // Apilado: solo las categorías con color propio; el resto ya viene plegado.

        <div id="g-meses"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Categorías del mes</h2><span class="pista">${esc(nombreMes(mes))}</span></header>

      </div>

    <section class="tarjeta">
      <header><h2>Movimientos de ${esc(nombreMes(mes))}</h2>
        <span class="pista">Lo que compone los ${money(pago)}</span></header>
      <div id="movs"></div>
    </section>`;

  // Controles
  $('#seg-tarjeta', raiz).appendChild(segmentado(
    // Cabe poco en el segmentado del teléfono: «TC Pichincha Adicional» se
    // queda en «Adicional», que ya la distingue de la principal.
    lista.map((x) => ({
      valor: x.id,
      texto: /adicional/i.test(x.nombre) ? 'Adicional' : x.nombre.replace(/^TC /, ''),
    })),
    estado.tarjeta, (v) => { estado.tarjeta = v; render(raiz); },
  ));
  $('#seg-usuario', raiz).appendChild(segmentado(
    [{ valor: 'ambos', texto: 'Ambos' }, { valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' }],
    estado.usuario, (v) => { estado.usuario = v; render(raiz); },
  ));
  $('#sel-mes', raiz).addEventListener('change', (e) => { estado.mes = e.target.value; render(raiz); });
  $('#btn-nuevo', raiz).addEventListener('click', () => formGastoTarjeta(() => render(raiz)));
  $('#btn-pagar', raiz).addEventListener('click', () => {
    formPagoTarjeta(t.id, mes, pagoTotal, () => render(raiz));
  });

  // En el panel las cifras ya están debajo: la barra va sola.
  medidor($('#cupo', raiz), { usado: est.utilizado, total: est.cupo, sinPie: true });

  const pintar = () => {
    columnas($('#g-meses', raiz), meses12.map((m) => nombreMes(m, true)), [
      { nombre: 'A pagar', valores: meses12.map((m) => pagoDelMes(t.id, m, estado.usuario)) },
    ], { alto: 220 });

    const porCat = new Map();
    db.cuotas
      .filter((c) => c.tarjeta === t.id && c.mes === mes
        && (estado.usuario === 'ambos' || c.usuario === estado.usuario))
      .forEach((c) => porCat.set(c.categoria, (porCat.get(c.categoria) || 0) + c.monto));
    dona($('#g-dona', raiz), [...porCat.entries()]
      .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
      .sort((a, b) => b.valor - a.valor), { titulo: nombreMes(mes, true) });
  };
  pintar();
  alRedimensionar(pintar);

  $('#diferidos', raiz).innerHTML = listaDiferidos(t.id, estado.usuario);
  $('#movs', raiz).innerHTML = listaMovimientos(t.id, mes, estado.usuario);

  $$('[data-corregir]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const gasto = db.gastosTarjeta.find((g) => g.id === btn.dataset.corregir);
      if (gasto) formGastoTarjeta(() => render(raiz), gasto);
    });
  });

  $$('[data-borrar]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const gasto = db.gastosTarjeta.find((g) => g.id === btn.dataset.borrar);
      confirmar(`¿Eliminar «${gasto?.detalle || btn.dataset.borrar}» y todas sus cuotas?`, () => {
        eliminar('gastosTarjeta', btn.dataset.borrar);
        render(raiz);
      });
    });
  });
}

function sumaPorTipo(tarjetaId, mes, usuario, tipo) {
  return redondear(db.cuotas
    .filter((c) => c.tarjeta === tarjetaId && c.mes === mes)
    .filter((c) => usuario === 'ambos' || c.usuario === usuario)
    .filter((c) => db.gastosTarjeta.find((g) => g.id === c.gasto_id)?.tipo === tipo)
    .reduce((s, c) => s + c.monto, 0));
}

function listaDiferidos(tarjetaId, usuario) {
  const filas = diferidosVigentes()
    .filter((d) => d.gasto.tarjeta === tarjetaId)
    .filter((d) => usuario === 'ambos' || d.gasto.usuario === usuario)
    // De la compra más reciente a la más antigua. `diferidosVigentes` los
    // devuelve ordenados por lo que falta por pagar, que sirve para otras
    // cosas pero aquí no dice nada: lo que se busca es «qué compré último».
    .sort((a, b) => String(b.gasto.fecha).localeCompare(String(a.gasto.fecha)));

  if (!filas.length) return '<p class="vacio">No hay diferidos con cuotas pendientes.</p>';

  return `<ul class="lista">${filas.map((d) => {
    const pagadas = d.gasto.cuotas - d.cuotasRestantes;
    return `
    <li class="detallada">
      <div class="principal">
        <div class="titulo">${esc(d.gasto.detalle)}
          <span class="chip ${esc(d.gasto.usuario.toLowerCase())}">${esc(d.gasto.usuario)}</span></div>
        <div class="meta">${esc(d.gasto.fecha)} · ${esc(d.gasto.categoria)} ·
          cuota ${pagadas + 1} de ${d.gasto.cuotas}</div>
        <div class="cifras">
          <span>Cuota <strong>${money(d.proxima.monto)}</strong></span>
          <span>Total <strong>${money(d.gasto.monto_total)}</strong></span>
          <span>Próxima <strong>${esc(nombreMes(d.proxima.mes, true))}</strong></span>
        </div>
      </div>
      <div class="monto neg">${money(d.restante)}<span class="pie">por pagar</span></div>
    </li>`;
  }).join('')}</ul>
    <div class="aviso"><span class="icono">Σ</span>
      <span>Falta por pagar <strong>${money(filas.reduce((s, d) => s + d.restante, 0))}</strong>
      en ${filas.length} ${filas.length === 1 ? 'compra diferida' : 'compras diferidas'}.</span></div>`;
}

function listaMovimientos(tarjetaId, mes, usuario) {
  const filas = db.cuotas
    .filter((c) => c.tarjeta === tarjetaId && c.mes === mes)
    .filter((c) => usuario === 'ambos' || c.usuario === usuario)
    .map((c) => ({ cuota: c, gasto: db.gastosTarjeta.find((g) => g.id === c.gasto_id) }))
    .filter((x) => x.gasto)
    .sort((a, b) => String(b.gasto.fecha).localeCompare(String(a.gasto.fecha)));

  if (!filas.length) return '<p class="vacio">Sin movimientos en este mes.</p>';

  // El total va al pie para que el detalle cuadre a la vista con la cifra
  // grande del panel: es la comprobación que se hace contra el Excel.
  const total = redondear(filas.reduce((s, x) => s + x.cuota.monto, 0));

  return `<ul class="lista">${filas.map(({ cuota, gasto }) => {
    const esCuota = gasto.cuotas > 1;
    const pendiente = cuotaPendiente(cuota);
    return `
      <li class="con-acciones">
        <div class="principal">
          <div class="titulo">${esc(gasto.detalle)}
            <span class="chip ${esc(gasto.usuario.toLowerCase())}">${esc(gasto.usuario)}</span></div>
          <div class="meta">${esc(gasto.fecha)} · ${esc(gasto.categoria)}
            ${esCuota ? ` · cuota ${cuota.n_cuota}/${gasto.cuotas} de ${money(gasto.monto_total)}` : ''}
            ${pendiente ? '' : ' · pagada'}</div>
        </div>
        <div class="monto">${money(cuota.monto)}</div>
        <div class="acciones">
          <button class="btn pequeno" data-corregir="${esc(gasto.id)}">Corregir</button>
          <button class="btn pequeno peligro" data-borrar="${esc(gasto.id)}">Eliminar</button>
        </div>
      </li>`;
  }).join('')}</ul>
    <div class="aviso"><span class="icono">Σ</span>
      <span>${filas.length} ${filas.length === 1 ? 'movimiento' : 'movimientos'} en el mes ·
      total <strong>${money(total)}</strong>.</span></div>`;
}

return { render };
})();

M["views/inversiones"] = (function () {
/** Vista «Inversiones»: pólizas activas, calculadora y rendimientos. */

const {db, eliminar, cuenta} = M["store"];
const {money, moneyHTML, calcularPoliza, sumarDias, diasEntre, redondear, nombreMes, claveMes, totalInvertido, rendimientoProyectado} = M["calc"];
const {dona, barrasHorizontales, alRedimensionar} = M["charts"];
const {aNumero, esc, $, $$, confirmar, hoyISO} = M["ui"];
const {formInversion, liquidarInversion} = M["forms"];
function render(raiz) {
  const hoy = hoyISO();
  const activas = db.inversiones.filter((p) => p.estado === 'Activa');
  const liquidadas = db.inversiones.filter((p) => p.estado === 'Liquidada');
  const vencidas = activas.filter((p) => p.fecha_vencimiento <= hoy);

  const capital = totalInvertido();
  const interes = rendimientoProyectado();
  const ganado = redondear(liquidadas.reduce((s, p) => s + (Number(p.interes_neto) || 0), 0));

  raiz.innerHTML = `
    <section class="panel">
      <div class="panel-cab">
        <div>
          <span class="etiqueta">Capital invertido</span>
          <span class="cifra">${moneyHTML(capital)}</span>
          <span class="nota">${activas.length} ${activas.length === 1 ? 'póliza activa' : 'pólizas activas'}</span>
        </div>
        <button class="btn primario pequeno" id="btn-nueva">+ Inversión</button>
      </div>
      <div class="panel-datos">
        <div><div class="etq">Interés por cobrar</div><div class="val">${money(interes)}</div></div>
        <div><div class="etq">Al vencimiento</div><div class="val">${money(redondear(capital + interes))}</div></div>
        <div><div class="etq">Ya cobrado</div><div class="val">${money(ganado)}</div></div>
      </div>
    </section>
    ${vencidas.length ? `
      <div class="aviso alerta"><span class="icono">⏰</span>
        <span><strong>${vencidas.length} ${vencidas.length === 1 ? 'póliza venció' : 'pólizas vencieron'}.</strong>
        Liquídalas para que el capital y el interés entren a la cuenta.</span></div>` : ''}

    <section class="tarjeta">
      <header><h2>Calculadora de póliza</h2>
        <span class="pista">Simula antes de invertir</span></header>
      <div class="filtros">
        <div class="campo"><label for="c-capital">Capital</label>
          <input id="c-capital" type="text" value="5000" inputmode="decimal"></div>
        <div class="campo"><label for="c-tasa">Tasa anual %</label>
          <input id="c-tasa" type="text" value="7.5" inputmode="decimal"></div>
        <div class="campo"><label for="c-plazo">Plazo (días)</label>
          <input id="c-plazo" type="number" step="1" min="1" value="360" inputmode="numeric"></div>
        <div class="campo"><label for="c-base">Base</label>
          <select id="c-base"><option value="360">360</option><option value="365">365</option></select></div>
      </div>
      <div class="filtros">
        <label class="campo" style="flex-direction:row;align-items:center;gap:8px">
          <input type="checkbox" id="c-ret" checked style="width:auto;min-height:auto">
          <span>Retención 2 %</span></label>
        <label class="campo" style="flex-direction:row;align-items:center;gap:8px">
          <input type="checkbox" id="c-comp" style="width:auto;min-height:auto">
          <span>Interés compuesto</span></label>
      </div>
      <div class="previsualizacion" id="c-res"></div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Reparto por institución</h2><span class="pista">Capital activo</span></header>
        <div id="g-inst"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Interés esperado</h2><span class="pista">Por póliza</span></header>
        <div id="g-int"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Pólizas activas</h2><span class="pista">Ordenadas por vencimiento</span></header>
      <div id="lista-activas"></div>
    </section>

    <section class="tarjeta">
      <header><h2>Historial</h2><span class="pista">Pólizas liquidadas</span></header>
      <div id="lista-hist"></div>
    </section>`;

  $('#btn-nueva', raiz).addEventListener('click', () => formInversion(() => render(raiz)));

  // --- Calculadora ---
  const calcular = () => {
    const r = calcularPoliza({
      capital: aNumero($('#c-capital', raiz).value) || 0,
      tasaAnual: aNumero($('#c-tasa', raiz).value) || 0,
      plazoDias: Number($('#c-plazo', raiz).value) || 0,
      base: Number($('#c-base', raiz).value) || 360,
      compuesto: $('#c-comp', raiz).checked,
      retencion: $('#c-ret', raiz).checked
        ? Number(db.config.retencion_fuente_polizas) || 0.02 : 0,
    });
    const capitalSim = aNumero($('#c-capital', raiz).value) || 0;
    $('#c-res', raiz).innerHTML = `
      <div>Interés bruto <strong>${money(r.interesBruto)}</strong>
        ${r.retencion ? `· retención −${money(r.retencion)}` : ''}
        · interés neto <strong>${money(r.interesNeto)}</strong></div>
      <div>Al vencimiento recibes <strong>${money(r.valorFinal)}</strong>
        <span class="solo-lectura">(${r.rendimientoEfectivo.toFixed(2)} % sobre ${money(capitalSim)})</span></div>
      <div class="solo-lectura">Vence el ${sumarDias(hoyISO(), Number($('#c-plazo', raiz).value) || 0)}</div>`;
  };
  $$('#c-capital, #c-tasa, #c-plazo, #c-base, #c-ret, #c-comp', raiz)
    .forEach((n) => n.addEventListener('input', calcular));
  calcular();

  // --- Gráficos ---
  const pintar = () => {
    const porInst = new Map();
    activas.forEach((p) => porInst.set(p.institucion,
      (porInst.get(p.institucion) || 0) + (Number(p.capital) || 0)));
    dona($('#g-inst', raiz), [...porInst.entries()]
      .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
      .sort((a, b) => b.valor - a.valor), { titulo: 'Invertido' });

    barrasHorizontales($('#g-int', raiz), activas
      .map((p) => ({ nombre: `${p.institucion} · ${p.fecha_vencimiento}`, valor: Number(p.interes_neto) || 0 }))
      .sort((a, b) => b.valor - a.valor));
  };
  pintar();
  alRedimensionar(pintar);

  // --- Listas ---
  $('#lista-activas', raiz).innerHTML = activas.length ? `<ul class="lista">${activas
    .slice()
    .sort((a, b) => String(a.fecha_vencimiento).localeCompare(String(b.fecha_vencimiento)))
    .map((p) => {
      const dias = diasEntre(hoy, p.fecha_vencimiento);
      const vencida = dias <= 0;
      return `
        <li>
          <div class="principal">
            <div class="titulo">${esc(p.institucion)}
              <span class="chip ${esc(String(p.usuario || '').toLowerCase())}">${esc(p.usuario || '')}</span></div>
            <div class="meta">${money(p.capital)} al ${Number(p.tasa_anual).toFixed(2)} % ·
              ${p.plazo_dias} días · vence ${esc(p.fecha_vencimiento)}
              ${vencida ? ' · <strong>vencida</strong>' : ` · faltan ${dias} días`}
              · a ${esc(cuenta(p.cuenta_destino)?.nombre || p.cuenta_destino)}</div>
          </div>
          <div class="monto pos">${money(p.valor_final)}</div>
          <button class="btn pequeno" data-corregir="${esc(p.id)}">Corregir</button>
          <button class="btn pequeno" data-liquidar="${esc(p.id)}">Liquidar</button>
          <button class="btn pequeno peligro" data-borrar="${esc(p.id)}" aria-label="Eliminar">✕</button>
        </li>`;
    }).join('')}</ul>` : '<p class="vacio">Aún no registras inversiones. Usa «+ Inversión» para la primera.</p>';

  $('#lista-hist', raiz).innerHTML = liquidadas.length ? `<ul class="lista">${liquidadas
    .slice()
    .sort((a, b) => String(b.fecha_vencimiento).localeCompare(String(a.fecha_vencimiento)))
    .map((p) => `
      <li>
        <div class="principal">
          <div class="titulo">${esc(p.institucion)}</div>
          <div class="meta">${esc(nombreMes(claveMes(p.fecha_vencimiento)))} ·
            capital ${money(p.capital)} · interés ${money(p.interes_neto)}</div>
        </div>
        <div class="monto pos">${money(p.valor_final)}</div>
      </li>`).join('')}</ul>` : '<p class="vacio">Sin pólizas liquidadas todavía.</p>';

  $$('[data-corregir]', raiz).forEach((b) => b.addEventListener('click', () => {
    const p = db.inversiones.find((x) => x.id === b.dataset.corregir);
    if (p) formInversion(() => render(raiz), p);
  }));

  $$('[data-liquidar]', raiz).forEach((b) => b.addEventListener('click', () => {
    const p = db.inversiones.find((x) => x.id === b.dataset.liquidar);
    confirmar(
      `¿Acreditar ${money(p.valor_final)} en ${cuenta(p.cuenta_destino)?.nombre || p.cuenta_destino}?`,
      () => liquidarInversion(b.dataset.liquidar, () => render(raiz)),
      { aceptar: 'Liquidar' },
    );
  }));
  $$('[data-borrar]', raiz).forEach((b) => b.addEventListener('click', () => {
    confirmar('¿Eliminar esta inversión del registro?', () => {
      eliminar('inversiones', b.dataset.borrar);
      render(raiz);
    });
  }));
}

return { render };
})();

/** Ingreso neto acumulado del año en curso. */
function ingresosDelAnio() {
  const anio = mesActual().slice(0, 4);
  return redondear(db.ingresos
    .filter((i) => String(i.mes || claveMes(i.fecha)).startsWith(anio))
    .reduce((s, i) => s + (Number(i.neto) || 0), 0));
}

/** Salidas de dinero de un mes (efectivo + movimientos salientes). */
function salidasDelMes(mes) {
  const ef = db.gastosEfectivo
    .filter((g) => claveMes(g.fecha) === mes)
    .reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const mv = db.movimientos
    .filter((m) => claveMes(m.fecha) === mes && m.cuenta_origen && !m.cuenta_destino)
    .reduce((s, m) => s + (Number(m.monto) || 0), 0);
  const pagos = db.movimientos
    .filter((m) => claveMes(m.fecha) === mes && m.tipo === 'Pago de tarjeta')
    .reduce((s, m) => s + (Number(m.monto) || 0), 0);
  return redondear(ef + mv + pagos);
}

function listaSimple(filas, mapear, vacio) {
  if (!filas.length) return `<p class="vacio">${esc(vacio)}</p>`;
  return `<ul class="lista">${filas.map((f) => {
    const v = mapear(f);
    return `

}

/**
 * Importa un .xlsx. Acepta dos formatos:
 *  - la base de la app (hojas Cuentas, Gastos_Tarjeta, Cuotas…), que reemplaza;
 *  - el libro de tarjetas original, que se convierte y se puede añadir.
 */
async function importarExcel(alTerminar) {
  const archivo = await pedirArchivo('.xlsx,.xlsm');
  if (!archivo) return;

  let libro;
  try {
    libro = await leerLibro(await archivo.arrayBuffer());
  } catch (err) {
    return avisoError('No se pudo abrir el archivo', err.message);
  }

  // Primero la base propia; si no lo es, se intenta como libro de tarjetas.
  try {
    const { datos, resumen } = libroADatos(libro, db.config);
    return confirmar(
      `Se importarán → ${resumen.join(' · ')}. Esto reemplaza los datos actuales de la app.`,
      () => { reemplazar(datos); brindis('Datos importados'); alTerminar?.(); },
      { aceptar: 'Importar y reemplazar' },
    );
  } catch {
    // No era la base de la app: se sigue con el otro formato.
  }

  if (!esLibroDeTarjetas(libro)) {
    return avisoError('Formato no reconocido',
      'El archivo no es ni la base de la app ni el libro de tarjetas. '
      + 'Debe tener hojas con las columnas Cargo, Fecha, Detalle, Propósito y Cuenta.');
  }

  let conv;
  try {
    conv = libroTarjetasAEntidades(libro, db.cuentas);
  } catch (err) {
    return avisoError('No se pudo interpretar el libro', err.message);
  }
  return revisarImportacion(conv, archivo.name, alTerminar);
}

/** Marca con la que se reconoce lo que vino del libro de tarjetas. */
/** Vuelca las entidades convertidas en la base. */
function aplicarImportacion(conv, modo) {
  if (modo === 'reemplazar') {
    // Solo se retira lo que vino de una importación anterior: los gastos
    // escritos a mano en la app se conservan.
    const fuera = new Set(db.gastosTarjeta
      .filter((g) => g.notas === NOTA)
      .map((g) => g.id));
    const ahora = Date.now();
    db.gastosTarjeta
      .filter((g) => fuera.has(g.id))
      .forEach((g) => db.borrados.push({ c: 'gastosTarjeta', k: g.id, t: ahora }));
    db.cuotas
      .filter((c) => fuera.has(c.gasto_id))
      .forEach((c) => db.borrados.push({ c: 'cuotas', k: `${c.gasto_id}#${c.n_cuota}`, t: ahora }));

    db.gastosTarjeta = db.gastosTarjeta.filter((g) => !fuera.has(g.id));
    db.cuotas = db.cuotas.filter((c) => !fuera.has(c.gasto_id));
  }

  const fusionar = (coleccion, filas) => {
    const clave = CLAVES[coleccion];
    const indice = new Map(db[coleccion].map((f) => [clave(f), f]));
    for (const fila of filas) {
      const k = clave(fila);
      const previo = indice.get(k);
      if (previo) Object.assign(previo, fila, { _ts: Date.now() });
      else {
        const nueva = tocar({ ...fila });
        db[coleccion].push(nueva);
        indice.set(k, nueva);
      }
    }
  };

  fusionar('gastosTarjeta', conv.gastosTarjeta);
  fusionar('cuotas', conv.cuotas);
  if (conv.ingresos.length) fusionar('ingresos', conv.ingresos);

  // Categorías que el libro trae y la app todavía no conoce.
  for (const nombre of conv.categorias) {
    if (!db.categorias.some((c) => c.nombre === nombre)) {
      db.categorias.push({
        nombre, grupo: 'Otros', tipo: 'Gasto', presupuesto: 0, activa: 'Si',
      });
    }
  }
  guardar();
}

        <li>Los datos viven en este navegador. Si cambias de teléfono, exporta el
            respaldo y restáuralo en el nuevo.</li>

            siguientes; el cupo se libera a medida que registras los pagos.</li>
        <li>El <strong>cupo utilizado</strong> es la suma de cuotas pendientes del mes actual

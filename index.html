M["views/plan"] = (function () {
/**
 * Vista «Plan»: el presupuesto que la app arma sola.
 *
 * Mira el historial, saca qué gastos se repiten y cada cuánto, y con eso
 * rellena los meses que no han pasado. Lo que se ve por mes es lo real ya
 * comprometido más lo previsto, y la suma de los dos es el presupuesto.
 */

const {db, guardar, categoriasGasto, cuentasBancarias, upsert, nuevoId} = M["store"];
const {nombreMes, money, moneyHTML, redondear, mesActual, sumarMeses, rangoMeses, serieMensual, textoFecha} = M["calc"];
const {columnasApiladas, alRedimensionar} = M["charts"];
const {esc, $, $$, segmentado, modal, brindis, aNumero, campoMonto, opciones} = M["ui"];
const {MEDIOS, recurrencias, proyeccion, mesesProyectados, estaExcluida, guardarAjuste, guardarManual, borrarManual, marcarPago} = M["plan"];
/*
 * `quien` arranca en J: el presupuesto es una herramienta de decisión personal
 * y mezclar dos bolsillos daba una cifra que no es de nadie. Se puede cambiar
 * en cualquier momento, y la elección se recuerda mientras dure la sesión.
 */
const estado = { horizonte: 6, mesAbierto: null, quien: 'J' };

function render(raiz) {
  const meses = mesesProyectados(estado.horizonte);
  const plan = proyeccion(meses, { quien: estado.quien });
  const todas = recurrencias(estado.quien);
  const mes = mesActual();
  const primero = plan.filas[0];

  // Con qué comparar: lo que de verdad se gastó en los meses ya cerrados.
  // Filtrado por la misma persona: comparar el presupuesto de J contra el gasto
  // de los dos daba un «68 % por debajo del promedio» que no significaba nada.
  const previos = rangoMeses(sumarMeses(mes, -3), sumarMeses(mes, -1));
  const realPrevio = serieMensual(previos, {
    usuario: estado.quien === 'Ambos' ? 'ambos' : estado.quien,
  });
  const promedio = realPrevio.length
    ? redondear(realPrevio.reduce((s, x) => s + x.gasto, 0) / realPrevio.length) : 0;

  /*
   * Sin historial la app no deduce nada, pero escribir un gasto a mano tiene que
   * seguir siendo posible: es justo el caso de un préstamo recién estrenado, que
   * no tiene pasado del que deducirlo. Así que el botón de añadir va también aquí.
   */
  if (!todas.length) {
    raiz.innerHTML = `
      <section class="panel">
        <span class="etiqueta">Presupuesto de ${esc(estado.quien === 'Ambos' ? 'los dos' : estado.quien)}</span>
        <span class="cifra">${moneyHTML(0)}</span>
        <span class="nota">Todavía no hay historial suficiente.</span>
      </section>
      <div class="barra-accion"><div id="seg-quien"></div></div>
      <div class="barra-accion">
        <span class="pista crece">Puedes escribir tú mismo un gasto que ya sabes
          que viene: una cuota, una suscripción, un préstamo.</span>
        <button class="btn primario pequeno" id="btn-fijo">+ Añadir gasto</button>
      </div>
      <p class="vacio">Para reconocer un gasto que se repite solo, hacen falta al
        menos tres apariciones suyas. Sigue registrando y esta pantalla se irá
        llenando sola.</p>`;
    $('#seg-quien', raiz).appendChild(segmentado(
      [{ valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' },
        { valor: 'Ambos', texto: 'Ambos' }],
      estado.quien,
      (v) => { estado.quien = v; render(raiz); },
    ));
    $('#btn-fijo', raiz).addEventListener('click', () => formFijo(null, () => render(raiz)));
    return;
  }

  const fiables = todas.filter((r) => r.fiable && r.vigente && !estaExcluida(r.clave));
  const descartadas = todas.filter((r) => r.fiable && r.vigente && estaExcluida(r.clave));
  const caducadas = todas.filter((r) => r.fiable && !r.vigente);
  const irregulares = todas.filter((r) => !r.fiable);

  /*
   * Los periódicos se parten en dos, que no son lo mismo aunque los dos
   * vuelvan cada mes: el FIJO cobra siempre igual —el gimnasio, $30 clavados—
   * y se puede dar por sabido; el VARIABLE vuelve seguro pero por lo que toque
   * —la gasolina—, y de ese solo cabe estimar. Lo que se compra una vez y no
   * vuelve no está en ninguna de las dos: eso es el gasto real y se apunta
   * como siempre.
   */
  const suma = (lista) => redondear(lista.reduce((t, r) => t + r.porMes, 0));

  // Para los totales de arriba da igual de dónde salga cada gasto.
  const totalFijos = suma(fiables.filter((r) => r.tipo === 'Fijo'));
  const totalVariables = suma(fiables.filter((r) => r.tipo !== 'Fijo'));

  /*
   * Lo escrito a mano va en su propia caja, y la primera. Mezclado entre lo
   * deducido se perdía: hacía falta buscar la etiqueta «a mano» gasto por gasto
   * para saber cuál había escrito uno. Aquí se ve de un vistazo qué se metió a
   * mano, cuánto suma y dónde tocar para añadir otro.
   */
  const mios = fiables.filter((r) => r.manual);
  const fijos = fiables.filter((r) => !r.manual && r.tipo === 'Fijo');
  const variables = fiables.filter((r) => !r.manual && r.tipo !== 'Fijo');

  raiz.innerHTML = `
    <section class="panel">
      <span class="etiqueta">${esc(nombreMes(primero.mes))} · ${
  esc(estado.quien === 'Ambos' ? 'J y C' : estado.quien)}</span>
      <span class="cifra">${moneyHTML(primero.simulado)}</span>
      <span class="nota">Lo ya comprometido más lo que suele repetirse</span>
      <div class="chips-panel">
        <span class="chip-panel">Comprometido ${money(primero.comprometido)}</span>
        <span class="chip-panel">Previsto ${money(primero.previsto)}</span>
        ${promedio > 0 ? `
          <span class="chip-panel ${primero.simulado <= promedio ? 'bien' : 'mal'}">
            ${primero.simulado <= promedio ? '↘' : '↗'}
            ${Math.abs(((primero.simulado - promedio) / promedio) * 100).toFixed(0)} %
            vs. promedio</span>` : ''}
      </div>
      <div class="panel-datos">
        <div><div class="etq">Fijos al mes</div>
          <div class="val">${money(totalFijos)}</div></div>
        <div><div class="etq">Variables al mes</div>
          <div class="val">${money(totalVariables)}</div></div>
        <div><div class="etq">Promedio real previo</div>
          <div class="val">${money(promedio)}</div></div>
      </div>
    </section>

    <div class="barra-accion">
      <div id="seg-quien"></div>
      <span class="pista" style="white-space:nowrap">${fiables.length} periódicos</span>
    </div>

    <div class="barra-accion">
      <div id="seg-horizonte"></div>
    </div>

    <section class="tarjeta">
      <header><h2>Simulación mes a mes</h2>
        <span class="pista">Por bolsillo · lo apuntado más lo previsto</span></header>
      <div class="aviso"><span class="icono">i</span>
        <span class="crece">Solo se proyecta lo que se repite con un ritmo
        reconocible. Lo que se compra una vez y no vuelve no entra, así que esta
        cifra es un piso, no un techo: el gasto real de los últimos meses
        promedia ${money(promedio)}.</span></div>
      <div id="g-plan"></div>
      ${tablaMeses(plan.filas, {
    grupo: 'sim',
    celda: (f) => f.medios,
    total: (f) => f.simulado,
    totales: plan.totales.medios,
    granTotal: plan.totales.simulado,
  })}
    </section>

    <section class="tarjeta">
      <header><h2>Solo lo real</h2>
        <span class="pista">Sin estimar nada · lo que ya está registrado</span></header>
      <div class="aviso"><span class="icono">i</span>
        <span class="crece">Aquí no hay ni una cifra supuesta: el efectivo ya
        gastado, las cuotas de tarjeta de compras ya hechas y las cuotas de
        préstamo. Aunque venzan meses adelante, esos importes están firmados,
        no estimados. La última columna va acumulando. Tócale a un mes para ver
        de qué se compone.</span></div>
      ${tablaMeses(plan.filas, {
    grupo: 'real',
    celda: (f) => f.reales,
    total: (f) => f.real,
    totales: plan.totales.reales,
    granTotal: plan.totales.real,
    acumulado: true,
  })}
    </section>

    <section class="tarjeta">
      <header><h2>Los que escribo yo</h2>
        <span class="pista">${mios.length
    ? `${money(suma(mios))} al mes · ${mios.length} ${mios.length === 1 ? 'gasto' : 'gastos'}`
    : 'Todavía ninguno'}</span></header>
      ${mios.length ? listaRecurrencias(mios, false) : `
        <p class="vacio">Aquí van los gastos que sabes que vienen aunque no estén
          en el historial: una cuota de préstamo, un curso diferido, una
          suscripción que acabas de contratar. Entran en la previsión de cada mes
          igual que los que la app deduce sola.</p>`}
      <div class="barra-accion">
        <span class="pista crece">Se escribe el concepto, el importe y cómo se
          paga: efectivo, tarjeta o préstamo.</span>
        <button class="btn primario pequeno" id="btn-fijo">+ Añadir gasto</button>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Fijos que deduce la app</h2>
        <span class="pista">${money(suma(fijos))} al mes · importe conocido</span></header>
      ${listaRecurrencias(fijos, false)}
    </section>

    <section class="tarjeta">
      <header><h2>Variables que se repiten</h2>
        <span class="pista">${money(suma(variables))} al mes · importe estimado</span></header>
      ${listaRecurrencias(variables, false)}
    </section>

    ${descartadas.length ? `
      <section class="tarjeta">
        <header><h2>Fuera del presupuesto</h2>
          <span class="pista">Tócalos para devolverlos</span></header>
        ${listaRecurrencias(descartadas, true)}
      </section>` : ''}

    ${caducadas.length ? `
      <section class="tarjeta">
        <header><h2>Parece que ya no se repiten</h2>
          <span class="pista">Sin aparecer desde hace demasiado</span></header>
        ${listaRecurrencias(caducadas, null)}
      </section>` : ''}

    ${irregulares.length ? `
      <section class="tarjeta">
        <header><h2>Se repiten sin ritmo fijo</h2>
          <span class="pista">No entran en la previsión</span></header>
        ${listaRecurrencias(irregulares, null)}
      </section>` : ''}`;

  $('#seg-quien', raiz).appendChild(segmentado(
    [{ valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' },
      { valor: 'Ambos', texto: 'Ambos' }],
    estado.quien,
    (v) => { estado.quien = v; render(raiz); },
  ));

  $('#seg-horizonte', raiz).appendChild(segmentado(
    [{ valor: 3, texto: '3 meses' }, { valor: 6, texto: '6 meses' }, { valor: 12, texto: '12 meses' }],
    estado.horizonte,
    (v) => { estado.horizonte = Number(v); render(raiz); },
  ));

  const pintar = () => {
    columnasApiladas($('#g-plan', raiz), meses.map((m) => nombreMes(m, true)), [
      { nombre: 'Comprometido', valores: plan.filas.map((f) => f.comprometido) },
      { nombre: 'Previsto', valores: plan.filas.map((f) => f.previsto) },
    ], { alto: 240 });
  };
  pintar();
  alRedimensionar(pintar);

  // Desplegar un mes para ver de qué se compone: en la tabla simulada, lo
  // previsto; en la real, los gastos concretos que ya están apuntados.
  $$('.desplegable', raiz).forEach((fila) => {
    const abrir = () => {
      const m = fila.dataset.mes;
      const grupo = fila.dataset.grupo;
      const det = $(`[data-detalle="${CSS.escape(`${grupo}:${m}`)}"]`, raiz);
      const abierta = fila.getAttribute('aria-expanded') === 'true';
      const datos = plan.filas.find((f) => f.mes === m);
      if (!abierta && !det.dataset.pintado) {
        det.firstElementChild.innerHTML = `<div class="caja-desglose">${
          grupo === 'real' ? detalleReal(datos) : detalleMes(datos)}</div>`;
        det.dataset.pintado = 'si';
      }
      const caja = det.querySelector('.caja-desglose');
      // El ancho se mide en la tabla a la que pertenece la fila, no en la
      // primera de la pantalla: con dos tablas ya no son la misma.
      const scroll = fila.closest('.tabla-scroll');
      if (caja && scroll) caja.style.width = `${Math.max(240, scroll.clientWidth - 32)}px`;
      det.hidden = abierta;
      fila.setAttribute('aria-expanded', String(!abierta));
    };
    fila.addEventListener('click', abrir);
    fila.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); }
    });
  });

  const recargar = () => render(raiz);
  $('#btn-fijo', raiz).addEventListener('click', () => formFijo(null, recargar));
  $$('[data-editar]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const r = todas.find((x) => x.clave === btn.dataset.editar);
      if (r) formFijo(r, recargar);
    });
  });

  // Dentro / fuera del presupuesto.
  $$('[data-pagar]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const r = recurrencias().find((x) => x.clave === btn.dataset.pagar);
      if (r) formPagar(r, recargar);
    });
  });

  $$('[data-alternar]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const clave = btn.dataset.alternar;
      guardarAjuste(clave, { activo: estaExcluida(clave) });
      db.config[`plan_no_${clave}`] = '';
      guardar();
      render(raiz);
    });
  });
}

/**
 * La tabla de meses por bolsillo. Se dibuja dos veces con los mismos huesos:
 * una con lo simulado —lo apuntado más lo que la app supone— y otra con lo
 * real pelado. El `grupo` separa las filas desplegables de las dos, que si no
 * comparten el `data-mes` y abrir un mes en una abriría el de la otra.
 */
function tablaMeses(filas, {
  grupo, celda, total, totales, granTotal, acumulado = false,
}) {
  const columnas = MEDIOS.length + 2 + (acumulado ? 1 : 0);
  return `
    <div class="tabla-scroll">
      <table>
        <thead><tr><th>Mes</th>${MEDIOS.map((m) => `<th>${m}</th>`).join('')}
          <th>Total</th>${acumulado ? '<th>Acumulado</th>' : ''}</tr></thead>
        <tbody>${filas.map((f) => `
          <tr class="desplegable" data-grupo="${grupo}" data-mes="${esc(f.mes)}"
              aria-expanded="false" tabindex="0">
            <td><span class="flecha" aria-hidden="true">›</span>${esc(nombreMes(f.mes))}</td>
            ${MEDIOS.map((m) => `<td class="${celda(f)[m] ? '' : 'cero'}">${
  celda(f)[m] ? money(celda(f)[m]) : '—'}</td>`).join('')}
            <td><strong>${money(total(f))}</strong></td>
            ${acumulado ? `<td class="acumulado">${money(f.acumulado)}</td>` : ''}
          </tr>
          <tr class="detalle" data-detalle="${grupo}:${esc(f.mes)}" hidden>
            <td colspan="${columnas}"></td></tr>`).join('')}
        </tbody>
        <tfoot><tr>
          <td>TOTAL</td>
          ${MEDIOS.map((m) => `<td>${money(totales[m])}</td>`).join('')}
          <td>${money(granTotal)}</td>
          ${acumulado ? `<td class="acumulado">${money(granTotal)}</td>` : ''}
        </tr></tfoot>
      </table>
    </div>`;
}

function listaRecurrencias(filas, fuera) {
  if (!filas.length) return '<p class="vacio">Nada por aquí.</p>';

  return `<ul class="lista">${filas.map((r) => `
    <li class="detallada con-acciones">
      <div class="principal">
        <div class="titulo">${esc(r.detalle)}
          ${r.manual ? '<span class="chip">a mano</span>' : ''}
          ${r.ajustado && !r.manual ? '<span class="chip">corregido</span>' : ''}</div>
        <div class="meta">${esc(r.cadenciaTexto)}${r.manual ? '' : ` · ${r.veces} veces · ${
  r.diasDesde >= 0
    ? `última hace ${r.diasDesde} días`
    // Un cargo recurrente ya tiene cuotas apuntadas por delante: decir que
    // la última fue «hace -98 días» no lo entiende nadie.
    : `apuntado hasta ${esc(nombreMes(r.ultima.slice(0, 7)))}`}`}</div>
        ${r.sitios?.length ? `<div class="meta sitios">En: ${
  esc(r.sitios.slice(0, 3).map((x) => x.nombre).join(' · '))}${
  r.sitios.length > 3 ? ` y ${r.sitios.length - 3} más` : ''}</div>` : ''}
        ${r.clase === 'plazos' ? '' : `
          <div class="cifras">
            <span>${r.tipo === 'Fijo' ? 'Cobra' : 'Suele ser'}
              <strong>${money(r.monto)}</strong></span>
            ${r.mensual
    ? `<span>Al mes <strong>${money(r.porMes)}</strong></span>`
    : `<span>Próxima <strong>${esc(textoFecha(r.proxima))}</strong></span>`}
          </div>`}
      </div>
      <div class="monto">${money(r.porMes)}<span class="pie">al mes</span></div>
      ${r.clase === 'plazos' ? contadorPlazos(r) : ''}
      ${fuera === null ? '' : `
        <div class="acciones">
          ${r.manual ? `<button class="btn pequeno${
  (r.pagos || []).includes(mesActual()) ? '' : ' primario'}" data-pagar="${esc(r.clave)}">
            ${(r.pagos || []).includes(mesActual()) ? 'Pagado ✓' : 'Pagar'}</button>` : ''}
          <button class="btn pequeno" data-editar="${esc(r.clave)}">Editar</button>
          <button class="btn pequeno${fuera ? ' primario' : ''}" data-alternar="${esc(r.clave)}">
            ${fuera ? 'Devolver' : 'Dejar fuera'}</button>
        </div>`}
    </li>`).join('')}</ul>`;
}

/**
 * Desglose de lo REAL de un mes: los gastos concretos que lo componen, con su
 * importe y de qué bolsillo salen. Sin esto la tabla dice «$1.132,09 en
 * tarjeta» y no hay manera de saber de qué.
 */
function detalleReal(fila) {
  if (!fila) return '';
  if (!fila.realLineas.length) {
    return `<p class="vacio">Todavía no hay nada registrado en
      ${esc(nombreMes(fila.mes))}.</p>`;
  }
  return `<ul class="desglose">${fila.realLineas.map((l) => `
    <li>
      <div class="principal">
        <div class="titulo">${esc(l.detalle)}</div>
        <div class="meta">${esc(l.medio)}${l.nota ? ` · ${esc(l.nota)}` : ''}${
  l.fecha ? ` · ${esc(textoFecha(l.fecha))}` : ''}</div>
      </div>
      <div class="monto">${money(l.monto)}</div>
    </li>`).join('')}
    </ul>
    <div class="pie-desglose">${fila.realLineas.length}
      ${fila.realLineas.length === 1 ? 'gasto' : 'gastos'} ·
      <strong>${money(fila.real)}</strong></div>`;
}

/**
 * Contador de un gasto a plazos: por qué cuota va, cuánto lleva pagado y
 * cuánto le queda.
 *
 * Un préstamo a diez años son 120 cobros iguales, y de un vistazo no se
 * distingue el mes 8 del mes 80: lo único que cambia es cuánto falta. Esto lo
 * dice de una vez, y lo dice para cualquier gasto a plazos, no solo para el
 * préstamo: todo lo que se dé de alta «a plazos» de aquí en adelante —un
 * diferido de tarjeta, un curso, un electrodoméstico— sale con su contador.
 */
function contadorPlazos(r) {
  const hechas = r.pagadas || 0;
  const terminado = hechas >= r.cuotas;
  const parte = r.total > 0 ? Math.min(1, r.pagado / r.total) : 0;
  return `
    <div class="plazos">
      <div class="plazos-cab">
        <span class="plazos-cuota">${terminado
    ? 'Terminado de pagar'
    : `Vas por la cuota ${hechas + 1} de ${r.cuotas}`}</span>
        <span class="plazos-pct">${(parte * 100).toFixed(0)} %</span>
      </div>
      <div class="plazos-barra" role="presentation">
        <span style="width:${(parte * 100).toFixed(2)}%"></span></div>
      <div class="plazos-datos">
        <div><div class="etq">Pagado</div>
          <div class="val">${money(r.pagado)}</div></div>
        <div><div class="etq">Queda</div>
          <div class="val">${money(r.restante)}</div></div>
        <div><div class="etq">De un total de</div>
          <div class="val">${money(r.total)}</div></div>
        <div><div class="etq">${terminado ? 'Terminó' : 'Termina'}</div>
          <div class="val">${esc(nombreMes(r.hastaMes))}</div></div>
      </div>
    </div>`;
}

/** Opciones de periodicidad, en días. */
const CADENCIAS = [
  { valor: 7, texto: 'Cada semana' },
  { valor: 15, texto: 'Cada quincena' },
  { valor: 30, texto: 'Cada mes' },
  { valor: 60, texto: 'Cada 2 meses' },
  { valor: 90, texto: 'Cada 3 meses' },
  { valor: 182, texto: 'Cada 6 meses' },
  { valor: 365, texto: 'Una vez al año' },
];

/**
 * Corregir un gasto periódico, o dar de alta uno nuevo.
 *
 * Lo que la app deduce del historial es un punto de partida: el iCloud subió
 * de $0,99 a $2,99 y eso no está en ningún dato pasado. El precio nuevo solo
 * lo sabe quien paga, así que tiene que poder escribirlo.
 */
function formFijo(r, alTerminar) {
  const nuevo = !r;
  const clasePrevia = r?.clase === 'plazos' ? 'plazos' : 'periodico';
  const cats = categoriasGasto();
  const editaDeducido = r && !r.manual;
  const mesHoy = new Date().toISOString().slice(0, 7);
  // Para un gasto deducido se propone el medio con más peso en su historial;
  // para uno a plazos, préstamo, que es el caso típico.
  const medioPorDefecto = r?.medio
    || (r?.reparto ? Object.entries(r.reparto).sort((a, b) => b[1] - a[1])[0]?.[0] : null)
    || (clasePrevia === 'plazos' ? 'Préstamo' : 'Efectivo');
  const cuerpo = `
    ${editaDeducido ? '' : `
      <div class="campo ancho"><label>Qué es</label><div id="pf-clase"></div></div>`}
    <div class="campo ancho"><label for="pf-detalle">Concepto</label>
      <input id="pf-detalle" name="detalle" required placeholder="Préstamo del carro"
             value="${esc(r?.detalle || '')}" ${nuevo ? '' : 'readonly'}></div>

    <div class="filtros" data-solo="periodico">
      ${campoMonto('pf-monto', 'monto', {
    etiqueta: 'Importe de cada vez', valor: String(r?.monto ?? '').replace('.', ','), requerido: true,
  })}
      <div class="campo"><label for="pf-cada">Cada cuánto</label>
        <select id="pf-cada" name="cadencia">
          ${opciones(CADENCIAS, cercana(r?.cadencia ?? 30))}</select></div>
    </div>

    <div class="filtros" data-solo="plazos" hidden>
      <div class="campo"><label for="pf-cuotas">Nº de cuotas</label>
        <input id="pf-cuotas" name="cuotas" type="number" inputmode="numeric"
               min="1" max="120" step="1" value="${esc(String(r?.cuotas ?? 12))}"></div>
      <div class="campo"><label for="pf-desde">Empieza en</label>
        <input id="pf-desde" name="desdeMes" type="month"
               value="${esc(r?.desdeMes || mesHoy)}"></div>
    </div>
    <div class="filtros" data-solo="plazos" hidden>
      ${campoMonto('pf-total', 'total', {
    etiqueta: 'Total del gasto', valor: String(r?.total ?? '').replace('.', ','),
  })}
      ${campoMonto('pf-cuota', 'cuota', {
    etiqueta: 'Cuota de cada mes', valor: String(r?.monto ?? '').replace('.', ','),
  })}
    </div>
    <p class="pista" data-solo="plazos" hidden>Escribe el que sepas: el otro se
      calcula solo.</p>

    <div class="filtros">
      <div class="campo"><label for="pf-cat">Categoría</label>
        <select id="pf-cat" name="categoria">${opciones(cats, r?.categoria)}</select></div>
      <div class="campo"><label for="pf-medio">Cómo se paga</label>
        <select id="pf-medio" name="medio">${opciones(MEDIOS, medioPorDefecto)}</select></div>
      <div class="campo"><label for="pf-quien">De quién es</label>
        <select id="pf-quien" name="usuario">${
  opciones([{ valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' },
    { valor: '', texto: 'De los dos' }], r?.usuario ?? estado.quien)}</select></div>
    </div>
    <div class="filtros">
      <div class="campo" data-solo="periodico"><label>Tipo de importe</label>
        <div id="pf-tipo"></div></div>
    </div>
    <div class="previsualizacion" id="pf-preview"></div>
    ${editaDeducido ? `<p class="pista">La app calculó ${money(r.montoAuto)}
      a partir de ${r.veces} apariciones. Lo que escribas aquí manda sobre eso.</p>` : ''}`;

  let tipo = r?.tipo || 'Fijo';
  let clase = r?.clase === 'plazos' ? 'plazos' : 'periodico';
  const dlg = modal({
    titulo: nuevo ? 'Nuevo gasto periódico' : `Corregir «${r.detalle}»`,
    cuerpo,
    aceptar: nuevo ? 'Añadir' : 'Guardar',
    alAbrir(form) {
      $('#pf-tipo', form).appendChild(segmentado(
        [{ valor: 'Fijo', texto: 'Fijo' }, { valor: 'Variable', texto: 'Variable' }],
        tipo, (v) => { tipo = v; },
      ));
      const preview = $('#pf-preview', form);

      /*
       * Los campos que no son de la clase elegida se ESCONDEN Y SE DESACTIVAN.
       * Escondidos a secas seguirían validándose, y un `required` invisible deja
       * el formulario sin enviar y sin explicar por qué.
       */
      const mostrarClase = () => {
        form.querySelectorAll('[data-solo]').forEach((n) => {
          const suyo = n.dataset.solo === clase;
          n.hidden = !suyo;
          n.querySelectorAll('input, select').forEach((c) => { c.disabled = !suyo; });
        });
        // El importe es obligatorio, pero solo el de la clase que se está usando.
        const m = $('#pf-monto', form);
        const c = $('#pf-cuota', form);
        if (m) m.required = clase === 'periodico';
        if (c) c.required = clase === 'plazos';
      };

      /*
       * Si se elige «a plazos» y nadie ha tocado el medio, se propone Préstamo:
       * es el caso típico, y dejarlo en Efectivo obligaba a corregirlo siempre.
       * En cuanto se elige uno a mano, deja de proponerse nada.
       */
      const selMedio = $('#pf-medio', form);
      let medioTocado = false;
      selMedio?.addEventListener('change', () => { medioTocado = true; });

      const cajaClase = $('#pf-clase', form);
      if (cajaClase) {
        cajaClase.appendChild(segmentado(
          [{ valor: 'periodico', texto: 'Se repite' }, { valor: 'plazos', texto: 'A plazos' }],
          clase, (v) => {
            clase = v;
            if (selMedio && !medioTocado) {
              selMedio.value = v === 'plazos' ? 'Préstamo' : medioPorDefecto;
            }
            mostrarClase();
            refrescar();
          },
        ));
      }

      /*
       * Total y cuota son la misma cifra vista de dos maneras, y unas veces se
       * sabe una y otras la otra: del préstamo se conoce la cuota que cobra el
       * banco; de un diferido de tarjeta, lo que costó la compra. Se escribe la
       * que se tenga y la app calcula la otra, sin obligar a sacar la
       * calculadora. El último campo tocado es el que manda.
       */
      const inCuota = $('#pf-cuota', form);
      const inTotal = $('#pf-total', form);
      const inN = $('#pf-cuotas', form);
      // Al abrir uno ya guardado manda el total, que es el dato exacto: al
      // revés, la cuota redondeada volvería a multiplicarse y movería el total.
      let mandaTotal = !!r?.total;
      inCuota?.addEventListener('input', () => { mandaTotal = false; });
      inTotal?.addEventListener('input', () => { mandaTotal = true; });
      const comaDe = (n) => (Number.isFinite(n) ? n.toFixed(2).replace('.', ',') : '');

      const sincronizar = () => {
        const n = Math.max(1, Math.round(Number(inN.value) || 1));
        if (mandaTotal) {
          const t = aNumero(inTotal.value);
          inCuota.value = t ? comaDe(redondear(t / n)) : '';
        } else {
          const c = aNumero(inCuota.value);
          inTotal.value = c ? comaDe(redondear(c * n)) : '';
        }
      };

      const refrescar = () => {
        if (clase === 'plazos') {
          sincronizar();
          const n = Math.max(1, Math.round(Number(inN.value) || 1));
          const total = redondear(aNumero(inTotal.value));
          const cuota = redondear(total / n);
          // La última carga con los centavos que la división dejó sueltos.
          const ultima = redondear(total - cuota * (n - 1));
          const desde = $('#pf-desde', form).value || mesHoy;
          const hasta = sumarMeses(desde, n - 1);
          preview.innerHTML = `${n} ${n === 1 ? 'cuota' : 'cuotas'} de
            <strong>${money(cuota)}</strong>${
  Math.abs(ultima - cuota) >= 0.005 ? ` (la última, ${money(ultima)})` : ''},
            de ${esc(nombreMes(desde))} a ${esc(nombreMes(hasta))}.
            En total <strong>${money(total)}</strong>.`;
          return;
        }
        const monto = aNumero($('#pf-monto', form).value);
        const cada = Number($('#pf-cada', form).value) || 30;
        // Los mismos factores de calendario que usa el plan, para que la
        // vista previa no prometa una cifra y la lista enseñe otra.
        const factor = { 7: 52 / 12, 15: 2, 30: 1, 60: 1 / 2, 90: 1 / 3, 182: 1 / 6, 365: 1 / 12 }[cada]
          || 30.44 / cada;
        preview.innerHTML = `Al mes serían <strong>${money(monto * factor)}</strong>,
          y al año <strong>${money(monto * factor * 12)}</strong>.`;
      };
      ['input', 'change'].forEach((e) => form.addEventListener(e, refrescar));
      mostrarClase();
      refrescar();
    },
    alEnviar(d) {
      const fila = clase === 'plazos'
        ? {
          detalle: d.detalle.trim(),
          clase: 'plazos',
          // Se guarda el total, que es el dato exacto; la cuota se deriva de él
          // cada vez. Guardar solo la cuota perdería los centavos del reparto.
          total: redondear(aNumero(d.total) || aNumero(d.cuota)
            * Math.max(1, Math.round(Number(d.cuotas) || 1))),
          monto: redondear(aNumero(d.cuota)),
          cuotas: Math.max(1, Math.round(Number(d.cuotas) || 1)),
          desdeMes: d.desdeMes || mesHoy,
          categoria: d.categoria,
          medio: d.medio,
          usuario: d.usuario,
          tipo: 'Fijo',
          cadencia: 30,
        }
        : {
          detalle: d.detalle.trim(),
          clase: 'periodico',
          monto: redondear(aNumero(d.monto)),
          cadencia: Number(d.cadencia) || 30,
          categoria: d.categoria,
          medio: d.medio,
          usuario: d.usuario,
          tipo,
        };
      if (nuevo) {
        guardarManual({
          ...fila,
          id: `${clase === 'plazos' ? 'plazo' : 'fijo'}-${Date.now().toString(36)}`,
          desde: new Date().toISOString().slice(0, 10),
          activo: true,
        });
      } else if (r.manual) {
        guardarManual({ ...r, ...fila });
      } else {
        guardarAjuste(r.clave, fila);
      }
      guardar();
      brindis(nuevo ? (clase === 'plazos' ? 'Gasto a plazos añadido' : 'Gasto periódico añadido') : 'Actualizado');
      alTerminar?.();
    },
  });

  if (r?.manual) {
    const pie = dlg.querySelector('.modal-pie');
    const borrar = document.createElement('button');
    borrar.type = 'button';
    borrar.className = 'btn pequeno peligro';
    borrar.style.marginRight = 'auto';
    borrar.textContent = 'Eliminar';
    borrar.addEventListener('click', () => {
      borrarManual(r.id);
      guardar();
      dlg.close();
      dlg.remove();
      brindis('Eliminado');
      alTerminar?.();
    });
    pie.prepend(borrar);
  }
}

/** La periodicidad conocida más cercana a un número de días. */
function cercana(dias) {
  return CADENCIAS.reduce((mejor, c) => (
    Math.abs(c.valor - dias) < Math.abs(mejor - dias) ? c.valor : mejor), 30);
}

function detalleMes(fila) {
  if (!fila) return '';
  if (!fila.lineas.length) {
    return `<p class="vacio">Sin previsión para ${esc(nombreMes(fila.mes))}:
      todo lo que se espera ya está registrado.</p>`;
  }
  return `<ul class="desglose">${fila.lineas.map((l) => `
    <li>
      <div class="principal">
        <div class="titulo">${esc(l.detalle)}</div>
        <div class="meta">${esc(String(l.cuando).startsWith('~') ? l.cuando : textoFecha(l.cuando))}</div>
      </div>
      <div class="monto">${money(l.monto)}</div>
    </li>`).join('')}
    </ul>
    <div class="pie-desglose">${fila.lineas.length}
      ${fila.lineas.length === 1 ? 'gasto previsto' : 'gastos previstos'} ·
      <strong>${money(fila.previsto)}</strong> sobre
      ${money(fila.comprometido)} ya comprometidos</div>`;
}


/**
 * Registrar el pago de un gasto previsto.
 *
 * Hace dos cosas de una vez: apunta el gasto de verdad —con lo que el dinero
 * sale de la cuenta que se elija y el saldo baja— y marca ese mes como pagado,
 * para que la previsión deje de contarlo ahí. Sin la marca, el mes tendría el
 * gasto apuntado Y previsto, contándolo dos veces.
 */
function formPagar(r, alTerminar) {
  const mes = mesActual();
  const yaPagado = (r.pagos || []).includes(mes);
  const cuentas = cuentasBancarias();

  if (yaPagado) {
    modal({
      titulo: `Pago de ${r.detalle}`,
      cuerpo: `<p>Este mes ya está marcado como pagado.</p>
        <p class="pista">Quitar la marca lo devuelve a la previsión de
        ${esc(nombreMes(mes))}. El gasto que se registró NO se borra: si te
        equivocaste, bórralo desde Cuentas.</p>`,
      aceptar: 'Quitar la marca',
      alEnviar() {
        marcarPago(r.clave, mes, false);
        guardar();
        brindis('Marca quitada');
        alTerminar?.();
      },
    });
    return;
  }

  // Si toca la última cuota, la que lleva los centavos del reparto.
  const cuotaAhora = r.clase === 'plazos' && (r.pagadas || 0) + 1 >= r.cuotas
    ? (r.ultimaCuota ?? r.monto) : r.monto;

  modal({
    titulo: `Pagar ${r.detalle}`,
    cuerpo: `
      <div class="filtros">
        ${campoMonto('pg-monto', 'monto', {
    etiqueta: 'Importe', valor: String(cuotaAhora).replace('.', ','), requerido: true,
  })}
        <div class="campo"><label for="pg-cuenta">Sale de</label>
          <select id="pg-cuenta" name="cuenta" required>${
  opciones(cuentas.map((c) => ({ valor: c.id, texto: c.nombre })), 'PACIFICO-1')}</select></div>
      </div>
      <div class="filtros">
        <div class="campo"><label for="pg-fecha">Fecha</label>
          <input id="pg-fecha" name="fecha" type="date"
                 value="${new Date().toISOString().slice(0, 10)}" required></div>
        <div class="campo"><label for="pg-usuario">Usuario</label>
          <select id="pg-usuario" name="usuario">${
  opciones(['J', 'C'], r.usuario || 'J')}</select></div>
      </div>
      <p class="pista">Se apunta como gasto de ${esc(nombreMes(mes))} y el importe
        sale del saldo de la cuenta elegida.${r.clase === 'plazos'
    ? ` Sería la cuota ${(r.pagadas || 0) + 1} de ${r.cuotas}.` : ''}</p>`,
    aceptar: 'Registrar el pago',
    alEnviar(d) {
      upsert('gastosEfectivo', {
        id: nuevoId('gastosEfectivo'),
        fecha: d.fecha,
        usuario: d.usuario,
        cuenta: d.cuenta,
        detalle: r.detalle,
        proposito: r.clase === 'plazos' ? `Cuota ${(r.pagadas || 0) + 1} de ${r.cuotas}` : '',
        categoria: r.categoria,
        monto: redondear(aNumero(d.monto)),
        notas: 'Pago registrado desde Presupuesto',
      });
      marcarPago(r.clave, mes, true);
      guardar();
      brindis('Pago registrado');
      alTerminar?.();
    },
  });
}

return { render };
})();

M["views/analisis"] = (function () {
/**
 * Vista «Análisis»: el corte que uno traiga, y el informe para mandarlo.
 *
 * El resto de la app contesta preguntas fijas: cuánto va este mes, cómo se
 * reparte entre los dos, qué viene. Aquí se pregunta otra cosa: cuánto se fue
 * en restaurantes en marzo, o en restaurantes más bebidas más aperitivos de
 * enero a agosto, o solo lo pagado en efectivo. Cuatro controles —quién, qué
 * meses, cómo se pagó y qué categorías— y debajo el resultado con todo el
 * detalle.
 *
 * Y el botón de PDF vive aquí, que es donde se acaba de decidir qué se quiere
 * enseñar.
 */

const {nombreMes, money, moneyHTML, redondear, rangoMeses, mesActual, mesesConDatos, textoFecha, detalleDeGastos} = M["calc"];
const {esc, $, $$, segmentado, modal, brindis, opciones, descargar} = M["ui"];
const {informeMensual, compartir} = M["informe"];
/*
 * El corte se recuerda mientras dure la sesión: se sale a mirar otra cosa y al
 * volver sigue puesto lo que uno estaba analizando.
 */
const corte = {
  desde: null, hasta: null, medio: 'ambos', quien: 'ambos', categorias: new Set(),
};

function render(raiz) {
  const hoy = mesActual();
  if (!corte.desde) { corte.desde = hoy; corte.hasta = hoy; }

  // Solo las categorías que de verdad tienen gasto: con las cuarenta del
  // catálogo, la mitad vacías, no se puede buscar con el dedo.
  const conDatos = mesesConDatos();
  const universo = conDatos.length ? conDatos : [hoy];
  const cats = [...new Set(detalleDeGastos(universo, {})
    .map((x) => x.categoria || 'Sin categoría'))]
    .sort((a, b) => a.localeCompare(b, 'es'));

  const resumen = calcular();

  raiz.innerHTML = `
    <section class="panel">
      <span class="etiqueta">${esc(rotuloCorte())}</span>
      <span class="cifra">${moneyHTML(resumen.total)}</span>
      <span class="nota">${resumen.movs.length}
        ${resumen.movs.length === 1 ? 'movimiento' : 'movimientos'} en
        ${resumen.meses.length} ${resumen.meses.length === 1 ? 'mes' : 'meses'}</span>
      <div class="panel-datos">
        <div><div class="etq">Al mes</div>
          <div class="val">${money(redondear(resumen.total / resumen.meses.length))}</div></div>
        <div><div class="etq">Mes más alto</div>
          <div class="val">${resumen.pico ? esc(nombreMes(resumen.pico.mes, true)) : '—'}</div></div>
        <div><div class="etq">Categorías</div>
          <div class="val">${resumen.porCat.length}</div></div>
      </div>
    </section>

    <div class="barra-accion"><div id="an-quien"></div></div>
    <div class="barra-accion"><div id="an-medio"></div></div>

    <div class="filtros">
      <div class="campo"><label for="an-desde">Desde</label>
        <input id="an-desde" type="month" value="${esc(corte.desde)}"></div>
      <div class="campo"><label for="an-hasta">Hasta</label>
        <input id="an-hasta" type="month" value="${esc(corte.hasta)}"></div>
    </div>

    ${desplegableCategorias(cats)}

    <div class="barra-accion">
      <span class="pista crece">Manda este mes por WhatsApp con todo el detalle.</span>
      <button class="btn primario pequeno" id="btn-pdf">PDF del mes</button>
    </div>

    <section class="tarjeta" id="an-resultado"></section>`;

  $('#an-quien', raiz).appendChild(segmentado(
    [{ valor: 'ambos', texto: 'Ambos' }, { valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' }],
    corte.quien,
    (v) => { corte.quien = v; render(raiz); },
  ));
  $('#an-medio', raiz).appendChild(segmentado(
    [{ valor: 'ambos', texto: 'Todo' }, { valor: 'tarjeta', texto: 'Tarjeta' },
      { valor: 'efectivo', texto: 'Efectivo' }],
    corte.medio,
    (v) => { corte.medio = v; render(raiz); },
  ));

  $$('#an-cats input[type=checkbox]', raiz).forEach((b) => {
    b.addEventListener('change', () => {
      const cat = b.dataset.cat;
      // «Todas» no es una categoría más: limpia la selección.
      if (!cat) corte.categorias.clear();
      else if (corte.categorias.has(cat)) corte.categorias.delete(cat);
      else corte.categorias.add(cat);
      // El desplegable se queda abierto: normalmente se marcan varias seguidas.
      const abierto = $('#an-cats-caja', raiz)?.open;
      render(raiz);
      if (abierto) $('#an-cats-caja', raiz).open = true;
    });
  });

  const desde = $('#an-desde', raiz);
  const hasta = $('#an-hasta', raiz);
  const cambioMes = (e) => {
    // Al revés no hay rango: se arrastra el otro extremo en vez de no enseñar
    // nada, que es lo que haría un rango vacío.
    corte.desde = desde.value || hoy;
    corte.hasta = hasta.value || hoy;
    if (corte.hasta < corte.desde) {
      if (e?.target === desde) corte.hasta = corte.desde;
      else corte.desde = corte.hasta;
    }
    render(raiz);
  };
  desde.addEventListener('change', cambioMes);
  hasta.addEventListener('change', cambioMes);

  $('#btn-pdf', raiz).addEventListener('click', () => formInforme(corte.hasta, corte.quien));

  $('#an-resultado', raiz).innerHTML = resultado(resumen);
}

/** Cómo se llama el corte que se está mirando, para la cabecera. */
function rotuloCorte() {
  const meses = rangoMeses(corte.desde, corte.hasta);
  const cuando = meses.length === 1 ? nombreMes(meses[0])
    : `${nombreMes(meses[0], true)} – ${nombreMes(meses[meses.length - 1], true)}`;
  const qué = corte.categorias.size === 1 ? [...corte.categorias][0]
    : corte.categorias.size ? `${corte.categorias.size} categorías` : 'Todo';
  return `${qué} · ${cuando}${corte.quien === 'ambos' ? '' : ` · ${corte.quien}`}`;
}

/**
 * Las categorías, en un desplegable que se abre y se cierra.
 *
 * Con veinticinco, la lista abierta empujaba el resultado media pantalla hacia
 * abajo y había que desplazarse para ver la cifra que se acababa de pedir. Se
 * abre para elegir, se cierra y el resultado queda a la vista; el rótulo dice
 * qué hay marcado sin necesidad de abrirlo.
 */
function desplegableCategorias(cats) {
  const n = corte.categorias.size;
  const marcadas = n === 0 ? 'Todas las categorías'
    : n === 1 ? [...corte.categorias][0]
      : `${n} categorías: ${[...corte.categorias].slice(0, 2).join(', ')}${n > 2 ? '…' : ''}`;

  return `
    <details class="desplegable-marcas" id="an-cats-caja">
      <summary>
        <span class="dm-etq">Categorías</span>
        <span class="dm-valor">${esc(marcadas)}</span>
        <span class="dm-flecha" aria-hidden="true">›</span>
      </summary>
      <div class="lista-marcas" id="an-cats">
        <label class="marca todas">
          <input type="checkbox" data-cat="" ${n ? '' : 'checked'}>
          <span>Todas</span></label>
        ${cats.map((c) => `
          <label class="marca">
            <input type="checkbox" data-cat="${esc(c)}" ${
  corte.categorias.has(c) ? 'checked' : ''}>
            <span>${esc(c)}</span></label>`).join('')}
      </div>
    </details>`;
}

/** El corte resuelto: los movimientos y lo que se saca de ellos. */
function calcular() {
  const meses = rangoMeses(corte.desde, corte.hasta);
  const movs = detalleDeGastos(meses, {
    usuario: corte.quien,
    categorias: [...corte.categorias],
    incluirTarjeta: corte.medio !== 'efectivo',
    incluirEfectivo: corte.medio !== 'tarjeta',
  });
  const total = redondear(movs.reduce((s, m) => s + m.monto, 0));
  const porMes = meses.map((m) => ({
    mes: m,
    monto: redondear(movs.filter((x) => x.mes === m).reduce((s, x) => s + x.monto, 0)),
  }));
  const porCat = [...movs.reduce((m, x) => {
    const c = x.categoria || 'Sin categoría';
    return m.set(c, redondear((m.get(c) || 0) + x.monto));
  }, new Map())].sort((a, b) => b[1] - a[1]);

  return {
    meses,
    movs,
    total,
    porMes,
    porCat,
    pico: porMes.length ? porMes.reduce((a, b) => (b.monto > a.monto ? b : a)) : null,
  };
}

function resultado({
  meses, movs, total, porMes, porCat,
}) {
  if (!movs.length) {
    return `<p class="vacio">No hay gasto que cuadre con este corte.
      Prueba con más meses, otra categoría o cambiando el medio de pago.</p>`;

  return `
    ${meses.length > 1 ? `
      <header><h2>Mes a mes</h2>
        <span class="pista">Con lo que va acumulando</span></header>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Mes</th><th>Gasto</th><th>Acumulado</th></tr></thead>
        <tbody>${(() => {
    let ac = 0;
    return porMes.map((f) => {
      ac = redondear(ac + f.monto);
      return `<tr><td>${esc(nombreMes(f.mes))}</td>
        <td class="${f.monto ? '' : 'cero'}">${f.monto ? money(f.monto) : '—'}</td>
        <td class="acumulado">${money(ac)}</td></tr>`;
    }).join('');

        <tfoot><tr><td>TOTAL</td><td>${money(total)}</td>

    <header><h2>Por categoría</h2>

    // Cada categoría lleva dentro sus propios movimientos, del más caro al

    const suyos = movs.filter((m) => (m.categoria || 'Sin categoría') === c)

            <div class="barra-jc" role="presentation">

              <span style="flex:${Math.max(0, total - v)};background:transparent"></span>
            </div>
            <div class="meta">${suyos.length}
              ${suyos.length === 1 ? 'movimiento' : 'movimientos'}</div>
          </div>
          <div class="monto">${money(v)}
            <span class="pie">${((v / total) * 100).toFixed(0)} %</span></div>
        </summary>
        <ul class="desglose">${suyos.map((m) => `
          <li>
            <div class="principal">
              <div class="titulo">${esc(m.detalle)}</div>
              <div class="meta">${esc(textoFecha(m.fecha))} · ${esc(m.origen)}${
  m.cuota ? ` · ${esc(m.cuota)}` : ''}</div>
            </div>
            <div class="monto">${money(m.monto)}</div>
          </li>`).join('')}</ul>
      </details>`;
  }).join('')}

    <div class="pie-desglose">${movs.length}
      ${movs.length === 1 ? 'movimiento' : 'movimientos'} en
      ${porCat.length} ${porCat.length === 1 ? 'categoría' : 'categorías'} ·
      <strong>${money(total)}</strong></div>`;
}

/**
 * El cuadro para armar el PDF del mes.
 *
 * Dos preguntas y ya: de qué mes y de quién. Lo demás se decide solo, porque
 * el informe existe para una cosa concreta —mandárselo al otro por WhatsApp—
 * y cada opción de más es una decisión que tomar antes de poder mandarlo.
 */
function formInforme(mesPorDefecto, quienPorDefecto) {
  const meses = mesesConDatos();
  // De más reciente a más antiguo: el que se manda casi siempre es el último.
  const opcionesMes = [...meses].reverse().map((m) => ({ valor: m, texto: nombreMes(m) }));
  const inicial = meses.includes(mesPorDefecto) ? mesPorDefecto
    : (meses[meses.length - 1] || mesPorDefecto || mesActual());
  let quien = quienPorDefecto === 'ambos' ? 'J' : (quienPorDefecto || 'J');

  modal({
    titulo: 'Informe en PDF',
    cuerpo: `
      <div class="filtros">
        <div class="campo ancho"><label for="pdf-mes">Mes</label>
          <select id="pdf-mes" name="mes">${opciones(
    opcionesMes.length ? opcionesMes : [{ valor: inicial, texto: nombreMes(inicial) }],
    inicial,
  )}</select></div>
      </div>
      <div class="filtros"><div class="campo ancho"><label>De quién</label>
        <div id="pdf-quien"></div></div></div>
      <p class="pista" id="pdf-previa"></p>
      <p class="pista">Se abre la hoja de compartir del teléfono, donde está
        WhatsApp. Si no la trae, el archivo se descarga.</p>`,
    aceptar: 'Crear y compartir',
    alAbrir(form) {
      const previa = $('#pdf-previa', form);
      const refrescar = () => {
        const m = $('#pdf-mes', form).value;
        const movs = detalleDeGastos([m], { usuario: quien });
        const total = redondear(movs.reduce((s, x) => s + x.monto, 0));
        previa.textContent = movs.length
          ? `${movs.length} ${movs.length === 1 ? 'movimiento' : 'movimientos'} · ${money(total)}`
          : 'Ese mes no tiene gastos registrados de esa persona.';
      };
      $('#pdf-quien', form).appendChild(segmentado(
        [{ valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' },
          { valor: 'ambos', texto: 'Los dos' }],
        quien,
        (v) => { quien = v; refrescar(); },
      ));
      $('#pdf-mes', form).addEventListener('change', refrescar);
      refrescar();
    },
    async alEnviar(d) {
      const informe = informeMensual(d.mes, quien);
      const texto = `Gastos de ${nombreMes(d.mes)}${
        quien === 'ambos' ? '' : ` de ${quien}`}: ${money(informe.total)}`;
      const via = await compartir(informe, texto);
      if (via === 'descargar') {
        descargar(informe.blob, informe.nombre);
        brindis('PDF descargado');
      } else if (via === 'compartido') {
        brindis('PDF compartido');
      }
    },
  });
}

return { render };
})();

M["app"] = (function () {
/** Arranque, navegación y botón de registro rápido. */

const {db, cargar, alCambiar, almacenamiento, instantanea, instantaneaSinSecretos, guardar, tarjetas} = M["store"];
const {iniciarSync, empujarDiferido, alCambiarSync, estadoSync, configurado} = M["sync"];
const {mesActual, nombreMes, money, pagoDelMes, estadoTarjeta} = M["calc"];
const archivoExcel = M["archivo"];
const {crearCajon} = M["cajon"];
const {alRedimensionar, ocultarTooltip} = M["charts"];
const {$, crear, esc, ICONOS, modal, brindis, descargar} = M["ui"];
const {formGastoTarjeta, formGastoEfectivo, formIngreso, formInversion, formMovimiento} = M["forms"];
const resumen = M["views/resumen"];
const mensual = M["views/mensual"];
const anual = M["views/anual"];
const vistaTarjetas = M["views/tarjetas"];
const inversiones = M["views/inversiones"];
const cuentas = M["views/cuentas"];
const datos = M["views/datos"];
const plan = M["views/plan"];
const analisis = M["views/analisis"];
/*
 * `titulo` es el rótulo de la barra de abajo, donde cada ranura mide unos 48 px
 * en un teléfono: si no cabe, se corta. `rotulo` es el título largo de la
 * cabecera, que sí tiene sitio.
 */
const VISTAS = [
  { id: 'resumen', titulo: 'Inicio', rotulo: 'Resumen', modulo: resumen, icono: ICONOS.resumen },
  { id: 'mensual', titulo: 'Mes', rotulo: 'Mensual', modulo: mensual, icono: ICONOS.mensual },
  { id: 'anual', titulo: 'Año', modulo: anual, icono: ICONOS.anual },
  { id: 'tarjetas', titulo: 'Tarjetas', modulo: vistaTarjetas, icono: ICONOS.tarjetas },
  { id: 'inversiones', titulo: 'Invertir', rotulo: 'Inversiones', modulo: inversiones, icono: ICONOS.inversiones },
  { id: 'cuentas', titulo: 'Cuentas', modulo: cuentas, icono: ICONOS.cuentas },
  { id: 'plan', titulo: 'Plan', rotulo: 'Presupuesto', modulo: plan, icono: ICONOS.plan },
  { id: 'analisis', titulo: 'Análisis', modulo: analisis, icono: ICONOS.analisis },
  { id: 'datos', titulo: 'Datos', modulo: datos, icono: ICONOS.datos },
];

let vistaActual = 'resumen';

function aplicarTema() {
  const tema = db.config.tema || 'auto';
  document.documentElement.dataset.tema = tema === 'auto' ? '' : tema;
}

/** Punto de estado del sync junto al título. */
function pintarEstadoSync() {
  const nodo = $('#estado-sync');
  if (!nodo) return;
  if (!configurado()) {
    nodo.hidden = true;
    return;
  }
  nodo.hidden = false;
  const estado = estadoSync.sincronizando ? 'sync' : estadoSync.error ? 'error' : 'ok';
  nodo.dataset.estado = estado;
  nodo.title = {
    sync: 'Sincronizando…',
    error: `Error de sincronización: ${estadoSync.error}`,
    ok: estadoSync.ultima
      ? `Sincronizado a las ${estadoSync.ultima.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' })}`
      : 'Conectado',
  }[estado];
}

/*
 * Abajo solo queda el «+». Navegar es cosa del cajón lateral, así que la barra
 * con las seis secciones sobraba: repetía lo mismo y se comía el ancho.
 *
 * El «+» va dibujado, no escrito: el carácter de texto se apoya en la línea
 * base de la fuente y nunca queda centrado del todo dentro del círculo.
 */
function pintarNav() {
  const nav = $('#nav');
  if (nav.dataset.listo) return;
  nav.innerHTML = `
    <button class="nav-mas" id="fab" aria-label="Registrar movimiento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>`;
  nav.querySelector('#fab').addEventListener('click', menuRegistro);
  nav.dataset.listo = 'si';
}

/** Lo que hay que mirar hoy: se pinta en la campana de la cabecera. */
function avisosPendientes() {
  const lista = [];

  if (!almacenamiento.ok) {
    lista.push({ nivel: 'critico', texto: 'Este navegador no está guardando los datos. Descarga un respaldo.' });
  }
  if (configurado() && estadoSync.error) {
    lista.push({ nivel: 'critico', texto: `La sincronización falló: ${estadoSync.error}` });
  }

  const mes = mesActual();
  tarjetas().forEach((t) => {
    const pago = pagoDelMes(t.id, mes, 'ambos');
    if (pago > 0) {
      lista.push({ nivel: 'info', texto: `${t.nombre}: a pagar en ${nombreMes(mes)} ${money(pago)}.` });
    }
    const est = estadoTarjeta(t.id);
    const uso = est.cupo ? (est.utilizado / est.cupo) * 100 : 0;
    if (uso >= 80) {
      lista.push({
        nivel: uso >= 95 ? 'critico' : 'alerta',
        texto: `${t.nombre} lleva usado el ${uso.toFixed(0)} % del cupo.`,
      });
    }
  });

  return lista;
}

/*
 * El punto de aviso vive ahora en la marca «JC», que es lo único que queda en
 * la cabecera y a la vez el tirador del menú: donde se ve el aviso es donde se
 * abre lo que lo explica.
 */
function pintarAvisos() {
  const btn = $('#btn-menu');
  if (!btn) return;
  const hay = avisosPendientes().some((a) => a.nivel !== 'info');
  btn.dataset.avisos = hay ? 'si' : 'no';
  pintarCajon();
}

function panelAvisos() {
  const lista = avisosPendientes();
  modal({
    titulo: 'Avisos',
    cuerpo: lista.length
      ? lista.map((a) => `
          <div class="aviso ${a.nivel === 'info' ? '' : a.nivel}">
            <span class="icono">${a.nivel === 'info' ? '•' : '⚠'}</span>
            <span class="crece">${esc(a.texto)}</span>
          </div>`).join('')
      : '<p class="vacio">Todo en orden: nada pendiente de mirar.</p>',
    aceptar: 'Cerrar',
    soloCerrar: true,
    alEnviar: () => {},
  });
}

/*
 * Menú lateral. Sustituye al que se abría desde la cabecera: la cabecera se va
 * con el scroll, y sus dos botones redondos solo se podían tocar estando
 * arriba del todo. Aquí están siempre, deslizando desde el borde izquierdo.
 */
let cajon;

function pintarCajon() {
  if (!cajon) return;
  const temas = [['auto', 'Automático'], ['claro', 'Claro'], ['oscuro', 'Oscuro']];
  const actual = db.config.tema || 'auto';
  const pendientes = avisosPendientes().some((a) => a.nivel !== 'info');

  cajon.nodo.innerHTML = `
    <div class="cajon-cab">
      <div class="marca" aria-hidden="true">JC</div>
      <div>
        <strong>Finanzas J &amp; C</strong>
        <span>${VISTAS.length} secciones</span>
      </div>
    </div>

    <button class="cajon-item" data-avisos>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>Avisos${pendientes ? '<span class="punto" aria-label="hay avisos"></span>' : ''}</button>

    <div class="cajon-rotulo">Secciones</div>
    ${VISTAS.map((v) => `
      <button class="cajon-item" data-vista="${v.id}"
        ${v.id === vistaActual ? 'aria-current="page"' : ''}>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${v.icono}</svg>
        ${esc(v.rotulo || v.titulo)}</button>`).join('')}

    <div class="cajon-rotulo">Tema</div>
    <div class="segmentado" id="m-tema">
      ${temas.map(([val, txt]) => `
        <button type="button" data-tema="${val}" aria-pressed="${val === actual}">${txt}</button>
      `).join('')}
    </div>`;

  cajon.nodo.querySelector('[data-avisos]').addEventListener('click', () => {
    cajon.cerrar();
    panelAvisos();
  });
  cajon.nodo.querySelectorAll('[data-vista]').forEach((b) => {
    b.addEventListener('click', () => {
      cajon.cerrar();
      irA(b.dataset.vista);
    });
  });
  cajon.nodo.querySelectorAll('[data-tema]').forEach((b) => {
    b.addEventListener('click', () => {
      db.config.tema = b.dataset.tema;
      guardar();
      aplicarTema();
      cajon.nodo.querySelectorAll('[data-tema]').forEach((o) => {
        o.setAttribute('aria-pressed', String(o === b));
      });
    });
  });
}

function menuPrincipal() {
  pintarCajon();
  cajon.alterna();
}

/**
 * Cuando el navegador no guarda, la app sigue usable en la sesión pero hay
 * que decirlo sin rodeos: lo contrario es perder datos en silencio.
 */
function avisoAlmacenamiento() {
  if (almacenamiento.ok) return null;
  const texto = {
    bloqueado: 'Este navegador está bloqueando el almacenamiento de la página, '
      + 'así que lo que registres se perderá al cerrarla. Pasa en Safari del '
      + 'iPhone cuando la app va incrustada en otra página.',
    'no-persiste': 'Este navegador no está conservando los datos entre sesiones: '
      + 'lo que registres se perderá al cerrar la app.',
    'sin-espacio': 'No queda espacio de almacenamiento en este navegador. '
      + 'Descarga un respaldo y borra datos antiguos.',
  }[almacenamiento.motivo] || 'No se pudo guardar en este navegador.';

  const nodo = crear(`
    <div class="aviso critico" role="alert">
      <span class="icono">⚠</span>
      <span class="crece"><strong>Los datos no se están guardando.</strong> ${texto}</span>
      <button class="btn pequeno" id="btn-respaldo-urgente">Descargar respaldo</button>
    </div>`);
  nodo.querySelector('#btn-respaldo-urgente').addEventListener('click', () => {
    descargar(new Blob([JSON.stringify(instantaneaSinSecretos(), null, 1)], { type: 'application/json' }),
      `respaldo_finanzas_${new Date().toISOString().slice(0, 10)}.json`);
  });
  return nodo;
}

function irA(id) {
  const vista = VISTAS.find((v) => v.id === id) || VISTAS[0];
  vistaActual = vista.id;
  /*
   * La dirección se REEMPLAZA, no se apila.
   *
   * Asignar `location.hash` deja una entrada de historial por cada sección
   * visitada. En el iPhone eso es un problema serio, porque deslizar desde el
   * borde izquierdo —el gesto con el que se abre el cajón— es también el gesto
   * de «atrás» del sistema: si el sistema se queda con el gesto, la app
   * retrocede por esa pila y acaba en Inicio, que es lo que hay en el fondo
   * desde que se arranca siempre ahí. Se veía como un parpadeo y un salto a
   * Resumen sin haberlo pedido.
   *
   * Con `replaceState` solo existe una entrada: el gesto no tiene adónde ir y
   * el cajón se queda con él.
   */
  if (location.hash !== `#${vista.id}`) {
    try {
      history.replaceState(null, '', `#${vista.id}`);
    } catch {
      // Abierta como archivo local, donde `replaceState` no está permitido.
      location.hash = vista.id;
    }
  }
  pintarNav();
  pintarCajon();
  $('#titulo-vista').textContent = vista.rotulo || vista.titulo;
  const raiz = $('#vista');
  /*
   * El repintado por redimensionado apunta a la vista que lo registró. Si la
   * siguiente no registra ninguno —Datos y Cuentas no llevan gráficos— seguía
   * activo el de la anterior, y al girar el teléfono intentaba dibujar dentro
   * de un trozo de página que ya no existe. Se descuelga aquí y cada vista
   * vuelve a colgar el suyo si lo necesita.
   */
  alRedimensionar(null);
  ocultarTooltip();
  raiz.textContent = '';
  vista.modulo.render(raiz, { irA });
  const aviso = avisoAlmacenamiento();
  if (aviso) raiz.prepend(aviso);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/**
 * Menú del botón flotante: qué quiero registrar.
 *
 * El gasto con tarjeta lleva a la vista de Tarjetas, colocada en la tarjeta y
 * el mes donde acaba de caer. Por el corte —Pichincha corta el día 3— una
 * compra de hoy entra en el estado del mes siguiente, así que quedarse donde
 * se estaba daba la sensación de que no se había guardado nada.
 */
function menuRegistro() {
  const acciones = [
    ['Gasto con tarjeta', formGastoTarjeta, (nuevo) => {
      vistaTarjetas.enfocarGasto(nuevo);
      irA('tarjetas');
    }],
    ['Gasto en efectivo', formGastoEfectivo],
    ['Ingreso', formIngreso],
    ['Inversión / póliza', formInversion],
    ['Movimiento entre cuentas', formMovimiento],
  ];
  const dlg = modal({
    titulo: '¿Qué quieres registrar?',
    cuerpo: `<div class="filtros" style="flex-direction:column;align-items:stretch">
      ${acciones.map(([texto], i) => (
    `<button type="button" class="btn" data-accion="${i}" style="justify-content:flex-start">${texto}</button>`
  )).join('')}</div>`,
    aceptar: 'Cerrar',
    alEnviar: () => {},
  });
  dlg.querySelector('.modal-pie').style.display = 'none';
  dlg.querySelectorAll('[data-accion]').forEach((b) => {
    b.addEventListener('click', () => {
      dlg.close();
      dlg.remove();
      const [, abrir, alGuardar] = acciones[Number(b.dataset.accion)];
      abrir((guardado) => {
        if (alGuardar) alGuardar(guardado);
        else irA(vistaActual);
      });
    });
  });
}

async function iniciar() {
  const origen = await cargar();
  aplicarTema();

  pintarNav();
  cajon = crearCajon({ etiqueta: 'Menú de Finanzas J y C' });
  $('#btn-menu').addEventListener('click', menuPrincipal);

  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && id !== vistaActual) irA(id);
  });

  // Siempre se arranca en Inicio. El iPhone reabre la app en la última
  // dirección visitada, fragmento incluido, así que al volver aparecía la
  // sección donde se quedó uno y no el resumen. El fragmento sigue mandando
  // dentro de la sesión: solo se ignora el heredado del arranque.
  irA('resumen');

  if (origen === 'semilla') {
    brindis('Datos cargados desde el Excel migrado');
  } else if (origen === 'vacio') {
    $('#vista').prepend(crear(`
      <div class="aviso alerta"><span class="icono">⚠</span>
        <span>No se encontró la base inicial. Si abriste el archivo directamente
        desde el disco, súbelo a un servidor o importa el Excel en la pestaña
        <strong>Datos</strong>.</span></div>`));
  }

  // Refresca la cabecera cuando cambian los datos y sube los cambios.
  alCambiar(() => {
    aplicarTema();
    pintarAvisos();
    empujarDiferido();
    archivoExcel.guardarDiferido();
  });

  // Indicador de sincronización en la cabecera.
  alCambiarSync(() => { pintarEstadoSync(); pintarAvisos(); });
  pintarEstadoSync();
  pintarAvisos();
  iniciarSync();

  // Archivo de Excel vinculado: se readopta y se queda atento a las
  // ediciones hechas directamente en Excel.
  if (archivoExcel.soportado) {
    archivoExcel.restaurar().then((estado) => {
      if (estado === 'ninguno') return;
      archivoExcel.vigilar(() => irA(vistaActual));
      if (estado === 'listo') {
        irA(vistaActual);
        brindis(`Datos leídos de ${archivoExcel.archivo.nombre}`);
      }
    }).catch((err) => console.warn('Archivo vinculado', err));
  }

  // El service worker solo acompaña a la versión por módulos; en el archivo
  // único no existe y pedirlo solo ensucia la consola con un 404. La señal es
  // el propio `<script type="module">`, que el empaquetador quita: mirar el
  // enlace al manifiesto no valía, porque la versión publicada también lo
  // lleva para que Android tome sus iconos.
  const porModulos = document.querySelector('script[type="module"]');
  if (porModulos && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sin modo offline */ });
  }
}

iniciar();

return {  };
})();

</script>
</body>

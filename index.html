        categoria,
        tipo: d.tipo,
        cuotas: n,
        monto_total: redondear(aNumero(d.monto_total)),
        tasa_interes: tasa,
        mes_inicio: d.mes_inicio,
        notas: g?.notas || '',
      });

      // Al corregir se rehace el cronograma, conservando qué meses ya estaban
      // marcados como pagados.
      const pagados = new Set(db.cuotas
        .filter((c) => c.gasto_id === id && c.pagado === 'Si')
        .map((c) => c.mes));
      db.cuotas = db.cuotas.filter((c) => c.gasto_id !== id);

      const i = db.gastosTarjeta.findIndex((x) => x.id === id);
      if (i >= 0) db.gastosTarjeta[i] = fila;
      else db.gastosTarjeta.push(fila);

      plan.cuotas.forEach((c) => db.cuotas.push(tocar({
        gasto_id: id,
        n_cuota: c.n_cuota,
        mes: c.mes,
        monto: c.monto,
        tarjeta: d.tarjeta,
        usuario: d.usuario,
        categoria,
        pagado: pagados.has(c.mes) ? 'Si' : '',
      })));
      guardar();
      brindis(g
        ? `Gasto corregido · ${money(plan.totalPagado)}`
        : `Gasto registrado · ${money(plan.totalPagado)} en ${n} ${n === 1 ? 'pago' : 'cuotas'}`);
      // Se devuelve el gasto guardado para que la vista pueda ir a buscarlo:
      // con el corte de la tarjeta, una compra de hoy puede caer en el estado
      // del mes siguiente y quedaría fuera de lo que se está mirando.
      alTerminar?.(fila);
    },
  });
}

/**
 * Paga el consumo de una tarjeta en un mes: marca sus cuotas como pagadas
 * (libera cupo) y deja el movimiento en la cuenta de origen.
 */
function formPagoTarjeta(tarjetaId, mes, monto, alTerminar) {
  const cuentas = cuentasBancarias();
  const tarjeta = db.cuentas.find((c) => c.id === tarjetaId);
  const cuerpo = `
    <p>Pago de <strong>${esc(tarjeta?.nombre || tarjetaId)}</strong> ·
       ${esc(nombreMes(mes))}</p>
    <div class="filtros">
      <div class="campo"><label for="pt-fecha">Fecha del pago</label>
        <input id="pt-fecha" name="fecha" type="date" value="${hoyISO()}" required></div>
      ${campoMonto('pt-monto', 'monto', {
    etiqueta: 'Monto pagado', valor: paraEditar(monto), requerido: true,
  })}
    </div>
    <div class="campo ancho"><label for="pt-cuenta">Se paga desde</label>
      <select id="pt-cuenta" name="cuenta_origen" required>
        ${opciones(cuentas.map((c) => ({ valor: c.id, texto: c.nombre })))}
      </select></div>
    <div class="previsualizacion" id="pt-preview"></div>`;

  modal({
    titulo: 'Registrar pago de tarjeta',
    cuerpo,
    aceptar: 'Confirmar pago',
    alAbrir(form) {
      /*
       * El pago es una transferencia: el dinero sale de la cuenta y entra a la
       * tarjeta. Se enseña el saldo antes y después para no tener que ir a
       * mirarlo a otra pantalla antes de confirmar.
       */
      const preview = $('#pt-preview', form);
      const refrescar = () => {
        const id = $('#pt-cuenta', form).value;
        const cuenta = cuentas.find((c) => c.id === id);
        const monto = val(form, '#pt-monto');
        const antes = saldoCuenta(id);
        preview.innerHTML = `
          <div>Sale de <strong>${esc(cuenta?.nombre || id)}</strong>
            y entra a <strong>${esc(tarjeta?.nombre || tarjetaId)}</strong>,
            como una transferencia.</div>
          <div style="margin-top:6px">Saldo de la cuenta:
            <strong>${money(antes)}</strong> → <strong>${money(redondear(antes - monto))}</strong></div>
          <div style="margin-top:6px">Las cuotas de ${esc(nombreMes(mes))} quedan marcadas
            como pagadas y ese monto se libera del cupo.</div>`;
      };
      ['change', 'input'].forEach((ev) => form.addEventListener(ev, refrescar));
      refrescar();
    },
    alEnviar(d) {
      db.cuotas.forEach((c) => {
        if (c.tarjeta === tarjetaId && c.mes === mes) tocar(Object.assign(c, { pagado: 'Si' }));
      });
      db.movimientos.push(tocar({
        id: nuevoId('movimientos'),
        fecha: d.fecha,
        tipo: 'Pago de tarjeta',
        cuenta_origen: d.cuenta_origen,
        cuenta_destino: tarjetaId,
        monto: redondear(aNumero(d.monto)),
        descripcion: `Pago ${tarjeta?.nombre || tarjetaId} — ${nombreMes(mes)}`,
        ref_id: `${tarjetaId}:${mes}`,
      }));
      guardar();
      brindis(`Pago registrado · ${money(aNumero(d.monto))}`);
      alTerminar?.();
    },
  });
}

/** Liquida una póliza vencida: acredita el valor final en la cuenta destino. */
function liquidarInversion(id, alTerminar) {
  const p = db.inversiones.find((x) => x.id === id);
  if (!p) return;
  tocar(Object.assign(p, { estado: 'Liquidada' }));
  db.movimientos.push(tocar({
    id: nuevoId('movimientos'),
    fecha: p.fecha_vencimiento,
    tipo: 'Rendimiento de inversión',
    cuenta_origen: '',
    cuenta_destino: p.cuenta_destino,
    monto: 0, // el capital y el interés ya se reflejan vía la póliza liquidada
    descripcion: `Vencimiento ${p.institucion} — capital ${money(p.capital)} + interés ${money(p.interes_neto)}`,
    ref_id: p.id,
  }));
  guardar();
  brindis(`Póliza liquidada · ${money(p.valor_final)} acreditados`);
  alTerminar?.();
}

return { formGastoEfectivo, formGastoTarjeta, formIngreso, formInversion, formMovimiento, formPagoTarjeta, liquidarInversion };
})();

/**
 * El total del mes de cada tarjeta, partido entre J y C.
 *
 * Es la pregunta de todos los días —«¿cuánto llevamos y cuánto puso cada
 * uno?»— y hasta ahora había que ir tarjeta por tarjeta a la vista de
 * Tarjetas. Deliberadamente no atiende al filtro J/C del panel: la gracia de
 * esta sección es ver a los dos a la vez.
 */
function seccionRepartoMes(mes) {
  const gente = usuarios();
  const filas = tarjetas().map((t) => {
    const total = pagoDelMes(t.id, mes, 'ambos');
    return {
      tarjeta: t,
      total,
      movs: db.cuotas.filter((c) => c.tarjeta === t.id && c.mes === mes).length,
      vence: fechaPagoMes(mes, t.id),
      partes: gente.map((u) => ({ usuario: u, monto: pagoDelMes(t.id, mes, u) })),
    };
  });

  const total = redondear(filas.reduce((s, f) => s + f.total, 0));
  const porPersona = gente.map((u) => ({
    usuario: u,
    monto: redondear(filas.reduce((s, f) => s
      + (f.partes.find((p) => p.usuario === u)?.monto || 0), 0)),
  }));

  const cab = `<header><h2>Tarjetas de ${esc(nombreMes(mes))}</h2>
    <span class="pista">Cuánto puso cada uno</span></header>`;

  if (!total) {
    return `${cab}<p class="vacio">Todavía no hay consumo cargado en este mes.</p>`;
  }

  return `${cab}
    <ul class="lista">
      ${filas.map((f) => `
        <li class="con-acciones">
          <span class="insignia">${esc(iniciales(f.tarjeta.nombre))}</span>
          <div class="principal">
            <div class="titulo">${esc(f.tarjeta.nombre.replace(/^TC /, ''))}</div>
            <div class="meta">${f.movs} ${f.movs === 1 ? 'movimiento' : 'movimientos'}${
  // Fecha corta: el año se sobreentiende y la línea no llega a cortarse.
  f.vence ? ` · se paga el ${esc(fechaCorta(f.vence))}` : ''}</div>
          </div>
          <div class="monto">${money(f.total)}</div>
          <div class="acciones" style="justify-content:stretch;flex-direction:column;align-items:stretch">
            ${barraReparto(f.partes, f.total)}
            <div class="reparto">${chipsReparto(f.partes, f.total)}</div>
          </div>
        </li>`).join('')}
    </ul>
    <div class="pie-reparto">
      <span>Total de ${esc(nombreMes(mes, true))} en las ${filas.length} tarjetas</span>
      <strong>${money(total)}</strong>
    </div>
    <div class="reparto">${chipsReparto(porPersona, total)}</div>`;
}

/** '2026-09-18' → '18 de septiembre'. */
function fechaCorta(fechaISO) {
  return textoFecha(fechaISO).replace(/ de \d{4}$/, '');
}

/** Barra de proporción J | C. Sin datos no se dibuja: una barra vacía engaña. */
function barraReparto(partes, total) {
  if (total <= 0) return '';
  return `<div class="barra-jc" role="presentation">
    ${partes.filter((p) => p.monto > 0).map((p) => `
      <span style="flex:${p.monto};background:var(--persona-${
  esc(String(p.usuario).toLowerCase())}, var(--acento))"></span>`).join('')}
  </div>`;
}

function chipsReparto(partes, total) {
  return partes.map((p) => `
    <span class="chip ${esc(String(p.usuario).toLowerCase())}">
      ${esc(p.usuario)} <strong>${money(p.monto)}</strong>
      <em>${total > 0 ? `${((p.monto / total) * 100).toFixed(0)} %` : '—'}</em>
    </span>`).join('');
}

function seccionProximos(mes) {
  const filas = [];

  tarjetas().forEach((t) => {
    const monto = pagoDelMes(t.id, mes, 'ambos');
    if (monto > 0) {
      const vence = fechaPagoMes(mes, t.id);
      // Cuánto pone cada uno de ese pago: el cupo es compartido, así que lo
      // útil no es solo el total sino a quién le toca qué parte.
      const reparto = usuarios()
        .map((u) => ({ usuario: u, monto: pagoDelMes(t.id, mes, u) }))
        .filter((x) => x.monto > 0);
      filas.push({
        tipo: 'Pago de tarjeta',
        cuando: vence ? fechaCorta(vence) : nombreMes(mes),
        titulo: t.nombre,
        reparto,
        pieEtq: `Consumo de ${nombreMes(mes)}`,
        monto: -monto,
      });
    }
  });

  const hoy = new Date().toISOString().slice(0, 10);
  db.inversiones
    .filter((p) => p.estado === 'Activa')
    .sort((a, b) => String(a.fecha_vencimiento).localeCompare(String(b.fecha_vencimiento)))
    .slice(0, 4)
    .forEach((p) => {
      const dias = diasEntre(hoy, p.fecha_vencimiento);
      filas.push({
        tipo: 'Vence póliza',
        cuando: fechaCorta(p.fecha_vencimiento),
        titulo: p.institucion,
        pieEtq: dias >= 0 ? `En ${dias} días · regresa a la cuenta` : `Venció hace ${-dias} días`,
        monto: Number(p.valor_final) || 0,
      });
    });

  if (!filas.length) {
    return '<header><h2>Próximos movimientos</h2></header><p class="vacio">Nada pendiente por ahora.</p>';
  }
  // Cada uno en su ficha: el tipo y la fecha en la cabecera, de qué se trata en
  // medio y las dos cifras que lo resumen en la franja de abajo.
  return `<header><h2>Próximos movimientos</h2></header>
    ${filas.map((f) => `
      <div class="ficha">
        <div class="ficha-meta">${esc(f.cuando)}</div>
        <div class="ficha-cab"><span class="rotulo">${esc(f.tipo)}</span></div>
        <div class="ficha-panel">
        <div class="ficha-cuerpo">
          <h3>${esc(f.titulo)}</h3>
          ${f.reparto?.length ? `
            <div class="reparto">
              ${f.reparto.map((r) => `
                <span class="chip ${esc(String(r.usuario).toLowerCase())}">
                  ${esc(r.usuario)} <strong>${money(r.monto)}</strong>
                  <em>${((r.monto / Math.abs(f.monto)) * 100).toFixed(0)} %</em>
                </span>`).join('')}
            </div>` : ''}
        </div>
        <div class="ficha-pie">
          <span>${esc(f.pieEtq)}</span>
          <span><strong class="${f.monto < 0 ? 'monto neg' : 'monto pos'}">
            ${money(Math.abs(f.monto))}</strong></span>
        </div>
        </div>
      </div>`).join('')}`;
}

/** «TC Pichincha» → «PI»; «Banco Bolivariano» → «BB». */
function iniciales(nombre) {
  const palabras = String(nombre).replace(/^TC /, '').split(/\s+/).filter(Boolean);
  if (palabras.length >= 2) return (palabras[0][0] + palabras[1][0]).toUpperCase();
  return String(palabras[0] || '?').slice(0, 2).toUpperCase();
}

return { render };

      <tbody>${ppto.map((p) => `

            ${money(p.diferencia)}</td>
          <td>${p.uso.toFixed(0)} %</td>
        </tr>`).join('')}</tbody>
    </table>` : '<p class="vacio">Define presupuestos por categoría en la pestaña Datos.</p>';
}

/**
 * Pone al día el presupuesto de cada categoría con lo que se gasta de verdad.
 *
 * Se enseña antes lo que va a cambiar y de dónde sale cada cifra: es el dato
 * contra el que se mide todo el mes, así que no puede reescribirse a espaldas
 * de quien lo mira.
 */
function ajustarPresupuesto(alTerminar) {
  const filas = presupuestoSugerido();
  const cambian = filas.filter((f) => f.cambia);

  modal({
    titulo: 'Ajustar el presupuesto',
    cuerpo: cambian.length ? `
      <p class="pista">Se toma, para cada categoría, lo mayor entre el gasto
      medio de los últimos seis meses cerrados y lo que ya está fijo al mes:
      los gastos que se repiten más las cuotas vivas de diferidos y cargos
      recurrentes. El mes en curso no entra en el promedio, que va a medias.</p>
      <div class="tabla-scroll" style="max-height:46vh">
        <table>
          <thead><tr><th>Categoría</th><th>Ahora</th><th>Queda en</th>
            <th>Promedio</th><th>Fijo</th></tr></thead>
          <tbody>${cambian.map((f) => `
            <tr>
              <td>${esc(f.categoria)}</td>
              <td class="cero">${money(f.actual)}</td>
              <td><strong>${money(f.sugerido)}</strong></td>
              <td>${money(f.promedio)}</td>
              <td>${f.recurrente ? money(f.recurrente) : '—'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>`
      : '<p class="vacio">El presupuesto ya está al día: nada que cambiar.</p>',
    aceptar: cambian.length ? `Ajustar ${cambian.length}` : 'Cerrar',
    soloCerrar: !cambian.length,
    alEnviar() {
      if (!cambian.length) return;
      const n = aplicarPresupuesto(filas);
      guardar();
      brindis(`${n} ${n === 1 ? 'categoría ajustada' : 'categorías ajustadas'}`);
      alTerminar?.();
    },
  });
}

function tablaHTML(matriz) {
  if (!matriz.filas.length) return '<p class="vacio">Sin gastos en el periodo seleccionado.</p>';
  const cab = matriz.meses.map((m) => `<th>${esc(nombreMes(m, true))}</th>`).join('');
  const columnas = matriz.meses.length + 2;

  /*
   * Cada categoría se abre para enseñar en qué se fue el dinero. La fila de
   * detalle se crea vacía y se rellena la primera vez que se abre: con catorce
   * categorías, montar todos los desgloses de entrada era pintar cientos de
   * movimientos que casi nunca se miran.
   */
  const cuerpo = matriz.filas.map((f) => `
    <tr class="desplegable" data-categoria="${esc(f.categoria)}" aria-expanded="false" tabindex="0">
      <td><span class="flecha" aria-hidden="true">›</span>${esc(f.categoria)}</td>
      ${f.valores.map((v) => `<td class="${v ? '' : 'cero'}">${v ? money(v) : '—'}</td>`).join('')}
      <td><strong>${money(f.total)}</strong></td>
    </tr>
    <tr class="detalle" data-detalle="${esc(f.categoria)}" hidden>
      <td colspan="${columnas}"></td>
    </tr>`).join('');

  const pie = matriz.totales.map((v) => `<td>${money(v)}</td>`).join('');
  return `
    <table>
      <thead><tr><th>Categoría</th>${cab}<th>Total</th></tr></thead>
      <tbody>${cuerpo}</tbody>
      <tfoot><tr><td>TOTAL</td>${pie}<td>${money(matriz.granTotal)}</td></tr></tfoot>
    </table>`;
}

/** Contenido del desglose de una categoría. */
function detalleHTML(meses, categoria, filtros) {
  const filas = detalleDeCategoria(meses, categoria, filtros);
  if (!filas.length) return '<p class="vacio">Sin movimientos.</p>';

  return `<ul class="desglose">${filas.map((x) => `
    <li>
      <div class="principal">
        <div class="titulo">${esc(x.detalle)}
          <span class="chip ${esc(String(x.usuario).toLowerCase())}">${esc(x.usuario)}</span></div>
        <div class="meta">${esc(x.fecha)} · ${esc(x.origen)}${x.cuota ? ` · ${esc(x.cuota)}` : ''}</div>
      </div>
      <div class="monto">${money(x.monto)}</div>
    </li>`).join('')}
    </ul>
    <div class="pie-desglose">${filas.length}
      ${filas.length === 1 ? 'movimiento' : 'movimientos'} ·
      <strong>${money(filas.reduce((s, x) => s + x.monto, 0))}</strong></div>`;
}

function exportarCSV(matriz) {
  const filas = [
    ['Categoría', ...matriz.meses, 'Total'],
    ...matriz.filas.map((f) => [f.categoria, ...f.valores, f.total]),
    ['TOTAL', ...matriz.totales, matriz.granTotal],
  ];
  const csv = filas.map((f) => f.map((c) => (
    typeof c === 'string' && /[",;\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c
  )).join(',')).join('\n');

  const url = URL.createObjectURL(new Blob([`﻿${csv}`], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `gastos_${matriz.meses[0]}_a_${matriz.meses[matriz.meses.length - 1]}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

return { render };
})();

 * también aparece ahí, y por el mismo valor, se marca. Al final tienen que

  const dif = comp.diferencia;

        <div class="kpi"><div class="etq">Cupo</div>
          <div class="valor">${money(est.cupo)}</div></div>
        <div class="kpi"><div class="etq">Disponible</div>
          <div class="valor">${money(est.disponible)}</div></div>
        ${Object.entries(est.porUsuario).map(([u, v]) => `
          <div class="kpi"><div class="etq">Pendiente ${esc(u)}</div>
            <div class="valor">${money(v)}</div></div>`).join('')}
      </div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Pagos por mes</h2><span class="pista">Últimos 12 meses</span></header>
        <div id="g-meses"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Categorías del mes</h2><span class="pista">${esc(nombreMes(mes))}</span></header>
        <div id="g-dona"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Diferidos vigentes</h2>
        <span class="pista">Cuotas que faltan por pagar</span></header>
      <div id="diferidos"></div>
    </section>

    <section class="tarjeta">
      <header><h2>Movimientos de ${esc(nombreMes(mes))}</h2>
        <button class="btn pequeno${estado.comprobando ? ' primario' : ''}" id="btn-comprobar">
          ${estado.comprobando ? 'Terminar' : '✓ Comprobar'}</button></header>
      ${estado.comprobando ? bloqueComprobacion(t, mes, comp) : `
        <p class="pista" style="margin:-4px 0 10px">Lo que compone los ${money(pago)}.</p>`}
      <div id="movs"></div>
    </section>`;

  // Controles
  $('#seg-tarjeta', raiz).appendChild(segmentado(
    // Cabe poco en el segmentado del teléfono: basta con el banco.
    lista.map((x) => ({ valor: x.id, texto: x.nombre.replace(/^TC /, '') })),
    estado.tarjeta, (v) => { estado.tarjeta = v; render(raiz); },
  ));
  $('#seg-usuario', raiz).appendChild(segmentado(
    [{ valor: 'ambos', texto: 'Ambos' }, { valor: 'J', texto: 'J' }, { valor: 'C', texto: 'C' }],
    estado.usuario, (v) => { estado.usuario = v; render(raiz); },
  ));
  $('#sel-mes', raiz).addEventListener('change', (e) => { estado.mes = e.target.value; render(raiz); });
  $('#btn-nuevo', raiz).addEventListener('click', () => formGastoTarjeta((nuevo) => {
    irAlGasto(nuevo);
    render(raiz);
  }));
  $('#btn-pagar', raiz).addEventListener('click', () => {
    formPagoTarjeta(t.id, mes, pagoTotal, () => render(raiz));
  });
  $('#btn-comprobar', raiz).addEventListener('click', () => {
    estado.comprobando = !estado.comprobando;
    render(raiz);
  });

  /** Repinta las cifras del bloque de comprobación sin rehacer la vista. */
  const refrescarResumen = () => {
    if (!estado.comprobando) return;
    const n = comprobacionDelMes(t.id, mes, estado.usuario);
    $('#ec-comprobado', raiz).textContent = money(n.comprobado);
    $('#ec-marcadas', raiz).textContent = `${n.marcadas} de ${n.cuotas} movimientos`;
    $('#ec-pendiente', raiz).textContent = money(n.pendiente);
    $('#btn-marcar-todo', raiz).textContent = n.completa ? 'Quitar marcas' : 'Marcar todos';
  };

  if (estado.comprobando) {
    const cuotasDelMes = () => db.cuotas.filter((c) => c.tarjeta === t.id && c.mes === mes
      && (estado.usuario === 'ambos' || c.usuario === estado.usuario));

    // El total del estado se guarda al salir del campo, no en cada tecla: si
    // no, cada dígito repintaría la pantalla y perdería el foco.
    const campoTotal = $('#ec-total', raiz);
    campoTotal.addEventListener('change', () => {
      const texto = campoTotal.value.trim();
      db.config[claveEstadoCuenta(t.id, mes)] = texto === '' ? '' : String(aNumero(texto));
      guardar();
      render(raiz);
    });

    $('#btn-marcar-todo', raiz).addEventListener('click', () => {
      const marca = comp.completa ? '' : 'Si';
      cuotasDelMes().forEach((c) => { c.conciliado = marca; c._ts = Date.now(); });
      guardar();
      render(raiz);
    });

  }

  // En el panel las cifras ya están debajo: la barra va sola.
  medidor($('#cupo', raiz), { usado: est.utilizado, total: est.cupo, sinPie: true });

  const pintar = () => {
    columnas($('#g-meses', raiz), meses12.map((m) => nombreMes(m, true)), [
      { nombre: 'A pagar', valores: meses12.map((m) => pagoDelMes(t.id, m, estado.usuario)) },
    ], { alto: 220 });

    const porCat = new Map();
    db.cuotas
      .filter((c) => c.tarjeta === t.id && c.mes === mes
        && (estado.usuario === 'ambos' || c.usuario === estado.usuario))
      .forEach((c) => porCat.set(c.categoria, (porCat.get(c.categoria) || 0) + c.monto));
    dona($('#g-dona', raiz), [...porCat.entries()]
      .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
      .sort((a, b) => b.valor - a.valor), { titulo: nombreMes(mes, true) });
  };
  pintar();
  alRedimensionar(pintar);

  $('#diferidos', raiz).innerHTML = listaDiferidos(t.id, estado.usuario);
  $('#movs', raiz).innerHTML = listaMovimientos(t.id, mes, estado.usuario, estado.comprobando);

  /*
   * Las casillas se enganchan AQUÍ y no arriba con el resto de controles: la
   * lista de movimientos se pinta unas líneas más abajo, así que allí todavía
   * no existían y los clics no llegaban a guardarse.
   */
  $$('[data-comprobar]', raiz).forEach((caja) => {
    caja.addEventListener('change', () => {
      const [gastoId, n] = caja.dataset.comprobar.split(':');
      const cuota = db.cuotas.find((c) => c.gasto_id === gastoId && String(c.n_cuota) === n);
      if (!cuota) return;
      cuota.conciliado = caja.checked ? 'Si' : '';
      cuota._ts = Date.now();
      guardar();
      // Se refresca solo el resumen: repintar la vista entera con cada clic
      // haría saltar el scroll a lo alto en mitad de la comprobación.
      refrescarResumen();
    });
  });

  $$('[data-corregir]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const gasto = db.gastosTarjeta.find((g) => g.id === btn.dataset.corregir);
      if (gasto) {
        formGastoTarjeta((editado) => { irAlGasto(editado); render(raiz); }, gasto);
      }
    });
  });

  $$('[data-borrar]', raiz).forEach((btn) => {
    btn.addEventListener('click', () => {
      const gasto = db.gastosTarjeta.find((g) => g.id === btn.dataset.borrar);
      confirmar(`¿Eliminar «${gasto?.detalle || btn.dataset.borrar}» y todas sus cuotas?`, () => {
        eliminar('gastosTarjeta', btn.dataset.borrar);
        render(raiz);
      });
    });
  });
}

function sumaPorTipo(tarjetaId, mes, usuario, tipo) {
  return redondear(db.cuotas
    .filter((c) => c.tarjeta === tarjetaId && c.mes === mes)
    .filter((c) => usuario === 'ambos' || c.usuario === usuario)
    .filter((c) => db.gastosTarjeta.find((g) => g.id === c.gasto_id)?.tipo === tipo)
    .reduce((s, c) => s + c.monto, 0));
}

function listaDiferidos(tarjetaId, usuario) {
  const filas = diferidosVigentes()
    .filter((d) => d.gasto.tarjeta === tarjetaId)
    .filter((d) => usuario === 'ambos' || d.gasto.usuario === usuario)
    // De la compra más reciente a la más antigua. `diferidosVigentes` los
    // devuelve ordenados por lo que falta por pagar, que sirve para otras
    // cosas pero aquí no dice nada: lo que se busca es «qué compré último».
    .sort((a, b) => String(b.gasto.fecha).localeCompare(String(a.gasto.fecha)));

  if (!filas.length) return '<p class="vacio">No hay diferidos con cuotas pendientes.</p>';

  return `<ul class="lista">${filas.map((d) => {
    const pagadas = d.gasto.cuotas - d.cuotasRestantes;
    return `
    <li class="detallada">
      <div class="principal">
        <div class="titulo">${esc(d.gasto.detalle)}
          <span class="chip ${esc(d.gasto.usuario.toLowerCase())}">${esc(d.gasto.usuario)}</span></div>
        <div class="meta">${esc(d.gasto.fecha)} · ${esc(d.gasto.categoria)} ·
          cuota ${pagadas + 1} de ${d.gasto.cuotas}</div>
        <div class="cifras">
          <span>Cuota <strong>${money(d.proxima.monto)}</strong></span>
          <span>Total <strong>${money(d.gasto.monto_total)}</strong></span>
          <span>Próxima <strong>${esc(nombreMes(d.proxima.mes, true))}</strong></span>
        </div>
      </div>
      <div class="monto neg">${money(d.restante)}<span class="pie">por pagar</span></div>
    </li>`;
  }).join('')}</ul>
    <div class="aviso"><span class="icono">Σ</span>
      <span>Falta por pagar <strong>${money(filas.reduce((s, d) => s + d.restante, 0))}</strong>
      en ${filas.length} ${filas.length === 1 ? 'compra diferida' : 'compras diferidas'}.</span></div>`;
}

function listaMovimientos(tarjetaId, mes, usuario, marcable = false) {
  const filas = db.cuotas
    .filter((c) => c.tarjeta === tarjetaId && c.mes === mes)
    .filter((c) => usuario === 'ambos' || c.usuario === usuario)
    .map((c) => ({ cuota: c, gasto: db.gastosTarjeta.find((g) => g.id === c.gasto_id) }))
    .filter((x) => x.gasto)
    /*
     * Del más reciente al más antiguo por fecha de compra y, a igualdad de
     * fecha, lo último apuntado primero. El desempate importa: casi todo lo
     * que se registra es del mismo día, y sin él un gasto recién guardado
     * aparecía enterrado entre los que ya estaban en esa fecha.
     */
    .sort((a, b) => String(b.gasto.fecha).localeCompare(String(a.gasto.fecha))
      || (b.gasto._ts || 0) - (a.gasto._ts || 0)
      || String(b.gasto.id).localeCompare(String(a.gasto.id)));

  if (!filas.length) return '<p class="vacio">Sin movimientos en este mes.</p>';

  // El total va al pie para que el detalle cuadre a la vista con la cifra
  // grande del panel: es la comprobación que se hace contra el Excel.
  const total = redondear(filas.reduce((s, x) => s + x.cuota.monto, 0));

  /*
   * Casi todo el mes vence en la misma fecha, la que anuncia el panel, así que
   * solo se marca la fila que se sale: con corte el día 3, una compra del 1 al
   * 3 entró en el estado anterior y se paga un mes antes que sus vecinas.
   */
  const venceMes = fechaPagoMes(mes, tarjetaId);
  const venceFila = ({ cuota, gasto }) => (cuota.n_cuota === 1
    ? fechaPagoCompra(gasto.fecha, tarjetaId)
    : fechaPagoMes(cuota.mes, tarjetaId));

  return `<ul class="lista">${filas.map((fila) => {
    const { cuota, gasto } = fila;
    const esCuota = gasto.cuotas > 1;
    const pendiente = cuotaPendiente(cuota);
    const vence = venceFila(fila);
    return `
      <li class="con-acciones${marcable ? ' comprobable' : ''}">
        ${marcable ? `
          <label class="check" title="Aparece igual en el estado de cuenta">
            <input type="checkbox" data-comprobar="${esc(gasto.id)}:${cuota.n_cuota}"
                   ${cuota.conciliado === 'Si' ? 'checked' : ''}>
          </label>` : ''}
        <div class="principal">
          <div class="titulo">${esc(gasto.detalle)}
            <span class="chip ${esc(gasto.usuario.toLowerCase())}">${esc(gasto.usuario)}</span></div>
          <div class="meta">${esc(gasto.fecha)} · ${esc(gasto.categoria)}
            ${esCuota ? ` · cuota ${cuota.n_cuota}/${gasto.cuotas} de ${money(gasto.monto_total)}` : ''}
            ${vence && vence !== venceMes ? ` · se paga el ${esc(textoFecha(vence))}` : ''}
            ${pendiente ? '' : ' · pagada'}</div>
        </div>
        <div class="monto">${money(cuota.monto)}</div>
        <div class="acciones">
          <button class="btn pequeno" data-corregir="${esc(gasto.id)}">Corregir</button>
          <button class="btn pequeno peligro" data-borrar="${esc(gasto.id)}">Eliminar</button>
        </div>
      </li>`;
  }).join('')}</ul>
    <div class="aviso"><span class="icono">Σ</span>
      <span>${filas.length} ${filas.length === 1 ? 'movimiento' : 'movimientos'} en el mes ·
      total <strong>${money(total)}</strong>.</span></div>`;
}

return { enfocarGasto, render };
})();

M["views/inversiones"] = (function () {
/** Vista «Inversiones»: pólizas activas, calculadora y rendimientos. */

const {db, eliminar, cuenta} = M["store"];
const {money, moneyHTML, calcularPoliza, sumarDias, diasEntre, redondear, nombreMes, claveMes, totalInvertido, rendimientoProyectado} = M["calc"];
const {dona, barrasHorizontales, alRedimensionar} = M["charts"];
const {aNumero, esc, $, $$, confirmar, hoyISO} = M["ui"];
const {formInversion, liquidarInversion} = M["forms"];
function render(raiz) {
  const hoy = hoyISO();
  const activas = db.inversiones.filter((p) => p.estado === 'Activa');
  const liquidadas = db.inversiones.filter((p) => p.estado === 'Liquidada');
  const vencidas = activas.filter((p) => p.fecha_vencimiento <= hoy);

  const capital = totalInvertido();
  const interes = rendimientoProyectado();
  const ganado = redondear(liquidadas.reduce((s, p) => s + (Number(p.interes_neto) || 0), 0));

  raiz.innerHTML = `
    <section class="panel">
      <div class="panel-cab">
        <div>
          <span class="etiqueta">Capital invertido</span>
          <span class="cifra">${moneyHTML(capital)}</span>
          <span class="nota">${activas.length} ${activas.length === 1 ? 'póliza activa' : 'pólizas activas'}</span>
        </div>
        <button class="btn primario pequeno" id="btn-nueva">+ Inversión</button>
      </div>
      <div class="panel-datos">
        <div><div class="etq">Interés por cobrar</div><div class="val">${money(interes)}</div></div>
        <div><div class="etq">Al vencimiento</div><div class="val">${money(redondear(capital + interes))}</div></div>
        <div><div class="etq">Ya cobrado</div><div class="val">${money(ganado)}</div></div>
      </div>
    </section>
    ${vencidas.length ? `
      <div class="aviso alerta"><span class="icono">⏰</span>
        <span><strong>${vencidas.length} ${vencidas.length === 1 ? 'póliza venció' : 'pólizas vencieron'}.</strong>
        Liquídalas para que el capital y el interés entren a la cuenta.</span></div>` : ''}

    <section class="tarjeta">
      <header><h2>Calculadora de póliza</h2>
        <span class="pista">Simula antes de invertir</span></header>
      <div class="filtros">
        <div class="campo"><label for="c-capital">Capital</label>
          <input id="c-capital" type="text" value="5000" inputmode="decimal"></div>
        <div class="campo"><label for="c-tasa">Tasa anual %</label>
          <input id="c-tasa" type="text" value="7.5" inputmode="decimal"></div>
        <div class="campo"><label for="c-plazo">Plazo (días)</label>
          <input id="c-plazo" type="number" step="1" min="1" value="360" inputmode="numeric"></div>
        <div class="campo"><label for="c-base">Base</label>
          <select id="c-base"><option value="360">360</option><option value="365">365</option></select></div>
      </div>
      <div class="filtros">
        <label class="campo" style="flex-direction:row;align-items:center;gap:8px">
          <input type="checkbox" id="c-ret" checked style="width:auto;min-height:auto">
          <span>Retención 2 %</span></label>
        <label class="campo" style="flex-direction:row;align-items:center;gap:8px">
          <input type="checkbox" id="c-comp" style="width:auto;min-height:auto">
          <span>Interés compuesto</span></label>
      </div>
      <div class="previsualizacion" id="c-res"></div>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Reparto por institución</h2><span class="pista">Capital activo</span></header>
        <div id="g-inst"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Interés esperado</h2><span class="pista">Por póliza</span></header>
        <div id="g-int"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Pólizas activas</h2><span class="pista">Ordenadas por vencimiento</span></header>
      <div id="lista-activas"></div>
    </section>

    <section class="tarjeta">
      <header><h2>Historial</h2><span class="pista">Pólizas liquidadas</span></header>
      <div id="lista-hist"></div>
    </section>`;

  $('#btn-nueva', raiz).addEventListener('click', () => formInversion(() => render(raiz)));

  // --- Calculadora ---
  const calcular = () => {
    const r = calcularPoliza({
      capital: aNumero($('#c-capital', raiz).value) || 0,
      tasaAnual: aNumero($('#c-tasa', raiz).value) || 0,
      plazoDias: Number($('#c-plazo', raiz).value) || 0,
      base: Number($('#c-base', raiz).value) || 360,
      compuesto: $('#c-comp', raiz).checked,
      retencion: $('#c-ret', raiz).checked
        ? Number(db.config.retencion_fuente_polizas) || 0.02 : 0,
    });
    const capitalSim = aNumero($('#c-capital', raiz).value) || 0;
    $('#c-res', raiz).innerHTML = `
      <div>Interés bruto <strong>${money(r.interesBruto)}</strong>
        ${r.retencion ? `· retención −${money(r.retencion)}` : ''}
        · interés neto <strong>${money(r.interesNeto)}</strong></div>
      <div>Al vencimiento recibes <strong>${money(r.valorFinal)}</strong>
        <span class="solo-lectura">(${r.rendimientoEfectivo.toFixed(2)} % sobre ${money(capitalSim)})</span></div>
      <div class="solo-lectura">Vence el ${sumarDias(hoyISO(), Number($('#c-plazo', raiz).value) || 0)}</div>`;
  };
  $$('#c-capital, #c-tasa, #c-plazo, #c-base, #c-ret, #c-comp', raiz)
    .forEach((n) => n.addEventListener('input', calcular));
  calcular();

  // --- Gráficos ---
  const pintar = () => {
    const porInst = new Map();
    activas.forEach((p) => porInst.set(p.institucion,
      (porInst.get(p.institucion) || 0) + (Number(p.capital) || 0)));
    dona($('#g-inst', raiz), [...porInst.entries()]
      .map(([nombre, valor]) => ({ nombre, valor: redondear(valor) }))
      .sort((a, b) => b.valor - a.valor), { titulo: 'Invertido' });

    barrasHorizontales($('#g-int', raiz), activas
      .map((p) => ({ nombre: `${p.institucion} · ${p.fecha_vencimiento}`, valor: Number(p.interes_neto) || 0 }))
      .sort((a, b) => b.valor - a.valor));
  };
  pintar();
  alRedimensionar(pintar);

  // --- Listas ---
  $('#lista-activas', raiz).innerHTML = activas.length ? `<ul class="lista">${activas
    .slice()
    .sort((a, b) => String(a.fecha_vencimiento).localeCompare(String(b.fecha_vencimiento)))
    .map((p) => {
      const dias = diasEntre(hoy, p.fecha_vencimiento);
      const vencida = dias <= 0;
      return `
        <li>
          <div class="principal">
            <div class="titulo">${esc(p.institucion)}
              <span class="chip ${esc(String(p.usuario || '').toLowerCase())}">${esc(p.usuario || '')}</span></div>
            <div class="meta">${money(p.capital)} al ${Number(p.tasa_anual).toFixed(2)} % ·
              ${p.plazo_dias} días · vence ${esc(p.fecha_vencimiento)}
              ${vencida ? ' · <strong>vencida</strong>' : ` · faltan ${dias} días`}
              · a ${esc(cuenta(p.cuenta_destino)?.nombre || p.cuenta_destino)}</div>
          </div>
          <div class="monto pos">${money(p.valor_final)}</div>
          <button class="btn pequeno" data-corregir="${esc(p.id)}">Corregir</button>
          <button class="btn pequeno" data-liquidar="${esc(p.id)}">Liquidar</button>
          <button class="btn pequeno peligro" data-borrar="${esc(p.id)}" aria-label="Eliminar">✕</button>
        </li>`;
    }).join('')}</ul>` : '<p class="vacio">Aún no registras inversiones. Usa «+ Inversión» para la primera.</p>';

  $('#lista-hist', raiz).innerHTML = liquidadas.length ? `<ul class="lista">${liquidadas
    .slice()
    .sort((a, b) => String(b.fecha_vencimiento).localeCompare(String(a.fecha_vencimiento)))
    .map((p) => `
      <li>
        <div class="principal">
          <div class="titulo">${esc(p.institucion)}</div>
          <div class="meta">${esc(nombreMes(claveMes(p.fecha_vencimiento)))} ·
            capital ${money(p.capital)} · interés ${money(p.interes_neto)}</div>
        </div>
        <div class="monto pos">${money(p.valor_final)}</div>
      </li>`).join('')}</ul>` : '<p class="vacio">Sin pólizas liquidadas todavía.</p>';

  $$('[data-corregir]', raiz).forEach((b) => b.addEventListener('click', () => {
    const p = db.inversiones.find((x) => x.id === b.dataset.corregir);
    if (p) formInversion(() => render(raiz), p);
  }));

  $$('[data-liquidar]', raiz).forEach((b) => b.addEventListener('click', () => {
    const p = db.inversiones.find((x) => x.id === b.dataset.liquidar);
    confirmar(
      `¿Acreditar ${money(p.valor_final)} en ${cuenta(p.cuenta_destino)?.nombre || p.cuenta_destino}?`,
      () => liquidarInversion(b.dataset.liquidar, () => render(raiz)),
      { aceptar: 'Liquidar' },
    );
  }));
  $$('[data-borrar]', raiz).forEach((b) => b.addEventListener('click', () => {
    confirmar('¿Eliminar esta inversión del registro?', () => {
      eliminar('inversiones', b.dataset.borrar);
      render(raiz);
    });
  }));
}

return { render };
})();

M["views/cuentas"] = (function () {
/** Vista «Cuentas»: saldos reales de banco y efectivo, y sus movimientos. */

const {db, cuentasBancarias, eliminar, upsert, cuenta} = M["store"];
const {money, moneyHTML, saldoCuenta, totalAhorrado, totalInvertido, deudaTotalTarjetas, patrimonioNeto, claveMes, nombreMes, redondear, rangoMeses, mesActual, sumarMeses, ingresoDelMes} = M["calc"];
const {dona, linea, alRedimensionar} = M["charts"];
const {esc, $, $$, confirmar, modal, brindis, aNumero} = M["ui"];
const {formMovimiento, formIngreso, formGastoEfectivo} = M["forms"];
function render(raiz) {
  const cuentas = cuentasBancarias();
  const ahorro = totalAhorrado();

  raiz.innerHTML = `
    <section class="panel">
      <div class="panel-cab">

          <span class="etiqueta">Total ahorrado</span>

          <span class="nota">Suma de bancos y efectivo</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button class="btn pequeno" id="btn-mov">+ Movimiento</button>
          <button class="btn primario pequeno" id="btn-ing">+ Ingreso</button>
        </div>
      </div>
      <div class="panel-datos">
        <div><div class="etq">Invertido</div><div class="val">${money(totalInvertido())}</div></div>
        <div><div class="etq">Deuda tarjetas</div><div class="val">${money(deudaTotalTarjetas())}</div></div>
        <div><div class="etq">Patrimonio neto</div><div class="val">${money(patrimonioNeto())}</div></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Saldos por cuenta</h2>
        <button class="btn pequeno" id="btn-cuenta">+ Cuenta</button></header>
      <ul class="lista">${cuentas.map((c) => {
    const saldo = saldoCuenta(c.id);
    return `
        <li>
          <div class="principal">
            <div class="titulo">${esc(c.nombre)}</div>
            <div class="meta">${esc(c.tipo)}${c.banco ? ` · ${esc(c.banco)}` : ''} ·
              saldo inicial ${money(c.saldo_inicial)}</div>
          </div>
          <div class="monto ${saldo < 0 ? 'neg' : 'pos'}">${money(saldo)}</div>
          <button class="btn pequeno" data-editar="${esc(c.id)}">Editar</button>
        </li>`;
  }).join('')}</ul>
    </section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <header><h2>Reparto del ahorro</h2><span class="pista">Por cuenta</span></header>
        <div id="g-cuentas"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Evolución del ahorro</h2><span class="pista">Saldo acumulado por mes</span></header>
        <div id="g-evolucion"></div>
      </div>
    </section>

    <section class="tarjeta">
      <header><h2>Ingresos registrados</h2>
        <button class="btn pequeno" id="btn-ing-2">+ Ingreso</button></header>
      <div class="rejilla kpis">
        <div class="kpi"><div class="etq">Ingresos de ${esc(nombreMes(mesActual()))}</div>
          <div class="valor">${money(ingresoDelMes(mesActual()))}</div></div>
        <div class="kpi"><div class="etq">Ingresos del año</div>
          <div class="valor">${money(ingresosDelAnio())}</div></div>
        <div class="kpi"><div class="etq">Histórico</div>
          <div class="valor">${money(db.ingresos.reduce((s, i) => s + (Number(i.neto) || 0), 0))}</div>
          <div class="delta">${db.ingresos.length} ${db.ingresos.length === 1 ? 'registro' : 'registros'}</div></div>
      </div>
      <div id="lista-ingresos"></div>
    </section>

    <section class="tarjeta">
      <header><h2>Gastos en efectivo / débito</h2>
        <button class="btn pequeno" id="btn-efectivo">+ Gasto en efectivo</button></header>

    <section class="tarjeta">

  $('#btn-mov', raiz).addEventListener('click', () => formMovimiento(() => render(raiz)));
  $('#btn-ing', raiz).addEventListener('click', () => formIngreso(() => render(raiz)));

  $$('[data-editar]', raiz).forEach((b) => b.addEventListener('click', () => {

  const pintar = () => {
    dona($('#g-cuentas', raiz), cuentas
      .map((c) => ({ nombre: c.nombre, valor: Math.max(0, saldoCuenta(c.id)) }))
      .filter((x) => x.valor > 0), { titulo: 'Ahorro' });

    const meses = rangoMeses(sumarMeses(mesActual(), -11), mesActual());
    let acc = 0;
    const serie = meses.map((m) => {
      acc = redondear(acc + ingresoDelMes(m) - salidasDelMes(m));
      return acc;
    });

      titulo: `${g.detalle} · ${g.usuario}`,
      meta: `${g.fecha} · ${g.categoria} · ${cuenta(g.cuenta)?.nombre || g.cuenta}`,

  $$('[data-corregir]', raiz).forEach((b) => b.addEventListener('click', () => {
    const col = b.dataset.coleccion;
    const fila = db[col].find((f) => f.id === b.dataset.corregir);
    if (fila) FORMULARIOS[col](() => render(raiz), fila);
  }));

  $$('[data-borrar]', raiz).forEach((b) => b.addEventListener('click', () => {
    confirmar('¿Eliminar este registro?', () => {
      eliminar(b.dataset.coleccion, b.dataset.borrar);
      render(raiz);
    });
  }));
}

/** Ingreso neto acumulado del año en curso. */
function ingresosDelAnio() {
  const anio = mesActual().slice(0, 4);
  return redondear(db.ingresos
    .filter((i) => String(i.mes || claveMes(i.fecha)).startsWith(anio))
    .reduce((s, i) => s + (Number(i.neto) || 0), 0));
}

/** Salidas de dinero de un mes (efectivo + movimientos salientes). */
function salidasDelMes(mes) {
  const ef = db.gastosEfectivo
    .filter((g) => claveMes(g.fecha) === mes)
    .reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const mv = db.movimientos
    .filter((m) => claveMes(m.fecha) === mes && m.cuenta_origen && !m.cuenta_destino)
    .reduce((s, m) => s + (Number(m.monto) || 0), 0);
  const pagos = db.movimientos
    .filter((m) => claveMes(m.fecha) === mes && m.tipo === 'Pago de tarjeta')
    .reduce((s, m) => s + (Number(m.monto) || 0), 0);
  return redondear(ef + mv + pagos);
}

function listaSimple(filas, mapear, vacio) {
  if (!filas.length) return `<p class="vacio">${esc(vacio)}</p>`;
  return `<ul class="lista">${filas.map((f) => {
    const v = mapear(f);
    return `
      <li>
        <div class="principal">
          <div class="titulo">${esc(v.titulo)}</div>
          <div class="meta">${esc(v.meta)}</div>
        </div>
        <div class="monto ${v.signo}">${money(v.monto)}</div>
        <button class="btn pequeno" data-corregir="${esc(v.id)}"
                data-coleccion="${esc(v.coleccion)}">Corregir</button>
        <button class="btn pequeno peligro" data-borrar="${esc(v.id)}"
                data-coleccion="${esc(v.coleccion)}" aria-label="Eliminar">✕</button>
      </li>`;
  }).join('')}</ul>`;
}

/** Número listo para escribir en un campo: con coma, como en el resto. */
const paraEditar = (n) => (n === undefined || n === null || n === ''
  ? '' : String(redondear(n)).replace('.', ','));

/**
 * Alta o edición de una cuenta (banco, efectivo o tarjeta).
 *
 * El formulario pide el SALDO DE HOY, no el de partida.
 *
 * El campo guardaba `saldo_inicial`, que es lo que había antes de todo lo
 * registrado, pero nadie piensa en eso: uno mira el banco y ve una cifra. Con
 * Pichincha la diferencia era enorme —tiene sueldos registrados y ningún pago
 * de salida, así que escribir «18,21» mostraba casi siete mil. Ahora se escribe
 * lo que dice el banco y la app despeja el saldo de partida restando lo que ya
 * tiene apuntado.
 */
function formCuenta(id, alTerminar) {
  const c = id ? cuenta(id) : null;
  // Lo que aportan los movimientos ya registrados en esta cuenta: la diferencia
  // entre lo que se muestra y el saldo de partida.
  const movimiento = c ? redondear(saldoCuenta(c.id) - (Number(c.saldo_inicial) || 0)) : 0;

  const cuerpo = `
    <div class="filtros">
      <div class="campo"><label for="cu-nombre">Nombre</label>
        <input id="cu-nombre" name="nombre" required value="${esc(c?.nombre || '')}"></div>
      <div class="campo"><label for="cu-tipo">Tipo</label>
        <select id="cu-tipo" name="tipo">
          ${['Banco', 'Efectivo', 'Tarjeta'].map((t) => `<option${c?.tipo === t ? ' selected' : ''}>${t}</option>`).join('')}
        </select></div>
    </div>
    <div class="filtros">
      <div class="campo"><label for="cu-banco">Banco</label>
        <input id="cu-banco" name="banco" value="${esc(c?.banco || '')}"></div>
      <div class="campo"><label for="cu-saldo">Saldo de hoy</label>
        <input id="cu-saldo" name="saldo_hoy" type="text"
               value="${paraEditar(c ? saldoCuenta(c.id) : 0)}" inputmode="decimal"></div>
    </div>
    ${movimiento ? `<p class="pista">Se pide el saldo que tiene la cuenta <strong>hoy</strong>,
      no el de partida. La app ya tiene ${money(movimiento)} registrados de movimientos aquí,
      así que resta esa parte sola: si escribes el saldo de tu banco, es el que verás.</p>` : ''}
    <div class="filtros">
      <div class="campo"><label for="cu-cupo">Cupo (solo tarjetas)</label>
        <input id="cu-cupo" name="cupo" type="text"
               value="${Number(c?.cupo) || 0}" inputmode="decimal"></div>
      <div class="campo"><label for="cu-usuarios">Usuarios</label>
        <input id="cu-usuarios" name="usuarios" value="${esc(c?.usuarios || 'J,C')}"></div>
    </div>
    <div class="filtros">
      <div class="campo"><label for="cu-corte">Día de corte</label>
        <input id="cu-corte" name="dia_corte" value="${esc(c?.dia_corte ?? '')}"
               placeholder="3 o «fin»"></div>
      <div class="campo"><label for="cu-pago">Día de pago</label>
        <input id="cu-pago" name="dia_pago" type="number" min="1" max="31" value="${esc(c?.dia_pago ?? '')}"></div>
    </div>
    <p class="pista">Solo para tarjetas: escribe el día del corte (por ejemplo <strong>3</strong>)
      o <strong>fin</strong> si cierra el último día del mes. Las compras posteriores al corte
      entran en el estado del mes siguiente.</p>`;

  modal({
    titulo: c ? `Editar ${c.nombre}` : 'Nueva cuenta',
    cuerpo,
    alEnviar(d) {
      // Lo que aportan los movimientos ya apuntados en esta cuenta. Se resta
      // del saldo de hoy para despejar el de partida.
      const aporte = c ? redondear(saldoCuenta(c.id) - (Number(c.saldo_inicial) || 0)) : 0;
      const nuevoIdCuenta = c?.id || d.nombre.trim().toUpperCase()
        .replace(/[^A-Z0-9]+/g, '-').slice(0, 14);
      upsert('cuentas', {
        id: nuevoIdCuenta,
        nombre: d.nombre.trim(),
        tipo: d.tipo,
        banco: d.banco.trim(),
        saldo_inicial: redondear(aNumero(d.saldo_hoy) - aporte),
        cupo: redondear(d.cupo),
        usuarios: d.usuarios.trim(),
        dia_corte: d.dia_corte,
        dia_pago: d.dia_pago,
        activa: c?.activa || 'Si',
      });
      brindis('Cuenta guardada');
      alTerminar?.();
    },
  });
}

return { formCuenta, render };
})();

M["views/datos"] = (function () {
/**
 * Vista «Datos»: puente con el Excel, respaldos, catálogo de categorías
 * y ajustes generales.
 */

const {db, guardar, reemplazar, limpiarTodo, instantanea, instantaneaSinSecretos, tocar, CLAVES} = M["store"];
const {money, redondear, nombreMes} = M["calc"];
const {aNumero, esc, $, $$, brindis, modal, confirmar, descargar, pedirArchivo, opciones} = M["ui"];
const {escribirLibro, leerLibro} = M["xlsx"];
const {ESQUEMA, construirLibro, libroADatos} = M["esquema"];
const archivoExcel = M["archivo"];
const {libroTarjetasAEntidades, esLibroDeTarjetas, NOTA_IMPORTADO: NOTA} = M["importar_libro"];

// --- Excel -------------------------------------------------------------------

function exportarExcel() {
  const blob = escribirLibro(construirLibro());
  const hoy = new Date().toISOString().slice(0, 10);
  descargar(blob, `Finanzas_DB_${hoy}.xlsx`);
  brindis('Excel generado');
}

/**
 * Importa un .xlsx. Acepta dos formatos:
 *  - la base de la app (hojas Cuentas, Gastos_Tarjeta, Cuotas…), que reemplaza;
 *  - el libro de tarjetas original, que se convierte y se puede añadir.
 */
async function importarExcel(alTerminar) {
  const archivo = await pedirArchivo('.xlsx,.xlsm');
  if (!archivo) return;

  let libro;
  try {
    libro = await leerLibro(await archivo.arrayBuffer());
  } catch (err) {
    return avisoError('No se pudo abrir el archivo', err.message);
  }

  // Primero la base propia; si no lo es, se intenta como libro de tarjetas.
  try {
    const { datos, resumen } = libroADatos(libro, db.config);
    return confirmar(
      `Se importarán → ${resumen.join(' · ')}. Esto reemplaza los datos actuales de la app.`,
      () => { reemplazar(datos); brindis('Datos importados'); alTerminar?.(); },
      { aceptar: 'Importar y reemplazar' },
    );
  } catch {
    // No era la base de la app: se sigue con el otro formato.
  }

  if (!esLibroDeTarjetas(libro)) {
    return avisoError('Formato no reconocido',
      'El archivo no es ni la base de la app ni el libro de tarjetas. '
      + 'Debe tener hojas con las columnas Cargo, Fecha, Detalle, Propósito y Cuenta.');
  }

  let conv;
  try {
    conv = libroTarjetasAEntidades(libro, db.cuentas);
  } catch (err) {
    return avisoError('No se pudo interpretar el libro', err.message);
  }
  return revisarImportacion(conv, archivo.name, alTerminar);
}

function avisoError(titulo, texto) {
  modal({
    titulo,
    cuerpo: `<p>${esc(texto)}</p>`,
    aceptar: 'Entendido',
    alEnviar: () => {},
  });
}

/** Muestra qué se encontró y deja elegir entre añadir o reemplazar. */
function revisarImportacion(conv, nombreArchivo, alTerminar) {
  const r = conv.resumen;
  const nombreTarjeta = (id) => db.cuentas.find((c) => c.id === id)?.nombre || id;
  const nuevas = conv.categorias.filter(

  modal({
    titulo: 'Importar gastos de tarjeta',
    cuerpo: `
      <p class="pista" style="margin-top:0">De <strong>${esc(nombreArchivo)}</strong></p>
      <div class="rejilla kpis">
        <div class="kpi"><div class="etq">Consumos</div>
          <div class="valor">${r.gastos}</div>
          <div class="delta">${r.cuotas} cuotas en total</div></div>
        <div class="kpi"><div class="etq">Suma de las cuotas</div>
          <div class="valor">${money(r.total)}</div></div>
        <div class="kpi"><div class="etq">Periodo</div>
          <div class="valor" style="font-size:15px">
            ${r.meses.length ? `${esc(nombreMes(r.meses[0], true))} → ${esc(nombreMes(r.meses[r.meses.length - 1], true))}` : '—'}</div>
          <div class="delta">${r.meses.length} meses</div></div>
      </div>
      <div class="previsualizacion">
        <div><strong>Por tarjeta</strong></div>
        ${Object.entries(r.porTarjeta).map(([id, v]) => `
          <div>${esc(nombreTarjeta(id))}: <strong>${money(v)}</strong></div>`).join('')}
        <div style="margin-top:6px"><strong>Por usuario</strong></div>
        ${Object.entries(r.porUsuario).map(([u, v]) => `
          <div>${esc(u)}: <strong>${money(v)}</strong></div>`).join('')}
        ${r.ingresos ? `<div style="margin-top:6px">También trae
          <strong>${r.ingresos} ingresos</strong> de la hoja «Ingreso».</div>` : ''}
        ${nuevas.length ? `<div style="margin-top:6px">Se crearán
          ${nuevas.length} categorías nuevas: ${esc(nuevas.join(', '))}.</div>` : ''}
      </div>
      <div class="campo ancho" style="margin-top:10px">
        <label for="imp-modo">Qué hacer con lo que ya hay</label>
        <select id="imp-modo" name="modo">
          <option value="reemplazar">Recargar: sustituye lo importado antes (recomendado)</option>
          <option value="anadir">Añadir sin quitar nada</option>
        </select>
      </div>
      <p class="pista">«Recargar» deja la app igual que el Excel: quita lo que trajo
        una importación anterior y vuelve a meterlo, conservando los gastos que
        hayas escrito a mano en la app.</p>`,
    aceptar: 'Importar',
    alEnviar(d) {
      aplicarImportacion(conv, d.modo);
      brindis(`Importados ${r.gastos} consumos · ${money(r.total)}`);
      alTerminar?.();
    },
  });
}

/** Marca con la que se reconoce lo que vino del libro de tarjetas. */
/** Vuelca las entidades convertidas en la base. */
function aplicarImportacion(conv, modo) {
  if (modo === 'reemplazar') {
    // Solo se retira lo que vino de una importación anterior: los gastos
    // escritos a mano en la app se conservan.
    const fuera = new Set(db.gastosTarjeta
      .filter((g) => g.notas === NOTA)
      .map((g) => g.id));
    const ahora = Date.now();
    db.gastosTarjeta
      .filter((g) => fuera.has(g.id))
      .forEach((g) => db.borrados.push({ c: 'gastosTarjeta', k: g.id, t: ahora }));
    db.cuotas
      .filter((c) => fuera.has(c.gasto_id))
      .forEach((c) => db.borrados.push({ c: 'cuotas', k: `${c.gasto_id}#${c.n_cuota}`, t: ahora }));

    db.gastosTarjeta = db.gastosTarjeta.filter((g) => !fuera.has(g.id));
    db.cuotas = db.cuotas.filter((c) => !fuera.has(c.gasto_id));
  }

  const fusionar = (coleccion, filas) => {
    const clave = CLAVES[coleccion];
    const indice = new Map(db[coleccion].map((f) => [clave(f), f]));
    for (const fila of filas) {
      const k = clave(fila);
      const previo = indice.get(k);
      if (previo) Object.assign(previo, fila, { _ts: Date.now() });
      else {
        const nueva = tocar({ ...fila });
        db[coleccion].push(nueva);
        indice.set(k, nueva);
      }
    }
  };

  fusionar('gastosTarjeta', conv.gastosTarjeta);
  fusionar('cuotas', conv.cuotas);
  if (conv.ingresos.length) fusionar('ingresos', conv.ingresos);

  // Categorías que el libro trae y la app todavía no conoce.
  for (const nombre of conv.categorias) {
    if (!db.categorias.some((c) => c.nombre === nombre)) {
      db.categorias.push({
        nombre, grupo: 'Otros', tipo: 'Gasto', presupuesto: 0, activa: 'Si',
      });
    }
  }
  guardar();
}

async function importarJSON(alTerminar) {
  const archivo = await pedirArchivo('.json');
  if (!archivo) return;
  try {
    const datos = JSON.parse(await archivo.text());
    confirmar('Esto reemplaza todos los datos actuales por los del respaldo.', () => {
      reemplazar(datos);
      brindis('Respaldo restaurado');
      alTerminar?.();
    }, { aceptar: 'Restaurar' });
  } catch (err) {
    brindis('El archivo no es un respaldo válido');
  }
}

    return `Al día · ${estadoSync.ultima.toLocaleTimeString('es-EC', {
      hour: '2-digit', minute: '2-digit',

  }
  return 'Conectado';
}
